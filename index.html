@ prob h prob-h-072
T: Return time to a leaf of a star graph
S: markov-chains
TYPE: nat
TOL: 0
Q: A random walk on the star graph with one centre and $4$ leaves moves at each step to a uniformly random neighbour of its current vertex. Starting at a particular leaf, find the expected number of steps until it first returns to that leaf.
ANS: 8
EXP: For a random walk on a connected graph, $\pi_v=\frac{\deg v}{2|E|}$. Here $|E|=4$, so $\pi_{\text{leaf}}=\frac18$.
Kac's formula: expected return time to $v$ is $1/\pi_v=8$.
Check directly: each excursion is leaf $\to$ centre $\to$ some leaf (2 steps), and it hits our leaf with probability $\frac14$, so the expected number of excursions is $4$ and the expected time is $2\times4=8$.
Answering $4$ counts excursions, not steps. Answering $5$ takes $\pi$ uniform over the $5$ vertices, but the walk visits the centre far more often than any leaf.

@ prob h prob-h-073
T: Expected time to absorption
S: markov-chains
TYPE: nat
TOL: 0
Q: A Markov chain on $\{1,2,3\}$ has transition matrix $P=\begin{pmatrix}0.6&0.4&0\\0.3&0.2&0.5\\0&0&1\end{pmatrix}$, where row $i$ is the current state and $P_{ij}=P(X_{n+1}=j\mid X_n=i)$. Starting from state $1$, find the expected number of steps until the chain reaches state $3$.
ANS: 6
EXP: First-step analysis. Let $t_i$ be the expected time to reach $3$ from $i$; $t_3=0$.
$t_1=1+0.6t_1+0.4t_2$, so $0.4t_1=1+0.4t_2$ and $t_1=2.5+t_2$.
$t_2=1+0.3t_1+0.2t_2$, so $0.8t_2=1+0.3(2.5+t_2)$, giving $0.5t_2=1.75$ and $t_2=3.5$.
$t_1=2.5+3.5=6$.
A quick guess like $1/0.5=2$ (the waiting time once in state $2$) ignores the time spent in state $1$ and the falls back from $2$ to $1$.

@ prob h prob-h-074
T: Long-run fraction for a doubly stochastic chain
S: markov-chains
Q: A Markov chain on $\{1,2,3\}$ has transition matrix $P=\begin{pmatrix}0.5&0.3&0.2\\0.2&0.5&0.3\\0.3&0.2&0.5\end{pmatrix}$, where row $i$ is the current state. In the long run, what fraction of time does the chain spend in state $3$?
A: $1/3$
B: $1/2$
C: $0.2$
D: $0.3$
ANS: A
EXP: Each column also sums to $1$ ($0.5+0.2+0.3$, $0.3+0.5+0.2$, $0.2+0.3+0.5$), so $P$ is doubly stochastic.
Then $\pi=(\tfrac13,\tfrac13,\tfrac13)$ satisfies $\pi P=\pi$: each entry of $\pi P$ is $\frac13\times(\text{column sum})=\frac13$.
The chain is irreducible and aperiodic (it has self-loops), so this is the unique stationary distribution and the long-run fraction is $1/3$.
$0.5$, $0.2$ and $0.3$ are single entries of $P$, which are one-step probabilities, not long-run fractions.

D: $1/5$
ANS: D
EXP: The chain only moves between neighbouring states (a birth–death chain), so the stationary distribution satisfies detailed balance $\pi_iP_{i,i+1}=\pi_{i+1}P_{i+1,i}$.
$\pi_0\cdot\frac13=\pi_1\cdot\frac13\Rightarrow\pi_1=\pi_0$, and $\pi_1\cdot\frac13=\pi_2\cdot\frac23\Rightarrow\pi_2=\frac{\pi_1}2$.
Normalise: $\pi_0(1+1+\frac12)=1$, so $\pi=(\tfrac25,\tfrac25,\tfrac15)$ and $\pi_2=1/5$.
$1/3$ would need a doubly stochastic matrix, but the columns sum to $1$, $4/3$ and $2/3$. $2/5$ is $\pi_0$ or $\pi_1$. Detailed balance is also the condition MCMC samplers such as Metropolis–Hastings are built to satisfy.

@ calc e calc-e-001

@ calc e calc-e-002
T: Derivative of the sigmoid
S: derivatives
Q: For $\sigma(x)=\dfrac{1}{1+e^{-x}}$, $\sigma'(x)$ equals:
A: $\sigma(x)(1-\sigma(x))$
B: $\sigma(x)^2$
C: $1-\sigma(x)$
D: $\sigma(x)(1+\sigma(x))$
ANS: A
EXP: $\sigma'(x)=\dfrac{e^{-x}}{(1+e^{-x})^2}=\dfrac{1}{1+e^{-x}}\cdot\dfrac{e^{-x}}{1+e^{-x}}=\sigma(x)(1-\sigma(x))$.
Its maximum is $\tfrac14$ at $x=0$, one reason deep sigmoid networks suffer vanishing gradients.


@ calc e calc-e-003

@ calc e calc-e-005
T: Gradient at a point
S: gradients-multivariable
Q: $f(x,y)=x^2y+3y$. What is $\nabla f(1,2)$?
A: $(4,\ 4)$
B: $(2,\ 4)$
C: $(4,\ 3)$
D: $(2,\ 1)$
ANS: A
EXP: $\partial f/\partial x=2xy=2\cdot1\cdot2=4$ and $\partial f/\partial y=x^2+3=1+3=4$. So $\nabla f(1,2)=(4,4)$.


@ calc e calc-e-006
T: Minimum of a quadratic
S: single-var-optimization
Q: What is the minimum value of $f(x)=x^2-4x+7$?
A: $7$
B: $2$
C: $3$
D: $-3$
ANS: C
EXP: $f'(x)=2x-4=0\Rightarrow x=2$, and $f''=2>0$ so it is a minimum. $f(2)=4-8+7=3$.
Completing the square gives the same: $(x-2)^2+3$. ($2$ is where the minimum occurs, not its value.)


@ calc e calc-e-007
T: Derivative of softplus
S: derivatives
Q: $\dfrac{d}{dx}\ln(1+e^x)=$
A: $\dfrac{1}{1+e^x}$
B: $\dfrac{e^x}{1+e^x}$
C: $\ln(e^x)$
D: $\dfrac{1}{(1+e^x)^2}$
ANS: B
EXP: Chain rule: $\dfrac{1}{1+e^x}\cdot e^x=\dfrac{e^x}{1+e^x}=\sigma(x)$.
The derivative of the softplus activation is the sigmoid.


@ calc e calc-e-008
T: Chain rule

Q: $\dfrac{d}{dx}\sin(x^2)=$
A: $\cos(x^2)$
B: $2x\cos(x^2)$
C: $2x\sin(x^2)$

@ calc e calc-e-009
T: One gradient descent step
S: gradient-descent
Q: Minimise $f(x)=x^2$ with gradient descent, learning rate $\eta=0.1$, starting at $x_0=3$. What is $x_1$?
A: $2.4$
B: $2.7$
C: $3.6$
D: $2.1$
ANS: A
EXP: $x_1=x_0-\eta f'(x_0)=3-0.1\cdot(2\cdot3)=3-0.6=2.4$.
Adding the gradient ($3.6$) would be gradient ascent.


@ calc e calc-e-010
T: Locating a local maximum

Q: Where does $f(x)=x^3-3x$ have a local maximum?
A: $x=1$
B: $x=-1$
C: $x=0$
D: $x=\sqrt3$
ANS: B
EXP: $f'(x)=3x^2-3=0\Rightarrow x=\pm1$. $f''(x)=6x$: $f''(-1)=-6<0$ gives a local max; $f''(1)=6>0$ gives a local min.


@ calc m calc-m-001
T: Gradient of a quadratic form
S: gradients-multivariable
Q: For a general (not necessarily symmetric) square matrix $A$, $\nabla_x\left(x^TAx\right)=$
A: $Ax$
B: $2Ax$
C: $(A+A^T)x$
D: $x^TA$
ANS: C
EXP: Write $x^TAx=\sum_{i,j}A_{ij}x_ix_j$; then $\partial/\partial x_k=\sum_jA_{kj}x_j+\sum_iA_{ik}x_i=(Ax+A^Tx)_k$.
It reduces to $2Ax$ only when $A$ is symmetric (e.g. the least squares Hessian $X^TX$).


@ calc m calc-m-002
T: Classifying a critical point with the Hessian
S: maxima-minima
Q: $f(x,y)=x^2+3xy+y^2$ has a critical point at the origin. It is a:
A: local minimum
B: local maximum
C: saddle point
D: cannot be determined
ANS: C
EXP: Hessian $H=\begin{pmatrix}2&3\\3&2\end{pmatrix}$, $\det H=4-9=-5<0$, so the eigenvalues have opposite signs ($5$ and $-1$).
Indefinite Hessian means a saddle: along $y=x$, $f=5x^2$ rises; along $y=-x$, $f=-x^2$ falls.


@ calc m calc-m-003
T: Second-order Taylor expansion
S: taylor-series
Q: The second-order Taylor approximation of $\ln(1+x)$ around $x=0$ is:
A: $x-\dfrac{x^2}{2}$
B: $x+\dfrac{x^2}{2}$
C: $1+x-\dfrac{x^2}{2}$
D: $x-x^2$
ANS: A
EXP: $f(0)=0$, $f'(x)=\tfrac1{1+x}\Rightarrow f'(0)=1$, $f''(x)=-\tfrac1{(1+x)^2}\Rightarrow f''(0)=-1$.
$f\approx0+x+\tfrac{-1}{2}x^2=x-\tfrac{x^2}{2}$.


@ calc m calc-m-004
T: Integral of x·e^(−x)
S: integrals
Q: $\displaystyle\int_0^\infty xe^{-x}\,dx=$
A: $1$
B: $\frac12$
C: $\infty$
D: $e$
ANS: A
EXP: Integration by parts or the Gamma function: $\int_0^\infty x^{n}e^{-x}dx=\Gamma(n+1)=n!$, so with $n=1$ it is $1$.
This is also the mean of an Exp(1) random variable.


@ calc m calc-m-005
T: Lagrange multipliers: product with fixed sum
S: constrained-optimization
Q: Maximise $xy$ subject to $x+y=10$.
A: $25$
B: $50$
C: $100$
D: $24$
ANS: A
EXP: $\mathcal L=xy-\lambda(x+y-10)$. $\partial_x: y=\lambda$, $\partial_y: x=\lambda\Rightarrow x=y=5$, so the maximum is $25$.
($24=4\cdot6$ is feasible but not optimal.)


@ calc m calc-m-006
T: Limit of (1 − cos x)/x²
S: limits
Q: $\displaystyle\lim_{x\to0}\frac{1-\cos x}{x^2}=$
A: $0$
B: $\frac12$
C: $1$
D: $2$
ANS: B
EXP: Taylor: $\cos x=1-\tfrac{x^2}{2}+O(x^4)$, so $\tfrac{1-\cos x}{x^2}\to\tfrac12$. (Or L'Hôpital twice.)


@ calc m calc-m-007
T: Gradient of softmax cross-entropy
S: gradients-multivariable
Q: With logits $z$, $p=\operatorname{softmax}(z)$ and one-hot label $y$, the loss is $L=-\sum_iy_i\log p_i$. What is $\partial L/\partial z$?
A: $p-y$
B: $y-p$
C: $p(1-p)$
D: $-y/p$
ANS: A
EXP: $\log p_i=z_i-\log\sum_je^{z_j}$, so $\partial\log p_i/\partial z_k=\delta_{ik}-p_k$.
$\partial L/\partial z_k=-\sum_iy_i(\delta_{ik}-p_k)=-y_k+p_k\sum_iy_i=p_k-y_k$ (since $\sum y_i=1$).
$-y/p$ is the gradient with respect to $p$, not $z$.


@ calc m calc-m-008
T: Directional derivative
S: gradients-multivariable
Q: $f(x,y)=x^2+y^2$. What is the directional derivative at $(1,1)$ in the direction of $(3,4)$?
A: $\frac{14}{5}$
B: $4$
C: $2\sqrt2$
D: $14$
ANS: A
EXP: $\nabla f=(2x,2y)=(2,2)$. Unit direction $u=(3,4)/5$.
$D_uf=\nabla f\cdot u=\tfrac{6+8}{5}=\tfrac{14}{5}$. Forgetting to normalise gives $14$; $2\sqrt2=\|\nabla f\|$ is the maximum rate.


@ calc m calc-m-009
T: Stable learning rate on a quadratic
S: gradient-descent
Q: Gradient descent on $f(x)=2x^2$ with a fixed step $\eta>0$ converges from any start if and only if:
A: $\eta<0.25$
B: $\eta<0.5$
C: $\eta<1$
D: $\eta<2$
ANS: B
EXP: $f'(x)=4x$, so $x_{t+1}=x_t-4\eta x_t=(1-4\eta)x_t$. Convergence needs $|1-4\eta|<1\Rightarrow0<\eta<\tfrac12$.
In general $\eta<2/L$, where $L$ is the largest curvature. $\eta=0.25$ is the one-step optimal rate, not the limit.


@ calc m calc-m-010
T: Spotting a non-convex function
S: convexity
Q: Which function is NOT convex on its domain?
A: $e^x$
B: $-\log x\ (x>0)$
C: $\max(0,x)$
D: $\sqrt x\ (x\ge0)$
ANS: D
EXP: $(\sqrt x)''=-\tfrac14x^{-3/2}<0$, so $\sqrt x$ is concave, not convex.
$e^x$ and $-\log x$ have positive second derivatives, and ReLU is a maximum of linear functions, so it is convex.


@ calc h calc-h-001
T: Two Newton steps for √2
S: single-var-optimization
Q: Apply Newton's method to $f(x)=x^2-2$ starting at $x_0=1$. What is $x_2$?
A: $\frac32$
B: $\frac{17}{12}$
C: $\frac75$
D: $\frac{577}{408}$
ANS: B
EXP: Newton: $x_{n+1}=x_n-\dfrac{x_n^2-2}{2x_n}=\tfrac12\left(x_n+\tfrac2{x_n}\right)$.
$x_1=\tfrac12(1+2)=\tfrac32$. $x_2=\tfrac12\left(\tfrac32+\tfrac43\right)=\tfrac{17}{12}\approx1.4167$.
$\tfrac{577}{408}$ is $x_3$, showing quadratic convergence (correct digits roughly double each step).


@ calc h calc-h-002
T: Gradient of log-determinant
S: gradients-multivariable
Q: For an invertible matrix $X$ with $\det X>0$, $\nabla_X\log\det X=$
A: $X^{-T}$
B: $X$
C: $\det(X)\,X^{-1}$
D: $X^T$
ANS: A
EXP: Jacobi's formula: $d\log\det X=\operatorname{tr}(X^{-1}dX)=\langle X^{-T},dX\rangle$, so the gradient is $(X^{-1})^T$.
For symmetric $X$ (e.g. a covariance in a Gaussian log-likelihood) it is $X^{-1}$.


@ calc h calc-h-003
T: Gaussian integral
S: integrals
Q: $\displaystyle\int_{-\infty}^{\infty}e^{-x^2/2}\,dx=$
A: $\sqrt\pi$
B: $\sqrt{2\pi}$
C: $2\pi$
D: $1$
ANS: B
EXP: $I^2=\iint e^{-(x^2+y^2)/2}dx\,dy=\int_0^{2\pi}\!\int_0^\infty e^{-r^2/2}r\,dr\,d\theta=2\pi$, so $I=\sqrt{2\pi}$.
That is why the normal density carries the factor $\tfrac1{\sqrt{2\pi}}$. ($\sqrt\pi$ is for $e^{-x^2}$.)


@ calc h calc-h-004
T: Jacobian of polar coordinates
S: gradients-multivariable
Q: For $x=r\cos\theta$, $y=r\sin\theta$, the Jacobian determinant $\left|\dfrac{\partial(x,y)}{\partial(r,\theta)}\right|$ is:
A: $1$
B: $r$
C: $r^2$
D: $\frac1r$
ANS: B
EXP: $\begin{vmatrix}\cos\theta&-r\sin\theta\\\sin\theta&r\cos\theta\end{vmatrix}=r\cos^2\theta+r\sin^2\theta=r$. So $dx\,dy=r\,dr\,d\theta$.


@ calc h calc-h-005
T: Constrained minimisation (KKT)
S: constrained-optimization
Q: Minimise $x^2+y^2$ subject to $x+2y\ge5$. Minimum value and minimiser:
A: $5$ at $(1,2)$
B: $\sqrt5$ at $(1,2)$
C: $\frac{25}{4}$ at $(0,\frac52)$
D: $25$ at $(5,0)$
ANS: A
EXP: The unconstrained minimum $(0,0)$ violates the constraint, so it is active: $x+2y=5$.
KKT: $(2x,2y)=\mu(1,2)$ with $\mu\ge0\Rightarrow y=2x$, so $5x=5$, $x=1$, $y=2$, $\mu=2>0$.
Value $=1+4=5$. ($\sqrt5$ is the distance; the objective is the squared distance.)


@ calc h calc-h-006
T: Gradient descent and the condition number
S: gradient-descent
Q: Gradient descent on a quadratic whose Hessian has eigenvalues $1$ and $100$, using the best fixed step $\eta=\frac{2}{L+\mu}$. The error contracts each step by a factor of:
A: $\frac{99}{101}$
B: $\frac{1}{100}$
C: $\frac{99}{100}$
D: $\frac12$
ANS: A
EXP: With $\eta=\tfrac2{\mu+L}=\tfrac2{101}$, each eigen-direction scales by $|1-\eta\lambda|$: $|1-\tfrac2{101}|=\tfrac{99}{101}$ and $|1-\tfrac{200}{101}|=\tfrac{99}{101}$.
In general the factor is $\tfrac{\kappa-1}{\kappa+1}$ with $\kappa=L/\mu=100$. Large $\kappa$ makes convergence slow, which motivates feature scaling, momentum and Adam.


@ calc h calc-h-007
T: Leibniz rule with a variable limit
S: integrals
Q: $\dfrac{d}{dx}\displaystyle\int_0^{x^2}e^{t^2}\,dt=$
A: $e^{x^4}$
B: $2xe^{x^4}$
C: $2xe^{x^2}$
D: $e^{x^2}$
ANS: B
EXP: Fundamental theorem plus chain rule: $\dfrac{d}{dx}\int_0^{g(x)}h(t)dt=h(g(x))\,g'(x)=e^{(x^2)^2}\cdot2x$.


@ calc h calc-h-008
T: Hessian of log-sum-exp
S: convexity
Q: Let $f(z)=\log\sum_ie^{z_i}$ and $p=\operatorname{softmax}(z)$. The Hessian $\nabla^2f(z)$ is:
A: $\operatorname{diag}(p)-pp^T$
B: $pp^T$
C: $\operatorname{diag}(p)$
D: $I-pp^T$
ANS: A
EXP: $\nabla f=p$. $\partial p_i/\partial z_j=p_i(\delta_{ij}-p_j)$, so $H=\operatorname{diag}(p)-pp^T$.
It is PSD ($v^THv=\operatorname{Var}_p(v)\ge0$), which proves log-sum-exp is convex and so is the softmax cross-entropy loss in the logits.


@ calc h calc-h-009
T: Maximise xy² on a line
S: constrained-optimization
Q: Maximise $f(x,y)=xy^2$ subject to $x+y=3$, $x,y\ge0$.
A: $4$
B: $\frac{27}{8}$
C: $0$
D: $9$
ANS: A
EXP: Substitute $x=3-y$: $g(y)=(3-y)y^2=3y^2-y^3$. $g'(y)=6y-3y^2=0\Rightarrow y=2$ (or $0$).
$x=1$, $f=1\cdot4=4$. The symmetric guess $x=y=1.5$ gives only $\tfrac{27}{8}$.


@ calc h calc-h-010
T: Smoothness constant of logistic loss
S: gradient-descent
Q: What is the smallest $L$ such that $f(x)=\log(1+e^x)$ has an $L$-Lipschitz derivative?
A: $1$
B: $\frac12$
C: $\frac14$
D: $\infty$
ANS: C
EXP: $f'=\sigma(x)$ and $f''=\sigma(1-\sigma)$, which peaks at $\tfrac14$ when $\sigma=\tfrac12$ ($x=0$).
So $L=\sup|f''|=\tfrac14$, and the safe GD step is $\eta\le1/L=4$ (for one sample with a unit feature).

@ calc e calc-e-011
T: Rational function at infinity
S: limits
Q: $\displaystyle\lim_{x\to\infty}\frac{3x^2+2x}{5x^2-1}=$
A: $0$
B: $\infty$
C: $\frac35$
D: $\frac25$
ANS: C
EXP: Divide top and bottom by the highest power, $x^2$: $\dfrac{3+2/x}{5-1/x^2}\to\dfrac{3}{5}$.
Rule: when numerator and denominator have the same degree, the limit at infinity is the ratio of leading coefficients. $\tfrac25$ wrongly uses the $x$ coefficient of the numerator.

@ calc e calc-e-012
T: Standard limit sin(ax)/(bx)
S: limits
TYPE: nat
TOL: 0.01
Q: Find $\displaystyle\lim_{x\to0}\frac{\sin 5x}{3x}$. Give your answer to 2 decimal places.
ANS: 1.67
EXP: Write $\dfrac{\sin5x}{3x}=\dfrac53\cdot\dfrac{\sin5x}{5x}$.
Standard limit: $\dfrac{\sin u}{u}\to1$ as $u\to0$. So the limit is $\dfrac53\approx1.67$.
A common slip is to answer $1$ by applying $\sin u/u\to1$ without matching the argument $5x$ in the denominator.

@ calc e calc-e-013
T: Removing a 0/0 by factoring
S: limits
Q: $\displaystyle\lim_{x\to2}\frac{x^2-4}{x-2}=$
A: $0$
B: $4$
C: $2$
D: does not exist
ANS: B
EXP: Direct substitution gives $\tfrac00$, which is indeterminate, not "does not exist".
Factor: $\dfrac{(x-2)(x+2)}{x-2}=x+2$ for $x\ne2$, so the limit is $2+2=4$.
The limit only looks at $x$ near $2$, never at $x=2$ itself, so cancelling is allowed.

@ calc e calc-e-014
T: One-sided limits of |x|/x
S: limits
Q: What is $\displaystyle\lim_{x\to0}\frac{|x|}{x}$?
A: $1$
B: $-1$
C: $0$
D: does not exist
ANS: D
EXP: For $x>0$, $\tfrac{|x|}{x}=1$, so the right-hand limit is $1$. For $x<0$, $\tfrac{|x|}{x}=-1$, so the left-hand limit is $-1$.
A two-sided limit exists only when both one-sided limits exist and are equal. Here $1\ne-1$, so it does not exist.
Answering $1$ only checks the right side.

@ calc e calc-e-015
T: Continuity and differentiability of |x|
S: continuity-differentiability
Q: At $x=0$, the function $f(x)=|x|$ is:
A: continuous and differentiable
B: continuous but not differentiable
C: differentiable but not continuous
D: neither continuous nor differentiable
ANS: B
EXP: Continuity: $\lim_{x\to0}|x|=0=f(0)$.
Differentiability: the right derivative is $\lim_{h\to0^+}\tfrac{|h|}{h}=1$ and the left derivative is $-1$. They differ, so $f'(0)$ does not exist (a corner).
"Differentiable but not continuous" is impossible: differentiability always implies continuity. This kink is why the L1 penalty in lasso needs subgradients.

@ calc e calc-e-016
T: Joining two pieces continuously
S: continuity-differentiability
TYPE: nat
TOL: 0.01
Q: Let $f(x)=kx+1$ for $x<2$ and $f(x)=x^2$ for $x\ge2$. Enter the value of $k$ that makes $f$ continuous at $x=2$.
ANS: 1.5
EXP: Continuity at $2$ needs the left limit to equal $f(2)$.
Left limit: $2k+1$. Value: $f(2)=4$.
$2k+1=4\Rightarrow k=1.5$.

@ calc e calc-e-017
T: One-sided derivatives of ReLU
S: continuity-differentiability
Q: For $\operatorname{ReLU}(x)=\max(0,x)$, the left-hand and right-hand derivatives at $x=0$ are, respectively:
A: $0$ and $1$
B: $1$ and $0$
C: $0$ and $0$
D: both undefined
ANS: A
EXP: Left: for $h<0$, $\tfrac{\operatorname{ReLU}(h)-0}{h}=\tfrac0h=0$. Right: for $h>0$, $\tfrac{h}{h}=1$.
Both one-sided derivatives exist but differ, so ReLU is not differentiable at $0$. Deep learning libraries simply pick a value in $[0,1]$ (usually $0$) there.

@ calc e calc-e-018
T: Removable discontinuity
S: continuity-differentiability
Q: Let $f(x)=\dfrac{x^2-9}{x-3}$ for $x\ne3$ and $f(3)=k$. For which $k$ is $f$ continuous at $x=3$?
A: $0$
B: $3$
C: $9$
D: $6$
ANS: D
EXP: For $x\ne3$, $f(x)=\dfrac{(x-3)(x+3)}{x-3}=x+3$, so $\lim_{x\to3}f(x)=6$.
Continuity needs $f(3)$ to equal the limit, so $k=6$. Any other $k$ leaves a removable discontinuity (a hole filled at the wrong height).

@ calc e calc-e-019
T: Continuity vs differentiability facts
S: continuity-differentiability
TYPE: msq
Q: Which of the following statements are true? (More than one option may be correct.)
A: If $f$ is differentiable at $a$, then $f$ is continuous at $a$.
B: If $f$ is continuous at $a$, then $f$ is differentiable at $a$.
C: $f(x)=|x|$ is continuous at $x=0$.
D: $f(x)=|x|$ is differentiable at $x=0$.
ANS: A,C
EXP: [[A]] is true: $f(a+h)-f(a)=\tfrac{f(a+h)-f(a)}{h}\cdot h\to f'(a)\cdot0=0$.
[[B]] is false: $|x|$ is continuous at $0$ but has a corner there.
[[C]] is true since $|x|\to0=|0|$. [[D]] is false: the one-sided derivatives are $-1$ and $1$.

@ calc e calc-e-020
T: Quotient rule for ln(x)/x
S: derivatives
Q: $\dfrac{d}{dx}\left(\dfrac{\ln x}{x}\right)=$
A: $\dfrac{1-\ln x}{x^2}$
B: $\dfrac{\ln x-1}{x^2}$
C: $\dfrac{1}{x^2}$
D: $\dfrac{1+\ln x}{x^2}$
ANS: A
EXP: Quotient rule $\left(\tfrac uv\right)'=\tfrac{u'v-uv'}{v^2}$ with $u=\ln x$, $v=x$:
$\dfrac{\tfrac1x\cdot x-\ln x\cdot1}{x^2}=\dfrac{1-\ln x}{x^2}$.
$\tfrac{\ln x-1}{x^2}$ comes from subtracting in the wrong order ($uv'-u'v$).

@ calc e calc-e-021
T: Coefficient of x³ in e^x
S: taylor-series
Q: In the Maclaurin series of $e^x$, the coefficient of $x^3$ is:
A: $\frac13$
B: $\frac12$
C: $\frac1{24}$
D: $\frac16$
ANS: D
EXP: $e^x=\sum_{n\ge0}\dfrac{x^n}{n!}$ because every derivative of $e^x$ equals $1$ at $0$.
The $x^3$ coefficient is $\tfrac1{3!}=\tfrac16$. $\tfrac13$ divides by $n$ instead of $n!$; $\tfrac1{24}$ is the $x^4$ coefficient.

@ calc e calc-e-022
T: Linear approximation of a square root
S: taylor-series
TYPE: nat
TOL: 0.001
Q: Use the first-order (linear) Taylor approximation of $f(x)=\sqrt x$ about $x=4$ to estimate $\sqrt{4.1}$. Give your answer to 3 decimal places.
ANS: 2.025
EXP: $f(4)=2$, $f'(x)=\dfrac1{2\sqrt x}\Rightarrow f'(4)=\dfrac14$.
$f(4.1)\approx f(4)+f'(4)(0.1)=2+0.025=2.025$.
The true value is $2.02485$; the small error is the neglected second-order term, which is negative since $\sqrt x$ is concave.

@ calc e calc-e-023
T: Maclaurin series of sin x
S: taylor-series
Q: The Maclaurin series of $\sin x$ is:
A: $x-\dfrac{x^3}{3!}+\dfrac{x^5}{5!}-\cdots$
B: $x+\dfrac{x^3}{3!}+\dfrac{x^5}{5!}+\cdots$
C: $1-\dfrac{x^2}{2!}+\dfrac{x^4}{4!}-\cdots$
D: $x-\dfrac{x^3}{3}+\dfrac{x^5}{5}-\cdots$
ANS: A
EXP: Derivatives of $\sin x$ at $0$ cycle $0,1,0,-1,\dots$, so only odd powers appear with alternating signs and factorial denominators.
The all-plus series is $\sinh x$, the even series is $\cos x$, and dividing by $n$ instead of $n!$ gives the series of $\arctan x$.

@ calc e calc-e-024
T: General Taylor coefficient
S: taylor-series
Q: In the Taylor series of $f$ about $x=a$, the coefficient of $(x-a)^n$ is:
A: $f^{(n)}(a)$
B: $\dfrac{f^{(n)}(a)}{n}$
C: $\dfrac{f^{(n)}(a)}{n!}$
D: $n!\,f^{(n)}(a)$
ANS: C
EXP: Differentiating $\sum c_k(x-a)^k$ $n$ times and setting $x=a$ leaves $n!\,c_n=f^{(n)}(a)$, so $c_n=\dfrac{f^{(n)}(a)}{n!}$.
Forgetting the $n!$ is the most common error in second-order expansions (the $\tfrac12$ in front of the Hessian term).

@ calc e calc-e-025
T: Where the geometric series is valid
S: taylor-series
Q: The expansion $\dfrac1{1-x}=1+x+x^2+x^3+\cdots$ is valid for:
A: all real $x$
B: $|x|<1$
C: $|x|\le1$
D: $x<1$
ANS: B
EXP: The partial sums are $\dfrac{1-x^{n+1}}{1-x}$, which converge to $\dfrac1{1-x}$ only when $x^{n+1}\to0$, i.e. $|x|<1$.
At $x=1$ the series diverges to $\infty$; at $x=-1$ it oscillates $1,0,1,0,\dots$. And $x<1$ would include $x=-2$, where the terms grow without bound.

@ calc e calc-e-026
T: Global max on a closed interval
S: maxima-minima
Q: What is the global maximum value of $f(x)=x^2$ on $[-1,2]$?
A: $1$
B: $0$
C: $2$
D: $4$
ANS: D
EXP: Closed interval method: compare $f$ at critical points and endpoints.
$f'(x)=2x=0\Rightarrow x=0$, $f(0)=0$ (the minimum). Endpoints: $f(-1)=1$, $f(2)=4$.
The maximum is $4$ at the endpoint $x=2$; the only critical point gives the minimum, so checking critical points alone misses it.

@ calc e calc-e-027
T: Inflection point of a cubic
S: maxima-minima
Q: At which $x$ does $f(x)=x^3-6x^2$ have an inflection point?
A: $x=0$
B: $x=2$
C: $x=4$
D: $x=6$
ANS: B
EXP: Inflection points are where $f''$ changes sign. $f''(x)=6x-12$, which is $0$ at $x=2$ and changes from negative to positive there.
$x=0$ and $x=4$ are the critical points ($f'=3x^2-12x=0$), which is a different thing; $x=6$ is a root of $f$.

@ calc e calc-e-028
T: Second derivative test
S: maxima-minima
Q: Suppose $f'(c)=0$ and $f''(c)=-3$. Then at $x=c$, $f$ has:
A: a local maximum
B: a local minimum
C: an inflection point
D: no conclusion possible
ANS: A
EXP: Second derivative test: at a stationary point, $f''(c)<0$ means the graph is concave down, so $c$ is a local maximum.
The test is inconclusive only when $f''(c)=0$. Reading the negative value as "minimum" mixes up the sign.

@ calc e calc-e-029
T: Minimum of x + 4/x
S: maxima-minima
Q: For $x>0$, the minimum value of $f(x)=x+\dfrac4x$ is:
A: $2$
B: $5$
C: $4$
D: $8$
ANS: C
EXP: $f'(x)=1-\dfrac4{x^2}=0\Rightarrow x=2$ (positive root). $f''(x)=\dfrac8{x^3}>0$, so it is a minimum.
$f(2)=2+2=4$. ($2$ is where the minimum occurs, not its value; $5=f(1)$ or $f(4)$.)

@ calc m calc-m-011
T: Limit of (1 + 2/x)^x
S: limits
Q: $\displaystyle\lim_{x\to\infty}\left(1+\frac2x\right)^x=$
A: $1$
B: $e^2$
C: $e$
D: $\sqrt e$
ANS: B
EXP: This is a $1^\infty$ form. Take logs: $x\ln\!\left(1+\tfrac2x\right)=\dfrac{\ln(1+2/x)}{1/x}$.
With $u=1/x\to0$: $\dfrac{\ln(1+2u)}{u}\to2$. So the limit is $e^2$.
General rule: $(1+a/x)^x\to e^a$. Answering $1$ treats $1^\infty$ as $1$, which is wrong because the base approaches $1$ while the exponent grows.

@ calc m calc-m-012
T: Limit of (x − sin x)/x³
S: limits
Q: $\displaystyle\lim_{x\to0}\frac{x-\sin x}{x^3}=$
A: $0$
B: $-\frac16$
C: $\frac16$
D: $\frac13$
ANS: C
EXP: Taylor: $\sin x=x-\dfrac{x^3}{6}+O(x^5)$, so $x-\sin x=\dfrac{x^3}{6}+O(x^5)$ and the ratio tends to $\tfrac16$.
(L'Hôpital three times gives the same: $\tfrac{1-\cos x}{3x^2}\to\tfrac{\sin x}{6x}\to\tfrac16$.)
$-\tfrac16$ is the limit of $(\sin x-x)/x^3$; the order of subtraction matters.

@ calc m calc-m-013
T: Difference of a root and x at infinity
S: limits
TYPE: nat
TOL: 0
Q: Find $\displaystyle\lim_{x\to\infty}\left(\sqrt{x^2+4x}-x\right)$.
ANS: 2
EXP: This is $\infty-\infty$. Multiply by the conjugate:
$\dfrac{(x^2+4x)-x^2}{\sqrt{x^2+4x}+x}=\dfrac{4x}{\sqrt{x^2+4x}+x}=\dfrac{4}{\sqrt{1+4/x}+1}\to\dfrac42=2$.
Concluding $0$ because "both terms are about $x$" ignores that their difference stays finite.

@ calc m calc-m-014
T: Limit of x ln x at zero
S: limits
Q: $\displaystyle\lim_{x\to0^+}x\ln x=$
A: $0$
B: $-\infty$
C: $-1$
D: $1$
ANS: A
EXP: This is a $0\cdot(-\infty)$ form. Rewrite as $\dfrac{\ln x}{1/x}$, which is $\tfrac{-\infty}{\infty}$, and apply L'Hôpital:
$\dfrac{1/x}{-1/x^2}=-x\to0$.
Powers of $x$ beat logarithms. This is why $0\log0$ is taken as $0$ in the entropy formula.

@ calc m calc-m-015
T: Limit of (3^x − 2^x)/x
S: limits
Q: $\displaystyle\lim_{x\to0}\frac{3^x-2^x}{x}=$
A: $\ln 6$
B: $1$
C: $\dfrac{\ln3}{\ln2}$
D: $\ln\dfrac32$
ANS: D
EXP: Use the standard limit $\dfrac{a^x-1}{x}\to\ln a$ (since $a^x=e^{x\ln a}$).
Split: $\dfrac{3^x-1}{x}-\dfrac{2^x-1}{x}\to\ln3-\ln2=\ln\tfrac32$.
$\ln6$ adds the logs instead of subtracting; $\tfrac{\ln3}{\ln2}$ divides them.

@ calc m calc-m-016
T: Which limits equal 1
S: limits
TYPE: msq
Q: Which of the following limits equal $1$? (More than one option may be correct.)
A: $\displaystyle\lim_{x\to\infty}x\sin\frac1x$
B: $\displaystyle\lim_{x\to0}\frac{\ln(1+x)}{x}$
C: $\displaystyle\lim_{x\to\infty}\left(1+\frac1x\right)^x$
D: $\displaystyle\lim_{x\to0}\frac{1-\cos x}{x}$
ANS: A,B
EXP: [[A]]: put $u=1/x\to0^+$; then $x\sin\tfrac1x=\tfrac{\sin u}{u}\to1$. True.
[[B]]: $\ln(1+x)=x-\tfrac{x^2}2+\cdots$, so the ratio $\to1$. True.
[[C]]: this is the definition of $e\approx2.718$, not $1$. False.
[[D]]: $1-\cos x\approx\tfrac{x^2}{2}$, so the ratio $\approx\tfrac x2\to0$. False.

@ calc m calc-m-017
T: Constants for a differentiable join
S: continuity-differentiability
TYPE: nat
TOL: 0
Q: Let $f(x)=x^2$ for $x\le1$ and $f(x)=ax+b$ for $x>1$. If $f$ is differentiable at $x=1$, enter the value of $b$.
ANS: -1
EXP: Differentiability needs both continuity and matching one-sided derivatives at $x=1$.
Slopes: left $2x|_{x=1}=2$, right $a$, so $a=2$.
Continuity: $1^2=a+b\Rightarrow b=1-2=-1$.
So the line $y=2x-1$ is the tangent to $x^2$ at $x=1$. Matching only the values (without slopes) does not fix $b$.

@ calc m calc-m-018
T: Mean value theorem point for x³
S: continuity-differentiability
Q: For $f(x)=x^3$ on $[0,3]$, the value $c\in(0,3)$ guaranteed by the mean value theorem is:
A: $\frac32$
B: $\sqrt3$
C: $1$
D: $3$
ANS: B
EXP: MVT: $f$ is continuous on $[0,3]$ and differentiable on $(0,3)$, so some $c$ has $f'(c)=\dfrac{f(3)-f(0)}{3-0}=\dfrac{27}{3}=9$.
$3c^2=9\Rightarrow c=\sqrt3\approx1.73$ (the root $-\sqrt3$ is outside the interval).
The midpoint $\tfrac32$ works only for quadratics.

@ calc m calc-m-019
T: x·sin(1/x) at the origin
S: continuity-differentiability
Q: Let $f(x)=x\sin\dfrac1x$ for $x\ne0$ and $f(0)=0$. At $x=0$, $f$ is:
A: continuous but not differentiable
B: differentiable with $f'(0)=0$
C: differentiable with $f'(0)=1$
D: not continuous
ANS: A
EXP: Continuity: $|x\sin\tfrac1x|\le|x|\to0$ (squeeze theorem), so $f(x)\to0=f(0)$.
Derivative: $\dfrac{f(h)-f(0)}{h}=\sin\dfrac1h$, which oscillates between $-1$ and $1$ as $h\to0$ and has no limit.
So $f$ is continuous but not differentiable at $0$. The bound $|f|\le|x|$ controls the values, not the difference quotient.

@ calc m calc-m-020
T: Counting kinks of a sum of absolute values
S: continuity-differentiability
TYPE: nat
TOL: 0
Q: At how many points of $\mathbb R$ is $f(x)=|x^2-1|+|x|$ not differentiable?
ANS: 3
EXP: $|g(x)|$ can fail to be differentiable only where $g(x)=0$ and $g$ changes sign there.
$|x^2-1|$: kinks at $x=\pm1$ (slopes jump from $-2$ to $2$ at $x=1$, and from $-2$ to $2$ at $x=-1$).
$|x|$: kink at $x=0$, where $|x^2-1|=1-x^2$ is smooth, so the kink cannot cancel.
At $x=\pm1$ the term $|x|$ is smooth, so those kinks also survive. Total: $3$.

@ calc m calc-m-021
T: Which functions are differentiable at 0
S: continuity-differentiability
TYPE: msq
Q: Which of the following functions are differentiable at $x=0$? (More than one option may be correct.)
A: $f(x)=\left(\max(0,x)\right)^2$
B: $f(x)=|x|^3$
C: $f(x)=|\sin x|$
D: $f(x)=x^{1/3}$
ANS: A,B
EXP: [[A]]: the difference quotient is $0$ for $h<0$ and $h$ for $h>0$; both tend to $0$, so $f'(0)=0$. Squaring ReLU smooths its kink.
[[B]]: $\tfrac{|h|^3}{h}=\pm h^2\to0$, so $f'(0)=0$.
[[C]]: $\tfrac{|\sin h|}{h}\to1$ from the right and $-1$ from the left, so no derivative.
[[D]]: $\tfrac{h^{1/3}}{h}=h^{-2/3}\to\infty$, a vertical tangent, so not differentiable even though it is continuous.

@ calc m calc-m-022
T: Smoothness of the Huber loss
S: continuity-differentiability
Q: The Huber loss with $\delta=1$ is $h(r)=\tfrac12r^2$ for $|r|\le1$ and $h(r)=|r|-\tfrac12$ for $|r|>1$. Which statement is true?
A: $h$ is not continuous at $r=\pm1$
B: $h$ is continuous but not differentiable at $r=\pm1$
C: $h$ is differentiable everywhere, but $h''$ does not exist at $r=\pm1$
D: $h$ is twice differentiable everywhere
ANS: C
EXP: At $r=1$: values $\tfrac12$ and $1-\tfrac12=\tfrac12$ agree, so $h$ is continuous.
Slopes: $r|_{r=1}=1$ on the inside and $1$ on the outside, so $h'(1)=1$ exists.
Second derivative: $1$ inside, $0$ outside, so it jumps and $h''(1)$ does not exist. The same holds at $r=-1$ by symmetry.
This is the design of Huber: quadratic (like MSE) near $0$, linear (like MAE) in the tails, joined with a continuous gradient, which suits gradient descent.

@ calc m calc-m-023
T: Floor function sum at an integer
S: continuity-differentiability
Q: Let $f(x)=\lfloor x\rfloor+\lfloor -x\rfloor$. Which statement about $f$ at $x=2$ is true?
A: $f$ is continuous at $2$
B: $\lim_{x\to2}f(x)$ does not exist
C: $\lim_{x\to2}f(x)=-1$ but $f(2)=0$, a removable discontinuity
D: $\lim_{x\to2}f(x)=0=f(2)$
ANS: C
EXP: If $x$ is not an integer, $\lfloor -x\rfloor=-\lfloor x\rfloor-1$, so $f(x)=-1$. If $x$ is an integer, $f(x)=x+(-x)=0$.
Near $x=2$ (but not at it), $f=-1$ on both sides, so the limit exists and equals $-1$, while $f(2)=0$.
Each floor alone jumps at $2$, but the jumps cancel in the sum, which is why the limit exists.

@ calc m calc-m-024
T: Implicit differentiation on an ellipse
S: derivatives
Q: The curve $x^2+xy+y^2=7$ passes through $(1,2)$. What is $\dfrac{dy}{dx}$ there?
A: $-\frac54$
B: $\frac45$
C: $-1$
D: $-\frac45$
ANS: D
EXP: Differentiate both sides with respect to $x$, treating $y$ as $y(x)$:
$2x+\left(y+xy'\right)+2yy'=0\Rightarrow y'=-\dfrac{2x+y}{x+2y}$.
At $(1,2)$: $y'=-\dfrac{4}{5}$.
$-\tfrac54$ inverts the fraction. $-1$ comes from forgetting the product rule on $xy$: differentiating it as just $y$ drops the $xy'$ term and gives $y'=-\tfrac{2x+y}{2y}=-1$.

@ calc m calc-m-025
T: Derivative of arctan(1/x)
S: derivatives
Q: For $x\ne0$, $\dfrac{d}{dx}\arctan\!\left(\dfrac1x\right)=$
A: $\dfrac{1}{1+x^2}$
B: $-\dfrac{1}{1+x^2}$
C: $\dfrac{x^2}{1+x^2}$
D: $-\dfrac{1}{x^2+1/x^2}$
ANS: B
EXP: Chain rule: $\dfrac{1}{1+(1/x)^2}\cdot\left(-\dfrac1{x^2}\right)=\dfrac{x^2}{x^2+1}\cdot\left(-\dfrac1{x^2}\right)=-\dfrac1{1+x^2}$.
Check: $\arctan x+\arctan\tfrac1x$ is constant ($\pm\tfrac\pi2$) on each side of $0$, so the two derivatives must be negatives of each other.
$\tfrac{x^2}{1+x^2}$ forgets the inner derivative $-1/x^2$.

@ calc m calc-m-026
T: Derivative of an inverse function
S: derivatives
TYPE: nat
TOL: 0.01
Q: Let $f(x)=x^3+x$ and $g=f^{-1}$. Find $g'(2)$.
ANS: 0.25
EXP: Inverse function rule: $g'(y)=\dfrac{1}{f'(g(y))}$.
First find $g(2)$: $x^3+x=2\Rightarrow x=1$. Then $f'(x)=3x^2+1$, so $f'(1)=4$.
$g'(2)=\tfrac14=0.25$. Plugging $2$ straight into $f'$ (giving $\tfrac1{13}$) is the classic mistake: $f'$ must be evaluated at $g(2)$, not at $2$.

@ calc m calc-m-027
T: Derivative of tanh
S: derivatives
Q: $\dfrac{d}{dx}\tanh x=$
A: $1+\tanh^2x$
B: $\tanh x\,(1-\tanh x)$
C: $1-\tanh^2x$
D: $\dfrac{1}{\cosh x}$
ANS: C
EXP: $\tanh x=\dfrac{\sinh x}{\cosh x}$. Quotient rule: $\dfrac{\cosh^2x-\sinh^2x}{\cosh^2x}=\dfrac1{\cosh^2x}=1-\tanh^2x$.
$\tanh x(1-\tanh x)$ mimics the sigmoid formula $\sigma(1-\sigma)$, which does not carry over.
At $x=0$ the derivative is $1$ (versus $\tfrac14$ for the sigmoid), one reason tanh layers train better than sigmoid layers.

@ calc m calc-m-028
T: Derivative of a base-2 logarithm
S: derivatives
TYPE: nat
TOL: 0.01
Q: Find $\dfrac{d}{dx}\log_2(x^2+1)$ at $x=1$. Give your answer to 2 decimal places.
ANS: 1.44
EXP: Change of base: $\log_2u=\dfrac{\ln u}{\ln2}$, so $\dfrac{d}{dx}\log_2u=\dfrac{u'}{u\ln2}$.
With $u=x^2+1$: $\dfrac{2x}{(x^2+1)\ln2}$. At $x=1$: $\dfrac{2}{2\ln2}=\dfrac1{\ln2}\approx1.44$.
Forgetting the $\ln2$ gives $1$. The same factor converts entropy in nats to bits.

@ calc m calc-m-029
T: Second derivative of a parametric curve
S: derivatives
Q: For the curve $x=t^2$, $y=t^3$, find $\dfrac{d^2y}{dx^2}$ at $t=1$.
A: $\frac32$
B: $\frac34$
C: $3$
D: $\frac12$
ANS: B
EXP: First derivative: $\dfrac{dy}{dx}=\dfrac{dy/dt}{dx/dt}=\dfrac{3t^2}{2t}=\dfrac{3t}2$.
Second derivative: differentiate $\tfrac{dy}{dx}$ with respect to $t$ and divide by $\tfrac{dx}{dt}$ again: $\dfrac{3/2}{2t}=\dfrac3{4t}$. At $t=1$ this is $\tfrac34$.
$\tfrac32$ forgets the second division by $dx/dt$; $3$ is $\tfrac{d^2y/dt^2}{d^2x/dt^2}=\tfrac{6t}{2}$, which is not a valid formula.

@ calc m calc-m-030
T: Derivative of log-sigmoid
S: derivatives
Q: Let $\sigma(x)=\dfrac1{1+e^{-x}}$. Then $\dfrac{d}{dx}\ln\sigma(x)=$
A: $\sigma(x)$
B: $\dfrac1{\sigma(x)}$
C: $\sigma(x)(1-\sigma(x))$
D: $1-\sigma(x)$
ANS: D
EXP: Chain rule: $\dfrac{\sigma'(x)}{\sigma(x)}=\dfrac{\sigma(1-\sigma)}{\sigma}=1-\sigma(x)$.
(Or directly: $\ln\sigma(x)=-\ln(1+e^{-x})$, whose derivative is $\tfrac{e^{-x}}{1+e^{-x}}=1-\sigma(x)$.)
This is why the logistic-regression log-likelihood has the simple gradient $(y-\sigma)x$. $\sigma(1-\sigma)$ is the derivative of $\sigma$ itself, before taking the log.

@ calc m calc-m-031
T: x⁴ coefficient of e^(−x²)
S: taylor-series
Q: The coefficient of $x^4$ in the Maclaurin series of $e^{-x^2}$ is:
A: $\frac12$
B: $-\frac12$
C: $\frac1{24}$
D: $\frac16$
ANS: A
EXP: Substitute $u=-x^2$ into $e^u=1+u+\tfrac{u^2}{2}+\cdots$: $e^{-x^2}=1-x^2+\dfrac{x^4}{2}-\cdots$.
The $x^4$ term comes from $\tfrac{u^2}{2}=\tfrac{x^4}{2}$, positive because $(-x^2)^2>0$.
$\tfrac1{24}$ is the $x^4$ coefficient of $e^x$, forgetting the substitution. Substitution is much faster than differentiating four times.

@ calc m calc-m-032
T: A high derivative read off a series
S: taylor-series
TYPE: nat
TOL: 0
Q: Let $f(x)=x^2e^x$. Find $f^{(5)}(0)$, the fifth derivative at $0$.
ANS: 20
EXP: Expand: $x^2e^x=\sum_{n\ge0}\dfrac{x^{n+2}}{n!}$. The $x^5$ term has $n=3$, coefficient $\tfrac1{3!}=\tfrac16$.
Since the coefficient of $x^5$ is $\tfrac{f^{(5)}(0)}{5!}$: $f^{(5)}(0)=\dfrac{5!}{3!}=20$.
Reading off the coefficient $\tfrac16$ as the derivative forgets to multiply by $5!$.

@ calc m calc-m-033
T: Error bound for sin x ≈ x
S: taylor-series
Q: Using Taylor's theorem with the Lagrange remainder, which is the smallest of these expressions that is a guaranteed upper bound on the error $|\sin(0.1)-0.1|$?
A: $\dfrac{(0.1)^2}{2}$
B: $\dfrac{(0.1)^3}{3}$
C: $\dfrac{(0.1)^3}{6}$
D: $\dfrac{(0.1)^5}{120}$
ANS: C
EXP: The Maclaurin polynomial of degree 2 of $\sin x$ is just $x$ (the $x^2$ coefficient is $0$). The remainder is $R_2=\dfrac{f'''(c)}{3!}x^3$ with $|f'''(c)|=|\cos c|\le1$.
So the error is at most $\dfrac{(0.1)^3}{6}\approx1.67\times10^{-4}$ (actual: $1.666\times10^{-4}$).
$\tfrac{(0.1)^2}{2}$ (the degree-1 remainder) and $\tfrac{(0.1)^3}{3}$ are valid but looser. $\tfrac{(0.1)^5}{120}$ is not an upper bound at all: it bounds the error of $x-\tfrac{x^3}{6}$, not of $x$.

@ calc m calc-m-034
T: Series of ln((1+x)/(1−x))
S: taylor-series
Q: The coefficient of $x^3$ in the Maclaurin series of $\ln\dfrac{1+x}{1-x}$ is:
A: $\frac13$
B: $0$
C: $-\frac23$
D: $\frac23$
ANS: D
EXP: $\ln(1+x)=x-\tfrac{x^2}2+\tfrac{x^3}3-\cdots$ and $\ln(1-x)=-x-\tfrac{x^2}2-\tfrac{x^3}3-\cdots$.
Subtract: even powers cancel and odd powers double: $2\left(x+\tfrac{x^3}{3}+\tfrac{x^5}{5}+\cdots\right)$.
So the coefficient is $\tfrac23$. $\tfrac13$ forgets the doubling; $0$ wrongly cancels the odd terms instead of the even ones.

@ calc m calc-m-035
T: Taylor polynomial of x³ about 1
S: taylor-series
Q: Written as a Taylor polynomial about $x=1$, $x^3=1+3(x-1)+c(x-1)^2+(x-1)^3$. What is $c$?
A: $6$
B: $3$
C: $1$
D: $\frac32$
ANS: B
EXP: $c=\dfrac{f''(1)}{2!}$ with $f''(x)=6x$, so $c=\tfrac62=3$.
Check by the binomial theorem: $\left((x-1)+1\right)^3=(x-1)^3+3(x-1)^2+3(x-1)+1$.
$6$ forgets to divide by $2!$.

@ calc m calc-m-036
T: Quadratic Taylor polynomial of the sigmoid
S: taylor-series
Q: The second-order Maclaurin polynomial of $\sigma(x)=\dfrac1{1+e^{-x}}$ is:
A: $\dfrac12+\dfrac x4+\dfrac{x^2}{8}$
B: $\dfrac12+\dfrac x2$
C: $\dfrac x4$
D: $\dfrac12+\dfrac x4$
ANS: D
EXP: $\sigma(0)=\tfrac12$ and $\sigma'(0)=\sigma(0)(1-\sigma(0))=\tfrac14$.
$\sigma(x)-\tfrac12$ is an odd function (since $\sigma(-x)=1-\sigma(x)$), so all even-power coefficients, including $x^2$, are $0$.
So $\sigma(x)\approx\tfrac12+\tfrac x4$ (next term $-\tfrac{x^3}{48}$). The $\tfrac{x^2}{8}$ term belongs to softplus, not sigmoid. Near $0$ the sigmoid is almost linear, which is why small initial weights put sigmoid units in their linear regime.

@ calc m calc-m-037
T: Global max beats the local max
S: maxima-minima
Q: What is the global maximum value of $f(x)=x^3-3x^2+1$ on $[-1,4]$?
A: $1$
B: $17$
C: $-3$
D: $20$
ANS: B
EXP: $f'(x)=3x^2-6x=3x(x-2)=0\Rightarrow x=0$ or $x=2$.
Values: $f(-1)=-3$, $f(0)=1$ (local max), $f(2)=-3$ (local min), $f(4)=64-48+1=17$.
The global maximum is $17$ at the endpoint $x=4$. Reporting the local maximum $1$ forgets the endpoints.

@ calc m calc-m-038
T: A stationary point that is not an extremum
S: maxima-minima
Q: For $f(x)=x^4-4x^3$, the stationary point $x=0$ is:
A: a local minimum
B: a local maximum
C: neither, because $f'$ does not change sign there
D: a global minimum
ANS: C
EXP: $f'(x)=4x^3-12x^2=4x^2(x-3)$. Stationary points: $x=0$ and $x=3$.
First derivative test at $0$: $4x^2\ge0$ and $x-3<0$ near $0$, so $f'<0$ on both sides; $f$ keeps decreasing through $0$. No extremum.
$f''(x)=12x^2-24x$ changes sign at $0$, so it is a stationary inflection point. The global minimum is at $x=3$ ($f(3)=-27$).

@ calc m calc-m-039
T: Extrema of the double well x⁴ − 2x²
S: maxima-minima
TYPE: msq
Q: For $f(x)=x^4-2x^2$ on $\mathbb R$, which statements are true? (More than one option may be correct.)
A: $f$ has a local maximum at $x=0$.
B: The global minimum value of $f$ is $-1$.
C: $f$ has a global maximum on $\mathbb R$.
D: $f$ has inflection points at $x=\pm1$.
ANS: A,B
EXP: $f'(x)=4x(x^2-1)=0\Rightarrow x=0,\pm1$. $f''(x)=12x^2-4$.
[[A]]: $f''(0)=-4<0$, local max. True.
[[B]]: $f''(\pm1)=8>0$, minima with $f(\pm1)=-1$, and $f\to\infty$ as $|x|\to\infty$, so $-1$ is the global minimum. True.
[[C]]: $f$ is unbounded above. False.
[[D]]: $f''=0$ at $x=\pm\tfrac1{\sqrt3}$, not $\pm1$ (those are the minima). False.
This non-convex double well has two global minima, a toy picture of a loss with several equally good solutions.

@ calc m calc-m-040
T: Minimum of x ln x
S: maxima-minima
Q: For $x>0$, the minimum value of $f(x)=x\ln x$ is:
A: $-\dfrac1e$
B: $\dfrac1e$
C: $0$
D: $-1$
ANS: A
EXP: $f'(x)=\ln x+1=0\Rightarrow x=e^{-1}$. $f''(x)=\tfrac1x>0$, so this is the global minimum on $(0,\infty)$.
$f(e^{-1})=e^{-1}\cdot(-1)=-\tfrac1e\approx-0.368$.
$\tfrac1e$ is where the minimum occurs, not its value. $-x\ln x$ is the term in entropy, so it peaks at $p=\tfrac1e$.

@ calc m calc-m-041
T: Minimising a sum of absolute deviations
S: maxima-minima
TYPE: nat
TOL: 0
Q: Find the minimum value of $f(x)=|x-1|+|x-3|+|x-8|$ over $x\in\mathbb R$.
ANS: 7
EXP: $f$ is piecewise linear with slope $=(\#\text{points left of }x)-(\#\text{points right of }x)$.
The slope is $-1$ on $(1,3)$ and $+1$ on $(3,8)$, so the minimum is at the median $x=3$: $f(3)=2+0+5=7$.
The mean $x=4$ gives $3+1+4=8$, which is not optimal. This is why the L1 (MAE) loss is minimised by the median and the L2 loss by the mean.

@ calc m calc-m-042
T: An extremum where f′ does not exist
S: maxima-minima
Q: Let $f(x)=x^{2/3}(x-5)$. Where does $f$ have a local maximum?
A: $x=2$
B: $x=5$
C: $x=0$
D: nowhere
ANS: C
EXP: $f=x^{5/3}-5x^{2/3}$, so $f'(x)=\tfrac53x^{2/3}-\tfrac{10}3x^{-1/3}=\dfrac{5(x-2)}{3x^{1/3}}$.
Critical points: $f'=0$ at $x=2$, and $f'$ does not exist at $x=0$.
Signs: $f'>0$ for $x<0$, $f'<0$ on $(0,2)$, $f'>0$ for $x>2$. So $x=0$ is a local max (a cusp, value $0$) and $x=2$ is a local min.
Solving only $f'(x)=0$ finds $x=2$ and misses the cusp.

@ calc h calc-h-011
T: Limit of x^x at zero
S: limits
Q: $\displaystyle\lim_{x\to0^+}x^x=$
A: $0$
B: $1$
C: $e$
D: does not exist
ANS: B
EXP: $0^0$ is indeterminate. Write $x^x=e^{x\ln x}$.
$x\ln x=\dfrac{\ln x}{1/x}\to\lim\dfrac{1/x}{-1/x^2}=\lim(-x)=0$ (L'Hôpital).
So $x^x\to e^0=1$. Guessing $0$ (because the base goes to $0$) ignores that the exponent also goes to $0$.

@ calc h calc-h-012
T: Choosing a to make a limit finite
S: limits
TYPE: nat
TOL: 0.01
Q: There is a constant $a$ for which $\displaystyle\lim_{x\to0}\frac{\sin2x+ax}{x^3}$ exists and is finite. Find the value of this limit, to 2 decimal places.
ANS: -1.33
EXP: Taylor: $\sin2x=2x-\dfrac{(2x)^3}{6}+O(x^5)=2x-\dfrac{4x^3}{3}+O(x^5)$.
Numerator: $(2+a)x-\tfrac43x^3+O(x^5)$. For a finite limit the $x$ term must vanish: $a=-2$.
Then the ratio tends to $-\tfrac43\approx-1.33$.
Writing $2\cdot\tfrac{x^3}{6}$ instead of $\tfrac{(2x)^3}{6}$ (not cubing the $2$) gives $-0.33$, a common slip.

@ calc h calc-h-013
T: Limit of (x/(x+1))^x
S: limits
Q: $\displaystyle\lim_{x\to\infty}\left(\frac{x}{x+1}\right)^x=$
A: $1$
B: $e$
C: $0$
D: $\dfrac1e$
ANS: D
EXP: $\dfrac{x}{x+1}=\dfrac1{1+1/x}$, so the expression is $\dfrac{1}{(1+1/x)^x}\to\dfrac1e$.
Trap: the base tends to $1$, but $1^\infty$ is indeterminate. Taking logs, $x\ln\tfrac{x}{x+1}=-x\ln(1+\tfrac1x)\to-1$.

@ calc h calc-h-014
T: Difference of 1/sin² x and 1/x²
S: limits
Q: $\displaystyle\lim_{x\to0}\left(\frac1{\sin^2x}-\frac1{x^2}\right)=$
A: $0$
B: $\frac13$
C: $\frac16$
D: $\infty$
ANS: B
EXP: $\infty-\infty$ form. Combine: $\dfrac{x^2-\sin^2x}{x^2\sin^2x}$.
Taylor: $\sin^2x=\left(x-\tfrac{x^3}6\right)^2+\cdots=x^2-\tfrac{x^4}{3}+O(x^6)$, so the numerator is $\tfrac{x^4}{3}+O(x^6)$.
Denominator: $x^2\sin^2x=x^4+O(x^6)$. The limit is $\tfrac13$.
$\tfrac16$ forgets that squaring $x-\tfrac{x^3}{6}$ doubles the cross term ($2\cdot x\cdot\tfrac{x^3}{6}=\tfrac{x^4}{3}$).

@ calc h calc-h-015
T: Limit of (cos x)^(1/x²)
S: limits
Q: $\displaystyle\lim_{x\to0}\left(\cos x\right)^{1/x^2}=$
A: $e^{-1/2}$
B: $1$
C: $e^{-2}$
D: $0$
ANS: A
EXP: $1^\infty$ form. Take logs: $\dfrac{\ln\cos x}{x^2}$.
$\cos x=1-\tfrac{x^2}2+O(x^4)$ and $\ln(1+u)\approx u$, so $\ln\cos x\approx-\tfrac{x^2}{2}$ and the log tends to $-\tfrac12$.
The limit is $e^{-1/2}\approx0.607$. Answering $1$ treats $1^\infty$ as $1$.

@ calc h calc-h-016
T: Which limits exist
S: limits
TYPE: msq
Q: Which of the following limits exist as finite real numbers? (More than one option may be correct.)
A: $\displaystyle\lim_{x\to0}x\sin\frac1x$
B: $\displaystyle\lim_{x\to0}\sin\frac1x$
C: $\displaystyle\lim_{x\to0}e^{-1/x}$
D: $\displaystyle\lim_{x\to0^+}e^{-1/x}$
ANS: A,D
EXP: [[A]]: $|x\sin\tfrac1x|\le|x|\to0$, so the limit is $0$ by the squeeze theorem. Exists.
[[B]]: $\sin\tfrac1x$ takes every value in $[-1,1]$ in every neighbourhood of $0$ (e.g. $x=\tfrac1{n\pi}$ gives $0$, $x=\tfrac1{2n\pi+\pi/2}$ gives $1$). No limit.
[[C]]: from the right $-1/x\to-\infty$ so $e^{-1/x}\to0$; from the left $-1/x\to+\infty$ so $e^{-1/x}\to\infty$. The two-sided limit does not exist.
[[D]]: the right-hand limit alone is $0$. Exists.
The pair [[C]] and [[D]] shows why one-sided limits must be checked separately.

@ calc h calc-h-017
T: Log-sum-exp as temperature goes to zero
S: limits
TYPE: nat
TOL: 0
Q: Find $\displaystyle\lim_{T\to0^+}T\ln\!\left(e^{2/T}+e^{5/T}\right)$.
ANS: 5
EXP: Factor out the largest term: $e^{2/T}+e^{5/T}=e^{5/T}\left(1+e^{-3/T}\right)$.
So $T\ln(\cdots)=5+T\ln\!\left(1+e^{-3/T}\right)$. As $T\to0^+$, $e^{-3/T}\to0$, so the second term $\to0\cdot\ln1=0$.
The limit is $\max(2,5)=5$. Log-sum-exp with temperature $T$ is a smooth maximum, and softmax with $T\to0$ becomes a hard argmax. Answering $7$ (the sum) treats $\ln$ as if it split over a sum.

@ calc h calc-h-018
T: Differentiable with a discontinuous derivative
S: continuity-differentiability
Q: Let $f(x)=x^2\sin\dfrac1x$ for $x\ne0$ and $f(0)=0$. Which statement is true?
A: $f$ is not differentiable at $0$.
B: $f'(0)=0$ and $f'$ is continuous at $0$.
C: $f'(0)=0$, but $f'$ is not continuous at $0$.
D: $f'(0)=1$.
ANS: C
EXP: From the definition: $\dfrac{f(h)-0}{h}=h\sin\dfrac1h\to0$ (squeeze), so $f'(0)=0$.
For $x\ne0$: $f'(x)=2x\sin\dfrac1x-\cos\dfrac1x$. The first term $\to0$, but $\cos\tfrac1x$ oscillates in $[-1,1]$, so $\lim_{x\to0}f'(x)$ does not exist.
So $f$ is differentiable everywhere but not continuously differentiable. Trying to get $f'(0)$ by letting $x\to0$ in the formula for $f'(x)$ wrongly concludes that $f'(0)$ does not exist.

@ calc h calc-h-019
T: How smooth is |x|³ at zero
S: continuity-differentiability
Q: How many times is $f(x)=|x|^3$ differentiable at $x=0$?
A: Exactly once
B: Exactly twice
C: Exactly three times
D: Infinitely many times
ANS: B
EXP: $f(x)=x^3$ for $x\ge0$ and $-x^3$ for $x<0$.
$f'(x)=3x|x|$ (so $f'(0)=0$), and $f''(x)=6|x|$ (so $f''(0)=0$).
$f''=6|x|$ has a corner at $0$, so $f'''(0)$ does not exist. Exactly twice.
Saying three times confuses $|x|^3$ with $x^3$; each power of $|x|$ buys one more derivative.

@ calc h calc-h-020
T: Kinks of a clipped distance function
S: continuity-differentiability
TYPE: nat
TOL: 0
Q: Let $f(x)=\min\left(|x|,\ |x-2|,\ 1\right)$. At how many points of $\mathbb R$ is $f$ not differentiable?
ANS: 5
EXP: $d(x)=\min(|x|,|x-2|)$ is the distance to the nearer of $0$ and $2$. It has corners at $x=0$ and $x=2$ (V shapes) and at $x=1$, where the two pieces cross (a peak with slopes $+1$ then $-1$).
Clipping at $1$: $d(x)\ge1$ exactly when $x\le-1$ or $x\ge3$, so new corners appear at $x=-1$ and $x=3$ (slope changes between $\mp1$ and $0$).
At $x=1$, $d=1$ only at that single point, so the peak survives the clipping.
Corners: $-1,0,1,2,3$, so $5$ points. Missing $x=1$ (the max of two V's) gives $4$.

@ calc h calc-h-021
T: When is |x|·g(x) differentiable
S: continuity-differentiability
Q: Let $g$ be continuous at $0$ and $f(x)=|x|\,g(x)$. Then $f$ is differentiable at $0$ if and only if:
A: $g(0)=0$
B: $g'(0)=0$
C: $g$ is differentiable at $0$
D: $g(0)=1$
ANS: A
EXP: $f(0)=0$, so $\dfrac{f(h)-f(0)}{h}=\dfrac{|h|}{h}\,g(h)$.
As $h\to0^+$ this tends to $g(0)$; as $h\to0^-$ it tends to $-g(0)$. They agree iff $g(0)=-g(0)$, i.e. $g(0)=0$.
Differentiability of $g$ is neither needed nor sufficient: $g(x)=1$ is smooth but gives $|x|$. Example: $|x|\sin x$ is differentiable at $0$, $|x|\cos x$ is not.

@ calc h calc-h-022
T: Twice-differentiable join (spline)
S: continuity-differentiability
Q: Let $f(x)=x^3$ for $x\le1$ and $f(x)=ax^2+bx+c$ for $x>1$. If $f$ is twice differentiable at $x=1$, then $(a,b,c)=$
A: $(3,-3,1)$
B: $(0,3,-2)$
C: $(3,3,-5)$
D: $(6,-9,4)$
ANS: A
EXP: Match value, first and second derivatives at $x=1$. Left side: $f(1)=1$, $f'(1)=3$, $f''(1)=6$.
Right side: $2a=6\Rightarrow a=3$; $2a+b=3\Rightarrow b=-3$; $a+b+c=1\Rightarrow c=1$.
$(0,3,-2)$ is the tangent line (only value and slope matched). $(6,-9,4)$ sets $a=f''(1)$, forgetting that $(ax^2)''=2a$.
Matching derivatives at joins is how cubic splines are built.

@ calc h calc-h-023
T: Roots via IVT and Rolle
S: continuity-differentiability
TYPE: nat
TOL: 0
Q: How many real roots does $f(x)=x^5-3x+1$ have in the interval $[0,2]$?
ANS: 2
EXP: Intermediate value theorem: $f(0)=1>0$, $f(1)=-1<0$, $f(2)=27>0$, so there is at least one root in $(0,1)$ and one in $(1,2)$.
Upper bound (Rolle): $f'(x)=5x^4-3$ has exactly one zero in $[0,2]$, at $x=(3/5)^{1/4}\approx0.88$. Between two roots of $f$ there must be a zero of $f'$, so three roots in $[0,2]$ would need two zeros of $f'$ there.
Exactly $2$ (numerically $\approx0.335$ and $\approx1.215$).

@ calc h calc-h-024
T: One-sided derivative of √(1 − cos x)
S: continuity-differentiability
TYPE: nat
TOL: 0.01
Q: Let $f(x)=\sqrt{1-\cos x}$. Find the right-hand derivative of $f$ at $x=0$, to 2 decimal places.
ANS: 0.71
EXP: Half-angle identity: $1-\cos x=2\sin^2\tfrac x2$, so $f(x)=\sqrt2\left|\sin\tfrac x2\right|$.
Right-hand derivative: $\lim_{h\to0^+}\dfrac{\sqrt2\sin(h/2)}{h}=\dfrac{\sqrt2}{2}=\dfrac1{\sqrt2}\approx0.71$.
The left-hand derivative is $-\tfrac1{\sqrt2}$, so $f$ is not differentiable at $0$.
Differentiating the formula $\tfrac{\sin x}{2\sqrt{1-\cos x}}$ and substituting $x=0$ gives $\tfrac00$; the hidden absolute value is the key.

@ calc h calc-h-025
T: Logarithmic differentiation at a point
S: derivatives
Q: Let $y=\dfrac{(x-1)^2(x+2)^3}{(x+1)^4}$. What is $y'(0)$?
A: $-4.5$
B: $36$
C: $-36$
D: $-20$
ANS: C
EXP: Logarithmic differentiation: $\ln|y|=2\ln|x-1|+3\ln|x+2|-4\ln|x+1|$, so $\dfrac{y'}{y}=\dfrac2{x-1}+\dfrac3{x+2}-\dfrac4{x+1}$.
At $x=0$: $\tfrac{y'}{y}=-2+\tfrac32-4=-4.5$, and $y(0)=\tfrac{1\cdot8}{1}=8$.
$y'(0)=8\times(-4.5)=-36$. $-4.5$ is $y'/y$, forgetting to multiply back by $y$.

@ calc h calc-h-026
T: Eighth derivative of e^x sin x
S: derivatives
Q: Let $f(x)=e^x\sin x$. Then $\dfrac{f^{(8)}(x)}{f(x)}$ (where $f(x)\ne0$) equals:
A: $8$
B: $-16$
C: $256$
D: $16$
ANS: D
EXP: $f'=e^x(\sin x+\cos x)=\sqrt2\,e^x\sin\!\left(x+\tfrac\pi4\right)$. Each derivative multiplies by $\sqrt2$ and shifts the phase by $\tfrac\pi4$.
After $8$ steps: $(\sqrt2)^8e^x\sin(x+2\pi)=16\,e^x\sin x$.
Equivalently $f=\operatorname{Im}e^{(1+i)x}$ and $(1+i)^8=(2i)^4=16$. After 4 steps the factor is $(1+i)^4=-4$, and $(-4)^2=+16$, so $-16$ gets the sign wrong. $256=2^8$ forgets the square root in $\sqrt2$.

@ calc h calc-h-027
T: Implicit second derivative on a circle
S: derivatives
Q: For the circle $x^2+y^2=25$, find $\dfrac{d^2y}{dx^2}$ at the point $(3,4)$.
A: $-\frac{7}{64}$
B: $-\frac{25}{64}$
C: $-\frac14$
D: $-\frac34$
ANS: B
EXP: First: $2x+2yy'=0\Rightarrow y'=-\tfrac xy=-\tfrac34$.
Second, quotient rule on $-\tfrac xy$: $y''=-\dfrac{y-xy'}{y^2}=-\dfrac{4-3\cdot(-\tfrac34)}{16}=-\dfrac{25/4}{16}=-\dfrac{25}{64}$.
Shortcut: $y''=-\dfrac{y^2+x^2}{y^3}=-\dfrac{25}{64}$.
$-\tfrac7{64}$ uses $y+xy'$ (a sign slip in the quotient rule); $-\tfrac14$ treats $y$ as constant; $-\tfrac34$ is $y'$, not $y''$.

@ calc h calc-h-028
T: Derivative from a functional equation
S: derivatives
TYPE: nat
TOL: 0
Q: A differentiable function $f$ satisfies $f(x+y)=f(x)f(y)$ for all $x,y$, with $f(0)\ne0$ and $f'(0)=2$. Find $f'(\ln3)$.
ANS: 18
EXP: Put $x=y=0$: $f(0)=f(0)^2$, so $f(0)=1$.
Derivative: $f'(x)=\lim_{h\to0}\dfrac{f(x)f(h)-f(x)}{h}=f(x)\lim_{h\to0}\dfrac{f(h)-f(0)}{h}=f(x)f'(0)=2f(x)$.
So $f(x)=e^{2x}$, and $f'(\ln3)=2e^{2\ln3}=2\cdot9=18$.
Answering $6$ uses $e^{\ln 3}$ instead of $e^{2\ln3}$.

@ calc h calc-h-029
T: Curvature of GELU at zero
S: derivatives
TYPE: nat
TOL: 0.01
Q: The GELU activation is $g(x)=x\,\Phi(x)$, where $\Phi$ is the standard normal CDF with density $\varphi(x)=\tfrac1{\sqrt{2\pi}}e^{-x^2/2}$. Find $g''(0)$, to 2 decimal places.
ANS: 0.80
EXP: Product rule: $g'(x)=\Phi(x)+x\varphi(x)$, so $g'(0)=\tfrac12$.
Again: $g''(x)=\varphi(x)+\varphi(x)+x\varphi'(x)=2\varphi(x)-x^2\varphi(x)$ (using $\varphi'(x)=-x\varphi(x)$).
$g''(0)=2\varphi(0)=\dfrac{2}{\sqrt{2\pi}}=\sqrt{\tfrac2\pi}\approx0.80$.
Forgetting the second $\varphi$ from the product rule gives $\varphi(0)\approx0.40$. Unlike ReLU, whose second derivative is $0$ away from $0$ and undefined at $0$, GELU is smoothly curved at the origin.

@ calc h calc-h-030
T: True facts about derivatives
S: derivatives
TYPE: msq
Q: Let $f$ and $g$ be differentiable on an open interval $I$. Which statements are always true? (More than one option may be correct.)
A: If $f'(x)>0$ for all $x\in I$, then $f$ is strictly increasing on $I$.
B: If $f$ is strictly increasing on $I$, then $f'(x)>0$ for all $x\in I$.
C: If $f'(x)=g'(x)$ for all $x\in I$, then $f-g$ is constant on $I$.
D: If $f'(c)=0$ for some $c\in I$, then $f$ has a local extremum at $c$.
ANS: A,C
EXP: [[A]]: by the mean value theorem, $f(b)-f(a)=f'(\xi)(b-a)>0$ for $a<b$. True.
[[B]]: $f(x)=x^3$ is strictly increasing but $f'(0)=0$. False.
[[C]]: $(f-g)'=0$ on an interval, so by the MVT $f-g$ is constant. True. (On a union of disjoint intervals it could be a different constant on each piece.)
[[D]]: $x^3$ again: $f'(0)=0$ but $0$ is not an extremum. False.

@ calc h calc-h-031
T: Tangent to ln x through the origin
S: derivatives
Q: A line through the origin is tangent to $y=\ln x$. What is its slope?
A: $1$
B: $e$
C: $\frac1e$
D: $\frac12$
ANS: C
EXP: Let the tangency point be $(a,\ln a)$. The tangent slope is $\tfrac1a$, and a line through the origin and $(a,\ln a)$ has slope $\tfrac{\ln a}{a}$.
Equate: $\tfrac1a=\tfrac{\ln a}{a}\Rightarrow\ln a=1\Rightarrow a=e$. Slope $=\tfrac1e$.
$e$ is the $x$-coordinate of the tangency point, not the slope; $1$ is the slope of $\ln x$ at $x=1$, where the tangent $y=x-1$ misses the origin.

@ calc h calc-h-032
T: Tenth derivative of 1/(1+x²) at zero
S: taylor-series
TYPE: nat
TOL: 0
Q: Let $f(x)=\dfrac{1}{1+x^2}$. Find $f^{(10)}(0)$.
ANS: -3628800
EXP: Geometric series with ratio $-x^2$: $\dfrac1{1+x^2}=\sum_{k\ge0}(-1)^kx^{2k}$ for $|x|<1$.
The $x^{10}$ term has $k=5$, coefficient $(-1)^5=-1$.
Since this coefficient equals $\dfrac{f^{(10)}(0)}{10!}$: $f^{(10)}(0)=-10!=-3628800$.
Differentiating ten times directly is hopeless; reading coefficients off a known series is the key insight. Forgetting the sign gives $+10!$.

@ calc h calc-h-033
T: Smooth but not analytic
S: taylor-series
TYPE: msq
Q: Let $f(x)=e^{-1/x^2}$ for $x\ne0$ and $f(0)=0$. Which statements are true? (More than one option may be correct.)
A: $f$ is infinitely differentiable at $0$.
B: $f^{(n)}(0)=0$ for every $n\ge0$.
C: The Maclaurin series of $f$ converges to $f(x)$ for every $x$.
D: $f$ has a local maximum at $x=0$.
ANS: A,B
EXP: Every derivative of $f$ for $x\ne0$ has the form $p(1/x)\,e^{-1/x^2}$ with $p$ a polynomial, and $e^{-1/x^2}$ goes to $0$ faster than any power of $1/x$ blows up. So each difference quotient at $0$ tends to $0$: [[A]] and [[B]] are true.
[[C]]: the Maclaurin series is identically $0$, but $f(x)>0$ for $x\ne0$, so the series converges to $f$ only at $x=0$. False. Infinitely differentiable does not imply equal to its Taylor series.
[[D]]: $f(0)=0<f(x)$ for $x\ne0$, so $0$ is a minimum. False.

@ calc h calc-h-034
T: Second-order estimate of softplus
S: taylor-series
TYPE: nat
TOL: 0.002
Q: Using the second-order Taylor polynomial of $s(x)=\ln(1+e^x)$ about $x=0$, estimate $s(0.4)$. Give your answer to 3 decimal places (use $\ln2=0.6931$).
ANS: 0.913
EXP: $s(0)=\ln2$. $s'(x)=\sigma(x)$, so $s'(0)=\tfrac12$. $s''(x)=\sigma(x)(1-\sigma(x))$, so $s''(0)=\tfrac14$.
$s(x)\approx\ln2+\tfrac x2+\tfrac{1}{2}\cdot\tfrac14x^2=\ln2+\tfrac x2+\tfrac{x^2}8$.
At $x=0.4$: $0.6931+0.2+0.02=0.9131$. (True value $0.9130$.)
Using $s''(0)$ without the $\tfrac1{2!}$ gives $0.9331$.

@ calc h calc-h-035
T: Radius of convergence of 1/(1+x²)
S: taylor-series
Q: The function $\dfrac1{1+x^2}$ is infinitely differentiable on all of $\mathbb R$. What is the radius of convergence of its Maclaurin series?
A: $1$
B: $\infty$
C: $2$
D: $\frac12$
ANS: A
EXP: The series is $\sum(-1)^kx^{2k}$, a geometric series in $-x^2$, which converges iff $x^2<1$, i.e. $|x|<1$. So $R=1$.
The reason, despite no trouble on the real line: in the complex plane $1+z^2=0$ at $z=\pm i$, at distance $1$ from $0$, and the radius of convergence is the distance to the nearest singularity.
Answering $\infty$ assumes that smooth on $\mathbb R$ means the series converges everywhere.

@ calc h calc-h-036
T: Recognising the alternating harmonic series
S: taylor-series
Q: $1-\dfrac12+\dfrac13-\dfrac14+\cdots=$
A: $1$
B: $\ln2$
C: $\dfrac\pi4$
D: $\dfrac1e$
ANS: B
EXP: $\ln(1+x)=x-\dfrac{x^2}2+\dfrac{x^3}3-\cdots$ for $-1<x\le1$. At $x=1$ (allowed, since the alternating series converges and Abel's theorem applies), the sum is $\ln2\approx0.693$.
$\tfrac\pi4=1-\tfrac13+\tfrac15-\cdots$ is the arctan series at $x=1$ (odd denominators only). $\tfrac1e=\sum\tfrac{(-1)^n}{n!}$ uses factorials.

@ calc h calc-h-037
T: How the Taylor error scales with step size
S: taylor-series
Q: Near $x=0$, approximate $e^x$ by $1+x+\dfrac{x^2}2$. If $x$ is halved (from a small value), the error is multiplied by approximately:
A: $\frac12$
B: $\frac14$
C: $\frac1{16}$
D: $\frac18$
ANS: D
EXP: The error is the first omitted term: $e^x-\left(1+x+\tfrac{x^2}2\right)=\dfrac{x^3}{6}+O(x^4)$.
It scales as $x^3$, so halving $x$ multiplies it by $\left(\tfrac12\right)^3=\tfrac18$.
$\tfrac14$ uses the order of the last kept term ($x^2$) instead of the first omitted one. The same reasoning explains why central differences ($O(h^2)$ error) beat forward differences ($O(h)$) when checking gradients numerically.

@ calc h calc-h-038
T: Checking third-order expansions
S: taylor-series
TYPE: msq
Q: Which of the following Maclaurin expansions are correct up to and including the $x^3$ term? (More than one option may be correct.)
A: $\tan x=x+\dfrac{x^3}{3}+\cdots$
B: $\sqrt{1+x}=1+\dfrac x2-\dfrac{x^2}8+\dfrac{x^3}{16}+\cdots$
C: $e^x\sin x=x+x^2+\dfrac{x^3}{2}+\cdots$
D: $\dfrac1{(1-x)^2}=1+2x+3x^2+3x^3+\cdots$
ANS: A,B
EXP: [[A]]: $\tfrac{\sin x}{\cos x}=\left(x-\tfrac{x^3}6\right)\left(1+\tfrac{x^2}2\right)+\cdots=x+\tfrac{x^3}{3}+\cdots$. True.
[[B]]: binomial series with $\binom{1/2}{2}=-\tfrac18$ and $\binom{1/2}{3}=\tfrac{(1/2)(-1/2)(-3/2)}{6}=\tfrac1{16}$. True.
[[C]]: $\left(1+x+\tfrac{x^2}2\right)\left(x-\tfrac{x^3}6\right)=x+x^2+\left(\tfrac12-\tfrac16\right)x^3+\cdots$, so the $x^3$ coefficient is $\tfrac13$, not $\tfrac12$. False.
[[D]]: differentiating $\sum x^n$ gives $\sum(n+1)x^n$, so the $x^3$ coefficient is $4$. False.

@ calc h calc-h-039
T: When the second derivative test fails
S: maxima-minima
Q: Let $f(x)=e^x+e^{-x}-2-x^2$. At $x=0$, $f'(0)=f''(0)=0$. What does $f$ have at $x=0$?
A: A local maximum
B: An inflection point
C: A local minimum
D: Neither an extremum nor an inflection point
ANS: C
EXP: The second derivative test is inconclusive, so go to higher order. $e^x+e^{-x}=2\cosh x=2+x^2+\dfrac{x^4}{12}+\cdots$.
So $f(x)=\dfrac{x^4}{12}+\dfrac{x^6}{360}+\cdots>0=f(0)$ for $x\ne0$: a local (in fact global) minimum.
Higher-order test: the first nonzero derivative is $f^{(4)}(0)=2>0$ and of even order, so it is a minimum. If the first nonzero derivative had odd order, it would be an inflection point, which is the tempting but wrong conclusion here.

@ calc h calc-h-040
T: Three real roots of x³ − 3x + k
S: maxima-minima
Q: For which values of $k$ does $x^3-3x+k=0$ have three distinct real roots?
A: $|k|<2$
B: $|k|\le2$
C: $|k|<1$
D: $k>2$
ANS: A
EXP: Let $f(x)=x^3-3x+k$. $f'(x)=3x^2-3=0\Rightarrow x=\pm1$: local max $f(-1)=k+2$, local min $f(1)=k-2$.
A cubic has three distinct real roots iff its local max is above $0$ and local min is below $0$: $k+2>0$ and $k-2<0$, so $-2<k<2$.
At $k=\pm2$ the graph touches the axis at an extremum, giving a repeated root, so only two distinct roots; that is why $|k|\le2$ is wrong.

@ calc h calc-h-041
T: Global max of x²e^(−x) on [0, ∞)
S: maxima-minima
Q: What is the global maximum value of $f(x)=x^2e^{-x}$ on $[0,\infty)$?
A: $\dfrac1e$
B: $\dfrac4{e^2}$
C: $\dfrac2e$
D: $\dfrac4e$
ANS: B
EXP: $f'(x)=(2x-x^2)e^{-x}=x(2-x)e^{-x}$: zero at $x=0$ and $x=2$.
$f'>0$ on $(0,2)$ and $f'<0$ for $x>2$, so $x=2$ is a max. Endpoint $f(0)=0$ (the minimum) and $f\to0$ as $x\to\infty$.
Global max $f(2)=4e^{-2}\approx0.541$. $\tfrac1e=f(1)$ comes from the critical point of $xe^{-x}$; $\tfrac4e$ forgets to square in $e^{-2}$.

@ calc h calc-h-042
T: Inflection points of the Gaussian bell
S: maxima-minima
Q: The function $\varphi(x)=\exp\!\left(-\dfrac{(x-\mu)^2}{2\sigma^2}\right)$ (with $\sigma>0$) has its inflection points at:
A: $x=\mu$
B: $x=\mu\pm\dfrac{\sigma}{\sqrt2}$
C: $x=\mu\pm\sigma$
D: $x=\mu\pm2\sigma$
ANS: C
EXP: Let $u=\tfrac{x-\mu}{\sigma}$. Then $\varphi'=-\tfrac{u}{\sigma}\varphi$ and $\varphi''=\tfrac{1}{\sigma^2}(u^2-1)\varphi$.
$\varphi''$ changes sign where $u^2=1$, i.e. $x=\mu\pm\sigma$. Between them the bell is concave, outside it is convex.
$x=\mu$ is the maximum, not an inflection point. $\mu\pm\tfrac\sigma{\sqrt2}$ is correct only for $e^{-(x-\mu)^2/\sigma^2}$, which lacks the factor $2$. This is how $\sigma$ can be read off a plotted normal curve.

@ calc h calc-h-043
T: Global minimum of x^x
S: maxima-minima
TYPE: nat
TOL: 0.01
Q: Find the minimum value of $f(x)=x^x$ for $x>0$, to 2 decimal places.
ANS: 0.69
EXP: Write $f=e^{x\ln x}$. Since $e^u$ is increasing, $f$ is minimised where $x\ln x$ is minimised.
$(x\ln x)'=\ln x+1=0\Rightarrow x=\tfrac1e$, and $(x\ln x)''=\tfrac1x>0$.
Minimum value: $e^{(1/e)\ln(1/e)}=e^{-1/e}\approx e^{-0.3679}\approx0.69$.
$0.37$ is the minimiser $x=\tfrac1e$, not the minimum value.

@ calc h calc-h-044
T: Which is larger, e^π or π^e
S: maxima-minima
Q: By studying $f(x)=\dfrac{\ln x}{x}$, decide which is true.
A: $e^\pi>\pi^e$
B: $\pi^e>e^\pi$
C: $e^\pi=\pi^e$
D: It cannot be decided without a calculator
ANS: A
EXP: $f'(x)=\dfrac{1-\ln x}{x^2}$, which is $>0$ for $x<e$ and $<0$ for $x>e$. So $f$ has its global maximum at $x=e$.
Hence $f(e)>f(\pi)$: $\dfrac1e>\dfrac{\ln\pi}{\pi}\Rightarrow\pi>e\ln\pi\Rightarrow e^\pi>\pi^e$.
(Numerically $23.14$ vs $22.46$.) The two are close, which is what makes the guess $\pi^e$ tempting.

@ calc h calc-h-045
T: Extrema of |x² − 4| on [−3, 3]
S: maxima-minima
TYPE: msq
Q: Let $f(x)=|x^2-4|$ on $[-3,3]$. Which statements are true? (More than one option may be correct.)
A: The global minimum is attained at $x=\pm2$, where $f'$ does not exist.
B: The global maximum value is $4$, attained at $x=0$.
C: $x=0$ is a local maximum.
D: $f$ has exactly two critical points in $(-3,3)$.
ANS: A,C
EXP: On $(-2,2)$, $f=4-x^2$; outside it, $f=x^2-4$.
[[A]]: $f(\pm2)=0$ and $f\ge0$, so these are global minima; the slopes jump from $-4$ to $4$ (at $x=2$), so $f'$ does not exist. True.
[[B]]: the endpoints give $f(\pm3)=5>4$, so the global max is $5$ at $x=\pm3$. False.
[[C]]: $4-x^2$ peaks at $0$. True.
[[D]]: critical points are where $f'=0$ or $f'$ does not exist: $x=0$ and $x=\pm2$, so three. False.

@ calc e calc-e-030
T: Largest rectangle with a fixed perimeter
S: single-var-optimization
Q: A rectangle has perimeter $40$. What is the largest area it can have?
A: $400$
B: $200$
C: $100$
D: $75$
ANS: C
EXP: With sides $x$ and $20-x$, the area is $A(x)=x(20-x)=20x-x^2$.
Set $A'(x)=20-2x=0$, so $x=10$, and $A''=-2<0$ confirms a maximum.
The best rectangle is the $10\times10$ square, area $100$.
$400$ comes from taking a side of $20$ (half the perimeter) for both sides, which is not a rectangle with perimeter $40$.


@ calc e calc-e-031
T: The constant that minimises squared error
S: single-var-optimization
Q: For the data $2,4,9$, which value of $c$ minimises $f(c)=\sum_{i=1}^{3}(x_i-c)^2$?
A: $4$
B: $5$
C: $5.5$
D: $15$
ANS: B
EXP: $f'(c)=-2\sum_i(x_i-c)=0$ gives $c=\frac1n\sum_ix_i$, the mean.
Here $c=\frac{2+4+9}{3}=5$, and $f''(c)=2n>0$ so it is a minimum.
The median $4$ minimises the sum of absolute errors, not squared errors. This is why a regression model trained with MSE predicts the conditional mean.


@ calc e calc-e-032
T: Maximum on a closed interval
S: single-var-optimization
TYPE: nat
TOL: 0
Q: What is the maximum value of $f(x)=x^2-2x$ on the closed interval $[0,3]$? Enter the value.
ANS: 3
EXP: Closed interval method: check the critical points and the endpoints.
$f'(x)=2x-2=0$ at $x=1$, where $f(1)=-1$. That is the minimum (the parabola opens upward).
Endpoints: $f(0)=0$ and $f(3)=9-6=3$.
The largest of $\{-1,0,3\}$ is $3$, at $x=3$. Stopping at the critical point would give the minimum, not the maximum.


@ calc e calc-e-033
T: Newton's method for minimising a quadratic
S: single-var-optimization
Q: Minimise $f(x)=3x^2-12x+1$ with Newton's method $x_{k+1}=x_k-\dfrac{f'(x_k)}{f''(x_k)}$, starting at $x_0=10$. What is $x_1$?
A: $2$
B: $-38$
C: $18$
D: $9.875$
ANS: A
EXP: $f'(x)=6x-12$, so $f'(10)=48$, and $f''(x)=6$.
$x_1=10-\frac{48}{6}=10-8=2$.
Check: $f'(2)=0$, so Newton lands on the minimiser in one step. For any quadratic the second-order model is exact, so one Newton step always suffices.
$-38$ is a plain gradient step with learning rate $1$ ($10-48$); $18$ has the sign flipped; $9.875$ inverts the ratio.


@ calc m calc-m-043
T: Open box from a square sheet
S: single-var-optimization
Q: An open-top box is made from a $12\times12$ square sheet by cutting a square of side $x$ from each corner and folding up the sides. Which $x$ gives the largest volume?
A: $6$
B: $3$
C: $4$
D: $2$
ANS: D
EXP: Volume $V(x)=x(12-2x)^2$ for $0<x<6$.
$V'(x)=(12-2x)^2-4x(12-2x)=(12-2x)(12-6x)$.
$V'=0$ at $x=6$ or $x=2$. At $x=6$ the base vanishes and $V=0$, so it is the minimum on the interval.
At $x=2$: $V=2\cdot8^2=128$, the maximum.
Picking $x=6$ just because it solves $V'=0$ is the trap: always check which critical point is the maximum.


@ calc m calc-m-044
T: Minimum of x + 9/x
S: single-var-optimization
TYPE: nat
TOL: 0
Q: What is the minimum value of $f(x)=x+\dfrac{9}{x}$ over $x>0$? Enter the minimum value of $f$.
ANS: 6
EXP: $f'(x)=1-\dfrac{9}{x^2}=0$ gives $x=3$ (we need $x>0$).
$f''(x)=\dfrac{18}{x^3}>0$, so $x=3$ is the minimiser.
Minimum value $f(3)=3+3=6$. AM-GM gives the same bound: $x+\frac9x\ge2\sqrt9=6$.
Entering $3$ would give the minimiser, not the minimum value.


@ calc m calc-m-045
T: Exact line search step size
S: single-var-optimization
Q: For $f(x,y)=x^2+2y^2$ at the point $(2,1)$, take the descent direction $d=-\nabla f(2,1)$ and choose the step $t>0$ that minimises $\phi(t)=f\big((2,1)+t\,d\big)$ (exact line search). What is $t$?
A: $\frac14$
B: $\frac13$
C: $\frac12$
D: $3$
ANS: B
EXP: $\nabla f=(2x,4y)$, so $g=\nabla f(2,1)=(4,4)$ and $d=(-4,-4)$.
$\phi(t)=(2-4t)^2+2(1-4t)^2$.
$\phi'(t)=-8(2-4t)-16(1-4t)=-32+96t=0$, so $t=\frac13$.
This is the one-variable formula $t=\dfrac{g^Tg}{g^THg}=\dfrac{32}{96}$ with $H=\operatorname{diag}(2,4)$.
$\frac14=1/L$ is the safe fixed step for the largest curvature $L=4$, not the exact minimiser along this line. The new point is $(\frac23,-\frac13)$.


@ calc m calc-m-046
T: One Newton step on e^x - 2x
S: single-var-optimization
Q: Minimise $f(x)=e^x-2x$ using Newton's method $x_{k+1}=x_k-f'(x_k)/f''(x_k)$, starting at $x_0=0$. What is $x_1$?
A: $1$
B: $-1$
C: $\ln2$
D: $2$
ANS: A
EXP: $f'(x)=e^x-2$, $f''(x)=e^x$.
At $x_0=0$: $f'(0)=-1$, $f''(0)=1$, so $x_1=0-\frac{-1}{1}=1$.
The true minimiser is $\ln2\approx0.693$ (where $e^x=2$). Newton gets there only in the limit because $f$ is not quadratic, so $\ln 2$ is not $x_1$.
$-1$ comes from dropping the minus sign in the update.


@ calc m calc-m-047
T: Profit-maximising price
S: single-var-optimization
Q: Demand at price $p$ is $q=100-2p$ units, and each unit costs $10$ to make. Profit is $(p-10)(100-2p)$. Which price maximises profit?
A: $25$
B: $\frac{110}{3}$
C: $30$
D: $50$
ANS: C
EXP: $P(p)=(p-10)(100-2p)$. Product rule: $P'(p)=(100-2p)+(p-10)(-2)=120-4p$.
$P'=0$ at $p=30$, and $P''=-4<0$, so it is the maximum. Profit $=20\cdot40=800$.
$25$ maximises revenue $p(100-2p)$, ignoring cost. $\frac{110}{3}$ comes from forgetting the factor $-2$ when differentiating $100-2p$. At $p=50$ demand is zero.


@ calc m calc-m-048
T: Maximise p³(1−p)² on [0,1]
S: single-var-optimization
Q: Which $p\in[0,1]$ maximises $L(p)=p^3(1-p)^2$?
A: $\frac25$
B: $\frac12$
C: $\frac34$
D: $\frac35$
ANS: D
EXP: Maximise $\log L=3\ln p+2\ln(1-p)$ instead (log is increasing, so the maximiser is the same).
$\dfrac{3}{p}-\dfrac{2}{1-p}=0\Rightarrow3(1-p)=2p\Rightarrow p=\frac35$.
$L(0)=L(1)=0$, so this interior point is the maximum.
This is the MLE of a Bernoulli parameter after $3$ successes and $2$ failures: successes over trials. $\frac25$ swaps the roles; $\frac34$ treats $(1-p)^2$ as $(1-p)$.


@ calc m calc-m-049
T: Closest point on a parabola
S: single-var-optimization
TYPE: nat
TOL: 0.01
Q: What is the smallest value of the squared distance from the point $(0,2)$ to a point on the parabola $y=x^2$? Enter the squared distance to 2 decimal places.
ANS: 1.75
EXP: Squared distance from $(x,x^2)$ to $(0,2)$: $D(x)=x^2+(x^2-2)^2=x^4-3x^2+4$.
$D'(x)=4x^3-6x=2x(2x^2-3)=0$ at $x=0$ or $x^2=\frac32$.
$D(0)=4$ (a local maximum of $D$) and $D=\frac94-\frac92+4=\frac74$ at $x^2=\frac32$.
So the minimum squared distance is $1.75$ (distance $\frac{\sqrt7}{2}$). The vertex $(0,0)$ at distance $2$ is not the closest point.


@ calc h calc-h-046
T: Newton's method on sqrt(1 + x²)
S: single-var-optimization
TYPE: msq
Q: Newton's method $x_{k+1}=x_k-f'(x_k)/f''(x_k)$ is used to minimise the convex function $f(x)=\sqrt{1+x^2}$, whose minimiser is $0$. Which statements are true? (More than one may be correct.)
A: Starting at $x_0=0.5$, the iterates converge to $0$.
B: Starting at $x_0=2$, the first iterate is $x_1=-8$.
C: Because $f$ is convex, Newton's method converges from every starting point.
D: Starting at $x_0=1$, the iterates converge to $0$.
ANS: A,B
EXP: $f'(x)=\dfrac{x}{\sqrt{1+x^2}}$, $f''(x)=(1+x^2)^{-3/2}$, so $\dfrac{f'}{f''}=x(1+x^2)$ and the update is $x_{k+1}=x-x-x^3=-x^3$.
[[A]] is true: $0.5\to-0.125\to0.00195\to\dots\to0$, since $|x|<1$ makes $|x|^3$ shrink fast.
[[B]] is true: $-2^3=-8$, and then $512$, so it diverges.
[[C]] is false: convexity does not save pure Newton. It converges only when $|x_0|<1$; [[B]] is a counterexample.
[[D]] is false: $1\to-1\to1\to\dots$ oscillates forever. This is why practical Newton methods add a line search (damped Newton).


@ calc h calc-h-047
T: Minimisers of the sum of absolute deviations
S: single-var-optimization
Q: For the data $1,3,8,28$, which values of $c$ minimise $f(c)=\sum_{i=1}^4|x_i-c|$?
A: Only $c=5.5$
B: Only $c=10$
C: Every $c$ in $[3,8]$
D: Only $c=3$ and $c=8$
ANS: C
EXP: $f$ is piecewise linear. Away from the data points, $f'(c)=(\#\text{points below }c)-(\#\text{points above }c)$.
For $3<c<8$ there are 2 points below and 2 above, so $f'(c)=0$: $f$ is flat on $[3,8]$. For example $f(3)=2+0+5+25=32$ and $f(8)=7+5+0+20=32$.
For $c<3$ the slope is negative and for $c>8$ it is positive, so the whole interval $[3,8]$ minimises $f$.
$5.5$ is the usual "median" convention, a minimiser but not the only one. $10$ is the mean, which minimises squared error and is pulled toward the outlier $28$; $f(10)=36>32$. This robustness is why the L1 loss is used for outlier-heavy data.


@ calc h calc-h-048
T: Soft thresholding with an L1 penalty
S: single-var-optimization
Q: What is the minimiser of $g(x)=\frac12(x-1)^2+2|x|$ over all real $x$?
A: $-1$
B: $0$
C: $3$
D: $\frac15$
ANS: B
EXP: $|x|$ is not differentiable at $0$, so check each piece and the kink.
For $x>0$: $g'(x)=x-1+2=x+1>0$, so $g$ increases; no minimiser there.
For $x<0$: $g'(x)=x-1-2=x-3<0$, so $g$ decreases toward $0$; no minimiser there.
So the minimum is at the kink $x=0$, with $g(0)=\frac12$. In general the answer is the soft-thresholding rule $\operatorname{sign}(z)\max(|z|-\lambda,0)$ with $z=1$, $\lambda=2$, which gives $0$.
$-1$ comes from solving $x-1+2=0$ without checking that it lies in the region $x>0$ where that derivative holds. $\frac15$ treats the penalty as $2x^2$ (ridge). This exact zero is why the Lasso produces sparse weights.


@ calc h calc-h-049
T: Backtracking line search on x⁴
S: single-var-optimization
Q: Minimise $f(x)=x^4$ from $x_0=1$ along $d=-f'(x_0)$. Backtracking tries $t=1,\frac12,\frac14,\dots$ and accepts the first $t$ satisfying the Armijo condition $f(x_0+t\,d)\le f(x_0)-0.1\,t\,f'(x_0)^2$. Which $t$ is accepted?
A: $1$
B: $\frac12$
C: $\frac18$
D: $\frac14$
ANS: D
EXP: $f'(1)=4$, so $d=-4$, $x_0+td=1-4t$ and the right side is $1-0.1\cdot t\cdot16=1-1.6t$.
$t=1$: $f(-3)=81>-0.6$, reject.
$t=\frac12$: $f(-1)=1>0.2$, reject. The value did not drop at all; it only matched $f(x_0)$, which fails "sufficient decrease".
$t=\frac14$: $f(0)=0\le0.6$, accept.
$\frac12$ is the trap for anyone who only checks $f(x_0+td)\le f(x_0)$. $\frac18$ also satisfies Armijo, but backtracking stops at the first success.


@ calc h calc-h-050
T: Newton's method on x − ln x: steps needed
S: single-var-optimization
TYPE: nat
TOL: 0
Q: Minimise $f(x)=x-\ln x$ ($x>0$, minimiser $x^*=1$) with Newton's method $x_{k+1}=x_k-f'(x_k)/f''(x_k)$ from $x_0=0.5$. What is the smallest $k$ with $|x_k-1|<10^{-6}$? Enter $k$.
ANS: 5
EXP: $f'(x)=1-\frac1x$, $f''(x)=\frac1{x^2}$, so $x_{k+1}=x-x^2\left(1-\frac1x\right)=2x-x^2$.
Then $1-x_{k+1}=1-2x+x^2=(1-x_k)^2$: the error squares every step (quadratic convergence).
Errors: $e_0=\frac12$, $e_1=\frac14$, $e_2=\frac1{16}$, $e_3=\frac1{256}\approx3.9\times10^{-3}$, $e_4=\frac1{65536}\approx1.5\times10^{-5}$, $e_5\approx2.3\times10^{-10}$.
So $k=5$. A linearly convergent method that halves the error would need about $20$ steps.


@ calc h calc-h-051
T: Open-top cylinder of least surface area
S: single-var-optimization
Q: An open-top cylindrical tank (base but no lid) must hold a fixed volume $V$. To use the least material (base area plus side area), how should its height $h$ compare with its radius $r$?
A: $h=2r$
B: $h=r$
C: $h=\frac r2$
D: $h=4r$
ANS: B
EXP: Surface $S=\pi r^2+2\pi rh$ with $\pi r^2h=V$, so $h=\dfrac{V}{\pi r^2}$ and $S(r)=\pi r^2+\dfrac{2V}{r}$.
$S'(r)=2\pi r-\dfrac{2V}{r^2}=0\Rightarrow\pi r^3=V$.
Then $h=\dfrac{V}{\pi r^2}=\dfrac{\pi r^3}{\pi r^2}=r$. $S''=2\pi+4V/r^3>0$, so it is a minimum.
$h=2r$ is the answer for a closed can (two circular ends). Removing the lid makes a shorter, wider shape optimal.


@ calc e calc-e-034
T: Normalising constant of a linear PDF
S: integrals
Q: $f(x)=cx$ for $0\le x\le2$ (and $0$ elsewhere) is a probability density. What is $c$?
A: $2$
B: $\frac14$
C: $1$
D: $\frac12$
ANS: D
EXP: A density must integrate to $1$: $\displaystyle\int_0^2cx\,dx=c\left[\frac{x^2}{2}\right]_0^2=2c=1$.
So $c=\frac12$.
$\frac14$ forgets the $\frac12$ from integrating $x$ (uses $c\cdot x^2\big|_0^2=4c$).


@ calc e calc-e-035
T: Area between y = x and y = x²
S: integrals
Q: What is the area of the region between the curves $y=x$ and $y=x^2$ for $0\le x\le1$?
A: $\frac16$
B: $\frac12$
C: $\frac13$
D: $\frac56$
ANS: A
EXP: On $[0,1]$, $x\ge x^2$, so area $=\displaystyle\int_0^1(x-x^2)\,dx=\frac12-\frac13=\frac16$.
$\frac12$ is the area under $y=x$ alone and $\frac13$ the area under $y=x^2$ alone; $\frac56$ adds them instead of subtracting.


@ calc e calc-e-036
T: Substitution with e^(x²)
S: integrals
Q: $\displaystyle\int_0^1 2x\,e^{x^2}\,dx=$
A: $e$
B: $e-1$
C: $2(e-1)$
D: $\frac{e-1}{2}$
ANS: B
EXP: Substitute $u=x^2$, $du=2x\,dx$; the limits $x=0,1$ become $u=0,1$.
$\displaystyle\int_0^1e^u\,du=e^1-e^0=e-1$.
$e$ forgets the lower limit ($e^0=1$). $2(e-1)$ keeps the $2x$ factor after it was already absorbed into $du$.


@ calc m calc-m-050
T: Integral of ln x by parts
S: integrals
Q: $\displaystyle\int_1^e\ln x\,dx=$
A: $e$
B: $2e-1$
C: $1$
D: $0$
ANS: C
EXP: By parts with $u=\ln x$, $dv=dx$: $\int\ln x\,dx=x\ln x-\int x\cdot\frac1x\,dx=x\ln x-x$.
$\left[x\ln x-x\right]_1^e=(e-e)-(0-1)=1$.
$e$ keeps only $x\ln x$ (drops the $-x$ term). $2e-1$ comes from a sign slip, $x\ln x+x$.


@ calc m calc-m-051
T: Second moment of an exponential by integration
S: integrals
Q: $X$ has density $f(x)=2e^{-2x}$ for $x\ge0$. Compute $E[X^2]=\displaystyle\int_0^\infty x^2\cdot2e^{-2x}\,dx$.
A: $\frac14$
B: $\frac12$
C: $1$
D: $2$
ANS: B
EXP: Use $\displaystyle\int_0^\infty x^ne^{-\lambda x}dx=\frac{n!}{\lambda^{n+1}}$ (repeated integration by parts, or the Gamma function).
$E[X^2]=2\cdot\dfrac{2!}{2^3}=\dfrac{4}{8}=\dfrac12$.
Check: $E[X]=\frac12$ and $\operatorname{Var}(X)=\frac14$, so $E[X^2]=\frac14+\frac14=\frac12$.
$\frac14$ is the variance (or $(E[X])^2$), not the second moment.


@ calc m calc-m-052
T: Normalising constant of x(1 − x)
S: integrals
TYPE: nat
TOL: 0
Q: $f(x)=c\,x(1-x)$ on $[0,1]$ (and $0$ elsewhere) is a probability density. Enter $c$.
ANS: 6
EXP: $\displaystyle\int_0^1x(1-x)\,dx=\int_0^1(x-x^2)\,dx=\frac12-\frac13=\frac16$.
So $c\cdot\frac16=1$ and $c=6$.
This is the Beta$(2,2)$ density, $\dfrac{x^{a-1}(1-x)^{b-1}}{B(a,b)}$ with $B(2,2)=\frac{1!\,1!}{3!}=\frac16$.


@ calc m calc-m-053
T: Which improper integrals converge?
S: integrals
TYPE: msq
Q: Which of these improper integrals converge (are finite)? More than one may be correct.
A: $\displaystyle\int_1^\infty x^{-3/2}\,dx$
B: $\displaystyle\int_0^1 x^{-1/2}\,dx$
C: $\displaystyle\int_1^\infty \frac{1}{x}\,dx$
D: $\displaystyle\int_0^1 x^{-2}\,dx$
ANS: A,B
EXP: $p$-test: $\int_1^\infty x^{-p}dx$ converges iff $p>1$; $\int_0^1x^{-p}dx$ converges iff $p<1$.
[[A]]: $p=\frac32>1$, value $\left[-2x^{-1/2}\right]_1^\infty=2$. Converges.
[[B]]: $p=\frac12<1$, value $\left[2x^{1/2}\right]_0^1=2$. Converges.
[[C]]: $\ln x\to\infty$. Diverges (the boundary case $p=1$ diverges at both ends).
[[D]]: $\left[-x^{-1}\right]_0^1$ blows up at $0$. Diverges.
The two tests point in opposite directions: fast decay helps at infinity, slow blow-up helps at $0$.


@ calc m calc-m-054
T: Normalising the Cauchy density
S: integrals
Q: For which $c$ is $f(x)=\dfrac{c}{1+x^2}$, $x\in\mathbb R$, a probability density?
A: $\frac{1}{2\pi}$
B: $\frac{2}{\pi}$
C: $\frac{1}{\sqrt{2\pi}}$
D: $\frac{1}{\pi}$
ANS: D
EXP: $\displaystyle\int_{-\infty}^{\infty}\frac{dx}{1+x^2}=\left[\arctan x\right]_{-\infty}^{\infty}=\frac\pi2-\left(-\frac\pi2\right)=\pi$.
So $c\pi=1$, $c=\frac1\pi$: the standard Cauchy density.
$\frac2\pi$ integrates only over $[0,\infty)$. $\frac{1}{\sqrt{2\pi}}$ is the normal constant. The Cauchy has heavy tails: its mean $\int\frac{x}{\pi(1+x^2)}dx$ does not exist.


@ calc m calc-m-055
T: Using odd symmetry in a definite integral
S: integrals
TYPE: nat
TOL: 0
Q: Evaluate $\displaystyle\int_{-2}^{2}\left(x^3+x^5\cos x+3\right)dx$. Enter the value.
ANS: 12
EXP: On a symmetric interval $[-a,a]$, an odd function integrates to $0$.
$x^3$ is odd, and $x^5\cos x$ is odd (odd times even). Both contribute $0$.
Only the constant remains: $\int_{-2}^2 3\,dx=3\cdot4=12$.
No antiderivative of $x^5\cos x$ is needed; trying to integrate it by parts is the slow route.


@ calc h calc-h-052
T: Gamma function at 3/2
S: integrals
Q: $\displaystyle\int_0^\infty\sqrt{x}\,e^{-x}\,dx=$
A: $\sqrt\pi$
B: $\frac{\sqrt\pi}{2}$
C: $\frac12$
D: $\frac{\pi}{2}$
ANS: B
EXP: This is $\Gamma(s)=\int_0^\infty x^{s-1}e^{-x}dx$ with $s=\frac32$.
Use $\Gamma(s+1)=s\,\Gamma(s)$ and $\Gamma(\frac12)=\sqrt\pi$: $\Gamma(\frac32)=\frac12\Gamma(\frac12)=\frac{\sqrt\pi}{2}$.
($\Gamma(\frac12)=\sqrt\pi$ follows from the Gaussian integral with $x=u^2/2$.)
$\sqrt\pi$ is $\Gamma(\frac12)$, one step too early. The Gamma function is the normalising constant of the Gamma and chi-squared densities.


@ calc h calc-h-053
T: Gaussian integral by completing the square
S: integrals
Q: $\displaystyle\int_{-\infty}^{\infty}e^{-(x^2-2x)}\,dx=$
A: $\sqrt\pi$
B: $e\sqrt{2\pi}$
C: $e\sqrt\pi$
D: $\frac{\sqrt\pi}{e}$
ANS: C
EXP: Complete the square: $-(x^2-2x)=-(x-1)^2+1$.
So the integral is $e\displaystyle\int_{-\infty}^\infty e^{-(x-1)^2}dx=e\sqrt\pi$, using $\int e^{-u^2}du=\sqrt\pi$ (shifting by $1$ does not change the integral over the whole line).
$\sqrt\pi$ forgets the leftover factor $e^{1}$; $\frac{\sqrt\pi}{e}$ gets its sign wrong. $\sqrt{2\pi}$ belongs to $e^{-u^2/2}$, not $e^{-u^2}$.
The same trick computes Gaussian normalising constants and the marginal likelihood in Bayesian linear regression.


@ calc h calc-h-054
T: Reversing the order of integration
S: integrals
