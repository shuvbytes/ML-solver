Q: $\displaystyle\int_0^1\int_x^1e^{y^2}\,dy\,dx=$
A: $e-1$
B: $\frac{e}{2}$
C: It has no closed form, since $e^{y^2}$ has no elementary antiderivative
D: $\frac{e-1}{2}$
ANS: D
EXP: The inner integral cannot be done in elementary terms, so reverse the order.
The region is $0\le x\le y\le1$. For fixed $y$, $x$ runs from $0$ to $y$:
$\displaystyle\int_0^1\int_0^y e^{y^2}\,dx\,dy=\int_0^1ye^{y^2}\,dy=\left[\tfrac12e^{y^2}\right]_0^1=\frac{e-1}{2}$.
The "no closed form" choice is the trap: the double integral is elementary even though the inner one is not. $e-1$ forgets the $\frac12$ from the substitution $u=y^2$.


@ calc h calc-h-055
T: Normalising a joint density on a triangle
S: integrals
TYPE: nat
TOL: 0
Q: $f(x,y)=c\,xy$ on the triangle $0<y<x<1$ (and $0$ elsewhere) is a joint probability density. Enter $c$.
ANS: 8
EXP: $\displaystyle\int_0^1\int_0^x xy\,dy\,dx=\int_0^1x\cdot\frac{x^2}{2}\,dx=\int_0^1\frac{x^3}{2}dx=\frac18$.
So $c=8$.
Integrating over the whole unit square instead gives $\int_0^1\int_0^1xy=\frac14$ and $c=4$; the support is only the triangle under $y=x$.


@ calc h calc-h-056
T: Integral of x² ln x by differentiating a parameter
S: integrals
Q: $\displaystyle\int_0^1x^2\ln x\,dx=$
A: $\frac19$
B: $-\frac13$
C: $-\frac19$
D: $-\frac1{27}$
ANS: C
EXP: Trick: $I(a)=\int_0^1x^a\,dx=\dfrac{1}{a+1}$, and $\dfrac{d}{da}x^a=x^a\ln x$.
So $\int_0^1x^a\ln x\,dx=I'(a)=-\dfrac{1}{(a+1)^2}$, and at $a=2$ this is $-\frac19$.
By parts agrees: $\int x^2\ln x\,dx=\frac{x^3}{3}\ln x-\frac{x^3}{9}$; at $1$ it is $-\frac19$ and the limit at $0$ is $0$.
The answer must be negative, since $\ln x<0$ on $(0,1)$, so $\frac19$ has the wrong sign.


@ calc e calc-e-037
T: Fastest rate of increase
S: gradients-multivariable
Q: For $f(x,y)=x^2+3y$, what is the largest directional derivative of $f$ at $(2,1)$ over all unit directions?
A: $7$
B: $25$
C: $5$
D: $3$
ANS: C
EXP: The directional derivative in unit direction $u$ is $\nabla f\cdot u$, which is largest when $u$ points along $\nabla f$. The maximum is $\|\nabla f\|$.
$\nabla f=(2x,3)=(4,3)$ at $(2,1)$, so the maximum rate is $\sqrt{16+9}=5$.
$7$ adds the components; $25$ is $\|\nabla f\|^2$. Gradient descent steps along $-\nabla f$ because it is the direction of fastest decrease.


@ calc e calc-e-038
T: Gradient of the squared norm
S: gradients-multivariable
Q: For $x\in\mathbb R^n$, $\nabla_x\|x\|_2^2=$
A: $2x$
B: $x$
C: $\dfrac{x}{\|x\|_2}$
D: $2\|x\|_2$
ANS: A
EXP: $\|x\|_2^2=\sum_ix_i^2$, so $\dfrac{\partial}{\partial x_i}=2x_i$, giving $\nabla=2x$ (a vector).
$\dfrac{x}{\|x\|_2}$ is the gradient of the norm $\|x\|_2$ itself, not its square. $2\|x\|_2$ is a scalar, so it cannot be a gradient in $\mathbb R^n$.
This is the gradient of the L2 (ridge / weight-decay) penalty.


@ calc e calc-e-039
T: Tangent to a level curve
S: gradients-multivariable
Q: For $f(x,y)=x^2+y^2$, which vector is tangent to the level curve $f=25$ at the point $(3,4)$?
A: $(3,4)$
B: $(4,-3)$
C: $(6,8)$
D: $(1,1)$
ANS: B
EXP: The gradient is perpendicular to the level curve. $\nabla f(3,4)=(6,8)$.
A tangent vector $t$ must satisfy $t\cdot(6,8)=0$: $(4,-3)\cdot(6,8)=24-24=0$.
$(6,8)$ and $(3,4)$ are along the gradient, i.e. normal to the curve (they point straight out of the circle).


@ calc m calc-m-056
T: Chain rule along a curve
S: gradients-multivariable
TYPE: nat
TOL: 0
Q: Let $f(x,y)=x^2+xy$ and move along the curve $x=\cos t$, $y=\sin t$. Find $\dfrac{d}{dt}f(x(t),y(t))$ at $t=0$. Enter the value.
ANS: 1
EXP: Multivariable chain rule: $\dfrac{df}{dt}=f_x\dfrac{dx}{dt}+f_y\dfrac{dy}{dt}$.
At $t=0$: $(x,y)=(1,0)$, $f_x=2x+y=2$, $f_y=x=1$, $\dfrac{dx}{dt}=-\sin0=0$, $\dfrac{dy}{dt}=\cos0=1$.
So $\dfrac{df}{dt}=2\cdot0+1\cdot1=1$.
Check directly: $f=\cos^2t+\cos t\sin t$, derivative $-2\cos t\sin t+\cos^2t-\sin^2t=1$ at $t=0$.


@ calc m calc-m-057
T: Gradient of the least-squares loss
S: gradients-multivariable
Q: $X$ is $n\times d$, $y\in\mathbb R^n$, $w\in\mathbb R^d$, and $L(w)=\|Xw-y\|_2^2$ (no factor $\frac12$). Then $\nabla_wL=$
A: $2X(Xw-y)$
B: $X^T(Xw-y)$
C: $-2X^Ty$
D: $2X^T(Xw-y)$
ANS: D
EXP: Write $r=Xw-y$, so $L=r^Tr$. Then $dL=2r^T\,dr=2r^TX\,dw$, so $\nabla_wL=2X^Tr=2X^T(Xw-y)$.
Shape check: $X^T$ is $d\times n$ and $r$ is $n\times1$, giving $d\times1$ like $w$. $2X(Xw-y)$ fails this check.
$X^T(Xw-y)$ is the gradient of $\frac12\|Xw-y\|^2$; here there is no $\frac12$. Setting the gradient to zero gives the normal equations $X^TXw=X^Ty$.


@ calc m calc-m-058
T: Hessian of x³ + 2xy²
S: gradients-multivariable
Q: What is the Hessian of $f(x,y)=x^3+2xy^2$ at $(1,1)$?
A: $\begin{pmatrix}6&4\\4&4\end{pmatrix}$
B: $\begin{pmatrix}6&2\\2&4\end{pmatrix}$
C: $\begin{pmatrix}3&4\\4&4\end{pmatrix}$
D: $\begin{pmatrix}6&4\\4&2\end{pmatrix}$
ANS: A
EXP: First derivatives: $f_x=3x^2+2y^2$, $f_y=4xy$.
Second derivatives: $f_{xx}=6x$, $f_{xy}=4y$, $f_{yy}=4x$.
At $(1,1)$: $f_{xx}=6$, $f_{xy}=f_{yx}=4$, $f_{yy}=4$.
The off-diagonal $2$ forgets the factor from differentiating $y^2$; the $3$ in the corner uses $3x^2$ (the first derivative) instead of $f_{xx}=6x$.


@ calc m calc-m-059
T: Common gradient identities
S: gradients-multivariable
TYPE: msq
Q: Let $a,x\in\mathbb R^n$ with $x\ne0$. Which gradient identities are correct? More than one may be correct.
A: $\nabla_x\left(a^Tx\right)=a$
B: $\nabla_x\|x\|_2=2x$
C: $\nabla_x\,e^{a^Tx}=e^{a^Tx}\,a$
D: $\nabla_x\left(a^Tx\right)^2=2a$
ANS: A,C
EXP: [[A]] is true: $\partial(a^Tx)/\partial x_i=a_i$.
[[B]] is false: $2x$ is the gradient of $\|x\|_2^2$. For the norm, $\nabla\|x\|_2=\dfrac{x}{\|x\|_2}$ (e.g. at $x=(1,0)$ it is $(1,0)$, not $(2,0)$).
[[C]] is true: chain rule, outer derivative $e^{u}$ times $\nabla u=a$.
[[D]] is false: chain rule gives $2(a^Tx)\,a$; the factor $a^Tx$ was dropped. With $a=(1,0)$ and $x=(2,0)$ the true gradient is $2\cdot2\cdot(1,0)=(4,0)\ne2a=(2,0)$.


@ calc h calc-h-057
T: Gradient of the logistic loss with ±1 labels
S: gradients-multivariable
Q: With label $y\in\{-1,+1\}$, feature vector $x$ and sigmoid $\sigma(t)=\dfrac{1}{1+e^{-t}}$, the logistic loss is $L(w)=\log\left(1+e^{-y\,w^Tx}\right)$. Then $\nabla_wL=$
A: $-y\,\sigma(-y\,w^Tx)\,x$
B: $\big(\sigma(w^Tx)-y\big)\,x$
C: $-y\,\sigma(y\,w^Tx)\,x$
D: $y\,\sigma(-y\,w^Tx)\,x$
ANS: A
EXP: Let $m=y\,w^Tx$ (the margin). $\dfrac{d}{dm}\log(1+e^{-m})=\dfrac{-e^{-m}}{1+e^{-m}}=-\sigma(-m)$.
Chain rule with $\nabla_wm=y\,x$: $\nabla_wL=-\sigma(-y\,w^Tx)\,y\,x$.
Sanity check: a confidently correct point ($m\gg0$) has $\sigma(-m)\approx0$, so it contributes almost no gradient.
$\big(\sigma(w^Tx)-y\big)x$ is the right formula for labels $y\in\{0,1\}$, not $\pm1$. $\sigma(y\,w^Tx)$ uses $\sigma(m)$ in place of $\sigma(-m)=1-\sigma(m)$, which would push hardest on points that are already right.


@ calc h calc-h-058
T: Gradient of a trace with respect to a matrix
S: gradients-multivariable
Q: For fixed $A\in\mathbb R^{n\times n}$, let $f(X)=\operatorname{tr}(AX)$. Taking $\nabla_Xf$ to be the matrix with entries $\partial f/\partial X_{ij}$, which is it?
A: $A$
B: $A^T$
C: $\operatorname{tr}(A)\,I$
D: $X^TA$
ANS: B
EXP: $\operatorname{tr}(AX)=\sum_i(AX)_{ii}=\sum_i\sum_jA_{ij}X_{ji}$.
The entry $X_{ij}$ appears only in the term $A_{ji}X_{ij}$, so $\dfrac{\partial f}{\partial X_{ij}}=A_{ji}$, i.e. $\nabla_Xf=A^T$.
$A$ would be right for $\operatorname{tr}(A^TX)=\sum_{ij}A_{ij}X_{ij}$, the Frobenius inner product $\langle A,X\rangle$. The transpose is the whole point of the question.


@ calc h calc-h-059
T: Second directional derivative from the Hessian
S: gradients-multivariable
Q: For $f(x,y)=x^2y$, what is the second derivative of $f$ along the unit direction $u=\frac{1}{\sqrt2}(1,1)$ at $(1,1)$, i.e. $\dfrac{d^2}{dt^2}f\big((1,1)+tu\big)$ at $t=0$?
A: $6$
B: $\frac{3}{\sqrt2}$
C: $1$
D: $3$
ANS: D
EXP: The second directional derivative is $u^T\nabla^2f\,u$.
$f_{xx}=2y$, $f_{xy}=2x$, $f_{yy}=0$, so at $(1,1)$: $H=\begin{pmatrix}2&2\\2&0\end{pmatrix}$.
$u^THu=\frac12(2+2\cdot2+0)=\frac12\cdot6=3$.
Check: $f(1+s,1+s)=(1+s)^3$ with $s=t/\sqrt2$, second derivative in $t$ is $\frac12\cdot6=3$.
$6$ uses the unnormalised $(1,1)$; $\frac3{\sqrt2}$ is the first directional derivative $\nabla f\cdot u$; $1$ keeps only the diagonal of $H$ (forgets the cross term $2u_1u_2f_{xy}$).


@ calc h calc-h-060
T: Change of variables u = x + y, v = x − y
S: gradients-multivariable
Q: $R$ is the square in the $xy$-plane with vertices $(0,0)$, $(\frac12,\frac12)$, $(1,0)$, $(\frac12,-\frac12)$. Using $u=x+y$, $v=x-y$ (which maps $R$ onto $[0,1]\times[0,1]$), evaluate $\displaystyle\iint_R(x+y)\,dx\,dy$.
A: $1$
B: $\frac12$
C: $\frac14$
D: $-1$
ANS: C
EXP: The Jacobian of the forward map is $\left|\dfrac{\partial(u,v)}{\partial(x,y)}\right|=\left|\det\begin{pmatrix}1&1\\1&-1\end{pmatrix}\right|=2$.
We need the inverse one: $dx\,dy=\left|\dfrac{\partial(x,y)}{\partial(u,v)}\right|du\,dv=\frac12\,du\,dv$.
$\displaystyle\iint_R(x+y)\,dx\,dy=\int_0^1\!\!\int_0^1u\cdot\frac12\,du\,dv=\frac14$.
Check: $R$ has side $\frac{1}{\sqrt2}$, area $\frac12$, and $x+y$ averages $\frac12$ over it, giving $\frac14$.
$1$ multiplies by $2$ (the forward Jacobian) instead of dividing; $\frac12$ drops the Jacobian; $-1$ uses the signed determinant.


@ calc h calc-h-061
T: Backpropagation through a ReLU unit
S: gradients-multivariable
TYPE: nat
TOL: 0
Q: A tiny network computes $h=\operatorname{ReLU}(w_1x)$, $\hat y=w_2h$, and loss $L=\frac12(\hat y-y)^2$. With $x=2$, $y=1$, $w_1=1.5$, $w_2=-1$, compute $\dfrac{\partial L}{\partial w_1}$. Enter the value.
ANS: 8
EXP: Forward: $w_1x=3$, $h=3$, $\hat y=-3$, error $\hat y-y=-4$.
Backward (chain rule): $\dfrac{\partial L}{\partial w_1}=(\hat y-y)\cdot w_2\cdot\operatorname{ReLU}'(w_1x)\cdot x$.
$\operatorname{ReLU}'(3)=1$, so $\dfrac{\partial L}{\partial w_1}=(-4)(-1)(1)(2)=8$.
A gradient step $w_1\leftarrow w_1-\eta\cdot8$ lowers $h$, which raises $\hat y=-h$ toward $y=1$, as it should. If $w_1x$ had been negative, the ReLU derivative $0$ would block the gradient entirely.


@ calc e calc-e-040
T: One gradient step in two dimensions
S: gradient-descent
Q: Run one step of gradient descent on $f(x,y)=x^2+2y^2$ from $(1,1)$ with learning rate $\eta=0.1$. Where does it land?
A: $(1.2,\ 1.4)$
B: $(0.8,\ 0.8)$
C: $(0.8,\ 0.6)$
D: $(0.9,\ 0.8)$
ANS: C
EXP: $\nabla f=(2x,4y)=(2,4)$ at $(1,1)$.
$(x,y)\leftarrow(1,1)-0.1\,(2,4)=(0.8,0.6)$.
$(1.2,1.4)$ adds the gradient (ascent). $(0.8,0.8)$ uses the $x$-derivative for both coordinates. Note $y$ moves more because $f$ is steeper in $y$.


@ calc e calc-e-041
T: A learning rate that is too large
S: gradient-descent
Q: Run gradient descent on $f(x)=x^2$ from $x_0=1$ with learning rate $\eta=1.5$. What is $x_2$?
A: $-2$
B: $0.25$
C: $-8$
D: $4$
ANS: D
EXP: $f'(x)=2x$, so $x_{t+1}=x_t-1.5\cdot2x_t=-2x_t$.
$x_1=-2$, $x_2=4$. The iterates flip sign and double: gradient descent diverges.
For $f(x)=x^2$ the step is stable only when $|1-2\eta|<1$, i.e. $0<\eta<1$. $0.25$ comes from forgetting the $2$ in $f'(x)=2x$; $-2$ is only $x_1$.


@ calc e calc-e-042
T: Basic facts about mini-batch SGD
S: gradient-descent
TYPE: msq
Q: In mini-batch SGD, each step uses the average gradient over a batch of training examples drawn uniformly at random. Which statements are true? More than one may be correct.
A: The mini-batch gradient is an unbiased estimate of the full-batch gradient.
B: The variance of the mini-batch gradient decreases as the batch size grows.
C: Every SGD step decreases the full training loss.
D: With a fixed learning rate, SGD converges exactly to the minimiser.
ANS: A,B
EXP: [[A]] is true: averaging over a uniformly random sample gives the full average in expectation.
[[B]] is true: with independent samples, the variance falls like $\frac1B$ in the batch size $B$.
[[C]] is false: a single noisy batch can point uphill for the full loss, so individual steps can increase it.
[[D]] is false: the gradient noise does not vanish at the minimiser, so with a constant step the iterates keep bouncing in a neighbourhood. That is why learning-rate decay is used.


@ calc m calc-m-060
T: Two steps of heavy-ball momentum
S: gradient-descent
TYPE: nat
TOL: 0.001
Q: Minimise $f(x)=x^2$ with momentum: $v_{t+1}=\beta v_t+f'(x_t)$, $x_{t+1}=x_t-\eta v_{t+1}$, using $\eta=0.1$, $\beta=0.9$, $x_0=1$, $v_0=0$. Enter $x_2$ to 2 decimal places.
ANS: 0.46
EXP: Step 1: $f'(1)=2$, $v_1=0.9\cdot0+2=2$, $x_1=1-0.1\cdot2=0.8$.
Step 2: $f'(0.8)=1.6$, $v_2=0.9\cdot2+1.6=3.4$, $x_2=0.8-0.1\cdot3.4=0.46$.
Plain gradient descent would give $x_2=0.8\cdot0.8=0.64$; the stored velocity makes momentum move further along a consistent direction.


@ calc m calc-m-061
T: Learning rate that solves a quadratic in one step
S: gradient-descent
Q: Gradient descent on $f(x)=5x^2$. Which fixed learning rate $\eta$ reaches the minimiser $x=0$ in exactly one step from every starting point?
A: $0.2$
B: $0.05$
C: $0.1$
D: $10$
ANS: C
EXP: $f'(x)=10x$, so $x_1=x_0-10\eta x_0=(1-10\eta)x_0$.
This is $0$ for every $x_0$ exactly when $\eta=\frac1{10}=\frac{1}{f''}$, which is Newton's step.
$0.2=\frac2{f''}$ is the edge of stability: $x_1=-x_0$, so it oscillates forever. $0.05$ converges but only halves the error each step.


@ calc m calc-m-062
T: Iterations to reach a tolerance
S: gradient-descent
TYPE: nat
TOL: 0
Q: Gradient descent on $f(x)=x^2$ with learning rate $\eta=0.25$ starts at $x_0=1$. What is the smallest $t$ with $|x_t|<0.01$? Enter $t$.
ANS: 7
EXP: $x_{t+1}=x_t-0.25\cdot2x_t=0.5\,x_t$, so $x_t=0.5^t$.
$0.5^6=0.015625\ge0.01$ and $0.5^7=0.0078125<0.01$, so $t=7$.
This is linear convergence: the error shrinks by a constant factor $|1-\eta f''|$ each step, so the steps needed grow like $\log(1/\varepsilon)$.


@ calc m calc-m-063
T: Stable step size on a 2-D quadratic
S: gradient-descent
Q: Gradient descent with fixed step $\eta>0$ on $f(x,y)=3x^2+y^2$ converges from every starting point if and only if:
A: $0<\eta<1$
B: $0<\eta<\frac23$
C: $0<\eta<\frac16$
D: $0<\eta<\frac13$
ANS: D
EXP: The Hessian is $\operatorname{diag}(6,2)$, and the updates decouple: $x\leftarrow(1-6\eta)x$, $y\leftarrow(1-2\eta)y$.
Both factors need $|1-\lambda\eta|<1$, i.e. $\eta<\frac2\lambda$. The binding one is the largest eigenvalue $L=6$: $\eta<\frac26=\frac13$.
$\eta<1$ uses the smallest eigenvalue $2$, which lets $x$ diverge. $\eta<\frac23$ uses the coefficient $3$ instead of the curvature $6$. $\eta<\frac16=\frac1L$ is sufficient but not necessary.


@ calc m calc-m-064
T: One SGD step on a single example
S: gradient-descent
Q: Linear model $\hat y=wx$ with per-example loss $(wx-y)^2$. One SGD step on the example $(x,y)=(2,3)$ from $w=0$ with learning rate $\eta=0.05$ gives:
A: $w=0.3$
B: $w=-0.6$
C: $w=0.6$
D: $w=0.15$
ANS: C
EXP: $\dfrac{d}{dw}(wx-y)^2=2(wx-y)\,x=2(0-3)(2)=-12$.
$w\leftarrow0-0.05\cdot(-12)=0.6$.
$0.3$ drops one factor of $2$ (either the $2$ from the square or the input $x=2$ from the chain rule). $-0.6$ steps along the gradient instead of against it.


@ calc m calc-m-065
T: Weight decay as a shrinking factor
S: gradient-descent
Q: Gradient descent on $L(w)+\frac{\lambda}{2}\|w\|_2^2$ with learning rate $\eta=0.1$ and $\lambda=0.5$ can be written $w\leftarrow c\,w-\eta\nabla L(w)$. What is $c$?
A: $0.95$
B: $0.9$
C: $0.5$
D: $1.05$
ANS: A
EXP: $\nabla\left(\frac\lambda2\|w\|^2\right)=\lambda w$, so the update is $w-\eta(\nabla L+\lambda w)=(1-\eta\lambda)w-\eta\nabla L$.
$c=1-0.1\cdot0.5=0.95$: each step shrinks the weights by $5\%$ before the loss gradient acts, hence "weight decay".
$0.9=1-\eta$ ignores $\lambda$. $1.05$ has the wrong sign and would grow the weights.


@ calc h calc-h-062
T: Gradient descent on an ill-conditioned quadratic
S: gradient-descent
TYPE: msq
Q: Gradient descent with $\eta=0.15$ is run on $f(x,y)=\frac12\left(x^2+10y^2\right)$, starting from $(1,1)$. Which statements are true? More than one may be correct.
A: The iterates converge to $(0,0)$.
B: The $y$-coordinate changes sign at every step.
C: The error in $x$ shrinks faster than the error in $y$.
D: Any step size $0<\eta<2$ would also converge.
ANS: A,B
EXP: Updates decouple: $x\leftarrow(1-\eta)x=0.85\,x$ and $y\leftarrow(1-10\eta)y=-0.5\,y$.
[[A]] is true: both factors have absolute value below $1$.
[[B]] is true: the $y$-factor is negative ($-0.5$), so $y$ zig-zags $1,-0.5,0.25,\dots$
[[C]] is false: $|y|$ shrinks by $0.5$ per step but $|x|$ only by $0.85$. The flat direction (small eigenvalue) is the slow one.
[[D]] is false: stability needs $\eta<\frac2{L}=\frac2{10}=0.2$; e.g. $\eta=1$ gives $y\leftarrow-9y$. Using the bound $2$ from the small eigenvalue is the trap.


@ calc h calc-h-063
T: Fixed-step subgradient method on |x|
S: gradient-descent
Q: Minimise $f(x)=|x|$ with the subgradient method $x_{t+1}=x_t-\eta\operatorname{sign}(x_t)$, fixed $\eta=0.3$, starting from $x_0=1$. What happens?
A: The iterates converge to $0$.
B: The iterates eventually cycle between $0.1$ and $-0.2$.
C: The iterates reach $0$ exactly after finitely many steps.
D: The iterates diverge.
ANS: B
EXP: The step always has length $0.3$, whatever the distance to the minimiser.
$1\to0.7\to0.4\to0.1\to-0.2\to0.1\to-0.2\to\dots$
Once near $0$ it overshoots back and forth for ever. On a non-smooth function the subgradient does not shrink near the minimum (unlike $f'(x)=2x$ for $x^2$), so a fixed step cannot converge; one needs a decaying step such as $\eta_t\propto\frac{1}{\sqrt t}$.
"Converges to $0$" is what one expects from smooth problems. Reaching $0$ exactly would need $x_0$ to be a multiple of $0.3$.


@ calc h calc-h-064
T: Bias in Adam's moving average
S: gradient-descent
TYPE: nat
TOL: 0.001
Q: Adam keeps $m_t=\beta m_{t-1}+(1-\beta)g_t$ with $m_0=0$ and $\beta=0.9$. If the gradient is constant, $g_t=1$ for all $t$, what is $m_3$ before bias correction? Enter it to 3 decimal places.
ANS: 0.271
EXP: $m_1=0.1$, $m_2=0.9\cdot0.1+0.1=0.19$, $m_3=0.9\cdot0.19+0.1=0.271$.
In general $m_t=(1-\beta^t)g$, here $1-0.9^3=0.271$.
Because it starts at $0$, the average badly underestimates the true gradient $1$ early on. Adam's bias correction divides by $1-\beta^t$: $\hat m_3=0.271/0.271=1$.


@ calc h calc-h-065
T: Gradient descent on x⁴ needs a small start
S: gradient-descent
Q: Gradient descent with fixed $\eta=0.1$ is run on the convex function $f(x)=x^4$. For which starting points $x_0$ does it converge to $0$?
A: Every real $x_0$, because $f$ is convex
B: $|x_0|<\sqrt5$
C: $|x_0|<\sqrt{10}$
D: $|x_0|<5$
ANS: B
EXP: $f'(x)=4x^3$, so $x_{t+1}=x_t-0.4x_t^3=x_t\left(1-0.4x_t^2\right)$.
If $0<x_t^2<5$, then $|1-0.4x_t^2|<1$, so $|x_{t+1}|<|x_t|$; the iterates stay in the region and shrink to $0$.
If $x_0^2=5$ the factor is $-1$ and it oscillates; if $x_0^2>5$ the factor exceeds $1$ in size and $|x_t|$ blows up.
The catch is that $f''(x)=12x^2$ is unbounded, so there is no global smoothness constant $L$ and no single safe step size. Convexity alone does not guarantee convergence of fixed-step gradient descent.


@ calc h calc-h-066
T: Batch size and gradient noise
S: gradient-descent
Q: For a scalar parameter, single-example gradients have variance $\sigma^2=4$. A mini-batch gradient averages $B=16$ independently sampled examples. What is its standard deviation, and what batch size halves that standard deviation?
A: SD $0.5$; batch size $64$
B: SD $0.5$; batch size $32$
C: SD $0.25$; batch size $32$
D: SD $0.125$; batch size $32$
ANS: A
EXP: The mean of $B$ independent terms has variance $\dfrac{\sigma^2}{B}=\dfrac4{16}=\dfrac14$, so the SD is $\dfrac{\sigma}{\sqrt B}=\dfrac{2}{4}=0.5$.
The SD scales as $\frac{1}{\sqrt B}$, so halving it needs $4\times$ the batch: $B=64$.
Doubling the batch to $32$ only cuts the SD by $\sqrt2$. $0.25$ is the variance, not the SD; $0.125$ divides $\sigma$ by $B$ instead of $\sqrt B$. This square-root law is why huge batches give diminishing returns.


@ calc e calc-e-043
T: Where is x³ − 3x² convex?
S: convexity
Q: On which set is $f(x)=x^3-3x^2$ convex?
A: $x\ge0$
B: $x\le1$
C: $x\ge1$
D: $x\ge2$
ANS: C
EXP: A twice-differentiable function is convex where $f''\ge0$.
$f'(x)=3x^2-6x$, $f''(x)=6x-6\ge0\iff x\ge1$. The inflection point is $x=1$.
$x\ge2$ uses $f'\ge0$ (where $f$ is increasing), which is a different property. $x\le1$ is where $f$ is concave.


@ calc e calc-e-044
T: The chord lies above a convex function
S: convexity
Q: $f$ is convex on $\mathbb R$ with $f(0)=0$ and $f(2)=4$. What can we conclude about $f(1)$?
A: $f(1)\le2$
B: $f(1)\ge2$
C: $f(1)=2$
D: $f(1)\le1$
ANS: A
EXP: Convexity: $f(\lambda a+(1-\lambda)b)\le\lambda f(a)+(1-\lambda)f(b)$.
With $a=0$, $b=2$, $\lambda=\frac12$: $f(1)\le\frac12\cdot0+\frac12\cdot4=2$. The graph lies on or below the chord.
Equality need not hold: $f(x)=x^2$ fits the data and has $f(1)=1$, while $f(x)=2x$ has $f(1)=2$. So $f(1)\le1$ is not forced either.


@ calc e calc-e-045
T: Stationary points of convex functions
S: convexity
Q: $f:\mathbb R^n\to\mathbb R$ is convex and differentiable, and $\nabla f(x^*)=0$. Then $x^*$ is:
A: a local minimiser that may not be a global minimiser
B: a global minimiser
C: possibly a saddle point
D: a global maximiser
ANS: B
EXP: For a differentiable convex function, $f(y)\ge f(x^*)+\nabla f(x^*)^T(y-x^*)$ for all $y$ (the tangent plane lies below the graph).
With $\nabla f(x^*)=0$ this gives $f(y)\ge f(x^*)$ for every $y$: a global minimum.
Convex functions have no saddle points and no spurious local minima. This is why convex losses (linear/logistic regression, SVMs) are reliably solved by gradient methods, unlike neural networks.


@ calc e calc-e-046
T: Convexity of x² + kxy + y²
S: convexity
TYPE: nat
TOL: 0
Q: $f(x,y)=x^2+kxy+y^2$ is convex exactly when $|k|\le k_{\max}$. Enter $k_{\max}$.
ANS: 2
EXP: The Hessian is constant: $H=\begin{pmatrix}2&k\\k&2\end{pmatrix}$, with eigenvalues $2\pm k$.
$f$ is convex iff $H$ is positive semidefinite: $2-|k|\ge0$, i.e. $|k|\le2$.
Equivalently $\det H=4-k^2\ge0$ together with the diagonal $2>0$. At $k=2$, $f=(x+y)^2$, convex but flat along $x=-y$.


@ calc m calc-m-066
T: Jensen's inequality for a square root
S: convexity
Q: Which inequality holds for every positive random variable $X$ with finite mean?
A: $E[X^2]\le(E[X])^2$
B: $E[e^X]\le e^{E[X]}$
C: $E[\sqrt X]\le\sqrt{E[X]}$
D: $E[1/X]\le1/E[X]$
ANS: C
EXP: Jensen: for convex $\varphi$, $E[\varphi(X)]\ge\varphi(E[X])$; for concave $\varphi$ the inequality reverses.
$\sqrt x$ is concave, so $E[\sqrt X]\le\sqrt{E[X]}$. Example: $X=1$ or $9$ with equal chance gives $2\le\sqrt5$.
The others are all convex functions, so the inequalities go the other way. With the same $X$: $E[X^2]=41>25$; $E[1/X]=\frac59>\frac15$; and $E[e^X]>e^{E[X]}$.
$E[X^2]\ge(E[X])^2$ is just $\operatorname{Var}(X)\ge0$.


@ calc m calc-m-067
T: Operations that preserve convexity
S: convexity
TYPE: msq
Q: $f$ and $g$ are convex functions on $\mathbb R$. Which of the following must also be convex? More than one may be correct.
A: $f+g$
B: $\max(f,g)$
C: $f\cdot g$
D: $g\circ f$, i.e. $g(f(x))$
ANS: A,B
EXP: [[A]]: a sum of convex functions is convex (add the two chord inequalities).
[[B]]: a pointwise maximum of convex functions is convex (its epigraph is the intersection of convex sets). The hinge loss $\max(0,1-m)$ and ReLU are examples.
[[C]] fails: $f(x)=x$ and $g(x)=x^2$ are convex but $x^3$ is not.
[[D]] fails: $g(t)=-t$ is convex (linear) and $f(x)=x^2$ is convex, but $g(f(x))=-x^2$ is concave. Composition needs $g$ convex and non-decreasing.


@ calc m calc-m-068
T: Strong convexity constant of a quadratic
S: convexity
Q: $f(x,y)=3x^2+2xy+3y^2$ is $\mu$-strongly convex, meaning $\nabla^2f\succeq\mu I$. What is the largest such $\mu$?
A: $6$
B: $4$
C: $8$
D: $2$
ANS: B
EXP: $\nabla^2f=\begin{pmatrix}6&2\\2&6\end{pmatrix}$, eigenvalues $6\pm2$: $8$ and $4$.
The largest $\mu$ with $H-\mu I\succeq0$ is the smallest eigenvalue, $\mu=4$. The largest eigenvalue, $L=8$, is the smoothness constant, and $\kappa=L/\mu=2$.
$6$ reads off the diagonal and ignores the coupling term; $2$ is the off-diagonal entry or the coefficient $2xy$.


@ calc m calc-m-069
T: When is |x|^p convex?
S: convexity
Q: For which $p>0$ is $f(x)=|x|^p$ convex on all of $\mathbb R$?
A: $p\ge1$
B: $p\ge2$
C: every $p>0$
D: $0<p\le1$
ANS: A
EXP: For $x>0$, $f''(x)=p(p-1)x^{p-2}$, which is $\ge0$ iff $p\ge1$; by symmetry the same holds for $x<0$.
At $x=0$: for $p\ge1$, $f$ has a minimum there and stays above its supporting line $0$, so convexity holds across $0$ too ($p=1$ gives $|x|$, convex but not differentiable).
For $p<1$, e.g. $|x|^{1/2}$: $f(1)=1$ but the chord from $0$ to $4$ gives $\frac14\cdot2=0.5$ at $x=1$, below the graph, so it is not convex.
$p\ge2$ is too strict: $|x|^{1.5}$ is convex. This is why $\ell_p$ norms are convex only for $p\ge1$.


@ calc m calc-m-070
T: Convex but not strictly convex
S: convexity
Q: The function $f(x,y)=e^{x+y}$ on $\mathbb R^2$ is:
A: strictly convex
B: concave
C: neither convex nor concave
D: convex but not strictly convex
ANS: D
EXP: $\nabla^2f=e^{x+y}\begin{pmatrix}1&1\\1&1\end{pmatrix}$, with eigenvalues $2e^{x+y}$ and $0$: positive semidefinite, so $f$ is convex.
It is not strictly convex: along the line $x+y=0$, $f\equiv1$ is constant, so chords on that line touch the graph.
A singular PSD Hessian is the warning sign. The usual guess "exponential, so strictly convex" holds for $e^x$ in one variable, not for $e^{x+y}$ in two.


@ calc h calc-h-067
T: Convexity of x⁴ + y⁴
S: convexity
TYPE: msq
Q: Consider $f(x,y)=x^4+y^4$. Which statements are true? More than one may be correct.
A: $f$ is convex.
B: $f$ is strictly convex.
C: The Hessian of $f$ is positive definite at every point.
D: $f$ is strongly convex (for some $\mu>0$, $\nabla^2f\succeq\mu I$ everywhere).
ANS: A,B
EXP: $\nabla^2f=\begin{pmatrix}12x^2&0\\0&12y^2\end{pmatrix}\succeq0$, so [[A]] is true.
[[B]] is true: $t\mapsto t^4$ is strictly convex on $\mathbb R$, and a sum of strictly convex functions of separate coordinates is strictly convex.
[[C]] is false: at the origin (and anywhere on an axis) the Hessian is singular. A positive definite Hessian is sufficient for strict convexity but not necessary.
[[D]] is false: the smallest eigenvalue $12\min(x^2,y^2)$ goes to $0$ near the axes. So gradient descent on $x^4$ converges only sublinearly near $0$.


@ calc h calc-h-068
T: Which loss is not convex in the weights?
S: convexity
Q: For a fixed example $(x,y)$, which loss is NOT convex in $w$? ($\sigma$ is the sigmoid, $y\in\{0,1\}$ for the last one and $y\in\{-1,+1\}$ for the first two.)
A: Hinge loss $\max(0,\ 1-y\,w^Tx)$
B: Logistic loss $\log\left(1+e^{-y\,w^Tx}\right)$
C: $(w^Tx-y)^2+\lambda\|w\|^2$ with $\lambda>0$
D: Squared error on a sigmoid output, $\left(\sigma(w^Tx)-y\right)^2$
ANS: D
EXP: Hinge: a max of two affine functions of $w$, so convex. Logistic: $t\mapsto\log(1+e^{-t})$ has second derivative $\sigma(t)(1-\sigma(t))>0$, and it is applied to a linear function of $w$, so convex. Ridge: a convex quadratic plus a strictly convex one.
For the sigmoid-squared loss take one dimension, $x=1$, $y=0$: $g(w)=\sigma(w)^2$, $g''(w)=2\sigma\sigma'(2-3\sigma)$, which is negative when $\sigma(w)>\frac23$. So it is not convex.
This is why logistic regression is trained with cross-entropy, not MSE on probabilities: the composition of a convex loss with a non-linear sigmoid need not be convex.


@ calc h calc-h-069
T: Convex in each variable but not jointly
S: convexity
Q: Which describes $f(x,y)=x^2+4xy+y^2$?
A: Convex in $x$ for fixed $y$ and in $y$ for fixed $x$, but not convex jointly
B: Jointly convex on $\mathbb R^2$
C: Concave on $\mathbb R^2$
D: Not convex on $\mathbb R^2$, but convex on the quadrant $x,y\ge0$
ANS: A
EXP: In $x$ alone, $f=x^2+(4y)x+y^2$ has second derivative $2>0$; the same holds in $y$. So $f$ is convex in each variable separately.
Jointly: $\nabla^2f=\begin{pmatrix}2&4\\4&2\end{pmatrix}$, eigenvalues $6$ and $-2$: indefinite. Along $x=-y=t$, $f=-2t^2$, so the origin is a saddle.
On the quadrant: the Hessian is the same constant indefinite matrix, so $f$ is not convex there either (e.g. on the segment from $(1,0)$ to $(0,1)$, $f=1+2t-2t^2$ in the parameter, which is concave).
Checking only $f_{xx}$ and $f_{yy}$ is the trap; the cross term matters. Alternating minimisation exploits per-variable convexity, but it does not make the joint problem convex.


@ calc h calc-h-070
T: Convexity of e^x + ax²
S: convexity
Q: For which real $a$ is $f(x)=e^x+ax^2$ convex on all of $\mathbb R$?
A: $a\ge-\frac12$
B: every real $a$
C: $a\ge0$
D: $a\ge\frac12$
ANS: C
EXP: $f''(x)=e^x+2a$ must be $\ge0$ for every $x$.
$\inf_xe^x=0$ (approached as $x\to-\infty$, never reached), so we need $2a\ge0$, i.e. $a\ge0$.
If $a<0$, then for $x<\ln(-2a)$ we get $e^x<-2a$ and $f''(x)<0$.
$a\ge-\frac12$ checks $f''\ge0$ only at $x=0$; e.g. $a=-\frac14$ gives $f''(-2)=e^{-2}-\frac12<0$.


@ calc h calc-h-071
T: Quadratic-over-linear function
S: convexity
Q: The function $f(x,y)=\dfrac{x^2}{y}$ on the half-plane $y>0$ is:
A: concave
B: convex
C: neither convex nor concave
D: convex only where $x>0$
ANS: B
EXP: $f_{xx}=\dfrac2y$, $f_{xy}=-\dfrac{2x}{y^2}$, $f_{yy}=\dfrac{2x^2}{y^3}$.
So $\nabla^2f=\dfrac{2}{y^3}\begin{pmatrix}y^2&-xy\\-xy&x^2\end{pmatrix}=\dfrac{2}{y^3}\begin{pmatrix}y\\-x\end{pmatrix}\begin{pmatrix}y&-x\end{pmatrix}$, a positive multiple of an outer product $vv^T$.
Hence it is positive semidefinite (determinant $0$, trace $>0$) and $f$ is convex on $y>0$.
The negative cross term $f_{xy}$ makes it look non-convex, but definiteness depends on the whole matrix, and the sign of $x$ plays no role. This function underlies the convexity of the perspective function and of $\frac{\|x\|^2}{t}$ terms in optimisation.


@ calc e calc-e-047
T: The Lagrange condition
S: constrained-optimization
Q: At a local minimiser $x^*$ of $f(x)$ subject to the single equality constraint $g(x)=0$ (with $\nabla g(x^*)\ne0$), which condition must hold?
A: $\nabla f(x^*)=0$ and $g(x^*)=0$
B: $\nabla f(x^*)=\lambda\nabla g(x^*)$ for some scalar $\lambda$, and $g(x^*)=0$
C: $\nabla f(x^*)$ is perpendicular to $\nabla g(x^*)$
D: $\nabla g(x^*)=0$
ANS: B
EXP: At a constrained optimum you cannot decrease $f$ by moving along the constraint surface, so $\nabla f$ has no component tangent to it. That means $\nabla f$ is parallel to the normal $\nabla g$: $\nabla f=\lambda\nabla g$.
Together with feasibility $g(x^*)=0$ these are the stationarity conditions of $\mathcal L=f-\lambda g$.
$\nabla f=0$ is the unconstrained condition; on a constraint the gradient usually is not zero. "Perpendicular" has it backwards: $\nabla f$ is perpendicular to the constraint surface, i.e. parallel to $\nabla g$.


@ calc e calc-e-048
T: Closest point to the origin on a line
S: constrained-optimization
Q: What is the minimum of $x^2+y^2$ subject to $x+y=2$?
A: $1$
B: $4$
C: $\sqrt2$
D: $2$
ANS: D
EXP: Lagrange: $\mathcal L=x^2+y^2-\lambda(x+y-2)$. Then $2x=\lambda$ and $2y=\lambda$, so $x=y$, and $x+y=2$ gives $x=y=1$.
Minimum value $1^2+1^2=2$.
$\sqrt2$ is the distance from the origin, not the squared distance. $4$ is the value at the point $(2,0)$, which is on the line but not the closest point.


@ calc e calc-e-049
T: The KKT conditions
S: constrained-optimization
TYPE: msq
Q: For the problem: minimise $f(x)$ subject to $g(x)\le0$, with Lagrangian $\mathcal L=f+\mu g$, which of the following are KKT conditions at an optimum $x^*$ (under the usual regularity assumptions)? More than one may be correct.
A: $\nabla f(x^*)+\mu\nabla g(x^*)=0$
B: $\mu\ge0$
C: $\mu\,g(x^*)=0$
D: $g(x^*)=0$
ANS: A,B,C
EXP: The KKT conditions are stationarity [[A]], dual feasibility [[B]], complementary slackness [[C]], and primal feasibility $g(x^*)\le0$.
[[D]] is not required: the constraint may be inactive. Example: minimise $x^2$ subject to $x-5\le0$; the optimum $x^*=0$ has $g(0)=-5<0$, and complementary slackness then forces $\mu=0$.
In SVMs, complementary slackness is why only the support vectors (active constraints) get non-zero multipliers.


@ calc e calc-e-050
T: The multiplier as a shadow price
S: constrained-optimization
Q: We maximise $f(x)$ subject to $g(x)=c$, using $\mathcal L=f-\lambda\,(g-c)$, and find the optimal multiplier $\lambda^*=3$. If $c$ is increased by $0.1$, the optimal value changes by approximately:
A: $+0.3$
B: $+3$
C: $+0.03$
D: $+30$
ANS: A
EXP: The multiplier is the sensitivity of the optimal value to the constraint level: $\dfrac{df^*}{dc}=\lambda^*$.
So $\Delta f^*\approx\lambda^*\,\Delta c=3\times0.1=0.3$.
$+3$ ignores the size of the change in $c$. This "shadow price" reading is used in economics and in sensitivity analysis of constrained models.


@ calc m calc-m-071
T: Maximise x + y on a circle
S: constrained-optimization
Q: What is the maximum of $x+y$ subject to $x^2+y^2=8$?
A: $4$
B: $2\sqrt2$
C: $8$
D: $4\sqrt2$
ANS: A
EXP: $\mathcal L=x+y-\lambda(x^2+y^2-8)$: $1=2\lambda x$ and $1=2\lambda y$, so $x=y$.
Then $2x^2=8$, $x=\pm2$. The maximum is at $(2,2)$: $x+y=4$ (the point $(-2,-2)$ gives the minimum $-4$).
Cauchy-Schwarz agrees: $x+y\le\sqrt2\sqrt{x^2+y^2}=\sqrt2\cdot2\sqrt2=4$.
$2\sqrt2$ is the radius; $4\sqrt2$ takes $x=y=2\sqrt2$, which is off the circle.


@ calc m calc-m-072
T: Cheapest design with a fixed product
S: constrained-optimization
Q: Minimise the cost $2x+3y$ subject to $xy=24$ with $x,y>0$. What is the minimum cost?
A: $26$
B: $24$
C: $30$
D: $12$
ANS: B
EXP: $\mathcal L=2x+3y-\lambda(xy-24)$: $2=\lambda y$ and $3=\lambda x$, so $\frac{2}{3}=\frac{y}{x}$, i.e. $2x=3y$.
With $xy=24$: $x=6$, $y=4$, cost $12+12=24$.
At the optimum the two cost terms are equal, as AM-GM predicts: $2x+3y\ge2\sqrt{6xy}=2\sqrt{144}=24$.
$26$ swaps the allocation to $x=4$, $y=6$ ($8+18$). $30$ is the cost at $x=12$, $y=2$, feasible but not optimal.


@ calc m calc-m-073
T: Distance from the origin to a plane
S: constrained-optimization
TYPE: nat
TOL: 0
Q: Minimise $\sqrt{x^2+y^2+z^2}$ subject to $x+2y+2z=9$. Enter the minimum distance.
ANS: 3
EXP: Minimise the square $x^2+y^2+z^2$ instead (same minimiser). $\mathcal L=x^2+y^2+z^2-\lambda(x+2y+2z-9)$ gives $(x,y,z)=\frac\lambda2(1,2,2)$.
The constraint: $\frac\lambda2(1+4+4)=9$, so $\frac\lambda2=1$ and the point is $(1,2,2)$.
Distance $\sqrt{1+4+4}=3$, matching $\dfrac{|9|}{\|(1,2,2)\|}=\dfrac93$.
Entering $9$ gives the squared distance, not the distance.


@ calc m calc-m-074
T: KKT multiplier for an active constraint
S: constrained-optimization
TYPE: nat
TOL: 0
Q: Minimise $(x-5)^2$ subject to $x\le3$, with Lagrangian $\mathcal L=(x-5)^2+\mu(x-3)$ and $\mu\ge0$. Enter the optimal multiplier $\mu^*$.
ANS: 4
EXP: The unconstrained minimiser $x=5$ is infeasible, so the constraint is active: $x^*=3$.
Stationarity: $2(x-5)+\mu=0$ at $x=3$ gives $-4+\mu=0$, so $\mu^*=4\ge0$ (dual feasible).
Complementary slackness holds since $x^*-3=0$. The multiplier measures how hard the constraint pushes: relaxing it to $x\le3+\delta$ lowers the optimum by about $4\delta$.
Getting $-4$ means the sign convention was flipped; with $\mathcal L=f+\mu g$ and $g\le0$, the multiplier must be non-negative.


@ calc m calc-m-075
T: Minimising over a box by clipping
S: constrained-optimization
Q: Minimise $(x-3)^2+(y-1)^2$ subject to $0\le x\le2$ and $0\le y\le2$.
A: $(3,1)$
B: $(2,2)$
C: $(2,1)$
D: $(1,1)$
ANS: C
EXP: The objective and the box both split into separate problems for $x$ and $y$.
$x$: minimise $(x-3)^2$ on $[0,2]$; the free minimiser $3$ is outside, so clip to $x=2$.
$y$: minimise $(y-1)^2$ on $[0,2]$; the free minimiser $1$ is inside, so $y=1$.
Answer $(2,1)$, value $1$. This is exactly the Euclidean projection of $(3,1)$ onto the box, the step used in projected gradient descent.
$(3,1)$ is infeasible; $(2,2)$ clips both coordinates, though only $x$ violates the box.


@ calc h calc-h-072
T: Maximise xy on an ellipse
S: constrained-optimization
Q: Maximise $xy$ subject to $\dfrac{x^2}{8}+\dfrac{y^2}{2}=1$.
A: $4$
B: $\sqrt2$
C: $1$
D: $2$
ANS: D
EXP: $\mathcal L=xy-\lambda\left(\frac{x^2}{8}+\frac{y^2}{2}-1\right)$: $y=\frac{\lambda x}{4}$ and $x=\lambda y$.
Multiply the first equation by $x$ and the second by $y$: $xy=\frac{\lambda x^2}{4}$ and $xy=\lambda y^2$. So $\frac{x^2}{4}=y^2$ ($\lambda\ne0$ at the maximum), i.e. $\frac{x^2}{8}=\frac{y^2}{2}$.
Each term is then $\frac12$: $x^2=4$, $y^2=1$, and the maximum $xy=2\cdot1=2$.
Shortcut: with $u=\frac{x}{2\sqrt2}$, $v=\frac{y}{\sqrt2}$, $xy=4uv\le4\cdot\frac{u^2+v^2}{2}=2$.
$4$ takes $x=2\sqrt2$, $y=\sqrt2$ (both semi-axes at once), which is not on the ellipse.


@ calc h calc-h-073
T: Lagrange dual of a one-variable problem
S: constrained-optimization
Q: For the problem minimise $x^2$ subject to $x\ge1$, form $\mathcal L(x,\mu)=x^2+\mu(1-x)$ with $\mu\ge0$. What is the dual function $q(\mu)=\min_x\mathcal L(x,\mu)$?
A: $\mu^2/4-\mu$
B: $\mu-\mu^2/2$
C: $\mu-\mu^2/4$
D: $\mu-\mu^2$
ANS: C
EXP: For fixed $\mu$, minimise over $x$: $\partial_x\mathcal L=2x-\mu=0$, so $x=\frac\mu2$.
$q(\mu)=\frac{\mu^2}{4}+\mu\left(1-\frac\mu2\right)=\mu-\frac{\mu^2}{4}$.
The dual problem maximises $q$: $q'(\mu)=1-\frac\mu2=0$ at $\mu^*=2$, giving $q^*=1$, which equals the primal optimum $p^*=1$ at $x=1$ (strong duality for this convex problem).
$\mu-\mu^2/2$ comes from plugging in $x=\mu$ (forgetting the $\frac12$). $\mu^2/4-\mu$ has the sign flipped and would be maximised at $\mu=0$. The SVM is trained through exactly this kind of dual.


@ calc h calc-h-074
T: KKT with two active constraints
S: constrained-optimization
Q: Minimise $(x-3)^2+(y+1)^2$ subject to $g_1=x+y-2\le0$ and $g_2=-y\le0$, with $\mathcal L=f+\mu_1g_1+\mu_2g_2$. Which gives the optimal point and multipliers?
A: $(2,0)$ with $\mu_1=2$, $\mu_2=4$
B: $(2,0)$ with $\mu_1=2$, $\mu_2=0$
C: $(3,-1)$ with $\mu_1=\mu_2=0$
D: $(2,0)$ with $\mu_1=2$, $\mu_2=-4$
ANS: A
EXP: The free minimiser $(3,-1)$ violates $y\ge0$. On $y=0$: minimise $(x-3)^2+1$ with $x\le2$, giving $(2,0)$, value $2$. On $x+y=2$: $f=(1+y)^2+(y+1)^2=2(1+y)^2$ is smallest at $y=0$, again $(2,0)$. So $x^*=(2,0)$ with both constraints active.
Stationarity: $\nabla f=(2(x-3),\,2(y+1))=(-2,2)$, $\nabla g_1=(1,1)$, $\nabla g_2=(0,-1)$.
$x$: $-2+\mu_1=0\Rightarrow\mu_1=2$. $y$: $2+\mu_1-\mu_2=0\Rightarrow\mu_2=4$. Both $\ge0$, so KKT holds.
$\mu_2=0$ treats $y\ge0$ as inactive, but then the $y$-equation $2+2=0$ fails. $\mu_2=-4$ has the sign convention wrong. $(3,-1)$ is infeasible.


@ calc h calc-h-075
T: Entropy-regularised choice gives softmax
S: constrained-optimization
Q: For scores $z\in\mathbb R^n$, maximise $\displaystyle\sum_ip_iz_i-\sum_ip_i\ln p_i$ over probability vectors $p$ ($p_i\ge0$, $\sum_ip_i=1$). Which gives the maximiser and the maximum value?
A: $p=\operatorname{softmax}(z)$, maximum $\max_iz_i$
B: $p=\operatorname{softmax}(z)$, maximum $\ln\sum_ie^{z_i}$
C: $p$ one-hot at $\arg\max_iz_i$, maximum $\max_iz_i$
D: $p$ uniform, maximum $\frac1n\sum_iz_i+\ln n$
ANS: B
EXP: $\mathcal L=\sum_ip_iz_i-\sum_ip_i\ln p_i-\lambda\left(\sum_ip_i-1\right)$.
$\partial/\partial p_i$: $z_i-\ln p_i-1-\lambda=0$, so $p_i\propto e^{z_i}$; normalising gives $p=\operatorname{softmax}(z)$ (all $p_i>0$, so the constraints $p_i\ge0$ are inactive).
Value: $\ln p_i=z_i-\ln Z$ with $Z=\sum_je^{z_j}$, so $\sum_ip_iz_i-\sum_ip_i(z_i-\ln Z)=\ln Z$.
The one-hot answer is right without the entropy term; the entropy smooths it. So log-sum-exp is a smooth max, and softmax is its gradient. $\max_iz_i$ is only a lower bound on $\ln Z$.

@ stat e stat-e-001
T: Median of a small sample
S: descriptive
Q: What is the median of $\{2,3,3,5,7\}$?
A: $4$
B: $3$
C: $5$
D: $3.5$
ANS: B
EXP: Sorted, the middle (3rd of 5) value is $3$. The mean is $4$ and the mode is $3$.


@ stat e stat-e-002
T: Sample variance
S: descriptive
Q: What is the sample variance (with $n-1$ in the denominator) of $\{2,4,6\}$?
A: $\frac83$
B: $4$
C: $2$
D: $8$
ANS: B
EXP: Mean $=4$. Squared deviations: $4,0,4$, summing to $8$.
$s^2=\tfrac{8}{3-1}=4$. Dividing by $n$ gives $\tfrac83$, the biased (MLE) version.


@ stat e stat-e-003
T: z-score
S: descriptive
Q: Test scores have mean $70$ and standard deviation $10$. What is the z-score of a score of $85$?
A: $1.5$
B: $15$
C: $0.15$
D: $-1.5$
ANS: A
EXP: $z=\dfrac{x-\mu}{\sigma}=\dfrac{85-70}{10}=1.5$: the score is 1.5 standard deviations above the mean.


@ stat e stat-e-004
T: Empirical rule
S: descriptive
Q: For a normal distribution, roughly what fraction of values lie within 2 standard deviations of the mean?
A: $68\%$
B: $95\%$
C: $99.7\%$
D: $50\%$
ANS: B
EXP: 68–95–99.7 rule: about 68% within $1\sigma$, 95% within $2\sigma$ (exactly 95% at $1.96\sigma$), and 99.7% within $3\sigma$.


@ stat e stat-e-005
T: Meaning of zero correlation
S: regression-correlation
Q: The Pearson correlation between $X$ and $Y$ is $0$. This means:
A: $X$ and $Y$ are independent
B: there is no linear relationship
C: there is no relationship of any kind
D: $Y$ is constant
ANS: B
EXP: Pearson $r$ measures only linear association. $Y=X^2$ with $X$ symmetric about 0 has $r=0$ but a perfect nonlinear relationship.


@ stat e stat-e-006
T: Type I error
S: z-test
Q: A Type I error is:
A: rejecting $H_0$ when $H_0$ is true
B: failing to reject $H_0$ when $H_0$ is false
C: rejecting $H_1$ when $H_1$ is true
D: using the wrong test statistic
ANS: A
EXP: Type I = false positive, with probability $\alpha$ (the significance level).
Type II = false negative (failing to reject a false $H_0$), with probability $\beta$; power $=1-\beta$.


@ stat e stat-e-007
T: Definition of an unbiased estimator
S: bias-variance
Q: An estimator $\hat\theta$ of $\theta$ is unbiased if:
A: $E[\hat\theta]=\theta$
B: $\operatorname{Var}(\hat\theta)=0$
C: $\hat\theta=\theta$ for every sample
D: $\hat\theta\to\theta$ as $n\to\infty$
ANS: A
EXP: Unbiased means right on average over repeated samples. [[D]] describes consistency, a different property; an estimator can be biased yet consistent (e.g. the MLE of $\sigma^2$).


@ stat e stat-e-008
T: Standard error of the mean
S: sampling-distributions
Q: The population standard deviation is $12$ and the sample size is $36$. What is the standard error of $\bar X$?
A: $2$
B: $6$
C: $\frac13$
D: $12$
ANS: A
EXP: $\text{SE}(\bar X)=\dfrac{\sigma}{\sqrt n}=\dfrac{12}{6}=2$. To halve the SE you need 4× the data.


@ stat e stat-e-009
T: Skewness from mean and median
S: descriptive
Q: A distribution has mean $60$ and median $45$. It is most likely:
A: right (positively) skewed
B: left (negatively) skewed
C: symmetric
D: uniform
ANS: A
EXP: A long right tail of large values pulls the mean above the median. Income distributions are the classic example.


@ stat e stat-e-010
T: Outlier fence using the IQR
S: descriptive
Q: $Q_1=20$ and $Q_3=50$. Using the $1.5\times$IQR rule, values above what are flagged as outliers?
A: $80$
B: $95$
C: $65$
D: $125$
ANS: B
EXP: $\text{IQR}=50-20=30$. Upper fence $=Q_3+1.5\cdot\text{IQR}=50+45=95$ (lower fence $=20-45=-25$).


@ stat m stat-m-001
T: MLE of a Bernoulli parameter
S: estimation-mle
Q: In 20 independent Bernoulli trials you observe 7 successes. What is the maximum likelihood estimate of $p$?
A: $0.35$
B: $0.5$
C: $0.7$
D: $0.65$
ANS: A
EXP: $\ell(p)=7\ln p+13\ln(1-p)$. $\ell'(p)=\tfrac7p-\tfrac{13}{1-p}=0\Rightarrow p=\tfrac{7}{20}=0.35$, the sample proportion.


@ stat m stat-m-002
T: MLE of an exponential rate
S: estimation-mle
Q: Data from $\text{Exp}(\lambda)$ have sample mean $\bar x=4$. What is the MLE of $\lambda$?
A: $4$
B: $0.25$
C: $0.5$
D: $16$
ANS: B
EXP: $\ell(\lambda)=n\ln\lambda-\lambda\sum x_i$. $\ell'=\tfrac n\lambda-\sum x_i=0\Rightarrow\hat\lambda=\tfrac1{\bar x}=0.25$.
The mean of Exp($\lambda$) is $1/\lambda$, so invariance gives the same answer.


@ stat m stat-m-003
T: 95% confidence interval for a mean
S: confidence-intervals
Q: $\bar x=50$, known $\sigma=10$, $n=100$. What is the 95% confidence interval for $\mu$?
A: $(48.04,\ 51.96)$
B: $(30.4,\ 69.6)$
C: $(49.80,\ 50.20)$
D: $(48.36,\ 51.64)$
ANS: A
EXP: $\bar x\pm z_{0.025}\dfrac{\sigma}{\sqrt n}=50\pm1.96\cdot\tfrac{10}{10}=50\pm1.96$.
[[B]] forgets $\sqrt n$; [[D]] uses $1.645$, which is the 90% value.


@ stat m stat-m-004
T: Regression slope from correlation
S: regression-correlation
Q: The correlation between $x$ and $y$ is $r=0.8$, with $s_x=4$ and $s_y=10$. What is the least-squares slope of $y$ on $x$?
A: $2$
B: $3.2$
C: $0.32$
D: $5$
ANS: A
EXP: $b=r\dfrac{s_y}{s_x}=0.8\cdot\tfrac{10}{4}=2$. Regressing $x$ on $y$ instead gives $r\tfrac{s_x}{s_y}=0.32$, which is not the reciprocal of 2 unless $|r|=1$.


@ stat m stat-m-005
T: Sample covariance
S: regression-correlation
Q: For paired data $x=(1,2,3)$, $y=(2,4,7)$, what is the sample covariance (denominator $n-1$)?
A: $2.5$
B: $\frac53$
C: $5$
D: $\frac{13}{3}$
ANS: A
EXP: $\bar x=2$, $\bar y=\tfrac{13}{3}$. $\sum(x_i-\bar x)(y_i-\bar y)=(-1)(-\tfrac73)+0+(1)(\tfrac83)=5$.
Divide by $n-1=2$: $2.5$. (Dividing by $n$ gives $\tfrac53$.)


@ stat m stat-m-006
T: Interpreting a p-value
S: z-test
Q: A test gives $p=0.03$. The correct interpretation is:
A: $P(H_0\text{ is true})=0.03$
B: assuming $H_0$ is true, the probability of a result at least this extreme is $0.03$
C: there is a 97% chance $H_1$ is true
D: the effect size is 0.03
ANS: B
EXP: A p-value is computed under $H_0$: $P(\text{data this extreme}\mid H_0)$. It is not $P(H_0\mid\text{data})$; that would need a prior (Bayes).


@ stat m stat-m-007
T: Bias–variance decomposition of MSE
S: bias-variance
Q: An estimator has bias $2$ and variance $5$. What is its mean squared error?
A: $7$
B: $9$
C: $3$
D: $29$
ANS: B
EXP: $\text{MSE}=\text{Bias}^2+\text{Var}=4+5=9$. A slightly biased, low-variance estimator (e.g. ridge regression) can beat an unbiased one on MSE.


@ stat m stat-m-008
T: Central limit theorem for a sum
S: sampling-distributions
Q: $X_1,\dots,X_{100}$ are iid with mean $2$ and variance $4$. Approximately, $S=\sum X_i$ follows:
A: $N(200,\ 400)$
B: $N(200,\ 4)$
C: $N(2,\ 0.04)$
D: $N(200,\ 20)$
ANS: A
EXP: $E[S]=100\cdot2=200$ and $\operatorname{Var}(S)=100\cdot4=400$ (SD $20$). [[C]] is the distribution of the mean $\bar X$. [[D]] puts the SD where the variance belongs.


@ stat m stat-m-009
T: Degrees of freedom of a chi-square test
S: chi-squared-test
Q: A chi-square test of independence on a $3\times4$ contingency table has how many degrees of freedom?
A: $12$
B: $6$
C: $7$
D: $11$
ANS: B
EXP: $\text{df}=(r-1)(c-1)=2\cdot3=6$.


@ stat m stat-m-010
T: Coefficient of determination
S: regression-correlation
Q: A regression has $\text{SSE}=20$ (residual) and $\text{SST}=80$ (total). What is $R^2$?
A: $0.25$
B: $0.75$
C: $4$
D: $0.8$
ANS: B
EXP: $R^2=1-\dfrac{\text{SSE}}{\text{SST}}=1-\dfrac{20}{80}=0.75$: the model explains 75% of the variance in $y$.


@ stat h stat-h-001
T: Bias of the MLE of normal variance
S: bias-variance
Q: For $X_1,\dots,X_n\sim N(\mu,\sigma^2)$, the MLE $\hat\sigma^2=\frac1n\sum(X_i-\bar X)^2$ has expectation:
A: $\sigma^2$
B: $\frac{n-1}{n}\sigma^2$
C: $\frac{n}{n-1}\sigma^2$
D: $\frac{\sigma^2}{n}$
ANS: B
EXP: $E\left[\sum(X_i-\bar X)^2\right]=(n-1)\sigma^2$ because one degree of freedom is used up estimating $\bar X$.
So the MLE underestimates by the factor $\tfrac{n-1}{n}$; Bessel's correction (dividing by $n-1$) removes the bias.


@ stat h stat-h-002
T: MLE for Uniform(0, θ)
S: estimation-mle
Q: Observations from $U(0,\theta)$ are $2.1,\ 4.7,\ 3.3$. The MLE of $\theta$ is:
A: $4.7$, and it is unbiased
B: $4.7$, and it tends to underestimate $\theta$
C: $2\bar x\approx6.73$, and it is unbiased
D: $\bar x\approx3.37$
ANS: B
EXP: $L(\theta)=\theta^{-n}$ for $\theta\ge\max x_i$ (else 0). It is decreasing, so it is maximised at $\hat\theta=\max x_i=4.7$.
$E[\max]=\tfrac{n}{n+1}\theta<\theta$, so it is biased low. $2\bar x$ is the unbiased method-of-moments estimator, not the MLE.


@ stat h stat-h-003
T: Cramér–Rao lower bound for a Bernoulli
S: estimation-mle
Q: For $n$ iid Bernoulli$(p)$ samples, the Cramér–Rao lower bound on the variance of any unbiased estimator of $p$ is:
A: $\frac{p(1-p)}{n}$
B: $\frac{1}{np(1-p)}$
C: $p(1-p)$
D: $\frac{p}{n}$
ANS: A
EXP: Fisher information per sample: $I(p)=\dfrac{1}{p(1-p)}$. The CRLB is $\dfrac1{nI(p)}=\dfrac{p(1-p)}n$.
$\hat p=\bar X$ attains it, so it is efficient. [[B]] is $nI(p)$ itself.


@ stat h stat-h-004
T: Required sample size
S: confidence-intervals
Q: You want a 95% CI for a mean with margin of error at most $2$. With $\sigma=10$, what is the minimum $n$?
A: $96$
B: $97$
C: $20$
D: $49$
ANS: B
EXP: $1.96\cdot\tfrac{10}{\sqrt n}\le2\Rightarrow\sqrt n\ge9.8\Rightarrow n\ge96.04$.
Round up to $97$; $96$ would give a margin slightly above 2.


@ stat h stat-h-005
T: Power of a one-sided z-test
S: z-test
Q: Test $H_0:\mu=0$ vs $H_1:\mu>0$ with $\sigma=1$, $n=25$, $\alpha=0.05$ (reject if $\bar x>0.329$). If the true $\mu=0.5$, the power is approximately:
A: $0.05$
B: $0.20$
C: $0.80$
D: $0.95$
ANS: C
EXP: $\text{SE}=1/\sqrt{25}=0.2$; the cutoff is $1.645\cdot0.2=0.329$.
Power $=P(\bar X>0.329\mid\mu=0.5)=P\left(Z>\tfrac{0.329-0.5}{0.2}\right)=P(Z>-0.855)\approx0.80$. Then $\beta\approx0.20$.


@ stat h stat-h-006
T: L1 regularisation as a prior
S: bayesian-inference
Q: Lasso ($L_1$-penalised) regression equals MAP estimation with which prior on the weights?
A: Gaussian
B: Laplace
C: Uniform
D: Beta
ANS: B
EXP: MAP minimises $-\log p(y\mid w)-\log p(w)$. A Laplace prior $p(w)\propto e^{-\lambda|w|}$ contributes $\lambda\|w\|_1$.
A Gaussian prior gives $\lambda\|w\|_2^2$ (ridge). The Laplace prior's sharp peak at 0 is why Lasso produces exact zeros.


@ stat h stat-h-007
T: Law of total variance
S: descriptive
Q: A population is 50% group A (mean 10, variance 4) and 50% group B (mean 20, variance 4). What is the overall variance?
A: $4$
B: $25$
C: $29$
D: $8$
ANS: C
EXP: $\operatorname{Var}(Y)=E[\operatorname{Var}(Y\mid G)]+\operatorname{Var}(E[Y\mid G])$.
Within-group: $4$. Between-group: the group means $10,20$ with equal weight have variance $25$. Total $=29$.
This within/between split is the basis of ANOVA and of the variance criterion in clustering.


@ stat h stat-h-008
T: Variance of the OLS estimator
S: regression-correlation
Q: In $y=X\beta+\varepsilon$ with $\varepsilon\sim N(0,\sigma^2I)$, the covariance of $\hat\beta=(X^TX)^{-1}X^Ty$ is:
A: $\sigma^2(X^TX)^{-1}$
B: $\sigma^2X^TX$
C: $\sigma^2I$
D: $(X^TX)^{-1}X^T$
ANS: A
EXP: $\hat\beta=\beta+(X^TX)^{-1}X^T\varepsilon$, so $\operatorname{Cov}(\hat\beta)=(X^TX)^{-1}X^T(\sigma^2I)X(X^TX)^{-1}=\sigma^2(X^TX)^{-1}$.
Collinear features make $X^TX$ near-singular, which inflates this variance (multicollinearity).


@ stat h stat-h-009
T: KL divergence between two Gaussians
S: information-theory
Q: What is $D_{KL}\big(N(0,1)\,\|\,N(1,1)\big)$?
A: $0$
B: $0.5$
C: $1$
D: $2$
ANS: B
EXP: For equal variances, $D_{KL}\big(N(\mu_1,\sigma^2)\|N(\mu_2,\sigma^2)\big)=\dfrac{(\mu_1-\mu_2)^2}{2\sigma^2}=\tfrac12$.
This closed form is the KL term in the VAE loss.


@ stat h stat-h-010
T: Multiple testing
S: z-test
Q: You run 20 independent tests at $\alpha=0.05$ where every null hypothesis is true. What is the probability of at least one false positive?
A: $0.05$
B: $\approx0.64$
C: $1.0$
D: $\approx0.36$
ANS: B
EXP: $1-(0.95)^{20}\approx1-0.358=0.642$. ($0.36$ is the probability of no false positives.)
Bonferroni fixes this by testing each at $\alpha/20=0.0025$.

@ stat e stat-e-011
T: Where the t distribution comes from
S: sampling-distributions
Q: $Z\sim N(0,1)$ and $V\sim\chi^2_k$ are independent. What is the distribution of $T=\dfrac{Z}{\sqrt{V/k}}$?
A: $\chi^2_k$
B: $t_{k-1}$
C: $t_k$
D: $F(1,k)$
ANS: C
EXP: By definition, a standard normal divided by the square root of an independent $\chi^2_k$ over its degrees of freedom is Student's $t$ with $k$ degrees of freedom.
The $k-1$ in the one-sample $t$ statistic appears only because there $V=(n-1)S^2/\sigma^2\sim\chi^2_{n-1}$, so $k=n-1$. $F(1,k)$ is the distribution of $T^2$, not $T$.


@ stat e stat-e-012
T: Variance of a chi-squared variable
S: sampling-distributions
TYPE: nat
TOL: 0
Q: $X\sim\chi^2_8$. What is $\operatorname{Var}(X)$? Enter an integer.
ANS: 16
EXP: A $\chi^2_k$ variable is a sum of $k$ independent $Z_i^2$ with $E[Z_i^2]=1$ and $\operatorname{Var}(Z_i^2)=E[Z^4]-1=3-1=2$.
So $E[X]=k=8$ and $\operatorname{Var}(X)=2k=16$. A common slip is to answer $8$, which is the mean.


@ stat e stat-e-013
T: Tails of the t distribution
S: sampling-distributions
Q: Compared with the standard normal $N(0,1)$, the $t$ distribution with $5$ degrees of freedom:
A: has lighter tails and a smaller variance
B: has heavier tails and a larger variance
C: has the same variance but is skewed to the right
D: is identical, because both are symmetric about 0
ANS: B
EXP: The $t$ distribution is symmetric about 0 like $N(0,1)$, but it accounts for the extra uncertainty of estimating $\sigma$ by $S$, so it has heavier tails.
Its variance is $\dfrac{\nu}{\nu-2}=\dfrac53>1$. This is why $t$ critical values (e.g. $t_{0.025,5}=2.571$) exceed $z_{0.025}=1.96$. As $\nu\to\infty$, $t_\nu\to N(0,1)$.


@ stat e stat-e-014
T: Sum of squared standard normals
S: sampling-distributions
Q: $Z_1,Z_2,Z_3$ are independent $N(0,1)$. What is the distribution of $Z_1^2+Z_2^2+Z_3^2$?
A: $\chi^2_3$
B: $\chi^2_2$
C: $N(0,3)$
D: $t_3$
ANS: A
EXP: The chi-squared distribution with $k$ degrees of freedom is defined as the sum of $k$ independent squared standard normals. Here $k=3$.
$\chi^2_2$ would be the answer only if one degree of freedom were lost to estimating a mean, as in $\sum(Z_i-\bar Z)^2$. $N(0,3)$ is the distribution of $Z_1+Z_2+Z_3$ (no squares); a sum of squares is never negative, so it cannot be normal.


@ stat e stat-e-015
T: MLE of a Poisson rate from counts
S: estimation-mle
Q: Daily counts of server errors are modelled as iid Poisson$(\lambda)$. Over 5 days you observe $2,0,3,1,4$. What is the maximum likelihood estimate of $\lambda$?
A: $2.5$
B: $10$
C: $\sqrt2$
D: $2$
ANS: D
EXP: $\ell(\lambda)=\sum x_i\ln\lambda-n\lambda+\text{const}$. Setting $\ell'(\lambda)=\dfrac{\sum x_i}{\lambda}-n=0$ gives $\hat\lambda=\bar x=\dfrac{10}{5}=2$.
$2.5$ divides by $n-1$, which belongs to the sample variance, not the mean. $10$ is the total count, not the per-day rate.


@ stat e stat-e-016
T: Method of moments for a power density
S: estimation-mle
Q: $X$ has density $f(x)=(\theta+1)x^{\theta}$ for $0<x<1$ ($\theta>-1$). A sample has mean $\bar x=0.75$. What is the method-of-moments estimate of $\theta$?
A: $3$
B: $2$
C: $1$
D: $0.75$
ANS: B
EXP: First moment: $E[X]=\int_0^1(\theta+1)x^{\theta+1}\,dx=\dfrac{\theta+1}{\theta+2}$.
Method of moments sets $E[X]=\bar x$: $\dfrac{\theta+1}{\theta+2}=0.75\Rightarrow\theta+1=0.75\theta+1.5\Rightarrow\theta=2$.
$3$ comes from using $E[X]=\dfrac{\theta}{\theta+1}$, which is the mean of the density $\theta x^{\theta-1}$, a different parametrisation.


@ stat e stat-e-017
T: Invariance property of the MLE
S: estimation-mle
Q: The MLE of a Bernoulli success probability is $\hat p=0.2$. What is the MLE of the odds $\dfrac{p}{1-p}$?
A: $0.25$
B: $0.2$
C: $4$
D: $0.8$
ANS: A
EXP: Invariance: if $\hat\theta$ is the MLE of $\theta$, then $g(\hat\theta)$ is the MLE of $g(\theta)$.
So the MLE of the odds is $\dfrac{0.2}{0.8}=0.25$. $4$ is the odds against, $\dfrac{1-p}{p}$. In logistic regression the model is linear in the log-odds $\ln\frac{p}{1-p}$.


@ stat e stat-e-018
T: Gaussian noise MLE and the loss function
S: estimation-mle
Q: In the model $y_i=f_w(x_i)+\varepsilon_i$ with $\varepsilon_i$ iid $N(0,\sigma^2)$ and $\sigma$ fixed, maximising the likelihood over $w$ is equivalent to minimising which loss?
A: mean absolute error
B: cross-entropy loss
C: sum of squared errors
D: hinge loss
ANS: C
EXP: $\ln L(w)=-\dfrac{1}{2\sigma^2}\sum_i\big(y_i-f_w(x_i)\big)^2+\text{const}$, so maximising it is the same as minimising $\sum_i(y_i-f_w(x_i))^2$.
Mean absolute error is what you get with Laplace noise instead. Cross-entropy is the negative log-likelihood for Bernoulli or categorical labels (classification).


@ stat e stat-e-019
T: What a likelihood function is
S: estimation-mle
Q: For observed data $x_1,\dots,x_n$, the likelihood $L(\theta)=\prod_i f(x_i;\theta)$ is best described as:
A: a probability distribution over $\theta$ that integrates to 1
B: a function of the data with $\theta$ held fixed
C: the posterior probability of $\theta$ given the data
D: a function of $\theta$ with the observed data held fixed
ANS: D
EXP: The same formula $f(x;\theta)$ is a density in $x$ when $\theta$ is fixed; the likelihood reads it the other way, as a function of $\theta$ for the data you actually saw.
It need not integrate to 1 over $\theta$, so it is not a distribution over $\theta$. Turning it into a posterior requires multiplying by a prior and normalising (Bayes' rule).


@ stat e stat-e-020
T: Diagnosing underfitting
S: bias-variance
Q: A model has training error $30\%$ and validation error $31\%$, while a well-tuned model on the same task reaches $5\%$. The model most likely suffers from:
A: high bias (underfitting)
B: high variance (overfitting)
C: data leakage from validation to training
D: too little regularisation
ANS: A
EXP: Training and validation errors are close (small variance gap) but both are high, so the model cannot even fit the training data: high bias.
High variance shows the opposite pattern, low training error with a large gap to validation error. Too little regularisation would lead to overfitting, not this.


@ stat e stat-e-021
T: MSE of the sample mean
S: bias-variance
TYPE: nat
TOL: 0
Q: $X_1,\dots,X_5$ are iid with mean $\mu$ and variance $\sigma^2=20$. What is the mean squared error of $\bar X$ as an estimator of $\mu$? Enter an integer.
ANS: 4
EXP: $\bar X$ is unbiased, so $\text{MSE}=\text{Bias}^2+\operatorname{Var}=0+\dfrac{\sigma^2}{n}=\dfrac{20}{5}=4$.
The answer is the variance $\sigma^2/n$, not the standard error $\sigma/\sqrt n=2$.


@ stat e stat-e-022
T: Which linear estimators are unbiased
S: bias-variance
TYPE: msq
Q: $X_1,X_2$ are iid with mean $\mu$. Which of the following are unbiased estimators of $\mu$? More than one option may be correct.
A: $X_1$
B: $\dfrac{X_1+X_2}{2}$
C: $2X_1-X_2$
D: $\dfrac{X_1+X_2}{3}$
ANS: A,B,C
EXP: By linearity, $E[aX_1+bX_2]=(a+b)\mu$, so the estimator is unbiased exactly when the weights sum to 1.
$X_1$: $1$. $\frac{X_1+X_2}{2}$: $\frac12+\frac12=1$. $2X_1-X_2$: $2-1=1$. All unbiased.
$\frac{X_1+X_2}{3}$: weights sum to $\frac23$, so $E=\frac23\mu$, biased.
Unbiasedness says nothing about quality: $\operatorname{Var}(2X_1-X_2)=5\sigma^2$, far worse than $\sigma^2/2$ for the average.


@ stat e stat-e-023
T: Model complexity and bias–variance
S: bias-variance
Q: As you increase the degree of a polynomial regression model (with a fixed training set), what typically happens?
A: bias increases and variance decreases
B: bias and variance both decrease
C: bias decreases and variance increases
D: bias and variance both increase
ANS: C
EXP: A more flexible model can fit the true function more closely (lower bias) but also fits the noise in the particular training set, so its predictions change more from sample to sample (higher variance).
Test error is therefore U-shaped in model complexity. Regularisation moves the other way: more bias, less variance.


@ stat e stat-e-024
T: Meaning of a 95% confidence interval
S: confidence-intervals
Q: A 95% confidence interval for a population mean $\mu$ is computed as $(48,\ 56)$. Which statement is correct?
A: There is a 95% probability that $\mu$ lies between 48 and 56.
B: 95% of the sample values lie between 48 and 56.
C: If the sampling were repeated many times, about 95% of the intervals built this way would contain $\mu$.
D: There is a 95% probability that the sample mean lies between 48 and 56.
ANS: C
EXP: In the frequentist view $\mu$ is fixed and the interval is random. "95%" is the long-run coverage rate of the procedure.
Once computed, $(48,56)$ either contains $\mu$ or not; a probability statement about $\mu$ itself needs a Bayesian credible interval. The interval is about the mean, not about individual values, and the sample mean ($52$) is certainly inside it.


@ stat e stat-e-025
T: Making a confidence interval narrower
S: confidence-intervals
Q: For a $z$-interval $\bar x\pm z_{\alpha/2}\dfrac{\sigma}{\sqrt n}$, which change makes the interval narrower?
A: increasing the sample size from $50$ to $200$
B: raising the confidence level from 95% to 99%
C: sampling from a population with a larger $\sigma$
D: decreasing the sample size from $50$ to $25$
ANS: A
EXP: The half-width is $z_{\alpha/2}\,\sigma/\sqrt n$. Increasing $n$ by 4× halves it.
A higher confidence level uses a larger $z$ ($2.576$ instead of $1.96$), so the interval gets wider. A larger $\sigma$ or a smaller $n$ also widens it.


@ stat e stat-e-026
T: Margin of error from a reported interval
S: confidence-intervals
TYPE: nat
TOL: 0
Q: A symmetric 95% confidence interval for a mean is reported as $(42,\ 58)$. What is the margin of error? Enter an integer.
ANS: 8
EXP: A symmetric interval is $\bar x\pm E$. The centre is $\bar x=\frac{42+58}{2}=50$ and the margin is $E=\frac{58-42}{2}=8$.
The full width is $16$; the margin of error is half of it.


@ stat e stat-e-027
T: z critical value for 90% confidence
S: confidence-intervals
Q: Which $z$ critical value is used for a two-sided 90% confidence interval?
A: $1.282$
B: $1.96$
C: $1.645$
D: $2.576$
ANS: C
EXP: A two-sided 90% interval leaves $5\%$ in each tail, so it uses $z_{0.05}=1.645$.
$1.282=z_{0.10}$ would put all 10% in one tail and is for a one-sided 90% bound. $1.96$ is for 95% and $2.576$ for 99%.


@ stat e stat-e-028
T: Critical value when sigma is unknown
S: confidence-intervals
Q: A sample of $n=16$ comes from a normal population with unknown $\sigma$. The confidence interval for $\mu$ uses $\bar x\pm c\cdot\dfrac{s}{\sqrt n}$. The critical value $c$ comes from:
A: the standard normal distribution
B: the $t$ distribution with 16 degrees of freedom
C: the $\chi^2$ distribution with 15 degrees of freedom
D: the $t$ distribution with 15 degrees of freedom
ANS: D
EXP: Replacing $\sigma$ by $s$ makes $\dfrac{\bar X-\mu}{S/\sqrt n}\sim t_{n-1}=t_{15}$. One degree of freedom is used up by estimating the mean in $s$.
Using $z$ would understate the width for small $n$. $\chi^2_{15}$ is what you use for a CI for $\sigma^2$, not for $\mu$.


@ stat m stat-m-011
T: Linear transformation of mean and SD
S: descriptive
Q: A dataset has mean $20$ and standard deviation $5$. Each value is transformed by $y=3x-4$. What are the mean and standard deviation of $y$?
A: mean $56$, SD $11$
B: mean $56$, SD $15$
C: mean $60$, SD $15$
D: mean $56$, SD $45$
ANS: B
EXP: The mean follows the transformation exactly: $\bar y=3\cdot20-4=56$.
A shift does not change spread, and scaling multiplies the SD by $|a|$: $s_y=3\cdot5=15$.
SD $11$ wrongly applies the shift $-4$ to the SD. SD $45$ multiplies by $a^2=9$, which is the rule for the variance ($225=9\cdot25$), not the SD.


@ stat m stat-m-012
T: Combined mean of two groups
S: descriptive
Q: Class A has 20 students with mean score $60$. Class B has 30 students with mean score $70$. What is the mean score of all 50 students?
A: $65$
B: $64$
C: $66$
D: $68$
ANS: C
EXP: The combined mean is the mean weighted by group size: $\dfrac{20\cdot60+30\cdot70}{50}=\dfrac{1200+2100}{50}=66$.
$65$ is the unweighted average of the two means, correct only when the groups are the same size. $64$ attaches the weights to the wrong groups.


@ stat m stat-m-013
T: Interquartile range by the median-of-halves rule
S: descriptive
TYPE: nat
TOL: 0
Q: Find the interquartile range of $\{3,5,7,8,12,13,14,18,21\}$. Use this convention: $Q_1$ is the median of the values below the overall median, and $Q_3$ is the median of the values above it (the overall median is excluded from both halves). Enter an integer.
ANS: 10
EXP: There are 9 sorted values; the median is the 5th, $12$.
Lower half $\{3,5,7,8\}$: $Q_1=\frac{5+7}{2}=6$. Upper half $\{13,14,18,21\}$: $Q_3=\frac{14+18}{2}=16$.
$\text{IQR}=16-6=10$. Other quartile conventions (e.g. linear interpolation in software) can give slightly different values, which is why the convention is stated.


@ stat m stat-m-014
T: Effect of an outlier on mean and median
S: descriptive
Q: The data $\{10,12,14,16,18\}$ have mean and median $14$. The value $18$ is mistyped as $68$. What are the new mean and median?
A: mean $24$, median $14$
B: mean $14$, median $14$
C: mean $24$, median $24$
D: mean $24$, median $16$
ANS: A
EXP: The sum rises by $50$, so the mean rises by $\frac{50}{5}=10$ to $24$.
The sorted data are $\{10,12,14,16,68\}$; the middle value is still $14$. The median depends only on order, so moving the largest value further out does not change it.
This robustness is why the median (and L1 loss) is preferred when data contain outliers.


@ stat m stat-m-015
T: Median from a frequency table
S: descriptive
Q: A survey records the number of devices per household:
$$\begin{array}{c|ccccc}\text{devices} & 1 & 2 & 3 & 4 & 5\\\hline\text{households} & 3 & 7 & 5 & 4 & 1\end{array}$$
What is the median number of devices?
A: $2$
B: $3$
C: $2.65$
D: $2.5$
ANS: D
EXP: There are $n=20$ households, so the median is the average of the 10th and 11th sorted values.
Cumulative counts: $3,\ 10,\ 15,\ 19,\ 20$. The 10th value is $2$ (positions 4–10) and the 11th is $3$ (positions 11–15). Median $=\frac{2+3}{2}=2.5$.
$2$ is the mode and $2.65$ is the mean ($53/20$).


@ stat m stat-m-016
T: Sample variance from summary sums
S: descriptive
Q: For $n=10$ observations, $\sum x_i=50$ and $\sum x_i^2=340$. What is the sample variance $s^2$ (denominator $n-1$)?
A: $9$
B: $10$
C: $29$
D: $\sqrt{10}$
ANS: B
EXP: Use $\sum(x_i-\bar x)^2=\sum x_i^2-n\bar x^2$. Here $\bar x=5$, so $\sum(x_i-\bar x)^2=340-10\cdot25=90$.
$s^2=\dfrac{90}{9}=10$. Dividing by $n$ gives $9$, the population (MLE) version. $29=34-5$ forgets to square the mean. $\sqrt{10}$ is the SD.


@ stat m stat-m-017
T: Adding an observation equal to the mean
S: descriptive
TYPE: nat
TOL: 0.01
Q: A sample of $n=9$ values has mean $50$ and sample variance $s^2=16$ (denominator $n-1$). A 10th value equal to $50$ is added. What is the new sample variance (denominator $n-1$)? Give your answer to 2 decimal places.
ANS: 14.22
EXP: The sum of squared deviations is $(n-1)s^2=8\cdot16=128$.
The new value equals the mean, so the mean stays $50$ and the new value adds $0$ to the sum of squares.
New $s^2=\dfrac{128}{10-1}=\dfrac{128}{9}\approx14.22$. The spread looks smaller because the same total squared deviation is shared over more degrees of freedom. (This is why imputing missing values with the mean shrinks the variance.)


@ stat m stat-m-018
T: Probability for a sample mean
S: sampling-distributions
Q: IQ scores have mean $100$ and SD $15$ and are normally distributed. For a random sample of $25$ people, what is $P(\bar X>106)$? Use $\Phi(2)=0.9772$ and $\Phi(0.4)=0.6554$.
A: $0.0228$
B: $0.3446$
C: $0.9772$
D: $0.0456$
ANS: A
EXP: $\bar X\sim N\!\left(100,\ \tfrac{15^2}{25}\right)$, so $\text{SE}=\tfrac{15}{5}=3$.
$z=\tfrac{106-100}{3}=2$, and $P(Z>2)=1-0.9772=0.0228$.
$0.3446$ uses the SD of a single person ($z=6/15=0.4$) instead of the SE. $0.0456$ is the two-sided probability $P(|Z|>2)$.


@ stat m stat-m-019
T: Variance of the sample variance
S: sampling-distributions
TYPE: nat
TOL: 0.01
Q: $X_1,\dots,X_{10}$ are iid $N(\mu,4)$ (the second parameter is the variance). What is $\operatorname{Var}(S^2)$, where $S^2$ is the sample variance with denominator $n-1$? Give your answer to 2 decimal places.
ANS: 3.56
EXP: For normal data, $\dfrac{(n-1)S^2}{\sigma^2}\sim\chi^2_{n-1}$, which has variance $2(n-1)$.
So $\operatorname{Var}(S^2)=\dfrac{\sigma^4}{(n-1)^2}\cdot2(n-1)=\dfrac{2\sigma^4}{n-1}=\dfrac{2\cdot16}{9}\approx3.56$.
Remember to square $\sigma^2=4$: using $\sigma^2$ instead of $\sigma^4$ gives $0.89$.


@ stat m stat-m-020
T: SD of a difference of sample means
S: sampling-distributions
Q: Independent samples are drawn from two populations: $n_1=16$ with $\sigma_1=8$, and $n_2=9$ with $\sigma_2=3$. What is the standard deviation of $\bar X_1-\bar X_2$?
A: $3$
B: $\sqrt3$
C: $5$
D: $\sqrt5$
ANS: D
EXP: $\operatorname{Var}(\bar X_1)=\tfrac{64}{16}=4$ and $\operatorname{Var}(\bar X_2)=\tfrac{9}{9}=1$.
For independent variables, variances add even for a difference: $\operatorname{Var}(\bar X_1-\bar X_2)=4+1=5$, so the SD is $\sqrt5\approx2.24$.
$3$ adds the standard deviations $2+1$; $\sqrt3$ subtracts the variances; $5$ is the variance, not the SD.


@ stat m stat-m-021
T: Standard error of a sample proportion
S: sampling-distributions
Q: In a population, 40% of users click an ad. For a random sample of $150$ users, what is the standard error of the sample proportion $\hat p$?
A: $0.04$
B: $0.0016$
C: $0.49$
D: $0.0516$
ANS: A
EXP: $\hat p$ is a mean of Bernoulli$(p)$ variables, so $\operatorname{Var}(\hat p)=\dfrac{p(1-p)}{n}=\dfrac{0.24}{150}=0.0016$ and $\text{SE}=\sqrt{0.0016}=0.04$.
$0.0016$ is the variance. $0.49\approx\sqrt{0.24}$ is the SD of one click. $0.0516=\sqrt{0.4/150}$ drops the $(1-p)$ factor.


@ stat m stat-m-022
T: Properties of the t distribution
S: sampling-distributions
TYPE: msq
Q: Which of the following statements about Student's $t_\nu$ distribution are true? More than one option may be correct.
A: It is symmetric about $0$.
B: For $\nu>2$ its variance is $\dfrac{\nu}{\nu-2}$.
C: For $\nu=1$ its mean is $0$.
D: As $\nu\to\infty$ it converges to $N(0,1)$.
ANS: A,B,D
EXP: Symmetric about 0: true, since $T=Z/\sqrt{V/\nu}$ and $Z$ is symmetric.
Variance $\frac{\nu}{\nu-2}$ for $\nu>2$: true (it is infinite for $\nu\le2$).
Mean 0 for $\nu=1$: false. $t_1$ is the Cauchy distribution, whose tails are so heavy that $E|T|=\infty$, so the mean does not exist, even though the distribution is symmetric.
Convergence to $N(0,1)$: true, because $V/\nu\to1$ by the law of large numbers.


@ stat m stat-m-023
T: Ratio of two sample variances
S: sampling-distributions
Q: Independent samples of sizes $n_1=8$ and $n_2=11$ come from normal populations with equal variance. What is the distribution of $S_1^2/S_2^2$?
A: $F(8,11)$
B: $F(7,10)$
C: $F(10,7)$
D: $\chi^2_{17}$
ANS: B
EXP: $\dfrac{(n_i-1)S_i^2}{\sigma^2}\sim\chi^2_{n_i-1}$, and an $F$ variable is a ratio of independent chi-squareds each divided by its df:
$\dfrac{S_1^2}{S_2^2}=\dfrac{\chi^2_7/7}{\chi^2_{10}/10}\sim F(7,10)$ (numerator df first).
$F(8,11)$ forgets to subtract 1 for the estimated means. $F(10,7)$ swaps numerator and denominator. This ratio is the statistic of the $F$-test for equal variances and the basis of ANOVA.


@ stat m stat-m-024
T: MLE of a geometric parameter
S: estimation-mle
Q: $X$ counts the number of trials up to and including the first success, so $P(X=k)=(1-p)^{k-1}p$ for $k=1,2,\dots$. Observations: $2,4,1,5$. What is the MLE of $p$?
A: $\frac14$
B: $3$
C: $\frac13$
D: $\frac23$
ANS: C
EXP: $\ell(p)=n\ln p+\left(\sum x_i-n\right)\ln(1-p)$ with $n=4$, $\sum x_i=12$.
$\ell'(p)=\dfrac{4}{p}-\dfrac{8}{1-p}=0\Rightarrow4(1-p)=8p\Rightarrow\hat p=\dfrac13=\dfrac{1}{\bar x}$.
$\frac14=\frac{n}{\sum x_i+n}$ is the answer for the other convention (counting failures before the success, support $0,1,2,\dots$). $3$ is $\bar x$ itself.


@ stat m stat-m-025
T: MLE with measurements of unequal precision
S: estimation-mle
Q: Two instruments measure the same quantity $\mu$. The first reads $10$ with error $N(0,1)$; the second reads $16$ with error $N(0,4)$ (second parameter is the variance). The errors are independent. What is the MLE of $\mu$?
A: $13$
B: $12$
C: $14.8$
D: $11.2$
ANS: D
EXP: $\ell(\mu)=-\dfrac{(10-\mu)^2}{2\cdot1}-\dfrac{(16-\mu)^2}{2\cdot4}$. Setting $\ell'(\mu)=0$: $(10-\mu)+\dfrac{16-\mu}{4}=0$.
So $\hat\mu=\dfrac{10/1+16/4}{1/1+1/4}=\dfrac{14}{1.25}=11.2$: an inverse-variance weighted mean.
$13$ is the plain average, which ignores precision. $12$ weights by $1/\sigma$ instead of $1/\sigma^2$. $14.8$ weights the noisy instrument more, the wrong way round. (Weighted least squares uses the same $1/\sigma_i^2$ weights.)


@ stat m stat-m-026
T: Poisson rate with different exposure times
S: estimation-mle
Q: Three machines are observed for $1$, $2$ and $3$ hours and show $2$, $3$ and $7$ failures. Failures on machine $i$ are Poisson with mean $\lambda t_i$, where $t_i$ is its observation time. What is the MLE of the hourly rate $\lambda$?
A: $1.94$
B: $2$
C: $4$
D: $0.5$
ANS: B
EXP: $\ell(\lambda)=\sum_i\big[y_i\ln(\lambda t_i)-\lambda t_i\big]+\text{const}$, so $\ell'(\lambda)=\dfrac{\sum y_i}{\lambda}-\sum t_i=0$.
$\hat\lambda=\dfrac{\sum y_i}{\sum t_i}=\dfrac{12}{6}=2$ failures per hour: total events over total exposure.
$1.94$ averages the three individual rates $2,\ 1.5,\ 2.33$, which gives a short observation the same weight as a long one. $4$ is the mean count per machine, ignoring exposure.


@ stat m stat-m-027
T: Method of moments for a uniform interval
S: estimation-mle
Q: Data are modelled as $U(a,b)$. The sample mean is $5$ and the sample variance is $3$. What are the method-of-moments estimates of $(a,b)$?
A: $(2,\ 8)$
B: $(3.27,\ 6.73)$
C: $(3.5,\ 6.5)$
D: $(-0.20,\ 10.20)$
ANS: A
EXP: For $U(a,b)$: mean $\frac{a+b}{2}$ and variance $\frac{(b-a)^2}{12}$.
Match: $a+b=10$ and $(b-a)^2=36\Rightarrow b-a=6$. So $a=2$, $b=8$.
$(3.27,6.73)$ uses $(b-a)^2/4$; $(3.5,6.5)$ sets $b-a$ equal to the variance; $(-0.20,10.20)$ treats $3$ as the SD, giving $b-a=3\sqrt{12}$.


@ stat m stat-m-028
T: MLE for a Rayleigh distribution
S: estimation-mle
Q: $X$ has density $f(x;\theta)=\dfrac{x}{\theta}e^{-x^2/(2\theta)}$ for $x>0$. Observations: $1,2,3$. What is the MLE of $\theta$?
A: $\frac{14}{3}$
B: $\frac73$
C: $2$
D: $\frac72$
ANS: B
EXP: $\ell(\theta)=\sum\ln x_i-n\ln\theta-\dfrac{\sum x_i^2}{2\theta}$.
$\ell'(\theta)=-\dfrac n\theta+\dfrac{\sum x_i^2}{2\theta^2}=0\Rightarrow\hat\theta=\dfrac{\sum x_i^2}{2n}=\dfrac{14}{6}=\dfrac73$.
$\frac{14}{3}$ drops the factor $2$ in the exponent. $\frac72$ divides by $2(n-1)$, a variance-style correction that the MLE does not use. $2$ is just $\bar x$.


@ stat m stat-m-029
T: Bias of a shrunken mean
S: bias-variance
Q: $X_1,\dots,X_9$ are iid with mean $\mu=20$. What is the bias of $T=\dfrac{1}{n+1}\sum_{i=1}^n X_i$ as an estimator of $\mu$?
A: $-2$
B: $2$
C: $0$
D: $-\frac{20}{9}$
ANS: A
EXP: $E[T]=\dfrac{n\mu}{n+1}=\dfrac{9\cdot20}{10}=18$, so $\text{Bias}=E[T]-\mu=18-20=-2$.
In general the bias is $-\dfrac{\mu}{n+1}$, which shrinks to 0 as $n$ grows (asymptotically unbiased). $-\frac{20}{9}$ divides by $n$ instead of $n+1$. Its variance $\frac{n\sigma^2}{(n+1)^2}$ is smaller than that of $\bar X$, a small-scale bias–variance trade-off.


@ stat m stat-m-030
T: Correcting the bias of the sample maximum
S: bias-variance
TYPE: nat
TOL: 0.01
Q: $X_1,\dots,X_4$ are iid $U(0,\theta)$ and $M=\max X_i$. Find the constant $c$ such that $cM$ is an unbiased estimator of $\theta$. Give your answer to 2 decimal places.
ANS: 1.25
EXP: $P(M\le m)=(m/\theta)^n$, so $M$ has density $\dfrac{n m^{n-1}}{\theta^n}$ on $(0,\theta)$ and $E[M]=\dfrac{n}{n+1}\theta$.
For $E[cM]=\theta$ we need $c=\dfrac{n+1}{n}=\dfrac54=1.25$.
The maximum always falls short of $\theta$, so it must be scaled up; this is the "German tank" estimator.


@ stat m stat-m-031
T: Effects of increasing the ridge penalty
S: bias-variance
TYPE: msq
Q: In ridge regression, $\hat w_\lambda=\arg\min_w\|y-Xw\|^2+\lambda\|w\|^2$. As $\lambda$ increases from $0$, which of the following happen? More than one option may be correct.
A: The squared bias of the predictions typically increases.
B: The variance of the predictions decreases.
C: The training error decreases.
D: The norm $\|\hat w_\lambda\|$ shrinks toward $0$.
ANS: A,B,D
EXP: The penalty pulls the weights toward 0: $\|\hat w_\lambda\|$ is non-increasing in $\lambda$ and tends to 0 as $\lambda\to\infty$. True.
Shrinking makes the fit less sensitive to the particular training sample, so variance falls; it also moves the fit away from the least-squares solution, so bias typically rises. Both true.
Training error does not decrease: $\lambda=0$ gives the least-squares fit, which minimises training error, so any $\lambda>0$ can only raise it. The hoped-for gain is in test error.


@ stat m stat-m-032
T: Solving the test error decomposition
S: bias-variance
TYPE: nat
TOL: 0.01
Q: At a test point $x_0$, a model's expected squared prediction error is $1.5$. The irreducible noise variance is $0.5$, and the model's bias at $x_0$ is $E[\hat f(x_0)]-f(x_0)=0.4$. What is the variance of $\hat f(x_0)$? Give your answer to 2 decimal places.
ANS: 0.84
EXP: Decomposition: $E\big[(Y-\hat f(x_0))^2\big]=\sigma^2_{\text{noise}}+\text{Bias}^2+\operatorname{Var}(\hat f(x_0))$.
$1.5=0.5+0.4^2+\operatorname{Var}\Rightarrow\operatorname{Var}=1.5-0.5-0.16=0.84$.
Subtracting the bias without squaring it gives $0.6$, a common slip.


@ stat m stat-m-033
T: Relative efficiency of two unbiased estimators
S: bias-variance
Q: $X_1,X_2$ are iid with mean $\mu$ and variance $\sigma^2$. Consider $T_1=\dfrac{X_1+X_2}{2}$ and $T_2=\dfrac{X_1+2X_2}{3}$. What is $\dfrac{\operatorname{Var}(T_2)}{\operatorname{Var}(T_1)}$?
A: $\frac{9}{10}$
B: $\frac{5}{9}$
C: $1$
D: $\frac{10}{9}$
ANS: D
EXP: Both are unbiased (weights sum to 1).
$\operatorname{Var}(T_1)=\tfrac14(\sigma^2+\sigma^2)=\tfrac{\sigma^2}{2}$ and $\operatorname{Var}(T_2)=\tfrac19(\sigma^2+4\sigma^2)=\tfrac{5\sigma^2}{9}$.
Ratio $=\dfrac{5/9}{1/2}=\dfrac{10}{9}>1$, so equal weights are more efficient. Among unbiased linear combinations of iid data, the equal-weight mean has the smallest variance. $\frac59$ is $\operatorname{Var}(T_2)/\sigma^2$, not the ratio.


@ stat m stat-m-034
T: Fixing a large train–validation gap
S: bias-variance
Q: A deep network reaches 2% training error but 20% validation error. Which action is most likely to reduce the validation error?
A: add more input features
B: collect more training data
C: reduce the weight-decay (L2) penalty
D: train for more epochs to push training error lower
ANS: B
EXP: A low training error with a large gap to validation error signals high variance (overfitting).
Remedies reduce variance: more data, stronger regularisation, early stopping, simpler models, or ensembling.
More features, less weight decay and longer training all increase the model's effective flexibility, which widens the gap.


@ stat m stat-m-035
T: t-interval for a mean
S: confidence-intervals
Q: A random sample of $n=16$ from a normal population has $\bar x=30$ and $s=8$. Find the 95% confidence interval for $\mu$. Use $t_{0.025,15}=2.131$ and $t_{0.05,15}=1.753$.
A: $(25.74,\ 34.26)$
B: $(26.08,\ 33.92)$
C: $(12.95,\ 47.05)$
D: $(26.49,\ 33.51)$
ANS: A
EXP: $\sigma$ is unknown, so use $t_{n-1}=t_{15}$. $\text{SE}=\dfrac{s}{\sqrt n}=\dfrac84=2$.
$30\pm2.131\cdot2=30\pm4.262$, giving $(25.74,\ 34.26)$.
$(26.08,33.92)$ uses $z=1.96$, too narrow for $n=16$. $(26.49,33.51)$ uses $t_{0.05}$, which is the 90% value. $(12.95,47.05)$ forgets to divide $s$ by $\sqrt n$.


@ stat m stat-m-036
T: Confidence interval for a proportion
S: confidence-intervals
Q: In a poll of $400$ people, $120$ support a policy. Using the normal approximation and $z_{0.025}=1.96$, what is the 95% confidence interval for the true proportion?
A: $(0.262,\ 0.338)$
B: $(0.246,\ 0.354)$
C: $(0.299,\ 0.301)$
D: $(0.255,\ 0.345)$
ANS: D
EXP: $\hat p=\tfrac{120}{400}=0.3$. $\text{SE}=\sqrt{\dfrac{\hat p(1-\hat p)}{n}}=\sqrt{\dfrac{0.21}{400}}\approx0.0229$.
Margin $=1.96\cdot0.0229\approx0.045$, so the interval is $(0.255,\ 0.345)$.
$(0.262,0.338)$ uses $1.645$ (90%). $(0.246,0.354)$ drops the $(1-\hat p)$ factor. $(0.299,0.301)$ forgets the square root and uses the variance $0.000525$ as the SE.


@ stat m stat-m-037
T: Converting a 95% interval width to 99%
S: confidence-intervals
