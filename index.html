Q: From some data, a 95% $z$-interval for $\mu$ has width $7.84$. What is the width of the 99% $z$-interval from the same data? Use $z_{0.025}=1.96$, $z_{0.005}=2.576$.
A: $8.17$
B: $10.30$
C: $6.58$
D: $13.54$
ANS: B
EXP: Width $=2z\,\sigma/\sqrt n$, so with the same data the width is proportional to $z$.
$7.84\cdot\dfrac{2.576}{1.96}=7.84\cdot1.314\approx10.30$. (Here $2\sigma/\sqrt n=4$.)
$6.58$ scales by $1.645/1.96$, the 90% value, and gives a narrower interval although 99% must be wider. $8.17$ scales by $99/95$. $13.54$ scales by $(2.576/1.96)^2$, as if width grew with $z^2$.


@ stat m stat-m-038
T: Sample size for a proportion, worst case
S: confidence-intervals
TYPE: nat
TOL: 0
Q: You want a 95% confidence interval for a proportion with margin of error at most $0.03$, and you have no prior guess for $p$. Using $z_{0.025}=1.96$ and the normal approximation, what is the minimum sample size? Enter an integer.
ANS: 1068
EXP: The margin is $z\sqrt{p(1-p)/n}$. With no prior guess, use the worst case $p=0.5$, which maximises $p(1-p)=0.25$.
$n\ge\dfrac{z^2\,p(1-p)}{E^2}=\dfrac{1.96^2\cdot0.25}{0.03^2}=\dfrac{0.9604}{0.0009}=1067.1$.
Round up to $1068$; rounding down to $1067$ would give a margin slightly above $0.03$.


@ stat m stat-m-039
T: Recovering sigma from a reported interval
S: confidence-intervals
TYPE: nat
TOL: 0
Q: A 95% confidence interval for $\mu$ with known $\sigma$, based on $n=25$ observations, is $(46.08,\ 53.92)$. Using $z_{0.025}=1.96$, what is $\sigma$? Enter an integer.
ANS: 10
EXP: The margin is half the width: $E=\dfrac{53.92-46.08}{2}=3.92$.
$E=1.96\cdot\dfrac{\sigma}{\sqrt{25}}\Rightarrow3.92=1.96\cdot\dfrac{\sigma}{5}\Rightarrow\sigma=10$.
Forgetting the $\sqrt n$ gives $\sigma=2$, which is the standard error, not the population SD.


@ stat m stat-m-040
T: One-sided lower confidence bound
S: confidence-intervals
Q: Battery lifetimes have known $\sigma=30$ hours. A sample of $36$ batteries has mean $200$ hours. What is the 95% one-sided lower confidence bound for $\mu$ (the value $L$ in the interval $(L,\infty)$)? Use $z_{0.05}=1.645$, $z_{0.025}=1.96$, $z_{0.10}=1.282$.
A: $190.20$
B: $150.65$
C: $191.78$
D: $193.59$
ANS: C
EXP: $\text{SE}=\dfrac{30}{\sqrt{36}}=5$. A one-sided 95% bound puts all 5% in one tail, so it uses $z_{0.05}=1.645$.
$L=200-1.645\cdot5\approx191.78$.
$190.20$ uses $1.96$, the lower end of the two-sided 95% interval (a 97.5% one-sided bound). $193.59$ uses $1.282$, a 90% bound. $150.65$ forgets the $\sqrt n$.


@ stat h stat-h-011
T: Minimiser of total absolute deviation
S: descriptive
Q: For the data $\{1,2,4,7,20\}$, which value of $c$ minimises $\sum_i|x_i-c|$?
A: $6.8$
B: $4$
C: $10.5$
D: $2$
ANS: B
EXP: The sum of absolute deviations is minimised at the median. Moving $c$ to the right of the median increases the distance to more points than it decreases, and vice versa.
Sorted, the median is $4$, and $\sum|x_i-4|=3+2+0+3+16=24$. At the mean $6.8$ the sum is $26.8$.
The mean minimises the sum of squared deviations, not absolute ones. This is why L1 loss (MAE) predicts a conditional median and L2 loss (MSE) a conditional mean; the outlier $20$ drags the mean but not the median.


@ stat h stat-h-012
T: Negative linear transformation of summaries
S: descriptive
TYPE: msq
Q: Each value of a dataset is transformed by $y=-2x+10$. Which of the following are true? More than one option may be correct.
A: $\text{SD}_y=2\,\text{SD}_x$
B: $Q_1(y)=-2\,Q_1(x)+10$
C: $\text{IQR}_y=2\,\text{IQR}_x$
D: Every observation keeps the same z-score.
ANS: A,C
EXP: SD: scaling by $a$ multiplies the SD by $|a|=2$; the shift does nothing. True.
Quartiles: a negative scale reverses the order, so the lower quartile of $y$ comes from the upper quartile of $x$: $Q_1(y)=-2\,Q_3(x)+10$. False in general.
IQR: $Q_3(y)-Q_1(y)=(-2Q_1(x)+10)-(-2Q_3(x)+10)=2\,\text{IQR}_x$. True.
z-scores: $z_y=\dfrac{-2x+10-(-2\bar x+10)}{2s_x}=-z_x$, so the sign flips. False.


@ stat h stat-h-013
T: Variance after removing one observation
S: descriptive
TYPE: nat
TOL: 0.01
Q: A sample of $10$ values has mean $50$ and sample variance $100$ (denominator $n-1$). One value is removed and the mean of the remaining $9$ values is $48$. What is the sample variance (denominator $n-1$) of the remaining 9 values? Give your answer to 2 decimal places.
ANS: 67.5
EXP: Removed value: $10\cdot50-9\cdot48=500-432=68$.
Original $\sum x^2=(n-1)s^2+n\bar x^2=900+25000=25900$. After removal: $25900-68^2=25900-4624=21276$.
New sum of squared deviations: $21276-9\cdot48^2=21276-20736=540$, so $s^2=\dfrac{540}{8}=67.5$.
Check: removing a point at distance $18$ from the mean reduces the sum of squares by $\frac{n}{n-1}\cdot18^2=360$ ($900\to540$). A single far point can carry a large share of the variance.


@ stat h stat-h-014
T: Average speed over equal distances
S: descriptive
Q: A car drives $60$ km at $30$ km/h and then another $60$ km at $60$ km/h. What is its average speed over the whole trip?
A: $45$ km/h
B: $42.4$ km/h
C: $40$ km/h
D: $50$ km/h
ANS: C
EXP: Average speed $=\dfrac{\text{total distance}}{\text{total time}}=\dfrac{120}{2+1}=40$ km/h.
For equal distances this is the harmonic mean $\dfrac{2}{1/30+1/60}=40$. The arithmetic mean $45$ would be right only for equal times; $42.4$ is the geometric mean.
The F1 score is the harmonic mean of precision and recall for the same reason: it is dominated by the smaller value.


@ stat h stat-h-015
T: Min–max scaling of mean and SD
S: descriptive
Q: A feature has mean $40$, SD $8$, minimum $20$ and maximum $70$. It is min–max scaled to $[0,1]$ by $x'=\dfrac{x-\min}{\max-\min}$. What are the mean and SD of $x'$?
A: mean $0.4$, SD $0.16$
B: mean $0.5$, SD $0.16$
C: mean $0.4$, SD $0.0256$
D: mean $0$, SD $1$
ANS: A
EXP: Min–max scaling is the linear map $x'=\dfrac{x-20}{50}$.
Mean: $\dfrac{40-20}{50}=0.4$. SD: $\dfrac{8}{50}=0.16$ (the shift has no effect, the scale divides).
$0.5$ assumes the mean lands in the middle of $[0,1]$, which happens only for symmetric data. $0.0256=0.16^2$ is the variance. Mean $0$, SD $1$ is the result of z-score standardisation, a different scaler.


@ stat h stat-h-016
T: Duplicating every observation
S: descriptive
Q: A sample of $n=5$ values has sample variance $s^2=10$ (denominator $n-1$). Every observation is duplicated, giving $10$ values (as in naive oversampling). What is the new sample variance (denominator $n-1$)?
A: $10$
B: $8$
C: $4.44$
D: $8.89$
ANS: D
EXP: Original sum of squared deviations: $(5-1)\cdot10=40$. Duplicating keeps the mean, and each squared deviation appears twice, so the new sum is $80$.
New $s^2=\dfrac{80}{10-1}\approx8.89$.
The population variance (divide by $n$) is unchanged at $8$, which is why $10$ feels natural, but $s^2$ changes because $n-1$ does not double. $4.44=40/9$ forgets that the deviations are duplicated too. Duplicated rows also make the data look more certain than it is: the SE of the mean drops by $\sqrt2$ with no new information.


@ stat h stat-h-017
T: Upper 5% point of the sample variance
S: sampling-distributions
Q: $X_1,\dots,X_{11}$ are iid $N(\mu,4)$ (second parameter is the variance). Find $c$ such that $P(S^2>c)=0.05$, where $S^2$ uses denominator $n-1$. Use $\chi^2_{0.05,10}=18.307$ and $\chi^2_{0.05,11}=19.675$ (upper-tail points).
A: $7.15$
B: $6.66$
C: $7.32$
D: $3.66$
ANS: C
EXP: $\dfrac{(n-1)S^2}{\sigma^2}=\dfrac{10S^2}{4}\sim\chi^2_{10}$.
$P(S^2>c)=P\left(\chi^2_{10}>\tfrac{10c}{4}\right)=0.05\Rightarrow\tfrac{10c}{4}=18.307\Rightarrow c=7.32$.
$7.15=4\cdot19.675/11$ uses $n$ instead of $n-1$ for the df. $6.66$ mixes the right table value with the wrong multiplier $n$. $3.66$ uses $\sigma=2$ instead of $\sigma^2=4$.


@ stat h stat-h-018
T: Facts about normal sample mean and variance
S: sampling-distributions
TYPE: msq
Q: $X_1,\dots,X_n$ are iid $N(\mu,\sigma^2)$ with $n\ge2$. Which of the following are true? More than one option may be correct.
A: $\bar X$ and $S^2$ are independent.
B: $\dfrac{(n-1)S^2}{\sigma^2}\sim\chi^2_{n-1}$.
C: $\dfrac{\bar X-\mu}{S/\sqrt n}\sim N(0,1)$ exactly.
D: $\dfrac{1}{\sigma^2}\sum_{i=1}^n(X_i-\mu)^2\sim\chi^2_{n-1}$.
ANS: A,B
EXP: Independence of $\bar X$ and $S^2$ is a special property of the normal distribution (Cochran's theorem). True; it is what makes the $t$ statistic work.
$(n-1)S^2/\sigma^2\sim\chi^2_{n-1}$: true; one df is lost to estimating $\mu$ by $\bar X$.
With $S$ in place of $\sigma$ the ratio is $t_{n-1}$, not $N(0,1)$; it only approaches $N(0,1)$ as $n\to\infty$. False.
$\sum(X_i-\mu)^2/\sigma^2$ uses the true $\mu$, so it is a sum of $n$ squared standard normals: $\chi^2_n$, not $\chi^2_{n-1}$. False.


@ stat h stat-h-019
T: CLT for a sum of uniforms
S: sampling-distributions
Q: $U_1,\dots,U_{48}$ are iid $U(0,1)$. Using the central limit theorem, approximate $P\left(\sum U_i>26\right)$. Use $\Phi(1)=0.8413$, $\Phi(0.5)=0.6915$, $\Phi(0.58)=0.7190$.
A: $0.1587$
B: $0.3085$
C: $0.281$
D: $0.8413$
ANS: A
EXP: For $U(0,1)$: mean $\tfrac12$, variance $\tfrac1{12}$. The sum has mean $24$ and variance $\tfrac{48}{12}=4$, so SD $2$.
$P(S>26)\approx P\left(Z>\tfrac{26-24}{2}\right)=P(Z>1)=0.1587$.
$0.3085$ divides by the variance $4$ instead of the SD. $0.281$ uses $\operatorname{Var}(U)=\tfrac14$ (SD $\approx3.46$, $z\approx0.58$). $0.8413$ is the left tail.


@ stat h stat-h-020
T: Finite population correction
S: sampling-distributions
Q: A sample of $n=36$ is drawn without replacement from a population of $N=100$ with $\sigma=12$. Using the finite population correction $\sqrt{\frac{N-n}{N-1}}$, what is the standard error of $\bar X$ (to 2 decimal places)?
A: $2$
B: $1.61$
C: $1.21$
D: $1.29$
ANS: B
EXP: Without replacement, $\text{SE}=\dfrac{\sigma}{\sqrt n}\sqrt{\dfrac{N-n}{N-1}}=2\sqrt{\dfrac{64}{99}}\approx2\cdot0.804=1.61$.
$2$ ignores the correction; that is right for sampling with replacement or when $N\gg n$, but here a third of the population is sampled. $1.21$ uses the sampled fraction, $\sqrt{36/99}$, where the unsampled fraction $\frac{N-n}{N-1}$ belongs. $1.29$ forgets the square root on the correction factor. (The simpler factor $\sqrt{1-n/N}$, used when $N$ is large, would give $1.60$; that is why the question names the factor.)


@ stat h stat-h-021
T: Square of a t variable
S: sampling-distributions
Q: $T\sim t_9$. What is the distribution of $T^2$?
A: $\chi^2_1$
B: $F(1,9)$
C: $\chi^2_9$
D: $F(9,1)$
ANS: B
EXP: $T=\dfrac{Z}{\sqrt{V/9}}$ with $V\sim\chi^2_9$, so $T^2=\dfrac{Z^2/1}{V/9}$.
$Z^2\sim\chi^2_1$, so this is a ratio of independent chi-squareds over their df: $F(1,9)$ (numerator df first).
$\chi^2_1$ would be right only if the denominator were exactly 1, i.e. $\sigma$ known. This is why a two-sided $t$-test and an $F$-test with 1 numerator df give the same p-value.


@ stat h stat-h-022
T: Sample mean of Cauchy data
S: sampling-distributions
Q: $X_1,\dots,X_n$ are iid standard Cauchy (density $\frac{1}{\pi(1+x^2)}$). What is the distribution of $\bar X$?
A: approximately $N(0,1/n)$ for large $n$
B: Cauchy with scale $1/n$
C: $t_{n-1}$
D: standard Cauchy, for every $n$
ANS: D
EXP: The Cauchy characteristic function is $e^{-|t|}$. For the mean, $\varphi_{\bar X}(t)=\left(e^{-|t|/n}\right)^n=e^{-|t|}$, so $\bar X$ is again standard Cauchy.
The CLT does not apply because the Cauchy distribution has no finite mean or variance. Averaging more data does not concentrate $\bar X$ at all.
A scale of $1/n$ would be right for a sum divided by $n^2$. With heavy-tailed data, robust statistics such as the median behave far better than the mean.


@ stat h stat-h-023
T: Expected minimum of exponential lifetimes
S: sampling-distributions
Q: Five components have independent Exponential lifetimes, each with rate $2$ per year. A system fails when the first component fails. What is the expected time to system failure (in years)?
A: $0.1$
B: $0.5$
C: $2.5$
D: $10$
ANS: A
EXP: $P(\min X_i>t)=\prod P(X_i>t)=(e^{-2t})^5=e^{-10t}$, so the minimum is Exponential with rate $5\cdot2=10$.
Its mean is $\frac1{10}=0.1$ years.
$0.5$ is the mean of a single component. $10$ is the rate of the minimum, not its mean. $2.5=5/2$ multiplies the single mean by $n$ instead of dividing.


@ stat h stat-h-024
T: Non-unique MLE for a shifted uniform
S: estimation-mle
TYPE: msq
Q: $X_1,\dots,X_n$ are iid $U(\theta,\theta+1)$. The observations are $2.3,\ 2.9,\ 2.6$. Which of the following values are maximum likelihood estimates of $\theta$? More than one option may be correct.
A: $2.3$
B: $1.9$
C: $2.1$
D: $2.4$
ANS: A,B,C
EXP: The likelihood is $1$ if every $x_i\in[\theta,\theta+1]$ and $0$ otherwise.
This needs $\theta\le\min x_i=2.3$ and $\theta+1\ge\max x_i=2.9$, i.e. $\theta\in[1.9,\ 2.3]$. Every value in this interval maximises the likelihood, so the MLE is not unique.
$2.3$, $1.9$ and $2.1$ (which is also the method-of-moments estimate $\bar x-\tfrac12$) all lie in it. $2.4>\min x_i$, so it would leave $2.3$ outside the support: likelihood $0$.


@ stat h stat-h-025
T: MLE of the zero probability for Poisson data
S: estimation-mle
Q: Counts $0,1,0,3,2,4,1,5$ are modelled as iid Poisson$(\lambda)$. What is the MLE of $P(X=0)$?
A: $0.25$
B: $0.135$
C: $0.5$
D: $0.368$
ANS: B
EXP: $\hat\lambda=\bar x=\frac{16}{8}=2$. By the invariance property, the MLE of $P(X=0)=e^{-\lambda}$ is $e^{-\hat\lambda}=e^{-2}\approx0.135$.
$0.25$ is the observed fraction of zeros. It is a valid estimate but not the MLE under the Poisson model, which uses all the counts, not just the zeros. $0.368=e^{-1}$ and $0.5=1/\hat\lambda$ plug in the wrong quantity.


@ stat h stat-h-026
T: Exponential rate with censored data
S: estimation-mle
Q: Five devices with Exponential$(\lambda)$ lifetimes are tested. Three fail at times $2$, $3$ and $5$. The other two are still working when the test stops at time $10$ (right-censored). What is the MLE of $\lambda$?
A: $0.3$
B: $\frac16$
C: $0.1$
D: $10$
ANS: C
EXP: A failure at $t$ contributes $\lambda e^{-\lambda t}$; a censored unit contributes $P(T>10)=e^{-10\lambda}$.
$\ell(\lambda)=3\ln\lambda-\lambda(2+3+5+10+10)=3\ln\lambda-30\lambda\Rightarrow\hat\lambda=\dfrac{3}{30}=0.1$.
Rule: number of failures divided by total time on test. $0.3$ discards the censored units, which overstates the failure rate. $\frac16$ treats the censored times as failures. $10$ is the MLE of the mean lifetime $1/\lambda$, not the rate.


@ stat h stat-h-027
T: Asymptotic standard error of an MLE
S: estimation-mle
Q: $n=100$ observations from Exponential$(\lambda)$ have $\bar x=0.5$. Using the Fisher information, what is the approximate standard error of the MLE $\hat\lambda$?
A: $0.04$
B: $0.05$
C: $0.02$
D: $0.2$
ANS: D
EXP: $\hat\lambda=1/\bar x=2$. Per observation, $\ln f=\ln\lambda-\lambda x$, so $-\dfrac{\partial^2}{\partial\lambda^2}\ln f=\dfrac1{\lambda^2}$ and $I(\lambda)=\dfrac{1}{\lambda^2}$.
Asymptotically $\operatorname{Var}(\hat\lambda)\approx\dfrac{1}{nI(\lambda)}=\dfrac{\lambda^2}{n}$, so $\text{SE}\approx\dfrac{\hat\lambda}{\sqrt n}=\dfrac{2}{10}=0.2$.
$0.04$ is the variance, not the SE. $0.05=\bar x/\sqrt n$ is the SE of $\bar x$, the estimate of the mean $1/\lambda$, not of $\lambda$.


@ stat h stat-h-028
T: Allele frequency by maximum likelihood
S: estimation-mle
Q: Under Hardy–Weinberg equilibrium, genotypes AA, Aa, aa have probabilities $\theta^2$, $2\theta(1-\theta)$, $(1-\theta)^2$. A sample of 100 individuals has 50 AA, 40 Aa and 10 aa. What is the MLE of $\theta$?
A: $0.7$
B: $0.5$
C: $0.707$
D: $0.9$
ANS: A
EXP: $\ell(\theta)=50\cdot2\ln\theta+40\left[\ln\theta+\ln(1-\theta)\right]+10\cdot2\ln(1-\theta)+\text{const}=140\ln\theta+60\ln(1-\theta)+\text{const}$.
$\ell'=0\Rightarrow\hat\theta=\dfrac{140}{200}=0.7$: count the A alleles ($2$ per AA, $1$ per Aa) out of $200$ alleles.
$0.5$ is the fraction of AA individuals, and $0.707=\sqrt{0.5}$ uses only the AA count. Both ignore the information in the Aa and aa counts. $0.9$ counts everyone carrying an A.


@ stat h stat-h-029
T: MSE-optimal shrinkage of the sample mean
S: bias-variance
TYPE: nat
TOL: 0.01
Q: $X_1,\dots,X_4$ are iid with mean $\mu=2$ and variance $\sigma^2=4$. Among estimators of the form $c\bar X$, which $c$ minimises the MSE for estimating $\mu$? Give your answer to 2 decimal places.
ANS: 0.8
EXP: $E[c\bar X]=c\mu$ and $\operatorname{Var}(c\bar X)=c^2\sigma^2/n$, so $\text{MSE}(c)=c^2\dfrac{\sigma^2}{n}+(c-1)^2\mu^2$.
Setting the derivative to 0: $c\dfrac{\sigma^2}{n}+(c-1)\mu^2=0\Rightarrow c^*=\dfrac{\mu^2}{\mu^2+\sigma^2/n}=\dfrac{4}{4+1}=0.8$.
MSE at $c=0.8$: $0.64+0.16=0.8$, below the unbiased choice $c=1$ (MSE $1$). Shrinking toward 0 trades a little bias for a larger cut in variance, the idea behind ridge regression. (In practice $c^*$ depends on the unknown $\mu$, so it has to be estimated.)


@ stat h stat-h-030
T: MSE of the normal-variance MLE
S: bias-variance
Q: $X_1,\dots,X_5$ are iid $N(\mu,1)$. What is the MSE of the MLE $\hat\sigma^2=\frac1n\sum(X_i-\bar X)^2$ as an estimator of $\sigma^2=1$?
A: $0.5$
B: $0.32$
C: $0.36$
D: $0.04$
ANS: C
EXP: $n\hat\sigma^2/\sigma^2\sim\chi^2_{n-1}$, so $E[\hat\sigma^2]=\tfrac{n-1}{n}=0.8$ and $\operatorname{Var}(\hat\sigma^2)=\tfrac{2(n-1)}{n^2}=\tfrac{8}{25}=0.32$.
$\text{Bias}=-0.2$, so $\text{MSE}=0.04+0.32=0.36$.
$0.5=\tfrac{2}{n-1}$ is the MSE of the unbiased $S^2$. So the biased MLE has the smaller MSE. $0.32$ and $0.04$ are only the variance and only the squared bias.


@ stat h stat-h-031
T: Unbiasedness of nonlinear estimators
S: bias-variance
TYPE: msq
Q: $X_1,\dots,X_n$ are iid with mean $\mu$ and variance $\sigma^2>0$, $n\ge2$. $S^2$ is the sample variance with denominator $n-1$. Which of the following are true? More than one option may be correct.
A: $S^2$ is unbiased for $\sigma^2$.
B: $S$ is unbiased for $\sigma$.
C: $\bar X^2$ is unbiased for $\mu^2$.
D: $\bar X^2-\dfrac{S^2}{n}$ is unbiased for $\mu^2$.
ANS: A,D
EXP: $E[S^2]=\sigma^2$ for any distribution with finite variance. True.
$S=\sqrt{S^2}$ and $\sqrt{\cdot}$ is strictly concave, so by Jensen $E[S]<\sqrt{E[S^2]}=\sigma$ (strict since $S^2$ is not constant). False.
$E[\bar X^2]=\operatorname{Var}(\bar X)+\mu^2=\mu^2+\dfrac{\sigma^2}{n}$, biased upward. False.
$E\left[\bar X^2-\tfrac{S^2}{n}\right]=\mu^2+\tfrac{\sigma^2}{n}-\tfrac{\sigma^2}{n}=\mu^2$. True.
Unbiasedness does not survive nonlinear transformations, unlike the invariance property of MLEs.


@ stat h stat-h-032
T: Test error of k-nearest-neighbour regression
S: bias-variance
TYPE: nat
TOL: 0.01
Q: Data follow $Y=f(x)+\varepsilon$ with $\operatorname{Var}(\varepsilon)=1$, and the training inputs are fixed. A $k$-NN regressor with $k=4$ predicts at $x_0$ by averaging the training $Y$ values of its 4 nearest neighbours. The average of $f$ at those neighbours differs from $f(x_0)$ by $0.5$. What is the expected squared error $E\big[(Y_0-\hat f(x_0))^2\big]$ for a new response $Y_0$ at $x_0$? Give your answer to 2 decimal places.
ANS: 1.5
EXP: Decompose: noise $+$ bias$^2$ $+$ variance.
Noise: $\operatorname{Var}(\varepsilon)=1$. Bias: $0.5$, so bias$^2=0.25$. Variance: the prediction averages $k$ independent noise terms, so $\operatorname{Var}(\hat f(x_0))=\dfrac{1}{k}=0.25$.
Total $=1+0.25+0.25=1.5$.
Raising $k$ shrinks the variance $\sigma^2/k$ but pulls in farther neighbours, which usually increases the bias: $k$ is the bias–variance dial for $k$-NN.


@ stat h stat-h-033
T: Variance of a bagged ensemble
S: bias-variance
Q: An ensemble averages the predictions of $B=10$ models. Each model's prediction has variance $1$, and every pair of models has correlation $0.2$. What is the variance of the ensemble's prediction?
A: $0.1$
B: $0.2$
C: $0.28$
D: $1$
ANS: C
EXP: $\operatorname{Var}\left(\tfrac1B\sum f_b\right)=\dfrac{1}{B^2}\left[B\sigma^2+B(B-1)\rho\sigma^2\right]=\rho\sigma^2+\dfrac{(1-\rho)\sigma^2}{B}$.
$=0.2+\dfrac{0.8}{10}=0.28$.
$0.1=\sigma^2/B$ assumes independent models. $0.2$ is the limit as $B\to\infty$: correlation sets a floor that more models cannot remove. Random forests reduce $\rho$ by subsampling features at each split.


@ stat h stat-h-034
T: MSE of a one-dimensional ridge estimate
S: bias-variance
Q: In $y_i=wx_i+\varepsilon_i$ with $\varepsilon_i$ iid with variance $1$, the inputs are fixed with $\sum x_i^2=8$, and the true $w=1$. The ridge estimate is $\hat w=\dfrac{\sum x_iy_i}{\sum x_i^2+\lambda}$ with $\lambda=2$. What is the MSE of $\hat w$?
A: $0.125$
B: $0.12$
C: $0.08$
D: $0.04$
ANS: B
EXP: $E[\hat w]=\dfrac{w\sum x_i^2}{\sum x_i^2+\lambda}=\dfrac{8}{10}=0.8$, so bias $=-0.2$ and bias$^2=0.04$.
$\operatorname{Var}(\hat w)=\dfrac{\sigma^2\sum x_i^2}{(\sum x_i^2+\lambda)^2}=\dfrac{8}{100}=0.08$.
$\text{MSE}=0.04+0.08=0.12$, slightly below the unbiased OLS estimate, whose MSE is its variance $\dfrac{1}{8}=0.125$.
$0.08$ and $0.04$ are only the variance and only the squared bias.


@ stat h stat-h-035
T: Confidence interval for a normal variance
S: confidence-intervals
Q: A sample of $n=10$ from a normal population has $s^2=20$. Find the 95% confidence interval for $\sigma^2$. Use the upper-tail points $\chi^2_{0.025,9}=19.023$, $\chi^2_{0.975,9}=2.700$, $\chi^2_{0.025,10}=20.483$, $\chi^2_{0.975,10}=3.247$.
A: $(9.46,\ 66.67)$
B: $(9.76,\ 61.60)$
C: $(6.00,\ 42.27)$
D: $(3.08,\ 8.16)$
ANS: A
EXP: Pivot: $\dfrac{(n-1)S^2}{\sigma^2}\sim\chi^2_9$. Solving $2.700\le\dfrac{180}{\sigma^2}\le19.023$ for $\sigma^2$:
$\left(\dfrac{180}{19.023},\ \dfrac{180}{2.700}\right)=(9.46,\ 66.67)$. The interval is not symmetric about $s^2=20$ because $\chi^2$ is skewed.
$(9.76,61.60)$ uses $n=10$ in both the multiplier and the df. $(6.00,42.27)$ multiplies by the table values instead of dividing. $(3.08,8.16)$ is the interval for $\sigma$, not $\sigma^2$.


@ stat h stat-h-036
T: Confidence intervals and two-sided tests
S: confidence-intervals
TYPE: msq
Q: From one sample, a 95% two-sided $z$-interval for $\mu$ is $(12.1,\ 17.9)$. Which of the following are true? More than one option may be correct.
A: A two-sided $z$-test of $H_0:\mu=18$ at $\alpha=0.05$ on the same data rejects $H_0$.
B: A two-sided $z$-test of $H_0:\mu=15$ at $\alpha=0.05$ on the same data does not reject $H_0$.
C: The 99% $z$-interval from the same data contains the whole interval $(12.1,\ 17.9)$.
D: $P(12.1<\mu<17.9)=0.95$.
ANS: A,B,C
EXP: Duality: a two-sided test at level $\alpha$ rejects $H_0:\mu=\mu_0$ exactly when $\mu_0$ lies outside the $(1-\alpha)$ interval.
$18$ is outside, so it is rejected: true. $15$ is inside, so it is not rejected: true.
The 99% interval has the same centre and a larger $z$ ($2.576$ vs $1.96$), so it contains the 95% one: true.
$\mu$ is a fixed constant, so once the interval is computed it either contains $\mu$ or not; the 95% describes the procedure over repeated samples. False.


@ stat h stat-h-037
T: Exact interval for an exponential rate
S: confidence-intervals
Q: $X_1,\dots,X_5$ are iid Exponential$(\lambda)$ with $\sum x_i=20$. Using the fact that $2\lambda\sum X_i\sim\chi^2_{10}$, find the 95% confidence interval for $\lambda$. Upper-tail points: $\chi^2_{0.975,10}=3.247$, $\chi^2_{0.025,10}=20.483$.
A: $(0.162,\ 1.024)$
B: $(0.031,\ 0.469)$
C: $(0.081,\ 0.512)$
D: $(3.247,\ 20.483)$
ANS: C
EXP: $P\left(3.247\le2\lambda\cdot20\le20.483\right)=0.95$, so $\lambda\in\left(\dfrac{3.247}{40},\ \dfrac{20.483}{40}\right)=(0.081,\ 0.512)$.
The interval is skewed around $\hat\lambda=0.25$, as it should be for a positive rate.
$(0.162,1.024)$ forgets the factor $2$. $(0.031,0.469)$ is the normal approximation $\hat\lambda\pm1.96\,\hat\lambda/\sqrt n$, which is poor for $n=5$. $(3.247,20.483)$ is the interval for the pivot $40\lambda$, not for $\lambda$.


@ stat h stat-h-038
T: Bonferroni critical value for joint intervals
S: confidence-intervals
Q: You report two-sided $z$-intervals for 3 different means and want all three to cover their true means simultaneously with probability at least 95%. Using the Bonferroni correction, which critical value should each interval use? $z_{0.025}=1.96$, $z_{0.0167}=2.128$, $z_{0.00833}=2.394$, $z_{0.005}=2.576$.
A: $2.394$
B: $1.96$
C: $2.128$
D: $2.576$
ANS: A
EXP: Bonferroni: $P(\text{some interval misses})\le\sum P(\text{miss}_j)$. Giving each interval miss probability $0.05/3$ keeps the total at most $0.05$.
Each interval is then a two-sided $(1-0.05/3)$ interval, with $\tfrac{0.05}{6}\approx0.00833$ in each tail: $z_{0.00833}=2.394$.
$2.128$ puts all $0.05/3$ in one tail, forgetting the two-sided split. $1.96$ ignores the multiplicity: for three independent intervals the joint coverage is only $0.95^3\approx0.86$.


@ stat h stat-h-039
T: Overlapping intervals and a difference in means
S: confidence-intervals
Q: Two independent groups have sample means $10$ and $13$, each with standard error $1$. Their individual 95% intervals are $(8.04,\ 11.96)$ and $(11.04,\ 14.96)$, which overlap. Using $z_{0.025}=1.96$, which statement is correct?
A: The 95% CI for the difference is $(-0.92,\ 6.92)$, so the difference is not significant at 5%.
B: The 95% CI for the difference is $(0.23,\ 5.77)$, so the difference is significant at 5%.
C: Because the two intervals overlap, the difference is not significant at 5%.
D: The 95% CI for the difference is $(1.04,\ 4.96)$, so the difference is significant at 5%.
ANS: B
EXP: $\text{SE}(\bar X_2-\bar X_1)=\sqrt{1^2+1^2}=\sqrt2\approx1.414$, so the interval is $3\pm1.96\cdot1.414=3\pm2.77=(0.23,\ 5.77)$. It excludes 0, so the difference is significant.
Overlap is a much stricter criterion: it amounts to adding the margins $1.96+1.96$ instead of combining them as $1.96\sqrt2$. That is the $(-0.92,6.92)$ interval. Overlapping intervals do not imply "no significant difference".
$(1.04,4.96)$ uses SE $1$, forgetting that both means are uncertain.


@ stat h stat-h-040
T: Upper bound when no events are observed
S: confidence-intervals
Q: A model makes $0$ critical errors in $300$ independent test cases. What is an approximate 95% one-sided upper confidence bound for its true error rate $p$? (Use the exact condition $(1-p)^{300}=0.05$ and $\ln0.05\approx-3$.)
A: $0$
B: $0.0033$
C: $0.0065$
D: $0.01$
ANS: D
EXP: The upper bound is the largest $p$ for which seeing 0 errors still has probability at least $0.05$: $(1-p)^{300}=0.05$.
Taking logs: $300\ln(1-p)=\ln0.05\approx-3$, and $\ln(1-p)\approx-p$, so $p\approx\frac{3}{300}=0.01$ (exactly $0.00994$). This is the "rule of three".
The Wald interval $\hat p\pm1.96\sqrt{\hat p(1-\hat p)/n}$ collapses to $[0,0]$ because $\hat p=0$, absurdly claiming certainty. $0.0033=1/300$ is a point-estimate-style guess, not a 95% bound.

@ stat e stat-e-029
T: One-sample z statistic with known sigma
S: z-test
TYPE: nat
TOL: 0.01
Q: A machine fills bags with known standard deviation $\sigma=10$ g. A sample of $n=100$ bags has mean $\bar x=52$ g. For testing $H_0:\mu=50$, what is the value of the $z$ statistic? Enter the number.
ANS: 2
EXP: Rule: $z=\dfrac{\bar x-\mu_0}{\sigma/\sqrt n}$.
Standard error $=10/\sqrt{100}=1$, so $z=\dfrac{52-50}{1}=2$.
Forgetting the $\sqrt n$ (dividing by $\sigma$ alone) gives $0.2$, which ignores that a mean of 100 values varies much less than one value.

@ stat e stat-e-030
T: Power from the Type II error rate
S: z-test
Q: A test has Type II error probability $\beta=0.2$ at a particular alternative, and significance level $\alpha=0.05$. What is its power at that alternative?
A: $0.2$
B: $0.95$
C: $0.8$
D: $0.05$
ANS: C
EXP: Power is the probability of rejecting $H_0$ when the alternative is true: power $=1-\beta=1-0.2=0.8$.
$0.95=1-\alpha$ is the probability of correctly keeping $H_0$ when it is true, a different quantity. $\beta$ itself is the miss rate.

@ stat e stat-e-031
T: Same z value, one-sided vs two-sided decision
S: z-test
Q: A z-test gives $z=1.80$. Use $z_{0.05}=1.645$ and $z_{0.025}=1.96$. At $\alpha=0.05$, which statement is correct?
A: $H_0$ is rejected by the two-sided test but not by the one-sided test $H_1:\mu>\mu_0$
B: $H_0$ is rejected by the one-sided test $H_1:\mu>\mu_0$ but not by the two-sided test
C: $H_0$ is rejected by both tests
D: $H_0$ is rejected by neither test
ANS: B
EXP: One-sided test ($H_1:\mu>\mu_0$): reject if $z>z_{0.05}=1.645$. Since $1.80>1.645$, reject.
Two-sided test: the $0.05$ is split into two tails, so reject if $|z|>z_{0.025}=1.96$. Since $1.80<1.96$, do not reject.
The one-sided test puts all of $\alpha$ in one tail, so its cut-off is lower. That is why the direction must be fixed before seeing the data.

@ stat e stat-e-032
T: One-sample t statistic
S: t-test
Q: A sample of $n=16$ values has mean $\bar x=12$ and sample standard deviation $s=4$. What is the $t$ statistic for testing $H_0:\mu=10$?
A: $0.5$
B: $8$
C: $0.125$
D: $2$
ANS: D
EXP: Rule: $t=\dfrac{\bar x-\mu_0}{s/\sqrt n}$, with $n-1=15$ degrees of freedom.
Standard error $=4/\sqrt{16}=1$, so $t=\dfrac{12-10}{1}=2$.
$0.5$ forgets the $\sqrt n$ (divides by $s$). $8$ divides by $s/n$ in place of $s/\sqrt n$. $0.125$ divides by the variance $s^2$.

@ stat e stat-e-033
T: Degrees of freedom of a pooled two-sample t-test
S: t-test
Q: A pooled (equal-variance) two-sample $t$-test compares groups of sizes $n_1=10$ and $n_2=12$. How many degrees of freedom does the test statistic have?
A: $20$
B: $21$
C: $22$
D: $9$
ANS: A
EXP: The pooled variance uses $n_1-1$ degrees of freedom from group 1 and $n_2-1$ from group 2 (one mean is estimated in each group).
df $=(n_1-1)+(n_2-1)=n_1+n_2-2=9+11=20$.
$21$ subtracts only one, as if a single mean had been estimated. $22$ subtracts nothing.

@ stat e stat-e-034
T: When to use t in place of z
S: t-test
Q: A sample of $n=12$ comes from a normal population. When should a $t$-test be used in place of a $z$-test for the mean?
A: When the population standard deviation is unknown and is estimated by the sample standard deviation $s$
B: When the population standard deviation is known
C: When the population is not normal and $n$ is small
D: When the alternative hypothesis is two-sided
ANS: A
EXP: If $\sigma$ is known, $\dfrac{\bar X-\mu}{\sigma/\sqrt n}$ is exactly standard normal, so a $z$-test applies.
If $\sigma$ is replaced by the estimate $s$, the extra uncertainty in $s$ makes the statistic follow a $t$ distribution with $n-1$ degrees of freedom, which has heavier tails.
The $t$-test also needs normal data when $n$ is small, so a small non-normal sample is not the reason to use it. One- or two-sided alternatives can be used with either test.

@ stat e stat-e-035
T: Choosing a test for before-and-after data
S: t-test
Q: The blood pressure of the same $12$ patients is measured before and after a drug. The population SD is unknown. Which test, with how many degrees of freedom, fits best?
A: Pooled two-sample $t$-test with $22$ degrees of freedom
B: Paired $t$-test with $12$ degrees of freedom
C: Paired $t$-test with $11$ degrees of freedom
D: Two-sample $z$-test
ANS: C
EXP: The two measurements come from the same patients, so they are dependent. Take the 12 differences $d_i=\text{after}_i-\text{before}_i$ and run a one-sample $t$-test on them.
That is the paired $t$-test, with df $=n-1=12-1=11$.
A two-sample test with $22$ df treats the groups as independent, which ignores the pairing and usually loses a lot of power.

@ stat e stat-e-036
T: Expected count in a contingency table
S: chi-squared-test
Q: In a chi-square test of independence on a table with grand total $n=120$, a cell lies in a row with total $40$ and a column with total $30$. What is its expected count under independence?
A: $35$
B: $\frac{1}{12}$
C: $40$
D: $10$
ANS: D
EXP: Under independence, $P(\text{row}\cap\text{col})=P(\text{row})P(\text{col})$, so
$E=n\cdot\dfrac{40}{120}\cdot\dfrac{30}{120}=\dfrac{40\times30}{120}=10$.
$\frac1{12}$ is the expected cell probability, not the count: it still has to be multiplied by $n$.

@ stat e stat-e-037
T: Degrees of freedom for a fair-die goodness-of-fit
S: chi-squared-test
Q: A die is rolled $300$ times and the six face counts are compared with the counts expected for a fair die using a chi-square goodness-of-fit test. How many degrees of freedom does the test have?
A: $6$
B: $5$
C: $299$
D: $4$
ANS: B
EXP: Goodness of fit: df $=k-1-m$, where $k$ is the number of categories and $m$ the number of parameters estimated from the data.
Here $k=6$ and nothing is estimated (the fair-die probabilities are fully specified), so df $=6-1=5$.
The $-1$ is because the counts must add to $300$. $299$ wrongly uses the number of rolls.

@ stat e stat-e-038
T: Chi-square statistic for 60 heads in 100 tosses
S: chi-squared-test
Q: A coin is tossed $100$ times and gives $60$ heads. What is the chi-square goodness-of-fit statistic for $H_0$: the coin is fair?
A: $2$
B: $4$
C: $200$
D: $0.4$
ANS: B
EXP: Expected counts: $50$ heads, $50$ tails. Rule: $\chi^2=\sum\dfrac{(O-E)^2}{E}$ over all categories.
$\chi^2=\dfrac{(60-50)^2}{50}+\dfrac{(40-50)^2}{50}=2+2=4$.
$2$ uses only the heads cell. Both categories must be included. $200$ forgets to divide by $E$.

@ stat e stat-e-039
T: Rejection region of a chi-square test
S: chi-squared-test
Q: A chi-square test of independence with $2$ degrees of freedom gives $\chi^2=7.2$. Given $\chi^2_{0.05,2}=5.991$ (upper 5% point) and $\chi^2_{0.025,2}=7.378$, what is the decision at $\alpha=0.05$?
A: Do not reject $H_0$, because the test is two-tailed and $7.2<7.378$
B: Do not reject $H_0$, because a large $\chi^2$ supports independence
C: Reject $H_0$, because $7.2>5.991$
D: Reject $H_0$, because $7.2>1.96$
ANS: C
EXP: The statistic $\sum (O-E)^2/E$ grows when the observed counts move away from the expected ones, so only large values count against $H_0$. The test is right-tailed: reject if $\chi^2>\chi^2_{0.05,2}=5.991$.
$7.2>5.991$, so reject independence.
Splitting $\alpha$ into two tails (the $7.378$ cut-off) is a habit carried over from $z$- and $t$-tests, and does not apply here. $1.96$ is a normal quantile and has nothing to do with this test.

@ stat e stat-e-040
T: Reading a regression slope
S: regression-correlation
Q: A fitted regression line is $\hat y=3+2x$. If $x$ increases by $5$, by how much does the predicted $y$ change?
A: $13$
B: $2.5$
C: $5$
D: $10$
ANS: D
EXP: The slope is the change in $\hat y$ per unit change in $x$. A change of $\Delta x=5$ gives $\Delta\hat y=2\times5=10$.
$13=3+2\cdot5$ is the predicted value at $x=5$, not the change. The intercept cancels when you take differences.

@ stat e stat-e-041
T: R squared from a negative correlation
S: regression-correlation
Q: In simple linear regression (one predictor, with intercept) the sample correlation is $r=-0.6$. What is $R^2$?
A: $0.36$
B: $-0.36$
C: $0.6$
D: $-0.6$
ANS: A
EXP: For simple linear regression with an intercept, $R^2=r^2=(-0.6)^2=0.36$: the line explains 36% of the variance of $y$.
$R^2$ is a fraction of variance, so it cannot be negative. The sign of $r$ tells you only the direction of the slope.

@ stat e stat-e-042
T: Correlation after linear transformations
S: regression-correlation
Q: The correlation between $X$ and $Y$ is $0.7$. Let $U=2X+3$ and $V=-Y+1$. What is the correlation between $U$ and $V$?
A: $0.7$
B: $-0.7$
C: $-1.4$
D: $1.4$
ANS: B
EXP: Correlation ignores shifts and positive rescaling: $\text{corr}(aX+b,cY+d)=\text{sign}(ac)\,\text{corr}(X,Y)$.
Here $a=2>0$ and $c=-1<0$, so the sign flips: $\text{corr}(U,V)=-0.7$.
Correlation always lies in $[-1,1]$, so $\pm1.4$ is impossible. Multiplying by 2 changes the covariance but also the SD, so the factor cancels.

@ stat e stat-e-043
T: Beta–Binomial posterior parameters
S: bayesian-inference
Q: A coin's heads probability $\theta$ has prior $\text{Beta}(2,2)$. In $10$ tosses you see $7$ heads and $3$ tails. What is the posterior distribution of $\theta$?
A: $\text{Beta}(7,3)$
B: $\text{Beta}(5,9)$
C: $\text{Beta}(9,5)$
D: $\text{Beta}(9,3)$
ANS: C
EXP: The Beta prior is conjugate to the binomial likelihood: $\text{Beta}(a,b)$ plus $k$ successes and $n-k$ failures gives $\text{Beta}(a+k,\;b+n-k)$.
$\text{Beta}(2+7,\;2+3)=\text{Beta}(9,5)$.
$\text{Beta}(7,3)$ drops the prior. $\text{Beta}(5,9)$ swaps heads and tails.

@ stat e stat-e-044
T: Posterior is proportional to likelihood times prior
S: bayesian-inference
Q: For a parameter $\theta$ and data $x$, which expression gives the posterior density $p(\theta\mid x)$ up to a constant that does not depend on $\theta$?
A: $p(x\mid\theta)\,p(\theta)$
B: $p(\theta)/p(x\mid\theta)$
C: $p(x\mid\theta)$ alone
D: $p(x)\,p(\theta)$
ANS: A
EXP: Bayes' rule: $p(\theta\mid x)=\dfrac{p(x\mid\theta)\,p(\theta)}{p(x)}$. The evidence $p(x)$ does not depend on $\theta$, so posterior $\propto$ likelihood $\times$ prior.
Using the likelihood alone is the frequentist starting point (it leads to the MLE). It equals the posterior shape only when the prior is flat.

@ stat e stat-e-045
T: When MAP equals MLE
S: bayesian-inference
Q: For which prior is the MAP estimate of $\theta$ always the same as the MLE (assuming the MLE lies inside the prior's support)?
A: A normal prior centred at the MLE
B: Any conjugate prior
C: A Laplace prior centred at zero
D: A uniform (flat) prior on the parameter space
ANS: D
EXP: $\hat\theta_{MAP}=\arg\max_\theta\,[\log p(x\mid\theta)+\log p(\theta)]$. If $p(\theta)$ is constant, the second term does not change the maximiser, so MAP $=$ MLE.
A Laplace prior at zero adds an $L_1$ penalty (lasso), and a normal prior adds an $L_2$ penalty (ridge). Both pull the estimate away from the MLE. Conjugacy only makes the posterior easy to compute, it does not remove the prior's effect.

@ stat e stat-e-046
T: Conjugate prior for a Poisson rate
S: bayesian-inference
Q: Counts $x_1,\dots,x_n$ are i.i.d. Poisson$(\lambda)$. Which prior family on $\lambda$ is conjugate, so that the posterior is in the same family?
A: Beta
B: Gamma
C: Normal
D: Dirichlet
ANS: B
EXP: The Poisson likelihood is $\propto \lambda^{\sum x_i}e^{-n\lambda}$. A Gamma$(\alpha,\beta)$ prior (rate $\beta$) has density $\propto \lambda^{\alpha-1}e^{-\beta\lambda}$.
Multiplying gives $\lambda^{\alpha+\sum x_i-1}e^{-(\beta+n)\lambda}$, which is Gamma$(\alpha+\sum x_i,\;\beta+n)$.
Beta is conjugate to the Bernoulli/binomial (it lives on $[0,1]$, but $\lambda$ can be any positive number). Dirichlet is conjugate to the multinomial.

@ stat e stat-e-047
T: Entropy of a uniform distribution on 8 outcomes
S: information-theory
Q: Using base-2 logarithms, what is the entropy of a random variable that is uniform on $8$ outcomes?
A: $3$ bits
B: $8$ bits
C: $\frac18$ bit
D: $2.08$ bits
ANS: A
EXP: For a uniform distribution on $k$ outcomes, $H=-\sum \frac1k\log_2\frac1k=\log_2 k$.
$H=\log_2 8=3$ bits: three yes/no questions identify the outcome.
$2.08=\ln 8$ is the same entropy in nats (natural log), not bits.

@ stat e stat-e-048
T: Entropy of the distribution (1/2, 1/4, 1/4)
S: information-theory
TYPE: nat
TOL: 0.01
Q: A random variable takes three values with probabilities $\frac12,\frac14,\frac14$. What is its entropy in bits (base-2 logarithm)? Enter the number.
ANS: 1.5
EXP: $H=-\sum p_i\log_2 p_i$.
$H=\tfrac12\log_2 2+\tfrac14\log_2 4+\tfrac14\log_2 4=\tfrac12(1)+\tfrac14(2)+\tfrac14(2)=1.5$ bits.
This is less than $\log_2 3\approx1.585$, the maximum for three outcomes, because the distribution is not uniform.

@ stat e stat-e-049
T: Cross-entropy loss for one example
S: information-theory
Q: A classifier outputs probabilities $(0.5,\,0.25,\,0.25)$ for classes $1,2,3$. The true class is $2$ (one-hot label). What is the cross-entropy loss for this example, using base-2 logarithms?
A: $1.5$ bits
B: $0.25$ bits
C: $2$ bits
D: $1$ bit
ANS: C
EXP: With a one-hot label, cross-entropy $-\sum_k y_k\log_2 q_k$ keeps only the true class term: loss $=-\log_2 q_{\text{true}}=-\log_2 0.25=2$ bits.
$1.5$ bits is the entropy of the predicted distribution, which does not involve the label at all. $1$ bit would be the loss if class 1 were the true class.

@ stat e stat-e-050
T: Basic property of KL divergence
S: information-theory
Q: For any two distributions $P$ and $Q$ on the same finite set (with $Q(x)>0$ wherever $P(x)>0$), which statement is always true?
A: $D_{KL}(P\|Q)=D_{KL}(Q\|P)$
B: $D_{KL}(P\|Q)\le 1$
C: $D_{KL}(P\|Q)\ge 0$, with equality only when $P=Q$
D: $D_{KL}(P\|R)\le D_{KL}(P\|Q)+D_{KL}(Q\|R)$ for every third distribution $R$
ANS: C
EXP: Gibbs' inequality (from Jensen's inequality): $D_{KL}(P\|Q)=\sum P\log\frac PQ\ge0$, with equality iff $P=Q$.
KL is not symmetric: for $P=(\frac12,\frac12)$, $Q=(\frac14,\frac34)$, $D(P\|Q)\approx0.208$ bits but $D(Q\|P)\approx0.189$ bits.
It is not bounded by 1: for $P=(1,0)$, $Q=(\frac1{1024},\frac{1023}{1024})$, $D(P\|Q)=\log_2 1024=10$ bits.
It does not satisfy the triangle inequality: for $P=(0.9,0.1)$, $Q=(0.5,0.5)$, $R=(0.1,0.9)$, $D(P\|R)\approx2.54$ bits but $D(P\|Q)+D(Q\|R)\approx0.53+0.74=1.27$ bits. That is why it is called a divergence, not a distance.

@ stat m stat-m-041
T: Two-sided p-value from a z statistic
S: z-test
TYPE: nat
TOL: 0.0005
Q: A two-sided $z$-test gives $z=2.00$. Using $\Phi(2.00)=0.9772$, what is the p-value? Enter it to 4 decimal places.
ANS: 0.0456
EXP: Two-sided p-value $=P(|Z|\ge|z|)=2\,[1-\Phi(|z|)]$.
$1-\Phi(2)=1-0.9772=0.0228$, so $p=2\times0.0228=0.0456$.
Reporting $0.0228$ gives only one tail, which is the p-value of a one-sided test. At $\alpha=0.05$ the result is significant, but only just.

@ stat m stat-m-042
T: Two-sample z-test with known variances
S: z-test
Q: Two independent groups have known SDs $\sigma_1=15$, $\sigma_2=20$ and sizes $n_1=n_2=25$. The sample means are $\bar x_1=110$ and $\bar x_2=100$. What is the $z$ statistic for $H_0:\mu_1=\mu_2$?
A: $2.83$
B: $1.43$
C: $2.00$
D: $0.40$
ANS: C
EXP: Rule: $z=\dfrac{\bar x_1-\bar x_2}{\sqrt{\sigma_1^2/n_1+\sigma_2^2/n_2}}$. Variances of independent means add, standard errors do not.
$\sigma_1^2/n_1=225/25=9$, $\sigma_2^2/n_2=400/25=16$, so SE $=\sqrt{25}=5$ and $z=10/5=2.00$.
$1.43$ adds the two standard errors ($3+4=7$). $0.40$ divides by the variance $25$ in place of its square root. $2.83$ divides the summed variances by $n_1+n_2=50$.

@ stat m stat-m-043
T: Two-proportion z-test for an A/B test
S: z-test
Q: In an A/B test, version A converts $60$ of $200$ users and version B converts $40$ of $200$. Using the pooled two-proportion $z$-test for $H_0:p_A=p_B$, the $z$ statistic is about:
A: $3.27$
B: $2.31$
C: $4.62$
D: $3.09$
ANS: B
EXP: Under $H_0$ the two rates are equal, so pool them: $\hat p=\dfrac{60+40}{400}=0.25$.
SE $=\sqrt{\hat p(1-\hat p)\left(\frac1{n_A}+\frac1{n_B}\right)}=\sqrt{0.25\times0.75\times\frac{2}{200}}=\sqrt{0.001875}\approx0.0433$.
$z=\dfrac{0.30-0.20}{0.0433}\approx2.31$.
$3.27$ uses only $\frac1{200}$ (one group's size) in place of $\frac1{200}+\frac1{200}$. $4.62$ uses $\frac1{400}$. $3.09$ uses only group A's variance $0.3\times0.7$.

@ stat m stat-m-044
T: Sample size for a target power
S: z-test
Q: You will test $H_0:\mu=\mu_0$ against $H_1:\mu>\mu_0$ at $\alpha=0.05$ with known $\sigma=10$. You want power $0.80$ when the true mean is $\mu_0+5$. Use $z_{0.05}=1.645$, $z_{0.025}=1.96$, $z_{0.20}=0.84$. What is the smallest sample size?
A: $25$
B: $32$
C: $11$
D: $5$
ANS: A
EXP: Rule for a one-sided $z$-test: $n=\left(\dfrac{(z_\alpha+z_\beta)\,\sigma}{\delta}\right)^2$.
$n=\left(\dfrac{(1.645+0.84)\times10}{5}\right)^2=(4.97)^2\approx24.7$, so round up to $n=25$.
$32$ uses the two-sided value $1.96$. $11$ ignores the power requirement (uses $z_\alpha$ only, which gives power $0.5$). $5$ forgets to square.

@ stat m stat-m-045
T: What changes the power of a z-test
S: z-test
TYPE: msq
Q: Consider a one-sided $z$-test of $H_0:\mu=\mu_0$ vs $H_1:\mu>\mu_0$ with known $\sigma$. Which statements are true? (More than one option may be correct.)
A: With $\alpha$ fixed, increasing the sample size $n$ increases the power at any fixed $\mu>\mu_0$
B: Lowering $\alpha$ from $0.05$ to $0.01$ (same $n$) increases the power
C: For fixed $n$ and $\alpha$, the power is larger when the true $\mu$ is further above $\mu_0$
D: The probability of a Type I error depends on the true value of $\mu$ under $H_1$
ANS: A,C
EXP: Power at true $\mu$: $1-\Phi\!\left(z_\alpha-\dfrac{(\mu-\mu_0)\sqrt n}{\sigma}\right)$.
[[A]] True: a larger $n$ makes the shift $\frac{(\mu-\mu_0)\sqrt n}{\sigma}$ larger, so the power rises.
[[B]] False: lowering $\alpha$ raises the cut-off $z_\alpha$ (from $1.645$ to $2.326$), so it is harder to reject and the power falls. This is the Type I/Type II trade-off.
[[C]] True: a bigger $\mu-\mu_0$ gives a bigger shift.
[[D]] False: a Type I error is rejecting when $H_0$ is true, so its probability is computed at $\mu=\mu_0$ and equals $\alpha$.

@ stat m stat-m-046
T: Duality between a CI and a two-sided test
S: z-test
Q: A 95% confidence interval for $\mu$ (based on the usual $z$ procedure) is $(48.2,\,53.8)$. For which null value would a two-sided $z$-test at $\alpha=0.05$ on the same data reject $H_0:\mu=\mu_0$?
A: $\mu_0=49$
B: $\mu_0=54$
C: $\mu_0=51$
D: $\mu_0=53$
ANS: B
EXP: A two-sided test at level $\alpha$ rejects $H_0:\mu=\mu_0$ exactly when $\mu_0$ lies outside the $(1-\alpha)$ confidence interval, because both use the same $\bar x\pm1.96\,\sigma/\sqrt n$.
Only $54$ lies outside $(48.2,53.8)$, so only that null value is rejected.
$49$ and $53$ are near the edges but still inside, so the data are consistent with them.

@ stat m stat-m-047
T: Paired t-test from before and after scores
S: t-test
Q: Four students take a test before and after a course. Scores before: $10,12,9,11$. After: $12,15,10,15$. For a paired $t$-test of $H_0$: no mean change, two-sided, $\alpha=0.05$, with $t_{0.025,3}=3.182$, which is correct?
A: $t\approx3.87$, reject $H_0$
B: $t\approx4.47$, reject $H_0$
C: $t\approx1.94$, do not reject $H_0$
D: $t\approx1.81$, do not reject $H_0$
ANS: A
EXP: Differences $d=(2,3,1,4)$, $\bar d=2.5$.
$s_d^2=\dfrac{(-0.5)^2+0.5^2+(-1.5)^2+1.5^2}{3}=\dfrac53$, so $s_d\approx1.291$.
$t=\dfrac{\bar d}{s_d/\sqrt4}=\dfrac{2.5}{0.6455}\approx3.87>3.182$, so reject.
$4.47$ uses $n$ in place of $n-1$ in $s_d$. $1.94$ forgets the $\sqrt n$. $1.81$ wrongly treats the two columns as independent samples (pooled two-sample test). The variation between students then swamps the consistent gain.

@ stat m stat-m-048
T: Pooled variance from two samples
S: t-test
TYPE: nat
TOL: 0
Q: For a pooled two-sample $t$-test, group 1 has $n_1=10$ and $s_1^2=20$, and group 2 has $n_2=6$ and $s_2^2=34$. What is the pooled variance $s_p^2$? Enter the number.
ANS: 25
EXP: Rule: $s_p^2=\dfrac{(n_1-1)s_1^2+(n_2-1)s_2^2}{n_1+n_2-2}$. Each sample variance is weighted by its degrees of freedom.
$s_p^2=\dfrac{9(20)+5(34)}{14}=\dfrac{180+170}{14}=25$.
The plain average $\frac{20+34}{2}=27$ ignores that group 1 has more data. Weighting by $n_i$ in place of $n_i-1$ gives $25.25$.

@ stat m stat-m-049
T: Welch t statistic with unequal variances
S: t-test
Q: Two independent samples: $n_1=9$, $\bar x_1=26$, $s_1^2=18$; $n_2=4$, $\bar x_2=20$, $s_2^2=28$. Variances are not assumed equal. What is Welch's (unpooled) $t$ statistic for $H_0:\mu_1=\mu_2$?
A: $2.19$
B: $1.48$
C: $2.00$
D: $0.67$
ANS: C
EXP: Welch: $t=\dfrac{\bar x_1-\bar x_2}{\sqrt{s_1^2/n_1+s_2^2/n_2}}$.
$s_1^2/n_1=2$, $s_2^2/n_2=7$, SE $=\sqrt9=3$, so $t=6/3=2.00$.
$2.19$ is the pooled statistic. Here the pooled variance puts most weight on the larger group, which has the smaller variance, so it understates the SE. $1.48$ adds the two standard errors ($\sqrt2+\sqrt7$). $0.67$ forgets the square root ($6/9$).

@ stat m stat-m-050
T: Bracketing a p-value with a t table
S: t-test
Q: A one-sample $t$-test with $10$ degrees of freedom gives $t=2.6$ (two-sided alternative). The table gives $t_{0.025,10}=2.228$ and $t_{0.01,10}=2.764$ (upper-tail points). What can you say about the p-value?
A: $0.01<p<0.025$
B: $0.05<p<0.10$
C: $p<0.01$
D: $0.02<p<0.05$
ANS: D
EXP: $2.228<2.6<2.764$, so the upper-tail area beyond $2.6$ is between $0.01$ and $0.025$.
For a two-sided test the p-value doubles the tail area: $0.02<p<0.05$.
$0.01<p<0.025$ is the one-sided p-value. Forgetting to double is the most common slip.

@ stat m stat-m-051
T: Smallest sample mean that rejects in a t-test
S: t-test
TYPE: nat
TOL: 0.01
Q: A sample of $n=9$ has standard deviation $s=6$. You test $H_0:\mu=20$ against $H_1:\mu>20$ at $\alpha=0.05$, with $t_{0.05,8}=1.860$. What is the smallest sample mean $\bar x$ for which $H_0$ is rejected? Enter it to 2 decimal places.
ANS: 23.72
EXP: Reject when $t=\dfrac{\bar x-20}{s/\sqrt n}>1.860$, with SE $=6/\sqrt9=2$.
So $\bar x>20+1.860\times2=23.72$.
Using $z_{0.05}=1.645$ gives $23.29$, which is too small: with $\sigma$ estimated from $9$ values, the $t$ cut-off must be used.

@ stat m stat-m-052
T: Assumptions of the pooled two-sample t-test
S: t-test
TYPE: msq
Q: Which of the following are assumptions of the pooled (equal-variance) two-sample $t$-test for small samples? (More than one option may be correct.)
A: The two samples are independent of each other
B: The two populations have equal variances
C: The two samples have equal sizes
D: The population variances are known
ANS: A,B
EXP: [[A]] Needed: dependence (for example, the same subjects measured twice) calls for the paired test.
[[B]] Needed: the pooled $s_p^2$ estimates one common variance. If the variances differ, use Welch's test.
[[C]] Not needed: $s_p^2$ and the SE $s_p\sqrt{1/n_1+1/n_2}$ handle unequal $n_1,n_2$ (equal sizes only make the test less sensitive to unequal variances).
[[D]] Not needed: if the variances were known you would use a $z$-test. The $t$-test exists because they are estimated.
Normality of both populations is also assumed for small samples.

@ stat m stat-m-053
T: Type I error when z is used for a small sample
S: t-test
Q: With $n=5$ normal observations and $\sigma$ unknown, an analyst computes $t=\dfrac{\bar x-\mu_0}{s/\sqrt5}$ but rejects $H_0$ when $|t|>1.96$ (the normal cut-off). Upper-tail points for $4$ df: $t_{0.10,4}=1.533$, $t_{0.05,4}=2.132$. What is the true Type I error rate of this procedure?
A: Exactly $0.05$
B: Between $0.05$ and $0.10$
C: Between $0.10$ and $0.20$
D: Less than $0.05$
ANS: C
EXP: Under $H_0$ the statistic follows $t_4$, not $N(0,1)$. Since $1.533<1.96<2.132$, the upper-tail area beyond $1.96$ is between $0.05$ and $0.10$.
The test rejects in both tails, so the true $\alpha$ is between $0.10$ and $0.20$ (it is about $0.12$).
"Between $0.05$ and $0.10$" forgets the second tail. The $t$ tails are heavier than normal tails, so the normal cut-off rejects too often, not too rarely.

@ stat m stat-m-054
T: Goodness of fit for a 9:3:3:1 ratio
S: chi-squared-test
TYPE: nat
TOL: 0.01
Q: A genetics model predicts four phenotypes in the ratio $9:3:3:1$. Among $160$ offspring the observed counts are $99,\,27,\,24,\,10$. What is the chi-square goodness-of-fit statistic? Enter it to 2 decimal places.
ANS: 2.4
EXP: Expected counts: $160\times\frac{9}{16}=90$, $160\times\frac3{16}=30$, $30$, $160\times\frac1{16}=10$.
$\chi^2=\dfrac{9^2}{90}+\dfrac{(-3)^2}{30}+\dfrac{(-6)^2}{30}+\dfrac{0^2}{10}=0.9+0.3+1.2+0=2.4$.
With df $=4-1=3$ and $\chi^2_{0.05,3}=7.815$, the data fit the model well.

@ stat m stat-m-055
T: Degrees of freedom when fitting a Poisson
S: chi-squared-test
Q: To check whether daily server errors follow a Poisson distribution, the counts are grouped into $5$ categories ($0,1,2,3,\ge4$). The rate $\lambda$ is estimated from the same data by its MLE (the sample mean). How many degrees of freedom does the chi-square goodness-of-fit test have?
A: $4$
B: $3$
C: $5$
D: $2$
ANS: B
EXP: Rule: df $=k-1-m$, with $k$ categories and $m$ estimated parameters.
$k=5$, $m=1$ ($\lambda$), so df $=5-1-1=3$.
$4$ forgets that estimating $\lambda$ from the data makes the fit closer, which costs one degree of freedom.

@ stat m stat-m-056
T: Chi-square test on a 2x2 table
S: chi-squared-test
Q: A $2\times2$ table of counts is $\begin{pmatrix}30&20\\20&30\end{pmatrix}$. Test independence at $\alpha=0.05$ using $\chi^2_{0.05,1}=3.841$ and $\chi^2_{0.05,2}=5.991$ (no continuity correction). Which is correct?
A: $\chi^2=4.0$ with $2$ df, so do not reject
B: $\chi^2=1.0$ with $1$ df, so do not reject
C: $\chi^2=4.0$ with $1$ df, so reject
D: $\chi^2=2.0$ with $1$ df, so do not reject
ANS: C
EXP: All margins are $50$ and $n=100$, so every expected count is $\frac{50\times50}{100}=25$.
Each cell contributes $\frac{(\pm5)^2}{25}=1$, so $\chi^2=4\times1=4.0$.
df $=(2-1)(2-1)=1$. Since $4.0>3.841$, reject independence.
$1.0$ counts only one cell. Using $2$ df (as if df $=$ number of rows) gives the wrong cut-off $5.991$ and the wrong decision.

@ stat m stat-m-057
T: Chi-square statistic when the sample is ten times larger
S: chi-squared-test
Q: A goodness-of-fit test on $n=160$ observations gives $\chi^2=2.4$. Suppose a study with $n=1600$ finds exactly the same observed proportions in every category. What is the new $\chi^2$ statistic?
A: $2.4$
B: $7.59$
C: $240$
D: $24$
ANS: D
EXP: Multiply all counts by $10$: then $O$ and $E$ both scale by $10$, so each term $\dfrac{(O-E)^2}{E}$ scales by $\dfrac{10^2}{10}=10$.
$\chi^2=10\times2.4=24$.
So a deviation that was not significant with $160$ observations can become highly significant with $1600$. A significant chi-square says the effect is detectable, not that it is large. $7.59=\sqrt{10}\times2.4$ wrongly scales like a $z$ statistic.

@ stat m stat-m-058
T: Facts about the chi-square test of independence
S: chi-squared-test
TYPE: msq
Q: Which statements about the chi-square test of independence on an $r\times c$ table are true? (More than one option may be correct.)
A: The expected count of a cell is $\dfrac{\text{row total}\times\text{column total}}{n}$
B: Applying the test to row percentages in place of counts gives the same statistic
C: The degrees of freedom are $(r-1)(c-1)$
D: A large p-value proves that the two variables are independent
ANS: A,C
EXP: [[A]] True: under independence the cell probability is $P(\text{row})P(\text{col})$, times $n$.
[[B]] False: $\chi^2$ scales with the total. For example, counts $\begin{pmatrix}60&40\\40&60\end{pmatrix}$ ($n=200$) give $\chi^2=8$, but the same table written as percentages, $\begin{pmatrix}30&20\\20&30\end{pmatrix}$, gives $\chi^2=4$. The test must use raw counts.
[[C]] True: once the margins are fixed, only $(r-1)(c-1)$ cells are free.
[[D]] False: failing to reject only means there is not enough evidence of dependence. The sample may simply be too small.

@ stat m stat-m-059
T: Chi-square test for a variance
S: chi-squared-test
Q: A process should have variance $\sigma^2=10$. A sample of $n=11$ items gives $s^2=18$ (denominator $n-1$). Test $H_0:\sigma^2=10$ against $H_1:\sigma^2>10$ at $\alpha=0.05$, with $\chi^2_{0.05,10}=18.307$. Which is correct?
A: Statistic $18.0$, do not reject $H_0$
B: Statistic $19.8$, reject $H_0$
C: Statistic $1.8$, do not reject $H_0$
D: Statistic $5.56$, do not reject $H_0$
ANS: A
EXP: For normal data, $\dfrac{(n-1)S^2}{\sigma_0^2}\sim\chi^2_{n-1}$ under $H_0$.
Statistic $=\dfrac{10\times18}{10}=18.0<18.307$, so do not reject (just barely).
$19.8$ multiplies by $n=11$ in place of $n-1=10$, which flips the decision. $1.8$ is only the ratio $s^2/\sigma_0^2$. $5.56$ inverts the ratio.

@ stat m stat-m-060
T: Correlation from the two regression slopes
S: regression-correlation
Q: For a data set, the least-squares slope of $y$ on $x$ is $1.5$ and the least-squares slope of $x$ on $y$ is $0.24$. What is the correlation $r$?
A: $0.6$
B: $0.36$
C: $-0.6$
D: $6.25$
ANS: A
EXP: $b_{y|x}=r\dfrac{s_y}{s_x}$ and $b_{x|y}=r\dfrac{s_x}{s_y}$, so $b_{y|x}\,b_{x|y}=r^2$.
$r^2=1.5\times0.24=0.36$, and $r$ has the same sign as both slopes (positive), so $r=0.6$.
$0.36$ is $r^2$ (the $R^2$), not $r$. The two lines are different unless $|r|=1$, so $b_{x|y}\ne 1/b_{y|x}$ in general.

@ stat m stat-m-061
T: t-test for a correlation coefficient
S: regression-correlation
Q: From $n=18$ pairs, the sample correlation is $r=0.5$. Test $H_0:\rho=0$ (two-sided, $\alpha=0.05$) with $t_{0.025,16}=2.120$. Which is correct?
A: $t=2.00$, do not reject $H_0$
B: $t\approx2.31$, reject $H_0$
C: $t\approx2.67$, reject $H_0$
D: $t\approx0.58$, do not reject $H_0$
ANS: B
EXP: Rule: $t=\dfrac{r\sqrt{n-2}}{\sqrt{1-r^2}}$ with $n-2$ df. This equals the $t$ statistic for the slope in simple regression.
$t=\dfrac{0.5\times4}{\sqrt{0.75}}=\dfrac{2}{0.866}\approx2.31>2.120$, so reject.
$2.00$ forgets the $\sqrt{1-r^2}$ and gets the wrong decision. $2.67$ divides by $1-r^2$ without the square root.

@ stat m stat-m-062
T: Properties of OLS residuals
S: regression-correlation
TYPE: msq
Q: A simple linear regression $\hat y=a+bx$ with an intercept is fitted by ordinary least squares. Which statements about the residuals $e_i=y_i-\hat y_i$ are true? (More than one option may be correct.)
A: $\sum e_i=0$
B: $\sum x_ie_i=0$, so the residuals are uncorrelated with $x$
C: The fitted line passes through $(\bar x,\bar y)$
D: The residuals would still sum to zero if the line were forced through the origin
ANS: A,B,C
EXP: The normal equations are $\partial/\partial a$: $\sum e_i=0$, and $\partial/\partial b$: $\sum x_ie_i=0$. So [[A]] and [[B]] are true.
[[C]] True: $\sum e_i=0$ gives $\bar y=a+b\bar x$.
[[D]] False: without an intercept only $\sum x_ie_i=0$ holds. For example, fit $y=\beta x$ to $x=(1,2,3)$, $y=(2,3,7)$: $\hat\beta=\frac{29}{14}$ and the residuals sum to $12-\frac{29}{14}\cdot6=-\frac{3}{7}\ne0$.

@ stat m stat-m-063
T: Residual standard error from R squared
S: regression-correlation
Q: A simple linear regression on $n=27$ points has total sum of squares $\text{SST}=100$ and $R^2=0.64$. What is the residual standard error $s=\sqrt{\text{SSE}/(n-2)}$?
A: $1.44$
B: $1.15$
C: $1.6$
D: $1.2$
ANS: D
EXP: $\text{SSE}=(1-R^2)\,\text{SST}=0.36\times100=36$.
Two parameters (intercept and slope) are estimated, so df $=n-2=25$: $s=\sqrt{36/25}=1.2$.
$1.44$ is $s^2$, not $s$. $1.15$ divides by $n=27$. $1.6$ uses $R^2\,\text{SST}=64$, the explained sum of squares, in place of the residual one.

@ stat m stat-m-064
T: Posterior mean as a compromise
S: bayesian-inference
Q: A click-through rate $\theta$ has prior $\text{Beta}(3,7)$ (prior mean $0.3$). In $20$ impressions there are $12$ clicks. What is the posterior mean of $\theta$?
A: $0.6$
B: $0.45$
C: $0.5$
D: $0.3$
ANS: C
EXP: Posterior: $\text{Beta}(3+12,\;7+8)=\text{Beta}(15,15)$, mean $\dfrac{15}{30}=0.5$.
In general the posterior mean is a weighted average of the prior mean and the MLE, with weights given by prior strength $a+b=10$ and data size $n=20$: $\frac{10}{30}(0.3)+\frac{20}{30}(0.6)=0.5$.
$0.45$ weights prior and data equally, ignoring that the data carry twice the weight. $0.6$ is the MLE.

@ stat m stat-m-065
T: Normal–Normal posterior mean
S: bayesian-inference
Q: Observations are $X_i\mid\mu\sim N(\mu,\,4)$ (second parameter is the variance). The prior is $\mu\sim N(0,\,1)$. From $n=4$ observations, $\bar x=3$. What is the posterior mean of $\mu$?
A: $3$
B: $1.5$
C: $2$
D: $0.6$
ANS: B
EXP: Precisions add: prior precision $1/1=1$, data precision $n/\sigma^2=4/4=1$. Posterior precision $=2$.
The posterior mean is the precision-weighted average: $\dfrac{1\times0+1\times3}{1+1}=1.5$.
$2$ uses $n/\sigma=4/2$ (SD in place of variance). $0.6$ uses a single observation's precision $1/4$, forgetting the factor $n$. $3$ ignores the prior.

@ stat m stat-m-066
T: MAP estimate under a Beta prior
S: bayesian-inference
TYPE: nat
TOL: 0.005
Q: A success probability $\theta$ has prior $\text{Beta}(3,3)$. In $10$ trials there are $4$ successes. What is the MAP estimate of $\theta$? Enter it to 3 decimal places.
ANS: 0.429
EXP: Posterior: $\text{Beta}(3+4,\;3+6)=\text{Beta}(7,9)$.
The mode of $\text{Beta}(a,b)$ with $a,b>1$ is $\dfrac{a-1}{a+b-2}$, so MAP $=\dfrac{6}{14}\approx0.429$.
Compare: posterior mean $\frac7{16}=0.4375$, MLE $0.4$. The prior centred at $0.5$ pulls both Bayesian estimates up from the MLE. The mode and the mean differ because the posterior is not symmetric.

@ stat m stat-m-067
T: Predictive probability after zero successes
S: bayesian-inference
Q: A rare word never appears in $3$ spam emails. With a uniform $\text{Beta}(1,1)$ prior on the probability $\theta$ that a spam email contains the word, what is the posterior predictive probability that the next spam email contains it?
A: $0$
B: $0.2$
C: $0.25$
D: $0.5$
ANS: B
EXP: Posterior: $\text{Beta}(1+0,\;1+3)=\text{Beta}(1,4)$. The predictive probability of a success is the posterior mean $\frac{1}{1+4}=0.2$.
This is Laplace's rule of succession, $\frac{k+1}{n+2}$, the same add-one smoothing used in naive Bayes.
The MLE $0$ would make any email containing the word get probability zero of being spam. $0.25=\frac1{n+1}$ adds one count to only one side.

@ stat m stat-m-068
T: Meaning of a 95% credible interval
S: bayesian-inference
Q: A Bayesian analysis gives a 95% credible interval $[0.32,\,0.48]$ for a parameter $\theta$. Which interpretation is correct?
A: If the experiment were repeated many times, 95% of such intervals would contain the true $\theta$
B: 95% of the observed data lie in $[0.32,0.48]$
C: There is a 5% chance that the MLE lies outside the interval
D: Given the data and the prior, the posterior probability that $\theta\in[0.32,0.48]$ is $0.95$
ANS: D
EXP: In Bayesian inference $\theta$ is treated as random, so a credible interval is a direct probability statement: $P(0.32\le\theta\le0.48\mid\text{data})=0.95$ under the posterior.
The "repeated experiments" statement describes a frequentist confidence interval, where $\theta$ is fixed and the interval is random. The two often agree numerically with a flat prior and large $n$, but they mean different things.

@ stat m stat-m-069
T: Gamma–Poisson posterior mean
S: bayesian-inference
Q: Daily bug reports are Poisson$(\lambda)$. The prior is $\lambda\sim\text{Gamma}(\alpha=2,\beta=1)$ (shape $\alpha$, rate $\beta$, mean $\alpha/\beta$). Three days give counts $3,5,4$. What is the posterior mean of $\lambda$?
A: $3.5$
B: $4$
C: $\frac{14}{3}$
D: $2$
ANS: A
EXP: Gamma–Poisson conjugacy: posterior $\text{Gamma}(\alpha+\sum x_i,\;\beta+n)=\text{Gamma}(2+12,\;1+3)=\text{Gamma}(14,4)$.
Posterior mean $=\frac{14}{4}=3.5$, between the prior mean $2$ and the MLE $\bar x=4$.
$\frac{14}{3}$ forgets to add the prior's $\beta=1$ to $n$.

@ stat m stat-m-070
T: KL divergence between two Bernoulli distributions
S: information-theory
Q: Let $P=\text{Bernoulli}(\frac12)$ and $Q=\text{Bernoulli}(\frac14)$. Using base-2 logarithms, $D_{KL}(P\|Q)$ is approximately:
A: $0.189$ bits
B: $0.208$ bits
C: $0.415$ bits
D: $0.5$ bits
ANS: B
EXP: $D_{KL}(P\|Q)=\sum_x P(x)\log_2\frac{P(x)}{Q(x)}=\tfrac12\log_2\frac{1/2}{1/4}+\tfrac12\log_2\frac{1/2}{3/4}$.
$=\tfrac12(1)+\tfrac12(-0.585)\approx0.208$ bits.
$0.189$ is $D_{KL}(Q\|P)$: KL is not symmetric, so the order matters. $0.415$ drops the weights $P(x)=\tfrac12$.

@ stat m stat-m-071
T: KL divergence from cross-entropy and entropy
S: information-theory
Q: Let $P=(\frac12,\frac14,\frac14)$ and $Q=(\frac14,\frac14,\frac12)$ on the same three outcomes. Using base-2 logarithms, what is $D_{KL}(P\|Q)$?
A: $1.75$ bits
B: $1.5$ bits
C: $-0.25$ bits
D: $0.25$ bits
ANS: D
EXP: Use $D_{KL}(P\|Q)=H(P,Q)-H(P)$.
Cross-entropy: $H(P,Q)=-\sum P\log_2Q=\tfrac12(2)+\tfrac14(2)+\tfrac14(1)=1.75$ bits.
Entropy: $H(P)=\tfrac12(1)+\tfrac14(2)+\tfrac14(2)=1.5$ bits.
$D_{KL}=1.75-1.5=0.25$ bits.
$1.75$ is the cross-entropy itself. $-0.25$ subtracts the wrong way round, and KL can never be negative. In training, $H(P)$ is fixed by the data, so minimising cross-entropy is the same as minimising KL.

@ stat m stat-m-072
T: Mutual information from a 2x2 joint table
S: information-theory
TYPE: nat
TOL: 0.005
Q: Binary $X,Y$ have joint probabilities $P(0,0)=\frac14$, $P(0,1)=\frac14$, $P(1,0)=0$, $P(1,1)=\frac12$. What is $I(X;Y)$ in bits (base-2 logarithm)? Enter it to 3 decimal places.
ANS: 0.311
EXP: Use $I(X;Y)=H(Y)-H(Y\mid X)$.
Marginal of $Y$: $P(Y=0)=\frac14$, $P(Y=1)=\frac34$, so $H(Y)=\frac14\log_24+\frac34\log_2\frac43\approx0.811$ bits.
Given $X=0$ (prob $\frac12$): $Y$ is $(\frac12,\frac12)$, entropy $1$. Given $X=1$ (prob $\frac12$): $Y=1$ for sure, entropy $0$. So $H(Y\mid X)=0.5$.
$I=0.811-0.5\approx0.311$ bits.

@ stat m stat-m-073
T: Chain rule for conditional entropy
S: information-theory
Q: For random variables $X$ and $Y$: $H(X)=1$ bit, $H(Y)=1.5$ bits and $I(X;Y)=0.3$ bits. What is $H(X\mid Y)$?
A: $1.2$ bits
B: $0.7$ bits
C: $2.2$ bits
D: $0.5$ bits
ANS: B
EXP: Mutual information is the drop in uncertainty about $X$ from knowing $Y$: $I(X;Y)=H(X)-H(X\mid Y)$.
$H(X\mid Y)=1-0.3=0.7$ bits.
$1.2=H(Y)-I$ is $H(Y\mid X)$, the other conditional. $2.2=H(X)+H(Y)-I$ is the joint entropy $H(X,Y)$.

@ stat m stat-m-074
T: Softmax cross-entropy loss from logits
S: information-theory
TYPE: nat
TOL: 0.01
Q: A 3-class model outputs logits $(2,\,1,\,0)$, and the true class is the first one. What is the softmax cross-entropy loss using the natural logarithm (nats)? Use $e\approx2.718$, $e^2\approx7.389$. Enter it to 2 decimal places.
ANS: 0.41
EXP: Softmax: $p_1=\dfrac{e^2}{e^2+e^1+e^0}=\dfrac{7.389}{7.389+2.718+1}=\dfrac{7.389}{11.107}\approx0.665$.
Loss $=-\ln p_1\approx0.408$, about $0.41$ nats.
Equivalently, loss $=\ln\sum_k e^{z_k}-z_{\text{true}}=\ln11.107-2\approx2.408-2=0.408$, the log-sum-exp form used in practice. In bits it would be $0.588$.

@ stat m stat-m-075
T: KL divergence when supports differ
S: information-theory
TYPE: msq
Q: Let $P=(\frac12,\frac12,0)$ and $Q=(\frac12,\frac14,\frac14)$ on three outcomes. Using base-2 logarithms (and $0\log0=0$), which statements are true? (More than one option may be correct.)
A: $D_{KL}(P\|Q)=0.5$ bits
B: $D_{KL}(Q\|P)=+\infty$
C: $D_{KL}(Q\|P)=0.5$ bits
D: $D_{KL}(P\|Q)=+\infty$
ANS: A,B
EXP: [[A]] True: $D(P\|Q)=\tfrac12\log_2\frac{1/2}{1/2}+\tfrac12\log_2\frac{1/2}{1/4}+0=0+\tfrac12(1)=0.5$ bits. The third term is $0$ because $P=0$ there.
[[B]] True: $Q$ puts $\frac14$ on the third outcome where $P=0$, giving a term $\frac14\log_2\frac{1/4}{0}=+\infty$.
So [[C]] is false, and [[D]] is false because $Q>0$ wherever $P>0$.
In ML, this is why a model that assigns probability $0$ to an outcome seen in the data gets infinite cross-entropy loss.

@ stat h stat-h-041
T: Power when the true mean sits on the cut-off
S: z-test
Q: Test $H_0:\mu=0$ vs $H_1:\mu\ne0$ at $\alpha=0.05$ with $\sigma=1$ known and $n=16$ (reject if $|\bar x|>1.96/4=0.49$). If the true mean is $\mu=0.49$, the power is closest to:
A: $0.975$
B: $0.025$
C: $0.50$
D: $0.05$
ANS: C
EXP: Under $\mu=0.49$, $\bar X\sim N(0.49,\;(1/4)^2)$.
Upper rejection: $P(\bar X>0.49)=0.5$, because the true mean sits exactly on the cut-off.
Lower rejection: $P(\bar X<-0.49)=P(Z<-3.92)\approx0.00004$, which is negligible.
Power $\approx0.50$.
Key idea: an effect exactly as large as the critical value is detected only half the time. To get 80% power the true effect must be about $(1.96+0.84)\,\sigma/\sqrt n$. $0.025$ and $0.975$ come from confusing the tail areas under $H_0$ with those under $H_1$.

@ stat h stat-h-042
T: What a p-value does and does not mean
S: z-test
TYPE: msq
Q: Consider tests with a continuous test statistic. Which statements are true? (More than one option may be correct.)
A: If $H_0$ is true, the p-value is uniformly distributed on $(0,1)$
B: A p-value of $0.03$ means there is a 3% probability that $H_0$ is true
C: For a $z$-test, the two-sided p-value is twice the one-sided p-value computed in the direction of the observed effect
D: A p-value of $0.001$ always indicates a larger effect than a p-value of $0.04$
ANS: A,C
EXP: [[A]] True: if $T$ has continuous CDF $F$ under $H_0$, then $p=1-F(T)$ and $P(p\le u)=u$. So with $H_0$ true, $p<0.05$ happens exactly 5% of the time, which is what $\alpha$ means.
[[B]] False: the p-value is $P(\text{data this extreme}\mid H_0)$, not $P(H_0\mid\text{data})$. The second needs a prior.
[[C]] True: the normal distribution is symmetric, so $P(|Z|\ge|z|)=2P(Z\ge|z|)$.
[[D]] False: p depends on $n$. A mean shift of $0.1\sigma$ with $n=1600$ gives $z=4$ ($p<0.001$), while a shift of $0.5\sigma$ with $n=16$ gives $z=2$ ($p\approx0.046$).

@ stat h stat-h-043
T: Sample size that balances both error rates
S: z-test
Q: You test $H_0:\mu=0$ vs $H_1:\mu=1$, with $\sigma=2$ known, using the rule "reject if $\bar x>c$". You want $P(\text{Type I})=P(\text{Type II})=0.05$. Use $z_{0.05}=1.645$, $z_{0.025}=1.96$. What is the smallest $n$?
A: $44$
B: $62$
C: $11$
D: $7$
ANS: A
EXP: Type I: $P(\bar X>c\mid\mu=0)=0.05$ gives $c=1.645\,\sigma/\sqrt n$. Type II: $P(\bar X<c\mid\mu=1)=0.05$ gives $c=1-1.645\,\sigma/\sqrt n$.
Both errors are equal, so by symmetry $c$ is the midpoint: $c=0.5$.
$1.645\times\dfrac{2}{\sqrt n}=0.5$ gives $\sqrt n=6.58$, so $n=43.3$, rounded up to $44$.
$62$ wrongly uses $1.96$ (the test is one-sided). $11$ uses $\sigma=1$. $7$ stops at $\sqrt n$.

@ stat h stat-h-044
T: Share of significant results that are false alarms
S: z-test
TYPE: nat
TOL: 0.01
Q: A team runs many A/B tests at $\alpha=0.05$. In $10\%$ of them the new version truly helps, and in those cases the tests have power $0.8$. In the other $90\%$, $H_0$ is true. Among the tests that come out significant, what fraction are false positives? Enter it to 2 decimal places.
ANS: 0.36
EXP: Per test: false positives occur at rate $0.9\times0.05=0.045$, and true positives at $0.1\times0.8=0.08$.
By Bayes' rule, $P(H_0\text{ true}\mid\text{significant})=\dfrac{0.045}{0.045+0.08}=0.36$.
So about a third of the "wins" are noise, even though each test controls its Type I error at 5%. The trap is to answer $0.05$, which confuses $P(\text{reject}\mid H_0)$ with $P(H_0\mid\text{reject})$.

@ stat h stat-h-045
T: p-value when the effect is in the wrong direction
S: z-test
Q: A team pre-registers the one-sided test $H_0:\mu=50$ vs $H_1:\mu>50$. The data give $z=-2.5$. Using $\Phi(2.5)=0.9938$, what is the p-value?
A: $0.0062$
B: $0.0124$
C: $0.9938$
D: $0.4938$
ANS: C
EXP: For $H_1:\mu>50$ the p-value is the upper-tail probability $P(Z\ge z)=P(Z\ge-2.5)=\Phi(2.5)=0.9938$.
The sample mean is below 50, which is the opposite of what $H_1$ claims, so there is no evidence at all for $H_1$.
$0.0062$ is the lower-tail area. Using it would mean switching the direction after seeing the data. $0.0124$ is the two-sided p-value.

@ stat h stat-h-046
T: Why pairing increases the t statistic
S: t-test
Q: Each subject is measured twice. Both measurements have SD $10$, and the correlation between a subject's two measurements is $0.8$. For the same mean difference and the same $n$ (treat the SDs as known), the paired test statistic is larger than the statistic from a test that wrongly treats the two sets as independent by about what factor?
A: $5$
B: $\sqrt5\approx2.24$
C: $1$
D: $\frac1{\sqrt5}\approx0.45$
ANS: B
EXP: Paired: $\text{Var}(X_1-X_2)=\sigma_1^2+\sigma_2^2-2\rho\sigma_1\sigma_2=100+100-160=40$.
Independent treatment ignores the covariance: $\text{Var}=100+100=200$.
The SEs are $\sqrt{40/n}$ and $\sqrt{200/n}$, so the ratio of the statistics is $\sqrt{200/40}=\sqrt5\approx2.24$.
Positive correlation cancels the between-subject variation. $5$ is the ratio of the variances, not of the SDs.

@ stat h stat-h-047
T: Two-sample t and one-way ANOVA
S: t-test
Q: A pooled two-sample $t$-test on two groups gives $t=2.5$. A one-way ANOVA $F$-test on the same two groups gives which $F$ statistic?
A: $2.5$
B: $1.58$
C: $5$
D: $6.25$
ANS: D
EXP: With two groups, the ANOVA $F$ statistic (with $1$ and $n_1+n_2-2$ df) equals $t^2$ from the pooled $t$-test: $F=2.5^2=6.25$.
The p-values are identical, because $F_{1,\nu}$ is the distribution of $T_\nu^2$. Both are also the same as regressing $y$ on a 0/1 group indicator and testing its slope.
$1.58=\sqrt{2.5}$ goes the wrong way. $5=2t$ is not a valid relation.

@ stat h stat-h-048
T: Transformations that leave the t statistic unchanged
S: t-test
TYPE: msq
Q: Two independent samples are compared with the pooled two-sample $t$ statistic. Which changes to the data leave the value of $t$ unchanged? (More than one option may be correct.)
A: Converting every observation from inches to centimetres (multiplying by $2.54$)
B: Adding $5$ to every observation in both groups
C: Adding $5$ to every observation in group 1 only
D: Multiplying every observation in both groups by $-1$
ANS: A,B
EXP: $t=\dfrac{\bar x_1-\bar x_2}{s_p\sqrt{1/n_1+1/n_2}}$.
[[A]] Unchanged: numerator and $s_p$ both scale by $2.54$.
[[B]] Unchanged: both means shift by $5$, so their difference stays the same, and SDs do not change under shifts.
[[C]] Changes: the numerator grows by $5$ while $s_p$ stays the same.
[[D]] Changes sign: $\bar x_1-\bar x_2$ flips sign but $s_p$ does not, so $t\to-t$. The two-sided p-value is unchanged, but the statistic is not.

@ stat h stat-h-049
T: How sample size alone can create significance
S: t-test
Q: A one-sample $t$-test with $n=16$ gives $t=1.2$. Suppose a larger study finds exactly the same $\bar x$ and $s$. Taking the two-sided critical value as $2.0$ for all sizes involved, what is the smallest $n$ for which the result becomes significant?
A: $27$
B: $45$
C: $36$
D: $64$
ANS: B
EXP: With $\bar x$ and $s$ fixed, $t=\dfrac{\bar x-\mu_0}{s}\sqrt n$ grows like $\sqrt n$: $t(n)=1.2\sqrt{n/16}$.
We need $1.2\sqrt{n/16}>2$, so $n>16\times(2/1.2)^2=44.4$, giving $n=45$.
$27$ assumes $t$ grows linearly in $n$ ($16\times2/1.2\approx26.7$). This is why huge A/B tests flag tiny effects: report effect sizes, not just p-values.

@ stat h stat-h-050
T: Pooled t-test when the small group is noisier
S: t-test
Q: Group 1 has $n_1=40$ observations from a population with small variance. Group 2 has $n_2=5$ observations from a population with much larger variance. The means are equal. If you use the pooled two-sample $t$-test at nominal $\alpha=0.05$, the actual Type I error rate is:
A: Larger than $0.05$, because $s_p^2$ is dominated by the small-variance group and understates the SE
B: Smaller than $0.05$, because $s_p^2$ is dominated by the large-variance group
C: Exactly $0.05$, because the $t$-test is exact for normal data
D: Exactly $0.05$, because $\bar x_1-\bar x_2$ is unbiased
ANS: A
EXP: The true SE of $\bar X_1-\bar X_2$ is $\sqrt{\sigma_1^2/40+\sigma_2^2/5}$, which is dominated by $\sigma_2^2/5$.
The pooled estimate $s_p^2=\frac{39s_1^2+4s_2^2}{43}$ is close to the small $\sigma_1^2$, so $s_p\sqrt{1/40+1/5}$ is too small. The $t$ statistic is then too large and the test rejects too often.
The pooled test is exact only if the variances are equal. That assumption fails here, so use Welch's test. (If the large group had the large variance, the error would go the other way, making the test conservative.)

@ stat h stat-h-051
T: Adding an observation equal to the sample mean
S: t-test
TYPE: nat
TOL: 0.01
Q: A sample of $n=9$ has $\bar x=10$ and $s=3$ (denominator $n-1$), and the one-sample statistic for $H_0:\mu=8$ is $t=2$. A tenth observation equal to $10$ is added. What is the new $t$ statistic? Enter it to 2 decimal places.
ANS: 2.24
EXP: The new value equals the mean, so $\bar x$ stays $10$ and the sum of squared deviations stays $(n-1)s^2=8\times9=72$.
New $s^2=72/9=8$, so $s=2.828$. New SE $=2.828/\sqrt{10}=0.894$.
$t=\dfrac{10-8}{0.894}\approx2.24$.
The statistic rises for two reasons: $s$ shrinks (same sum of squares, one more df) and $\sqrt n$ grows.

@ stat h stat-h-052
T: Choosing the test direction after seeing the data
S: t-test
Q: A researcher looks at the sample first and then runs a one-sided $t$-test at $\alpha=0.05$ in whichever direction the sample mean points. If $H_0$ is true, what is the actual probability of rejecting $H_0$?
A: $0.10$
B: $0.05$
C: $0.025$
D: $0.0025$
ANS: A
EXP: The procedure rejects if $t>t_{0.05}$ (when the mean is above $\mu_0$) or if $t<-t_{0.05}$ (when it is below).
That is a two-sided test with $0.05$ in each tail, so $P(\text{reject}\mid H_0)=0.05+0.05=0.10$.
The nominal $0.05$ is honest only when the direction is fixed before seeing the data.

@ stat h stat-h-053
T: Smallest imbalance that a 2x2 test detects
S: chi-squared-test
TYPE: nat
TOL: 0
Q: $200$ users are split equally between two page designs. The click table is $\begin{pmatrix}a&100-a\\100-a&a\end{pmatrix}$ (rows: designs, columns: click / no click). Test independence at $\alpha=0.05$ with $\chi^2_{0.05,1}=3.841$ (no continuity correction). What is the smallest integer $a>50$ for which $H_0$ is rejected? Enter the integer.
ANS: 57
EXP: Every margin is $100$, so every expected count is $50$. Write $a=50+x$. Then each cell deviates by $\pm x$:
$\chi^2=4\cdot\dfrac{x^2}{50}=0.08x^2$.
Reject if $0.08x^2>3.841$, so $x^2>48.0$ and $x\ge7$ ($x=6$ gives $2.88$, $x=7$ gives $3.92$).
Smallest $a=57$: a click rate of $57\%$ vs $43\%$ is needed at this sample size.

@ stat h stat-h-054
T: Degrees of freedom after merging sparse categories
S: chi-squared-test
Q: To test whether the number of heads in $4$ tosses of a coin follows a Binomial$(4,p)$ model, $p$ is estimated from the data. The $5$ categories ($0,1,2,3,4$ heads) are reduced to $4$ by merging "3" and "4", because their expected counts are below $5$. How many degrees of freedom does the goodness-of-fit test have?
A: $3$
B: $4$
C: $2$
D: $1$
ANS: C
EXP: df $=k-1-m$, where $k$ is the number of categories actually used in the statistic and $m$ is the number of estimated parameters.
After merging, $k=4$. One parameter $p$ is estimated, so df $=4-1-1=2$.
$3$ forgets the estimated $p$. $4$ uses the original 5 categories and forgets the estimate. Merging changes the number of terms in $\sum(O-E)^2/E$, so $k$ must be the merged count.

@ stat h stat-h-055
T: Phi coefficient from a 2x2 chi-square
S: chi-squared-test
Q: A chi-square test of independence on a $2\times2$ table with $n=100$ observations gives $\chi^2=9$. What is the magnitude of the phi coefficient (the correlation between the two binary variables)?
A: $0.09$
B: $0.03$
C: $0.9$
D: $0.3$
ANS: D
EXP: For a $2\times2$ table, $\chi^2=n\,\phi^2$, where $\phi$ is the Pearson correlation of the two 0/1 variables.
$|\phi|=\sqrt{\chi^2/n}=\sqrt{9/100}=0.3$.
$0.09$ is $\phi^2$. So a highly significant $\chi^2$ (well above $3.841$) can still mean only a modest association. Significance and strength are different things.

@ stat h stat-h-056
T: z statistic recovered from a 2x2 chi-square
S: chi-squared-test
Q: Out of $100$ users each, $45$ convert with version A and $30$ with version B. The chi-square test of independence on this $2\times2$ table (no continuity correction) gives $\chi^2=4.8$. What is $|z|$ for the pooled two-proportion $z$-test on the same data?
A: $4.8$
B: $2.19$
C: $23.04$
D: $1.10$
ANS: B
EXP: For a $2\times2$ table, the uncorrected chi-square statistic equals the square of the pooled two-proportion $z$: $\chi^2=z^2$, and $\chi^2_1$ is the distribution of $Z^2$.
So $|z|=\sqrt{4.8}\approx2.19$.
Check directly: $\hat p=0.375$, SE $=\sqrt{0.375\times0.625\times\frac2{100}}\approx0.0685$, $z=0.15/0.0685\approx2.19$.
The two tests give the same two-sided p-value. $23.04$ squares again in place of taking the root.

@ stat h stat-h-057
T: Chi-square test across three ad variants
S: chi-squared-test
Q: Three ad variants are each shown $100$ times and get $20$, $30$ and $40$ clicks. Test whether the click rate is the same for all variants. Table values: $\chi^2_{0.05,2}=5.991$, $\chi^2_{0.01,2}=9.210$, $\chi^2_{0.05,3}=7.815$, $\chi^2_{0.01,3}=11.345$. Which is correct?
A: $\chi^2\approx9.52$ and $p<0.01$
B: $\chi^2\approx6.67$ and $0.01<p<0.05$
C: $\chi^2\approx9.52$ and $0.01<p<0.05$
D: $\chi^2\approx2.86$ and $p>0.05$
ANS: A
EXP: Pooled click rate $=90/300=0.3$, so expected counts are $30$ clicks and $70$ non-clicks per variant.
Clicks: $\frac{100}{30}+0+\frac{100}{30}=6.67$. Non-clicks (observed $80,70,60$): $\frac{100}{70}+0+\frac{100}{70}=2.86$.
