<style>
/* Layout idea: a quiet problem sheet on graph-paper grey; one ink-blue accent; difficulty colours carry state. */
:root {
  --bg: #eef0f3; --surface: #ffffff; --ink: #161a23; --muted: #596273; --line: #d9dde4; --accent: #2449c7;
  --accent-soft: #e5ebfb; --ok: #16865b; --ok-soft: #e2f4ec; --bad: #c4372f; --bad-soft: #fbe7e5;
  --easy: #16865b; --med: #b77600; --hard: #c4372f;
  --f-display: "IBM Plex Serif", Georgia, serif; --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10131a; --surface: #181c25; --ink: #e5e8ef; --muted: #98a1b3; --line: #2a303d; --accent: #86a2ff;
  --accent-soft: #1f2840; --ok: #3fc58c; --ok-soft: #13291f; --bad: #ff7a70; --bad-soft: #2f1716;
  --easy: #3fc58c; --med: #f0b232; --hard: #ff7a70; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10131a; --surface: #181c25; --ink: #e5e8ef; --muted: #98a1b3; --line: #2a303d; --accent: #86a2ff;
  --accent-soft: #1f2840; --ok: #3fc58c; --ok-soft: #13291f; --bad: #ff7a70; --bad-soft: #2f1716;
  --easy: #3fc58c; --med: #f0b232; --hard: #ff7a70; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0; background: var(--bg); opacity: .82; z-index: -1; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topin { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { font: 600 18px/1 var(--f-display); letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
.brand i { font-style: italic; color: var(--accent); font-family: var(--f-display); }
#nav { display: flex; gap: 2px; }
#nav a { color: var(--muted); text-decoration: none; padding: 7px 12px; border-radius: 6px; font-weight: 500; font-size: 15px; }
#nav a:hover { color: var(--ink); background: var(--bg); }
#nav a.on { color: var(--accent); background: var(--accent-soft); }
#hstats { margin-left: auto; display: flex; gap: 14px; font-size: 14px; color: var(--muted); }
.hs b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }

main { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font: 600 30px/1.15 var(--f-display); letter-spacing: -.015em; margin: 0 0 6px; text-wrap: balance; }
.h2 { font: 600 19px/1.3 var(--f-display); margin: 28px 0 10px; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; }
.eyebrow { font: 500 13px/1 var(--f-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; }
.phead { margin-bottom: 18px; }

.hero { display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; margin-bottom: 18px; flex-wrap: wrap; }
.streakbox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px; text-align: center; min-width: 120px; font-size: 13px; color: var(--muted); }
.streakbox .big { font: 500 38px/1 var(--f-mono); color: var(--ink); }
.streakbox .sub { font-size: 12px; margin-top: 2px; }
.segs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
.seg { height: 8px; border-radius: 4px; background: var(--line); }
.seg.ok { background: var(--ok); } .seg.bad { background: var(--bad); }
.todaybar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; color: var(--muted); font-size: 15px; flex-wrap: wrap; }
.done { color: var(--ok); font-weight: 600; }
.banner { background: var(--ok-soft); color: var(--ink); border: 1px solid var(--ok); border-radius: 8px; padding: 12px 16px; margin: 14px 0; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 15px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.warn { border-color: var(--bad); color: var(--bad); }

.filters { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; margin-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 14px; cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.frow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.frow select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.count { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.grow { flex: 1; }

.plist { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.plist li + li { border-top: 1px solid var(--line); }
.prow { width: 100%; display: grid; grid-template-columns: 22px 34px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 11px 14px; background: transparent; border: 0; cursor: pointer; }
.prow:hover { background: var(--bg); }
.plist li:nth-child(even) .prow { background: color-mix(in srgb, var(--bg) 45%, var(--surface)); }
.plist li:nth-child(even) .prow:hover { background: var(--bg); }
.pnum { font: 13px var(--f-mono); color: var(--muted); }
.ptitle { font-weight: 500; }
.pmeta { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.st { font-weight: 700; text-align: center; }
.st-ok { color: var(--ok); } .st-bad { color: var(--bad); } .st-new { color: var(--line); }
.pill { font: 500 12px/1 var(--f-body); padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.d-e { color: var(--easy); background: color-mix(in srgb, var(--easy) 13%, transparent); }
.d-m { color: var(--med); background: color-mix(in srgb, var(--med) 15%, transparent); }
.d-h { color: var(--hard); background: color-mix(in srgb, var(--hard) 13%, transparent); }
.tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
.tag.fresh, .tag.prev { border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
.tag.qtype { color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 2px 6px; font-weight: 500; }
.subchips { padding-top: 10px; border-top: 1px dashed var(--line); }
.subchips .chip { font-size: 13px; padding: 4px 10px; }
.chip .cn { font: 12px var(--f-mono); opacity: .7; margin-left: 2px; }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.star { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
.star.on { color: var(--med); }
.empty { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; }

.tabs { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tab.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tab .n { font-family: var(--f-mono); margin-left: 4px; }

.sbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.sbar .pos { font: 14px var(--f-mono); color: var(--muted); margin-right: auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.qmeta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.qtitle { font-size: 24px; margin-bottom: 14px; }
.qtext { font-size: 17px; line-height: 1.65; max-width: 68ch; margin-bottom: 18px; overflow-x: auto; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 9px; padding: 10px 14px; cursor: pointer; min-height: 50px; overflow-x: auto; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .ol { font: 500 14px/1 var(--f-mono); width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ol { background: var(--accent); color: var(--surface); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .ol { background: var(--ok); color: var(--surface); }
.opt.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrongpick .ol { background: var(--bad); color: var(--surface); }
.opt.multi .ol { border-radius: 3px; outline: 1.5px solid var(--line); outline-offset: -1.5px; }
.opt.multi.sel .ol { outline-color: var(--accent); }
.opt.right.missed { border-style: dashed; }
.selhint { font-size: 14px; color: var(--muted); margin: -6px 0 10px; }
.natwrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.natwrap label { font-weight: 500; }
.natin { font: 500 18px var(--f-mono); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 12px; width: 200px; max-width: 100%; }
.natin:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.natin.right { border-color: var(--ok); background: var(--ok-soft); }
.natin.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
.nathint { font-size: 14px; color: var(--muted); }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.kbd { font-size: 12px; color: var(--muted); margin-left: auto; }
.result { margin-top: 20px; border-left: 4px solid var(--ok); background: var(--ok-soft); border-radius: 0 8px 8px 0; padding: 14px 18px; }
.result.bad { border-color: var(--bad); background: var(--bad-soft); }
.verdict { font-weight: 600; margin: 0 0 6px; }
.result.ok .verdict { color: var(--ok); } .result.bad .verdict { color: var(--bad); }
.exp { line-height: 1.7; max-width: 70ch; overflow-x: auto; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.tile .k { font-size: 13px; color: var(--muted); }
.tile .v { font: 500 30px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 15px; color: var(--muted); }
.tile .s { font-size: 12px; color: var(--muted); }
.tblwrap { overflow-x: auto; }
.grid { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.grid th, .grid td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: left; }
.grid tbody th { font-weight: 500; white-space: nowrap; }
.grid tr:last-child th, .grid tr:last-child td { border-bottom: 0; }
.cell { display: grid; gap: 4px; min-width: 110px; }
.frac { font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; }
.frac small { color: var(--muted); font-size: 13px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: currentColor; }
.bar i.d-e { color: var(--easy); } .bar i.d-m { color: var(--med); } .bar i.d-h { color: var(--hard); }
.gstat { font-size: 12px; color: var(--muted); }
.bar i.d-acc { color: var(--accent); }
.subtopic-head { margin-bottom: 10px; }
.subgrid td.num { font: 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.subgrid tr.nodata th, .subgrid tr.nodata td { color: var(--muted); }
.heat { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; }
.hdays { display: grid; grid-template-rows: repeat(7, 14px); gap: 3px; font-size: 10px; color: var(--muted); line-height: 14px; }
.hgrid { display: flex; gap: 3px; }
.hcol { display: grid; grid-template-rows: repeat(7, 14px); gap: 3px; }
.hc { width: 14px; height: 14px; border-radius: 3px; background: var(--line); }
.hc.fut { background: transparent; }
.hc.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.hc.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.hc.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--line)); }
.hc.l4 { background: var(--accent); }
.note { color: var(--muted); font-size: 14px; }
.danger { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); }
footer { max-width: 980px; margin: 0 auto; padding: 0 16px 28px; font-size: 13px; color: var(--muted); }

@media (max-width: 720px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .prow { grid-template-columns: 20px 1fr; }
  .prow .pnum { display: none; }
  .prow .pmeta { grid-column: 2; justify-content: flex-start; }
  #hstats { margin-left: 0; width: 100%; }
  .card { padding: 16px; }
  h1 { font-size: 25px; } .qtitle { font-size: 21px; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<script type="text/plain" id="bank">
@ la e la-e-001
T: Rank of a 2×2 matrix
S: rank-nullity
Q: What is the rank of $A=\begin{pmatrix}1&2\\2&4\end{pmatrix}$?
A: $0$
B: $1$
C: $2$
D: $4$
ANS: B
EXP: Row 2 is exactly $2\times$ Row 1, so there is only one linearly independent row.
Check: $\det A = 1\cdot4-2\cdot2=0$, so rank $<2$; and $A\neq 0$, so rank $\ge 1$. Hence rank $=1$.


@ la e la-e-002
T: Eigenvalues of a triangular matrix
S: eigen
Q: What are the eigenvalues of $A=\begin{pmatrix}3&1\\0&-2\end{pmatrix}$?
A: $3$ and $-2$
B: $3$ and $1$
C: $1$ and $-2$
D: $2$ and $-3$
ANS: A
EXP: For any triangular matrix the eigenvalues are the diagonal entries.
$\det(A-\lambda I)=(3-\lambda)(-2-\lambda)=0 \Rightarrow \lambda=3,\,-2$. The off-diagonal $1$ does not affect them.


@ la e la-e-003
T: Determinant of a scaled matrix
S: determinants
Q: $A$ is a $3\times3$ matrix with $\det A=4$. What is $\det(2A)$?
A: $8$
B: $16$
C: $32$
D: $64$
ANS: C
EXP: Scaling a matrix by $c$ scales every one of its $n$ rows by $c$, so $\det(cA)=c^n\det A$.
Here $\det(2A)=2^3\cdot 4=32$. A common trap is answering $2\cdot4=8$.


@ la e la-e-004
T: Determinant of the inverse
S: determinants
Q: A $3\times3$ matrix $A$ has eigenvalues $1,2,3$. What is $\det(A^{-1})$?
A: $6$
B: $\frac{1}{6}$
C: $-6$
D: $\frac{1}{2}$
ANS: B
EXP: $\det A$ is the product of eigenvalues: $1\cdot2\cdot3=6$.
Since $\det(A^{-1})=1/\det A$, the answer is $\frac16$. (Equivalently, $A^{-1}$ has eigenvalues $1,\tfrac12,\tfrac13$.)


@ la e la-e-005
T: Orthogonal vectors
S: vectors-norms
Q: For which $k$ are $u=(1,k,2)$ and $v=(3,-1,1)$ orthogonal?
A: $-5$
B: $5$
C: $1$
D: $3$
ANS: B
EXP: Orthogonal means $u\cdot v=0$: $1\cdot3+k\cdot(-1)+2\cdot1=5-k=0$, so $k=5$.


@ la e la-e-006
T: Solutions of a non-singular system
S: linear-systems
Q: $A$ is a $3\times3$ matrix with $\det A\neq0$. The system $Ax=b$ has:
A: no solution for some $b$
B: exactly one solution for every $b$
C: infinitely many solutions for every $b$
D: a unique solution only when $b=0$
ANS: B
EXP: $\det A\ne0$ means $A$ is invertible (full rank 3), so $x=A^{-1}b$ is the one and only solution for every $b\in\mathbb R^3$.


@ la e la-e-007
T: Transpose of a product
S: matrix-ops
Q: For conformable matrices $A$ and $B$, $(AB)^T$ equals:
A: $A^TB^T$
B: $B^TA^T$
C: $BA$
D: $(BA)^T$
ANS: B
EXP: Transpose reverses the order: $(AB)^T=B^TA^T$.
Quick dimension check: if $A$ is $m\times n$ and $B$ is $n\times p$, then $(AB)^T$ is $p\times m$, and only $B^T(p\times n)\,A^T(n\times m)$ produces that shape.


@ la e la-e-008
T: Rank–nullity theorem
S: rank-nullity
Q: A $4\times6$ matrix has rank $3$. What is the dimension of its null space?
A: $1$
B: $2$
C: $3$
D: $6$
ANS: C
EXP: Rank–nullity: rank + nullity = number of columns $=6$.
So nullity $=6-3=3$. (Using rows instead, $4-3=1$, is the common mistake; that is the dimension of the left null space.)


@ la e la-e-009
T: Euclidean norm
S: vectors-norms
Q: What is the $L_2$ norm of $x=(3,4,12)$?
A: $19$
B: $13$
C: $12$
D: $169$
ANS: B
EXP: $\|x\|_2=\sqrt{3^2+4^2+12^2}=\sqrt{9+16+144}=\sqrt{169}=13$.
$19$ is the $L_1$ norm and $169$ is $\|x\|_2^2$.


@ la e la-e-010
T: Eigenvalues of a real symmetric matrix
S: special-matrices
Q: The eigenvalues of every real symmetric matrix are:
A: always real
B: always positive
C: always distinct
D: always integers
ANS: A
EXP: The spectral theorem says a real symmetric matrix has real eigenvalues and an orthonormal set of eigenvectors.
They need not be positive (e.g. $\mathrm{diag}(1,-1)$) or distinct (e.g. $I$). This is why covariance matrices in PCA can always be diagonalised.


@ la e la-e-011
T: Shape of a matrix product
S: matrix-ops
Q: $A$ is $3\times4$ and $B$ is $4\times2$. What is the shape of $AB$?
A: $4\times4$
B: $3\times2$
C: $2\times3$
D: undefined
ANS: B
EXP: $(m\times n)(n\times p)=m\times p$. The inner dimensions ($4$) match and disappear, leaving $3\times2$.


@ la m la-m-001
T: Eigenvalues of a 2×2 matrix
S: eigen
Q: What are the eigenvalues of $A=\begin{pmatrix}4&1\\2&3\end{pmatrix}$?
A: $5$ and $2$
B: $4$ and $3$
C: $6$ and $1$
D: $7$ and $10$
ANS: A
EXP: For a $2\times2$ matrix, $\lambda^2-(\operatorname{tr}A)\lambda+\det A=0$.
$\operatorname{tr}A=7$, $\det A=12-2=10$, so $\lambda^2-7\lambda+10=(\lambda-5)(\lambda-2)=0$.
Check: $5+2=7$ (trace) and $5\cdot2=10$ (det).


@ la m la-m-002
T: Eigenvalues of an idempotent matrix
S: special-matrices
Q: If $A^2=A$ (an idempotent / projection matrix), its eigenvalues can only be:
A: $0$ or $1$
B: $1$ or $-1$
C: any real number
D: $1$ only
ANS: A
EXP: If $Av=\lambda v$ with $v\ne0$, then $A^2v=\lambda^2v$. But $A^2v=Av=\lambda v$, so $\lambda^2=\lambda$, giving $\lambda\in\{0,1\}$.
Projection matrices such as the hat matrix $H=X(X^TX)^{-1}X^T$ in regression are idempotent.


@ la m la-m-003
T: Rank of the 1–9 matrix
S: rank-nullity
Q: What is the rank of $\begin{pmatrix}1&2&3\\4&5&6\\7&8&9\end{pmatrix}$?
A: $1$
B: $2$
C: $3$
D: $0$
ANS: B
EXP: $R_2-R_1=(3,3,3)$ and $R_3-R_2=(3,3,3)$, so $R_1-2R_2+R_3=0$: the rows are dependent and rank $<3$.
$R_1$ and $R_2$ are not multiples of each other, so rank $=2$ (and $\det=0$).


@ la m la-m-004
T: Properties of orthogonal matrices
S: special-matrices
Q: $Q$ is a real orthogonal matrix. Which statement is NOT necessarily true?
A: $Q^TQ=I$
B: $\|Qx\|=\|x\|$ for all $x$
C: $\det Q=\pm1$
D: $Q$ is symmetric
ANS: D
EXP: Orthogonality gives $Q^TQ=I$, which implies length preservation $\|Qx\|^2=x^TQ^TQx=\|x\|^2$ and $\det(Q)^2=1$.
It does not force symmetry: the rotation $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ is orthogonal but $Q^T\ne Q$.


@ la m la-m-005
T: Vector projection
S: projections-least-squares
Q: What is the projection of $b=(2,3)$ onto $a=(1,1)$?
A: $(2.5,\ 2.5)$
B: $(5,\ 5)$
C: $(2,\ 3)$
D: $(1.25,\ 1.25)$
ANS: A
EXP: $\operatorname{proj}_a b=\dfrac{a\cdot b}{a\cdot a}\,a=\dfrac{2+3}{1+1}(1,1)=\tfrac52(1,1)=(2.5,2.5)$.
Forgetting to divide by $a\cdot a$ gives $(5,5)$.


@ la m la-m-006
T: Eigenvalues of a matrix polynomial
S: eigen
Q: $A=\begin{pmatrix}2&1\\1&2\end{pmatrix}$. What are the eigenvalues of $B=A^3-2A+I$?
A: $0$ and $22$
B: $1$ and $3$
C: $0$ and $20$
D: $2$ and $22$
ANS: A
EXP: Eigenvalues of $A$: trace $4$, det $3$, so $\lambda=1,3$.
If $Av=\lambda v$ then $p(A)v=p(\lambda)v$ for any polynomial $p$. With $p(\lambda)=\lambda^3-2\lambda+1$:
$p(1)=1-2+1=0$ and $p(3)=27-6+1=22$. So $B$ is singular.


@ la m la-m-007
T: Positive definite check
S: quadratic-forms
Q: Which matrix is positive definite?
A: $\begin{pmatrix}2&-1\\-1&2\end{pmatrix}$
B: $\begin{pmatrix}1&2\\2&1\end{pmatrix}$
C: $\begin{pmatrix}0&1\\1&0\end{pmatrix}$
D: $\begin{pmatrix}1&0\\0&0\end{pmatrix}$
ANS: A
EXP: A symmetric matrix is PD iff all eigenvalues are $>0$ (or all leading principal minors $>0$).
[[A]]: minors $2>0$, $4-1=3>0$ → eigenvalues $1,3$: PD.
[[B]]: eigenvalues $3,-1$. [[C]]: eigenvalues $\pm1$. [[D]]: eigenvalues $1,0$, only positive semidefinite.


@ la m la-m-008
T: Eigenvalue of an outer product
S: eigen
Q: Let $x=(1,2,2)^T$. What is the only nonzero eigenvalue of $xx^T$?
A: $3$
B: $5$
C: $9$
D: $1$
ANS: C
EXP: $(xx^T)x=x(x^Tx)=\|x\|^2x$, so $x$ is an eigenvector with eigenvalue $\|x\|^2=1+4+4=9$.
$xx^T$ has rank 1, so the other two eigenvalues are $0$. (Trace check: $1+4+4=9$.)


@ la m la-m-009
T: Singular values of a diagonal matrix
S: svd-pca
Q: What are the singular values of $\begin{pmatrix}3&0\\0&-4\end{pmatrix}$?
A: $3$ and $-4$
B: $4$ and $3$
C: $9$ and $16$
D: $7$ and $1$
ANS: B
EXP: Singular values are $\sqrt{\text{eigenvalues of }A^TA}$. $A^TA=\mathrm{diag}(9,16)$, so $\sigma=4,3$.
Singular values are never negative; the sign goes into the singular vectors. $9,16$ are the eigenvalues of $A^TA$, not the singular values.


@ la m la-m-010
T: Inverse via Cayley–Hamilton
S: eigen
Q: For $A=\begin{pmatrix}1&2\\3&4\end{pmatrix}$, which expression equals $A^{-1}$?
A: $\frac{1}{2}(A-5I)$
B: $\frac{1}{2}(5I-A)$
C: $\frac{1}{2}(A+5I)$
D: $\frac{1}{5}(A-2I)$
ANS: A
EXP: Characteristic polynomial: $\lambda^2-5\lambda-2$ (trace 5, det $-2$).
Cayley–Hamilton: $A^2-5A-2I=0\Rightarrow A(A-5I)=2I\Rightarrow A^{-1}=\tfrac12(A-5I)$.
Check: $\tfrac12\begin{pmatrix}-4&2\\3&-1\end{pmatrix}=\begin{pmatrix}-2&1\\1.5&-0.5\end{pmatrix}$, which is the inverse.


@ la h la-h-001
T: Determinant of I + all-ones matrix
S: determinants
Q: Let $J$ be the $4\times4$ matrix of all ones. What is $\det(I+J)$?
A: $1$
B: $4$
C: $5$
D: $16$
ANS: C
EXP: $J=\mathbf 1\mathbf 1^T$ has rank 1, with eigenvalue $\mathbf 1^T\mathbf 1=4$ (eigenvector $\mathbf 1$) and $0$ with multiplicity 3.
$I+J$ shifts every eigenvalue by 1: $5,1,1,1$. So $\det(I+J)=5$.
In general $\det(I+uv^T)=1+v^Tu$ (matrix determinant lemma).


@ la h la-h-002
T: Square of a rank-one matrix
S: matrix-ops
Q: Let $u=(1,2,3)^T$, $v=(1,1,-1)^T$ and $A=uv^T$. Then $A^2$ equals:
A: the zero matrix
B: $A$
C: $2A$
D: $6A$
ANS: A
EXP: $A^2=u(v^Tu)v^T=(v^Tu)\,uv^T=(v^Tu)A$.
$v^Tu=1+2-3=0$, so $A^2=0$: $A$ is nilpotent even though $A\ne0$. All its eigenvalues are $0$.


@ la h la-h-003
T: Least squares through the origin
S: projections-least-squares
Q: Fit $y=mx$ (no intercept) by least squares to the points $(1,2),(2,3),(3,7)$. What is $m$?
A: $\frac{29}{14}$
B: $2$
C: $\frac{7}{3}$
D: $\frac{29}{6}$
ANS: A
EXP: Minimise $\sum(y_i-mx_i)^2$. Setting the derivative to zero gives the normal equation $m=\dfrac{\sum x_iy_i}{\sum x_i^2}$.
$\sum x_iy_i=2+6+21=29$, $\sum x_i^2=1+4+9=14$, so $m=\tfrac{29}{14}\approx2.07$.
This is $(X^TX)^{-1}X^Ty$ with $X=(1,2,3)^T$. $\sum y/\sum x=2$ is a ratio of means, not the least squares fit.


@ la h la-h-004
T: Involutory matrix with given trace
S: special-matrices
Q: A $3\times3$ real matrix satisfies $A^2=I$ and $\operatorname{tr}A=1$. What is $\det A$?
A: $1$
B: $-1$
C: $0$
D: $3$
ANS: B
EXP: $A^2=I\Rightarrow\lambda^2=1\Rightarrow\lambda\in\{1,-1\}$.
Three eigenvalues from $\{\pm1\}$ summing to $1$: must be $1,1,-1$. So $\det A=1\cdot1\cdot(-1)=-1$.


@ la h la-h-005
T: Determinant of AB with mismatched shapes
S: rank-nullity
Q: $A$ is $5\times3$ and $B$ is $3\times5$. What is $\det(AB)$?
A: $0$ always
B: $1$
C: $\det A\cdot\det B$
D: cannot be determined
ANS: A
EXP: $\operatorname{rank}(AB)\le\min(\operatorname{rank}A,\operatorname{rank}B)\le3$, but $AB$ is $5\times5$.
A $5\times5$ matrix of rank at most 3 is singular, so $\det(AB)=0$. ($\det A$ is not even defined for a non-square $A$.)


@ la h la-h-006
T: Eckart–Young best low-rank approximation
S: svd-pca
Q: A matrix has singular values $5,3,1$. What is the Frobenius-norm error of its best rank-1 approximation?
A: $\sqrt{10}$
B: $3$
C: $4$
D: $\sqrt{34}$
ANS: A
EXP: Eckart–Young: the best rank-$k$ approximation keeps the top $k$ singular values (truncated SVD), and
$\|A-A_k\|_F=\sqrt{\sum_{i>k}\sigma_i^2}$. Here $\sqrt{3^2+1^2}=\sqrt{10}$.
In the spectral (2-) norm the error would be $\sigma_2=3$. This is the maths behind PCA and low-rank compression.


@ la h la-h-007
T: Convergence rate of power iteration
S: eigen
Q: $A$ has eigenvalues $4,-3,1$. Power iteration converges to the dominant eigenvector, with error shrinking each step by a factor of about:
A: $\frac14$
B: $\frac34$
C: $\frac13$
D: $\frac43$
ANS: B
EXP: Write $x_0=\sum c_iv_i$. Then $A^kx_0=4^k\left(c_1v_1+c_2(-\tfrac34)^kv_2+c_3(\tfrac14)^kv_3\right)$.
The slowest-decaying term is governed by $|\lambda_2/\lambda_1|=3/4$. Magnitudes matter, so $-3$ counts as 3.


@ la h la-h-008
T: What similar matrices share
S: eigen
Q: $B=P^{-1}AP$ for an invertible $P$. Which of these do $A$ and $B$ NOT necessarily share?
A: eigenvalues
B: determinant
C: rank
D: eigenvectors
ANS: D
EXP: Similar matrices represent the same linear map in different bases, so they share the characteristic polynomial (eigenvalues, trace, determinant) and rank.
Eigenvectors change with the basis: if $Av=\lambda v$ then $B(P^{-1}v)=\lambda(P^{-1}v)$, so $B$'s eigenvector is $P^{-1}v$.


@ la h la-h-009
T: Diagonalisability over the reals
S: eigen
Q: Which matrix is diagonalisable over $\mathbb R$?
A: $\begin{pmatrix}2&1\\0&2\end{pmatrix}$
B: $\begin{pmatrix}2&1\\0&3\end{pmatrix}$
C: $\begin{pmatrix}0&1\\0&0\end{pmatrix}$
D: $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$
ANS: B
EXP: [[B]] has distinct real eigenvalues $2,3$, and distinct eigenvalues always give independent eigenvectors, so it is diagonalisable.
[[A]] and [[C]] have a repeated eigenvalue with only one eigenvector (Jordan blocks). [[D]] is a rotation with eigenvalues $\pm i$, so it is not diagonalisable over $\mathbb R$.


@ la h la-h-010
T: Determinant of a Householder reflector
S: special-matrices
Q: For a nonzero $u\in\mathbb R^n$, let $H=I-\dfrac{2uu^T}{u^Tu}$. What is $\det H$?
A: $1$
B: $-1$
C: $0$
D: depends on $u$
ANS: B
EXP: $Hu=u-2u=-u$, so $u$ has eigenvalue $-1$.
Any $w\perp u$ gives $Hw=w$, so eigenvalue $1$ with multiplicity $n-1$.
$\det H=(-1)\cdot1^{n-1}=-1$. $H$ is a reflection: orthogonal and symmetric. It is used in QR decomposition.

@ la e la-e-012
T: L1 norm of a vector
S: vectors-norms
Q: What is the $L_1$ norm $\|x\|_1$ of $x=(3,-4,1,-2)$?
A: $10$
B: $-2$
C: $\sqrt{30}$
D: $4$
ANS: A
EXP: The $L_1$ norm is the sum of absolute values: $\|x\|_1=|3|+|-4|+|1|+|-2|=10$.
$-2$ is the plain sum (forgetting absolute values), $\sqrt{30}$ is the $L_2$ norm, and $4$ is the $L_\infty$ norm (largest absolute entry).
In ML, the $L_1$ penalty (lasso) uses exactly this norm and pushes weights to be exactly zero.


@ la e la-e-013
T: Cosine similarity of two vectors
S: vectors-norms
TYPE: nat
TOL: 0.01
Q: Find the cosine similarity $\dfrac{u\cdot v}{\|u\|\,\|v\|}$ of $u=(1,2,2)$ and $v=(2,1,2)$. Give your answer to 2 decimal places.
ANS: 0.89
EXP: Dot product: $u\cdot v=1\cdot2+2\cdot1+2\cdot2=8$.
Norms: $\|u\|=\sqrt{1+4+4}=3$ and $\|v\|=\sqrt{4+1+4}=3$.
Cosine similarity $=\frac{8}{3\cdot3}=\frac89\approx0.89$.
A common slip is dividing by $\|u\|^2+\|v\|^2=18$ or by only one norm. Cosine similarity is how embeddings (words, sentences) are usually compared.


@ la e la-e-014
T: Unit vector in a given direction
S: vectors-norms
Q: What is the unit vector in the direction of $v=(2,-1,2)$?
A: $\left(\tfrac23,-\tfrac13,\tfrac23\right)$
B: $\left(\tfrac25,-\tfrac15,\tfrac25\right)$
C: $\left(\tfrac29,-\tfrac19,\tfrac29\right)$
D: $\left(\tfrac{2}{\sqrt3},-\tfrac{1}{\sqrt3},\tfrac{2}{\sqrt3}\right)$
ANS: A
EXP: Divide $v$ by its $L_2$ norm: $\|v\|=\sqrt{4+1+4}=3$, so $\hat v=v/3=\left(\tfrac23,-\tfrac13,\tfrac23\right)$.
Dividing by $5$ uses the $L_1$ norm, dividing by $9$ uses $\|v\|^2$, and dividing by $\sqrt3$ uses the square root of the number of entries. Only $\|v\|_2=3$ gives a vector of length $1$.


@ la e la-e-015
T: Which sets are subspaces of R^3
S: vector-spaces
TYPE: msq
Q: Which of the following sets are subspaces of $\mathbb R^3$? More than one option may be correct.
A: $\{x\in\mathbb R^3 : x_1+x_2+x_3=0\}$
B: $\{x\in\mathbb R^3 : x_1+x_2+x_3=1\}$
C: $\{x\in\mathbb R^3 : x_1=2x_3\}$
D: $\{x\in\mathbb R^3 : x_1x_2=0\}$
ANS: A,C
EXP: A subspace must contain $0$ and be closed under addition and scalar multiplication.
[[A]] the solution set of a homogeneous linear equation, so it is a subspace (a plane through the origin).
[[B]] $0$ is not in it ($0+0+0\ne1$), so it is not a subspace (it is a shifted plane).
[[C]] $x_1-2x_3=0$ is homogeneous and linear, so it is a subspace.
[[D]] contains $0$ and is closed under scaling, but not under addition: $(1,0,0)$ and $(0,1,0)$ are in it, their sum $(1,1,0)$ is not. Not a subspace.


@ la e la-e-016
T: Dimension of a span
S: vector-spaces
Q: What is the dimension of $\operatorname{span}\{(1,2,3),\ (2,4,6),\ (0,1,1)\}$?
A: $1$
B: $2$
C: $3$
D: $0$
ANS: B
EXP: The dimension of a span is the number of linearly independent vectors in the set.
$(2,4,6)=2(1,2,3)$ adds nothing new. $(0,1,1)$ is not a multiple of $(1,2,3)$, so these two are independent.
So the span is a plane and has dimension $2$. Answering $3$ just counts the vectors without checking for dependence.


@ la e la-e-017
T: Five vectors in R^4
S: vector-spaces
Q: $v_1,\dots,v_5$ are any five vectors in $\mathbb R^4$. Which statement is always true?
A: They are linearly dependent.
B: They are linearly independent.
C: They span $\mathbb R^4$.
D: They are independent as long as none of them is the zero vector.
ANS: A
EXP: $\dim\mathbb R^4=4$, so at most $4$ vectors in $\mathbb R^4$ can be linearly independent. Any $5$ vectors must be dependent.
They need not span $\mathbb R^4$: for example all five could lie on one line. Being nonzero does not prevent dependence either (e.g. $v$ and $2v$).


@ la e la-e-018
T: Dimension of 3×3 symmetric matrices
S: vector-spaces
TYPE: nat
TOL: 0
Q: What is the dimension of the vector space of all real symmetric $3\times3$ matrices?
ANS: 6
EXP: A symmetric matrix is fixed by its diagonal and the entries above it, since $a_{ji}=a_{ij}$.
Free entries: $3$ on the diagonal $+\ 3$ above it $=6$. In general the dimension is $\frac{n(n+1)}{2}$.
$9$ is the dimension of all $3\times3$ matrices; $3$ counts only the off-diagonal (that is the dimension of skew-symmetric $3\times3$ matrices).


@ la e la-e-019
T: Trace of AB versus BA
S: matrix-ops
Q: $A$ is $2\times3$ and $B$ is $3\times2$, with $\operatorname{tr}(AB)=5$. What is $\operatorname{tr}(BA)$?
A: $5$
B: $0$
C: $\tfrac{15}{2}$
D: It cannot be determined because $BA$ is a different size from $AB$.
ANS: A
EXP: The trace is invariant under cyclic shifts: $\operatorname{tr}(AB)=\operatorname{tr}(BA)$ whenever both products are defined, even if $AB$ ($2\times2$) and $BA$ ($3\times3$) have different sizes.
Reason: both equal $\sum_{i,j}a_{ij}b_{ji}$. So $\operatorname{tr}(BA)=5$.
This identity is used constantly in ML derivations, e.g. $x^TAx=\operatorname{tr}(Axx^T)$.


@ la e la-e-020
T: Matrix identities that always hold
S: matrix-ops
TYPE: msq
Q: $A$ and $B$ are $n\times n$ matrices. Which statements are always true? More than one option may be correct.
A: $(A+B)^T=A^T+B^T$
B: $AB=BA$
C: $\det(A+B)=\det A+\det B$
D: If $A$ and $B$ are invertible, $(AB)^{-1}=B^{-1}A^{-1}$
ANS: A,D
EXP: [[A]] true, transposing is linear, entry by entry.
[[B]] false in general. Example: $A=\begin{pmatrix}0&1\\0&0\end{pmatrix}$, $B=\begin{pmatrix}0&0\\1&0\end{pmatrix}$ give $AB=\begin{pmatrix}1&0\\0&0\end{pmatrix}\ne BA=\begin{pmatrix}0&0\\0&1\end{pmatrix}$.
[[C]] false. With $A=B=I_2$: $\det(2I)=4$ but $\det I+\det I=2$. The determinant is multiplicative, not additive.
[[D]] true, since $(AB)(B^{-1}A^{-1})=A(BB^{-1})A^{-1}=I$. Note the order reverses.


@ la e la-e-021
T: Multiplying by a diagonal matrix on the left
S: matrix-ops
Q: Let $D=\begin{pmatrix}2&0\\0&3\end{pmatrix}$ and $A=\begin{pmatrix}1&2\\3&4\end{pmatrix}$. What is $DA$?
A: $\begin{pmatrix}2&4\\9&12\end{pmatrix}$
B: $\begin{pmatrix}2&6\\6&12\end{pmatrix}$
C: $\begin{pmatrix}2&0\\0&12\end{pmatrix}$
D: $\begin{pmatrix}2&9\\4&12\end{pmatrix}$
ANS: A
EXP: Multiplying by a diagonal matrix on the left scales the rows: row $i$ of $A$ is multiplied by $d_i$.
Row 1 $\times2$: $(2,4)$. Row 2 $\times3$: $(9,12)$. So $DA=\begin{pmatrix}2&4\\9&12\end{pmatrix}$.
$\begin{pmatrix}2&6\\6&12\end{pmatrix}$ is $AD$ (columns scaled), the most common mix-up. $\begin{pmatrix}2&0\\0&12\end{pmatrix}$ is the entrywise (Hadamard) product.


@ la e la-e-022
T: Parameter that makes a system inconsistent
S: linear-systems
Q: For which value of $k$ does the system $x+2y=3,\ 2x+ky=7$ have no solution?
A: $k=4$
B: $k=-4$
C: $k=2$
D: $k=1$
ANS: A
EXP: Eliminate $x$: $R_2-2R_1$ gives $(k-4)y=7-6=1$.
If $k\ne4$, $y=\frac{1}{k-4}$ and there is a unique solution. If $k=4$, the equation becomes $0=1$, so there is no solution (the two lines are parallel and distinct).
$k=2$ makes the coefficients proportional to $1:1$, not $1:2$, so it still gives a unique solution.


@ la e la-e-023
T: Homogeneous system with more unknowns
S: linear-systems
Q: A homogeneous system $Ax=0$ has $3$ equations in $5$ unknowns. Which is always true?
A: It has infinitely many solutions.
B: It has only the trivial solution $x=0$.
C: It has no solution.
D: It has exactly one nonzero solution.
ANS: A
EXP: A homogeneous system always has the solution $x=0$, so it is never inconsistent.
$\operatorname{rank}A\le3<5$, so at least $5-3=2$ variables are free. Each free variable can take any value, giving infinitely many solutions.
"Only the trivial solution" would need $\operatorname{rank}A=5$, which is impossible with 3 rows.


@ la e la-e-024
T: Consistency from ranks of A and [A|b]
S: linear-systems
Q: For a system $Ax=b$, $\operatorname{rank}(A)=2$ and $\operatorname{rank}([A\mid b])=3$. The system has:
A: no solution
B: exactly one solution
C: infinitely many solutions
D: exactly two solutions
ANS: A
EXP: By the Rouché–Capelli criterion, $Ax=b$ is consistent if and only if $\operatorname{rank}(A)=\operatorname{rank}([A\mid b])$.
Here the ranks differ: adding $b$ raised the rank, so $b$ is not in the column space of $A$. There is no solution.
(A linear system can never have exactly two solutions: it has $0$, $1$, or infinitely many.)


@ la e la-e-025
T: Rank of a Gram matrix
S: rank-nullity
Q: A data matrix $X$ is $50\times4$ with $\operatorname{rank}(X)=3$. What is $\operatorname{rank}(X^TX)$?
A: $3$
B: $4$
C: $50$
D: $9$
ANS: A
EXP: For any real matrix, $\operatorname{rank}(X^TX)=\operatorname{rank}(X)$, because $X^TXv=0 \Rightarrow v^TX^TXv=\|Xv\|^2=0 \Rightarrow Xv=0$, so both have the same null space.
So $\operatorname{rank}(X^TX)=3$, even though $X^TX$ is $4\times4$.
This is why the normal equations $X^TX\beta=X^Ty$ have no unique solution when the features are linearly dependent (here one of the 4 columns is redundant).


@ la e la-e-026
T: Smallest possible nullity of a 3×5 matrix
S: rank-nullity
TYPE: nat
TOL: 0
Q: $A$ is a real $3\times5$ matrix. What is the smallest possible dimension of the null space of $A$?
ANS: 2
EXP: Rank–nullity: $\operatorname{rank}A+\operatorname{nullity}A=5$ (the number of columns).
The rank is at most $\min(3,5)=3$, so $\operatorname{nullity}A\ge5-3=2$. This is reached by any full-rank $A$.
A common mistake is to use the number of rows instead of columns in the theorem.


@ la e la-e-027
T: Determinant after row operations
S: determinants
Q: $A$ is $3\times3$ with $\det A=3$. Matrix $B$ is formed by swapping two rows of $A$ and then multiplying one row by $2$. What is $\det B$?
A: $-6$
B: $6$
C: $-24$
D: $24$
ANS: A
EXP: Swapping two rows multiplies the determinant by $-1$: $3\to-3$.
Multiplying a single row by $2$ multiplies it by $2$: $-3\to-6$.
$\pm24$ comes from treating "one row times 2" as "whole matrix times 2" ($2^3=8$). $6$ forgets the sign change from the swap.


@ la e la-e-028
T: Determinant of a product with transpose
S: determinants
Q: $A$ and $B$ are $3\times3$ with $\det A=2$ and $\det B=-3$. What is $\det(A^TB^2)$?
A: $18$
B: $-18$
C: $-12$
D: $4.5$
ANS: A
EXP: Use $\det(XY)=\det X\det Y$ and $\det(A^T)=\det A$.
$\det(A^TB^2)=\det A\cdot(\det B)^2=2\cdot9=18$.
$-12$ comes from $\det(B^2)=2\det B$ (wrong), $-18$ from dropping the sign when squaring, and $4.5$ from $\det(A^T)=1/\det A$ (that rule is for the inverse, not the transpose).


@ la e la-e-029
T: Checking an eigenvector
S: eigen
Q: $v=(1,-1)$ is an eigenvector of $A=\begin{pmatrix}2&1\\1&2\end{pmatrix}$. What is its eigenvalue?
A: $1$
B: $3$
C: $-1$
D: $2$
ANS: A
EXP: Compute $Av$ and compare with $v$: $Av=(2-1,\ 1-2)=(1,-1)=1\cdot v$, so $\lambda=1$.
$3$ is the other eigenvalue of $A$, belonging to $(1,1)$. Always multiply out instead of guessing from the matrix entries.


@ la e la-e-030
T: Sum of eigenvalues of a 3×3 matrix
S: eigen
Q: What is the sum of the eigenvalues of $A=\begin{pmatrix}4&1&2\\0&3&5\\1&1&2\end{pmatrix}$?
A: $9$
B: $3$
C: $24$
D: $20$
ANS: A
EXP: The sum of the eigenvalues (with multiplicity) equals the trace: $4+3+2=9$.
$3$ is $\det A$, which equals the product of the eigenvalues, not the sum. $24=4\cdot3\cdot2$ is the product of the diagonal, which equals the determinant only for triangular matrices; $A$ is not triangular.


@ la e la-e-031
T: Consequences of a zero eigenvalue
S: eigen
TYPE: msq
Q: A square matrix $A$ has $0$ as an eigenvalue. Which statements must be true? More than one option may be correct.
A: $A$ is not invertible.
B: $Ax=0$ has a nonzero solution.
C: $A$ is the zero matrix.
D: $\operatorname{tr}(A)=0$.
ANS: A,B
EXP: $\lambda=0$ means $Av=0\cdot v=0$ for some $v\ne0$, so [[B]] holds directly.
Then $\det A=$ product of eigenvalues $=0$, so [[A]] holds.
[[C]] is false: $\begin{pmatrix}1&0\\0&0\end{pmatrix}$ has eigenvalue $0$ but is not zero. [[D]] is false for the same matrix (trace $1$): only one eigenvalue needs to be $0$, not all of them.


@ la e la-e-032
T: Symmetric part of a matrix
S: special-matrices
Q: Every square matrix can be written as $A=S+K$ with $S$ symmetric and $K$ skew-symmetric. For $A=\begin{pmatrix}1&4\\2&3\end{pmatrix}$, what is $S$?
A: $\begin{pmatrix}1&3\\3&3\end{pmatrix}$
B: $\begin{pmatrix}2&6\\6&6\end{pmatrix}$
C: $\begin{pmatrix}0&1\\-1&0\end{pmatrix}$
D: $\begin{pmatrix}1&4\\4&3\end{pmatrix}$
ANS: A
EXP: The symmetric part is $S=\frac12(A+A^T)$ and the skew part is $K=\frac12(A-A^T)$.
$A+A^T=\begin{pmatrix}2&6\\6&6\end{pmatrix}$, so $S=\begin{pmatrix}1&3\\3&3\end{pmatrix}$.
$\begin{pmatrix}2&6\\6&6\end{pmatrix}$ forgets the $\frac12$, and $\begin{pmatrix}0&1\\-1&0\end{pmatrix}$ is $K$. Check: $S+K=A$.
Only $S$ matters in a quadratic form: $x^TAx=x^TSx$.


@ la e la-e-033
T: Which matrices are idempotent
S: special-matrices
TYPE: msq
Q: Which of the following matrices are idempotent ($P^2=P$)? More than one option may be correct.
A: $\begin{pmatrix}1&0\\0&0\end{pmatrix}$
B: $\frac12\begin{pmatrix}1&1\\1&1\end{pmatrix}$
C: $\begin{pmatrix}0&1\\1&0\end{pmatrix}$
D: $\begin{pmatrix}1&1\\0&1\end{pmatrix}$
ANS: A,B
EXP: Square each one.
[[A]] $\begin{pmatrix}1&0\\0&0\end{pmatrix}^2=\begin{pmatrix}1&0\\0&0\end{pmatrix}$. Idempotent (projection onto the $x$-axis).
[[B]] $\frac14\begin{pmatrix}2&2\\2&2\end{pmatrix}=\frac12\begin{pmatrix}1&1\\1&1\end{pmatrix}$. Idempotent (projection onto the line $y=x$).
[[C]] the swap matrix squares to $I$, not to itself. It is involutory, not idempotent.
[[D]] $\begin{pmatrix}1&2\\0&1\end{pmatrix}\ne D$. Not idempotent, even though its eigenvalues are $1,1$.


@ la e la-e-034
T: Missing entries of a skew-symmetric matrix
S: special-matrices
Q: The matrix $A=\begin{pmatrix}0&2&a\\b&0&-1\\3&c&0\end{pmatrix}$ is skew-symmetric. What is $a+b+c$?
A: $-4$
B: $4$
C: $0$
D: $-6$
ANS: A
EXP: Skew-symmetric means $A^T=-A$, i.e. $a_{ji}=-a_{ij}$.
$b=-a_{12}=-2$, $a=-a_{31}=-3$, $c=-a_{23}=1$. So $a+b+c=-3-2+1=-4$.
$4$ is what you get by making $A$ symmetric instead ($a=3$, $b=2$, $c=-1$).


@ la e la-e-035
T: Matrix of a quadratic form
S: quadratic-forms
Q: Which symmetric matrix $A$ gives $x^TAx=x_1^2+4x_1x_2+3x_2^2$?
A: $\begin{pmatrix}1&2\\2&3\end{pmatrix}$
B: $\begin{pmatrix}1&4\\4&3\end{pmatrix}$
C: $\begin{pmatrix}1&4\\0&3\end{pmatrix}$
D: $\begin{pmatrix}1&0\\0&3\end{pmatrix}$
ANS: A
EXP: For symmetric $A$, $x^TAx=a_{11}x_1^2+2a_{12}x_1x_2+a_{22}x_2^2$.
So $a_{11}=1$, $a_{22}=3$, and $2a_{12}=4\Rightarrow a_{12}=a_{21}=2$.
$\begin{pmatrix}1&4\\4&3\end{pmatrix}$ gives $8x_1x_2$ (it forgets to split the cross term). $\begin{pmatrix}1&4\\0&3\end{pmatrix}$ gives the right form but is not symmetric.


@ la e la-e-036
T: Definiteness of a diagonal quadratic form
S: quadratic-forms
Q: The quadratic form $q(x)=2x_1^2-x_2^2+3x_3^2$ is:
A: indefinite
B: positive definite
C: positive semidefinite
D: negative definite
ANS: A
EXP: The matrix is $\operatorname{diag}(2,-1,3)$, whose eigenvalues are $2,-1,3$.
There are both positive and negative eigenvalues: $q(1,0,0)=2>0$ but $q(0,1,0)=-1<0$. So the form is indefinite.
Positive semidefinite would need all eigenvalues $\ge0$; one negative eigenvalue rules it out.


@ la e la-e-037
T: Evaluating a quadratic form
S: quadratic-forms
TYPE: nat
TOL: 0
Q: Let $A=\begin{pmatrix}2&1\\1&3\end{pmatrix}$ and $x=(1,-2)^T$. Find $x^TAx$.
ANS: 10
EXP: First $Ax=(2\cdot1+1\cdot(-2),\ 1\cdot1+3\cdot(-2))=(0,-5)$.
Then $x^TAx=1\cdot0+(-2)(-5)=10$.
Check with the expanded form $2x_1^2+2x_1x_2+3x_2^2=2-4+12=10$. Forgetting the factor $2$ on the cross term gives $12$.


@ la e la-e-038
T: Parameter range for positive definiteness
S: quadratic-forms
Q: For which values of $k$ is $A=\begin{pmatrix}1&k\\k&4\end{pmatrix}$ positive definite?
A: $|k|<2$
B: $|k|\le2$
C: $|k|<4$
D: $k<2$
ANS: A
EXP: Sylvester's criterion: a symmetric matrix is positive definite iff all leading principal minors are positive.
First minor: $1>0$. Second: $\det A=4-k^2>0\iff|k|<2$.
At $|k|=2$ the determinant is $0$, so $A$ is only positive semidefinite; that is why $|k|\le2$ is wrong. $k<2$ wrongly allows $k=-3$, where $\det A=-5$.


@ la e la-e-039
T: Normal equations of least squares
S: projections-least-squares
Q: $A$ is $m\times n$ with $m>n$ and independent columns. The least squares solution $\hat x$ of $Ax\approx b$ satisfies:
A: $A^TA\hat x=A^Tb$
B: $AA^T\hat x=b$
C: $A\hat x=b$
D: $A^TA\hat x=b$
ANS: A
EXP: Minimise $\|Ax-b\|^2$. Setting the gradient $2A^T(Ax-b)$ to zero gives the normal equations $A^TA\hat x=A^Tb$.
$A\hat x=b$ usually has no solution when $m>n$, which is why we use least squares. $A^TA\hat x=b$ does not even have matching sizes ($n$ vs $m$).
In linear regression this is $\hat\beta=(X^TX)^{-1}X^Ty$.


@ la e la-e-040
T: Least squares residual is orthogonal to...
S: projections-least-squares
Q: Let $\hat x$ be the least squares solution of $Ax\approx b$ and $r=b-A\hat x$ the residual. Then $r$ is always orthogonal to:
A: every column of $A$
B: every row of $A$
C: the vector $b$
D: the null space of $A$
ANS: A
EXP: The normal equations $A^T(b-A\hat x)=0$ say $A^Tr=0$, i.e. $r$ is orthogonal to each column of $A$ (the whole column space).
Geometrically, $A\hat x$ is the orthogonal projection of $b$ onto the column space, and $r$ is the perpendicular part.
$r$ is not orthogonal to $b$ in general (unless $r=0$). In regression this means the residuals have zero correlation with every feature column.


@ la e la-e-041
T: Trace of the hat matrix
S: projections-least-squares
TYPE: nat
TOL: 0
Q: $X$ is a $20\times3$ matrix of rank $3$, and $H=X(X^TX)^{-1}X^T$ is the hat (projection) matrix of linear regression. What is $\operatorname{tr}(H)$?
ANS: 3
EXP: Use the cyclic property of the trace: $\operatorname{tr}\big(X(X^TX)^{-1}X^T\big)=\operatorname{tr}\big((X^TX)^{-1}X^TX\big)=\operatorname{tr}(I_3)=3$.
Equivalently, $H$ is a projection onto the 3-dimensional column space of $X$, so its eigenvalues are three $1$s and seventeen $0$s.
$20$ would be the trace of $I_{20}$. In statistics $\operatorname{tr}(H)$ is the number of parameters (degrees of freedom) of the fit.


@ la e la-e-042
T: Least squares fit of a constant
S: projections-least-squares
Q: Fit the model $y=c$ (a constant, no slope) by least squares to the observations $y=1,2,3,10$. What is $\hat c$?
A: $4$
B: $2.5$
C: $\frac{16}{3}$
D: $16$
ANS: A
EXP: Minimise $\sum(y_i-c)^2$. Setting the derivative $-2\sum(y_i-c)$ to zero gives $\hat c=\frac1n\sum y_i=\frac{1+2+3+10}{4}=4$.
In matrix form the design matrix is the column $\mathbf 1=(1,1,1,1)^T$, and $\hat c=\dfrac{\mathbf 1^Ty}{\mathbf 1^T\mathbf 1}=\dfrac{16}{4}$. Forgetting to divide by $\mathbf 1^T\mathbf 1=4$ gives $16$.
$2.5$ is the median, which minimises the absolute loss $\sum|y_i-c|$ (the $L_1$ loss), not the squared loss. The outlier $10$ pulls the mean up but not the median.
$\frac{16}{3}$ divides by $n-1$, which belongs in the sample variance, not in the mean.


@ la e la-e-043
T: The L factor of a 2×2 matrix
S: lu
Q: $A=\begin{pmatrix}2&1\\6&5\end{pmatrix}=LU$ with $L$ unit lower triangular and $U$ upper triangular. What is $L$?
A: $\begin{pmatrix}1&0\\3&1\end{pmatrix}$
B: $\begin{pmatrix}1&0\\-3&1\end{pmatrix}$
C: $\begin{pmatrix}1&0\\\tfrac13&1\end{pmatrix}$
D: $\begin{pmatrix}1&3\\0&1\end{pmatrix}$
ANS: A
EXP: Eliminate below the pivot $2$: the multiplier is $\ell_{21}=6/2=3$, and $R_2-3R_1$ gives $U=\begin{pmatrix}2&1\\0&2\end{pmatrix}$.
$L$ stores the multiplier with a plus sign: $L=\begin{pmatrix}1&0\\3&1\end{pmatrix}$. Check: $LU=\begin{pmatrix}2&1\\6&3+2\end{pmatrix}=A$.
$-3$ is the entry of the elimination matrix $E$ (with $EA=U$), and $L=E^{-1}$ flips that sign.


@ la e la-e-044
T: Determinant from an LU factorisation
S: lu
Q: $A=LU$, where $L$ is $3\times3$ unit lower triangular and $U$ is upper triangular with diagonal entries $2,3,-1$. What is $\det A$?
A: $-6$
B: $6$
C: $4$
D: It cannot be found without the entries of $L$.
ANS: A
EXP: $\det A=\det L\cdot\det U$. A triangular matrix has determinant equal to the product of its diagonal.
$L$ has $1$s on the diagonal, so $\det L=1$. $\det U=2\cdot3\cdot(-1)=-6$. So $\det A=-6$.
This is how software computes determinants: factor once, then multiply the pivots. The off-diagonal entries of $L$ never matter.


@ la e la-e-045
T: Matrix needing a row exchange for LU
S: lu
Q: Which matrix has no factorisation $A=LU$ (unit lower $L$, upper $U$) without row exchanges?
A: $\begin{pmatrix}0&1\\1&1\end{pmatrix}$
B: $\begin{pmatrix}1&1\\1&1\end{pmatrix}$
C: $\begin{pmatrix}1&2\\3&4\end{pmatrix}$
D: $\begin{pmatrix}2&1\\1&0\end{pmatrix}$
ANS: A
EXP: LU without pivoting fails when a zero appears in a pivot position that has a nonzero below it.
For $\begin{pmatrix}0&1\\1&1\end{pmatrix}$ the first pivot is $0$, so no multiple of row 1 can clear the $1$ below. You need $PA=LU$ with a row swap.
The singular $\begin{pmatrix}1&1\\1&1\end{pmatrix}$ is the trap: it does factor, $L=\begin{pmatrix}1&0\\1&1\end{pmatrix}$, $U=\begin{pmatrix}1&1\\0&0\end{pmatrix}$. A zero in the last pivot is allowed.
[[C]] and [[D]] have nonzero first pivots ($1$ and $2$), so elimination goes through.


@ la e la-e-046
T: Solving a system with given L and U
S: lu
TYPE: nat
TOL: 0
Q: $A=LU$ with $L=\begin{pmatrix}1&0\\2&1\end{pmatrix}$ and $U=\begin{pmatrix}1&1\\0&2\end{pmatrix}$. Solve $Ax=b$ for $b=(3,8)^T$ and enter $x_1$.
ANS: 2
EXP: Step 1 (forward substitution), solve $Ly=b$: $y_1=3$, then $2y_1+y_2=8\Rightarrow y_2=2$.
Step 2 (back substitution), solve $Ux=y$: $2x_2=2\Rightarrow x_2=1$, then $x_1+x_2=3\Rightarrow x_1=2$.
Check: $A=LU=\begin{pmatrix}1&1\\2&4\end{pmatrix}$ and $A(2,1)^T=(3,8)^T$. Skipping step 1 and solving $Ux=b$ directly gives the wrong $x_1=-1$.


@ la e la-e-047
T: Singular values from eigenvalues of A^T A
S: svd-pca
Q: For a matrix $A$, the eigenvalues of $A^TA$ are $16$ and $9$. What are the singular values of $A$?
A: $4$ and $3$
B: $16$ and $9$
C: $256$ and $81$
D: $8$ and $4.5$
ANS: A
EXP: The singular values of $A$ are the square roots of the eigenvalues of $A^TA$: $\sigma_i=\sqrt{\lambda_i(A^TA)}$.
So $\sigma=\sqrt{16}=4$ and $\sqrt9=3$.
Taking the eigenvalues of $A^TA$ themselves as singular values ($16$, $9$) is the usual slip. They are $\sigma_i^2$.


@ la e la-e-048
T: Variance explained by two principal components
S: svd-pca
TYPE: nat
TOL: 0
Q: The covariance matrix of a 4-feature dataset has eigenvalues $5,3,1,1$. What percentage of the total variance is explained by the first two principal components? Enter a number (e.g. 50 for 50%).
ANS: 80
EXP: Each principal component's variance is its eigenvalue, and the total variance is the trace (sum of eigenvalues): $5+3+1+1=10$.
The first two PCs explain $\frac{5+3}{10}=0.8$, i.e. $80\%$.
Dividing by the number of features (4) instead of the total variance is a common mistake. This ratio is what you look at in a scree plot to choose how many components to keep.


@ la e la-e-049
T: Rank from singular values
S: svd-pca
Q: A $4\times3$ matrix has singular values $6,\ 2,\ 0$. What is its rank?
A: $2$
B: $3$
C: $4$
D: $1$
ANS: A
EXP: The rank equals the number of nonzero singular values. Here $6$ and $2$ are nonzero, so the rank is $2$.
$3$ just counts all singular values listed (the number of columns). In practice, numerically tiny singular values are treated as zero to find the effective rank.


@ la e la-e-050
T: Direction of the first principal component
S: svd-pca
Q: For centred data, the first principal component direction is:
A: the eigenvector of the sample covariance matrix with the largest eigenvalue
B: the eigenvector of the sample covariance matrix with the smallest eigenvalue
C: the unit vector along the original feature with the largest variance
D: the unit vector in the direction of the mean of the data
ANS: A
EXP: PCA finds the unit vector $w$ maximising the projected variance $w^TSw$, where $S$ is the covariance matrix.
The maximum of $w^TSw$ over $\|w\|=1$ is the largest eigenvalue, reached at its eigenvector (the Rayleigh quotient).
The smallest eigenvalue's eigenvector is the direction of least variance. The best direction is usually a mix of features, not one original axis. For centred data the mean is $0$, so it gives no direction.

@ la h la-h-011
T: Maximise a linear function on a sphere
S: vectors-norms
Q: Over all $(x,y,z)$ with $x^2+y^2+z^2=9$, what is the maximum value of $2x+y-2z$?
A: $9$
B: $3$
C: $27$
D: $5$
ANS: A
EXP: Write the objective as $w\cdot v$ with $w=(2,1,-2)$ and $\|v\|_2=3$.
Cauchy–Schwarz: $w\cdot v\le\|w\|_2\|v\|_2=3\cdot3=9$, with equality when $v$ points along $w$: $v=\tfrac{3}{3}(2,1,-2)=(2,1,-2)$, giving $4+1+4=9$.
$3$ forgets the radius ($\|v\|=3$, not $1$); $27$ uses $\|v\|^2=9$ instead of $\|v\|=3$; $5$ is the $L_1$ norm of $w$.

@ la h la-h-012
T: Span of cyclic differences
S: vector-spaces
Q: $v_1,v_2,v_3$ are linearly independent vectors in $\mathbb R^5$. What is the dimension of $\operatorname{span}\{v_1-v_2,\ v_2-v_3,\ v_3-v_1\}$?
A: $2$
B: $3$
C: $1$
D: $5$
ANS: A
EXP: The three differences add to zero: $(v_1-v_2)+(v_2-v_3)+(v_3-v_1)=0$, so they are dependent and the dimension is at most $2$.
$v_1-v_2$ and $v_2-v_3$ are independent: $a(v_1-v_2)+b(v_2-v_3)=av_1+(b-a)v_2-bv_3=0$ forces $a=b=0$ because the $v_i$ are independent.
So the dimension is exactly $2$. Answering $3$ assumes "three vectors built from independent vectors are independent", which is false.

@ la h la-h-013
T: High power of a shear matrix
S: matrix-ops
Q: Let $A=\begin{pmatrix}1&1\\0&1\end{pmatrix}$. What is $A^{50}$?
A: $\begin{pmatrix}1&50\\0&1\end{pmatrix}$
B: $\begin{pmatrix}1&2^{50}\\0&1\end{pmatrix}$
C: $\begin{pmatrix}1&49\\0&1\end{pmatrix}$
D: $\begin{pmatrix}50&50\\0&50\end{pmatrix}$
ANS: A
EXP: Write $A=I+N$ with $N=\begin{pmatrix}0&1\\0&0\end{pmatrix}$. $N^2=0$ and $I$ commutes with $N$, so the binomial theorem stops after two terms:
$A^{50}=(I+N)^{50}=I+50N+\binom{50}{2}N^2+\dots=I+50N=\begin{pmatrix}1&50\\0&1\end{pmatrix}$.
$2^{50}$ comes from squaring entries instead of multiplying matrices; $\begin{pmatrix}50&50\\0&50\end{pmatrix}$ is $50A$, not $A^{50}$.
$A$ is not diagonalisable (eigenvalue $1$ repeated, one eigenvector), so the $P D^{50}P^{-1}$ shortcut does not apply.

@ la h la-h-014
T: Parameters for infinitely many solutions
S: linear-systems
TYPE: nat
TOL: 0
Q: The system
$$x+y+z=6,\qquad x+2y+3z=10,\qquad x+2y+\lambda z=\mu$$
has infinitely many solutions. Enter the value of $\lambda+\mu$.
ANS: 13
EXP: Subtract equation 1 from equations 2 and 3: $y+2z=4$ and $y+(\lambda-1)z=\mu-6$.
Subtract these: $(\lambda-3)z=\mu-10$.
If $\lambda\ne3$ there is a unique solution. If $\lambda=3$ and $\mu\ne10$ the last row reads $0=\mu-10\ne0$: no solution.
Infinitely many solutions need $\lambda=3$ and $\mu=10$ (rank of $A$ = rank of $[A\mid b]$ = $2<3$). So $\lambda+\mu=13$.

@ la h la-h-015
T: Smallest possible rank of a product
S: rank-nullity
Q: $A$ is $4\times5$ with rank $4$ and $B$ is $5\times3$ with rank $3$. What is the smallest possible value of $\operatorname{rank}(AB)$?
A: $2$
B: $3$
C: $0$
D: $1$
ANS: A
EXP: Sylvester's rank inequality: $\operatorname{rank}(AB)\ge\operatorname{rank}A+\operatorname{rank}B-n$, where $n=5$ is the shared inner dimension. So $\operatorname{rank}(AB)\ge4+3-5=2$.
Why: $\operatorname{rank}(AB)=3-\dim(\operatorname{col}B\cap\operatorname{null}A)$, and $\dim\operatorname{null}A=5-4=1$, so at most one dimension of $\operatorname{col}B$ can be killed.
The bound is reached when $\operatorname{null}A\subset\operatorname{col}B$. $3$ is only the maximum (from $\operatorname{rank}(AB)\le\min(4,3)$), not the minimum.

@ la h la-h-016
T: Determinant of the 1D Laplacian matrix
S: determinants
Q: What is the determinant of the $4\times4$ tridiagonal matrix
$$T=\begin{pmatrix}2&-1&0&0\\-1&2&-1&0\\0&-1&2&-1\\0&0&-1&2\end{pmatrix}?$$
A: $5$
B: $16$
C: $4$
D: $1$
ANS: A
EXP: Expand along the first row to get the recurrence $D_n=2D_{n-1}-D_{n-2}$ for this family, with $D_1=2$ and $D_2=4-1=3$.
Then $D_3=2\cdot3-2=4$ and $D_4=2\cdot4-3=5$. In general $D_n=n+1$.
$16$ is the product of the diagonal, which is only valid for triangular matrices. This matrix is the discrete second-difference (Laplacian) operator; being positive definite, its determinant must be positive.

@ la h la-h-017
T: Trace of a power of J minus I
S: eigen
TYPE: nat
TOL: 0
Q: Let $A=\begin{pmatrix}0&1&1\\1&0&1\\1&1&0\end{pmatrix}$. Enter $\operatorname{tr}(A^4)$.
ANS: 18
EXP: $A=J-I$ where $J$ is the $3\times3$ all-ones matrix. $J$ has eigenvalues $3,0,0$, so $A$ has eigenvalues $3-1=2$ and $0-1=-1$ (twice).
The trace of $A^4$ is the sum of the fourth powers of the eigenvalues: $2^4+(-1)^4+(-1)^4=16+1+1=18$.
A common slip is $(\operatorname{tr}A)^4=0$; the trace of a power is not the power of the trace. ($A$ is the adjacency matrix of the triangle graph, and $\operatorname{tr}(A^4)$ counts closed walks of length 4.)

@ la h la-h-018
T: Determinant of I plus a projection
S: special-matrices
Q: $P$ is a $4\times4$ matrix with $P^2=P$ and $\operatorname{tr}P=2$. What is $\det(I+P)$?
A: $4$
B: $3$
C: $2$
D: $9$
ANS: A
EXP: Idempotent means every eigenvalue is $0$ or $1$, and an idempotent matrix is diagonalisable (its minimal polynomial $\lambda^2-\lambda$ has distinct roots).
The trace is the number of eigenvalues equal to $1$, so the eigenvalues are $1,1,0,0$ and $\operatorname{rank}P=2$.
$I+P$ has eigenvalues $2,2,1,1$, so $\det(I+P)=4$.
$3=1+\operatorname{tr}P$ wrongly uses the rank-one formula $\det(I+uv^T)=1+v^Tu$ for a rank-2 matrix.

@ la h la-h-019
T: Positive definiteness with a parameter
S: quadratic-forms
Q: For which values of $k$ is the quadratic form $x^2+4y^2+kz^2+2xy+4yz$ positive definite?
A: $k>\frac43$
B: $k>4$
C: $k>0$
D: $k>\frac34$
ANS: A
EXP: The symmetric matrix halves the cross terms: $A=\begin{pmatrix}1&1&0\\1&4&2\\0&2&k\end{pmatrix}$.
Sylvester's criterion (all leading principal minors $>0$): $1>0$; $\begin{vmatrix}1&1\\1&4\end{vmatrix}=3>0$; $\det A=1(4k-4)-1(k-0)=3k-4>0$.
So $k>\tfrac43$. Using the cross-term coefficients $2$ and $4$ directly as matrix entries (forgetting to halve) makes the $2\times2$ minor $4-4=0$, wrongly suggesting no $k$ works; $k>0$ only makes the last diagonal entry positive, which is necessary but not sufficient.

@ la h la-h-020
T: Distance from a vector to the ones line
S: projections-least-squares
Q: What is the squared distance from $b=(1,2,6)$ to the line spanned by $\mathbf 1=(1,1,1)$?
A: $14$
B: $41$
C: $27$
D: $\frac{14}{3}$
ANS: A
EXP: Project onto $\mathbf 1$: $\hat b=\dfrac{\mathbf 1^Tb}{\mathbf 1^T\mathbf 1}\mathbf 1=\dfrac{9}{3}\mathbf 1=(3,3,3)$, i.e. every entry becomes the mean.
The residual $b-\hat b=(-2,-1,3)$ is $b$ centred, and its squared length is $4+1+9=14$.
$41=\|b\|^2$ ignores the projection, $27=\|\hat b\|^2$ is the projected part, and $\tfrac{14}{3}$ divides by $n$ (that would be the population variance).
This is why centring data in PCA is an orthogonal projection onto the complement of $\mathbf 1$.

@ la h la-h-021
T: When LU without pivoting fails
S: lu
Q: For which value of $a$ does $A=\begin{pmatrix}1&2&3\\2&a&1\\1&3&5\end{pmatrix}$ have NO factorisation $A=LU$ (unit lower triangular $L$, upper triangular $U$) without row exchanges?
A: $a=4$
B: $a=\frac32$
C: $a=0$
D: $a=-4$
ANS: A
EXP: Doolittle elimination: $\ell_{21}=2$, so the second pivot is $u_{22}=a-2\cdot2=a-4$.
If $a=4$ the pivot is $0$; the next step needs $\ell_{32}u_{22}=a_{32}-\ell_{31}u_{12}=3-2=1$, i.e. $\ell_{32}\cdot0=1$, which is impossible. So no LU exists without a row swap.
Equivalently, the $2\times2$ leading principal minor $a-4$ is zero.
$a=\tfrac32$ makes $\det A=2a-3=0$, but singularity alone does not block LU: only the leading minors of order $1,\dots,n-1$ matter (then $u_{33}=0$ is allowed).

@ la h la-h-022
T: Variance explained by the first PC
S: svd-pca
TYPE: nat
TOL: 0.01
Q: The covariance matrix of a 2-feature dataset is $\Sigma=\begin{pmatrix}5&2\\2&2\end{pmatrix}$. What fraction of the total variance is explained by the first principal component? Give your answer to 2 decimal places.
ANS: 0.86
EXP: PCA directions are eigenvectors of $\Sigma$; the variance along each is its eigenvalue.
$\operatorname{tr}\Sigma=7$, $\det\Sigma=10-4=6$, so $\lambda^2-7\lambda+6=0\Rightarrow\lambda=6,1$.
Fraction explained by PC1 $=\dfrac{6}{6+1}=\dfrac67\approx0.86$.
Using the largest diagonal entry ($5/7\approx0.71$) ignores the correlation between the features, which PCA exploits.

@ la h la-h-023
T: Valid inequalities between vector norms
S: vectors-norms
TYPE: msq
Q: Which inequalities hold for every $x\in\mathbb R^n$? More than one option may be correct.
A: $\|x\|_2\le\|x\|_1$
B: $\|x\|_1\le\sqrt n\,\|x\|_2$
C: $\|x\|_2\le\|x\|_\infty$
D: $\|x\|_1\le\|x\|_\infty$
ANS: A,B
EXP: [[A]] True: $\|x\|_1^2=\left(\sum|x_i|\right)^2=\sum x_i^2+\sum_{i\ne j}|x_i||x_j|\ge\|x\|_2^2$.
[[B]] True: Cauchy–Schwarz with the all-ones vector: $\sum|x_i|\cdot1\le\sqrt{\sum x_i^2}\sqrt n$.
[[C]] False: $x=(1,1)$ gives $\|x\|_2=\sqrt2>1=\|x\|_\infty$. The correct direction is $\|x\|_\infty\le\|x\|_2$.
[[D]] False: $x=(1,1)$ gives $2>1$. The correct bound is $\|x\|_1\le n\|x\|_\infty$.
The full chain is $\|x\|_\infty\le\|x\|_2\le\|x\|_1\le\sqrt n\|x\|_2\le n\|x\|_\infty$.

@ la h la-h-024
T: Which set of 2×2 matrices is not a subspace
S: vector-spaces
Q: Which of these subsets of the space of real $2\times2$ matrices is NOT a subspace?
A: matrices with $\det A=0$
B: matrices with $\operatorname{tr}A=0$
C: symmetric matrices
D: upper triangular matrices
ANS: A
EXP: A subspace must contain $0$ and be closed under addition and scalar multiplication.
Singular matrices contain $0$ and are closed under scaling, but not under addition: $\begin{pmatrix}1&0\\0&0\end{pmatrix}+\begin{pmatrix}0&0\\0&1\end{pmatrix}=I$, and $\det I=1\ne0$.
Trace is linear, so $\{\operatorname{tr}A=0\}$ is the null space of a linear map (dimension 3). Symmetric (dimension 3) and upper triangular (dimension 3) matrices are closed under both operations.
The trap is that "$\det=0$" looks like a linear equation, but $\det$ is not linear.

@ la h la-h-025
T: Cyclic property of the trace
S: matrix-ops
Q: $A,B,C$ are $n\times n$ matrices. Which expression equals $\operatorname{tr}(ABC)$ for all such matrices?
A: $\operatorname{tr}(CAB)$
B: $\operatorname{tr}(BAC)$
C: $\operatorname{tr}(ACB)$
D: $\operatorname{tr}A\cdot\operatorname{tr}B\cdot\operatorname{tr}C$
ANS: A
EXP: $\operatorname{tr}(XY)=\operatorname{tr}(YX)$. With $X=AB$ and $Y=C$: $\operatorname{tr}(ABC)=\operatorname{tr}(CAB)$. The trace is invariant under cyclic shifts only.
$BAC$ and $ACB$ are cyclic shifts of each other but are a swap (not a rotation) of $ABC$, so they differ in general; a random $3\times3$ example gives $\operatorname{tr}(ABC)\approx3.52$ but $\operatorname{tr}(BAC)\approx-0.94$.
The trace is not multiplicative, so [[D]] fails too: $A=\mathrm{diag}(1,0)$, $B=C=\mathrm{diag}(0,1)$ give $\operatorname{tr}(ABC)=0$ but $\operatorname{tr}A\operatorname{tr}B\operatorname{tr}C=1$.
ML use: $\|X\|_F^2=\operatorname{tr}(X^TX)$ and $x^TAx=\operatorname{tr}(Axx^T)$ both rely on the cyclic rule.

@ la h la-h-026
T: Rank from three solutions of Ax = b
S: linear-systems
Q: $A$ is a $3\times3$ matrix, and $Ax=b$ is satisfied by all three vectors $(1,0,1)$, $(2,1,0)$ and $(0,-1,2)$. What is the largest possible rank of $A$?
A: $2$
B: $1$
C: $3$
D: $0$
ANS: A
EXP: The difference of two solutions of $Ax=b$ solves $Ax=0$.
Differences: $(2,1,0)-(1,0,1)=(1,1,-1)$ and $(0,-1,2)-(1,0,1)=(-1,-1,1)$. These are parallel, so they only show $\dim\operatorname{null}A\ge1$.
By rank–nullity, $\operatorname{rank}A\le3-1=2$, and rank 2 is achievable (any $A$ with null space exactly $\operatorname{span}\{(1,1,-1)\}$ and $b=A(1,0,1)$).
The trap is answering $1$ by assuming three solutions give two independent null vectors; here the three points are collinear.

@ la h la-h-027
T: Nullity of the Gram matrix XXᵀ
S: rank-nullity
Q: A data matrix $X$ is $100\times5$ with rank $3$. What is the nullity of the $100\times100$ matrix $XX^T$?
A: $97$
B: $2$
C: $95$
D: $3$
ANS: A
EXP: Key fact: $\operatorname{rank}(XX^T)=\operatorname{rank}(X^TX)=\operatorname{rank}X=3$ (since $X^Tv=0\iff v^TXX^Tv=\|X^Tv\|^2=0$).
Rank–nullity on the $100\times100$ matrix: nullity $=100-3=97$.
$2$ is the nullity of the $5\times5$ matrix $X^TX$ (or of $X$); $95$ wrongly uses rank $5$.
In kernel methods the $n\times n$ Gram matrix $XX^T$ is highly rank-deficient whenever $n$ exceeds the feature dimension.

@ la h la-h-028
T: Determinant of a block triangular matrix
S: determinants
Q: What is the determinant of
$$M=\begin{pmatrix}2&1&5&7\\1&1&3&-2\\0&0&3&1\\0&0&4&2\end{pmatrix}?$$
A: $2$
B: $6$
C: $-2$
D: $12$
ANS: A
EXP: $M=\begin{pmatrix}A&B\\0&D\end{pmatrix}$ is block upper triangular, so $\det M=\det A\cdot\det D$; the block $B$ does not matter.
$\det A=2\cdot1-1\cdot1=1$ and $\det D=3\cdot2-1\cdot4=2$, so $\det M=2$.
$12=2\cdot1\cdot3\cdot2$ multiplies the diagonal entries, which only works for fully triangular matrices; $6=3\cdot2$ uses only the diagonal of $D$; $-2$ comes from computing $\det D$ as $4\cdot1-3\cdot2$ (wrong sign).

@ la h la-h-029
T: Determinant of I + BA from eigenvalues of AB
S: eigen
Q: $A$ is $2\times3$ and $B$ is $3\times2$. The eigenvalues of $AB$ are $3$ and $5$. What is $\det(I_3+BA)$?
A: $24$
B: $0$
C: $15$
D: $9$
ANS: A
EXP: Key fact: $AB$ and $BA$ have the same nonzero eigenvalues. $BA$ is $3\times3$ with rank at most $2$, so its eigenvalues are $3,5,0$.
$I_3+BA$ has eigenvalues $4,6,1$, so $\det(I_3+BA)=24$.
$0=\det(BA)$ and $15=\det(AB)$ forget the identity shift; $9=1+3+5$ wrongly treats $\det(I+M)$ as $1+\operatorname{tr}M$, which holds only for rank-one $M$.
This is Sylvester's determinant identity $\det(I_3+BA)=\det(I_2+AB)=4\cdot6$, used to swap a large determinant for a small one (e.g. in Gaussian process likelihoods).

@ la h la-h-030
T: Orthogonal 3×3 matrix with determinant −1
S: special-matrices
Q: $Q$ is a real $3\times3$ orthogonal matrix with $\det Q=-1$. What is $\det(I+Q)$?
A: $0$
B: $-1$
C: $-8$
D: $8$
ANS: A
EXP: Eigenvalues of an orthogonal matrix have modulus $1$. Non-real ones come in conjugate pairs $e^{\pm i\theta}$ whose product is $1$.
A $3\times3$ real matrix has at least one real eigenvalue, which must be $\pm1$. The product of all eigenvalues is $\det Q=-1$; the conjugate pair (if any) contributes $+1$, so the real eigenvalues must include $-1$. (If all three are real, they are $\pm1$ with product $-1$, so again $-1$ appears.)
Then $I+Q$ has eigenvalue $1+(-1)=0$, so $\det(I+Q)=0$.
$8=\det(2I)$ assumes $Q=I$; $-8=\det(2Q)$ treats $I+Q$ like $2Q$; $-1=\det Q$ just drops the $I$. Determinants are not additive. Geometrically $Q$ is a reflection (possibly composed with a rotation) and flips some direction $v$: $Qv=-v$.

@ la h la-h-031
T: Maximum Rayleigh quotient of a block matrix
S: quadratic-forms
Q: Let $A=\begin{pmatrix}4&2&0\\2&1&0\\0&0&3\end{pmatrix}$. What is the maximum of $\dfrac{x^TAx}{x^Tx}$ over all nonzero $x\in\mathbb R^3$?
A: $5$
B: $4$
C: $3$
D: $8$
ANS: A
EXP: For symmetric $A$, the maximum of the Rayleigh quotient is the largest eigenvalue (attained at its eigenvector).
$A$ is block diagonal. The top block $\begin{pmatrix}4&2\\2&1\end{pmatrix}$ has trace $5$ and determinant $0$, so eigenvalues $5,0$. The bottom block gives $3$.
Eigenvalues $5,0,3$; the maximum is $5$, at $x=(2,1,0)$: $x^TAx=16+8+1=25$, $x^Tx=5$.
$4$ is the largest diagonal entry, which is only a lower bound (try $x=e_1$). $8$ is the trace (sum of all eigenvalues). This is the variational idea behind PCA: the first PC maximises $w^T\Sigma w$ over unit $w$.

@ la h la-h-032
T: Leverage of an extreme point in simple regression
S: projections-least-squares
TYPE: nat
TOL: 0.01
Q: Simple linear regression $y=\beta_0+\beta_1x$ (with intercept) is fitted to the five inputs $x=0,1,2,3,4$. Let $H=X(X^TX)^{-1}X^T$ be the hat matrix, where $X$ has a column of ones and a column of the $x$ values. Enter the leverage $h_{55}$ of the point with $x=4$, to 2 decimal places.
ANS: 0.6
EXP: For simple regression with an intercept, the diagonal of the hat matrix is $h_{ii}=\dfrac1n+\dfrac{(x_i-\bar x)^2}{\sum_j(x_j-\bar x)^2}$.
Here $n=5$, $\bar x=2$ and $\sum(x_j-\bar x)^2=4+1+0+1+4=10$, so $h_{55}=\dfrac15+\dfrac{(4-2)^2}{10}=0.2+0.4=0.6$.
(Directly: $X^TX=\begin{pmatrix}5&10\\10&30\end{pmatrix}$, and $h_{55}=(1,4)(X^TX)^{-1}(1,4)^T=\frac{1}{50}(30-80+80)=0.6$.)
Two traps: $0.4$ forgets the $\frac1n$ term from the intercept, and also equals the average leverage $\operatorname{tr}H/n=2/5$. Points far from $\bar x$ have high leverage, so they pull the fitted line towards themselves.


@ la h la-h-033
T: Which matrices have an LU factorisation
S: lu
TYPE: msq
Q: Which of these matrices can be written as $A=LU$ with $L$ unit lower triangular and $U$ upper triangular, without any row exchanges? More than one option may be correct.
A: $\begin{pmatrix}0&1\\1&0\end{pmatrix}$
B: $\begin{pmatrix}1&2\\2&4\end{pmatrix}$
C: $\begin{pmatrix}2&1\\4&3\end{pmatrix}$
D: $\begin{pmatrix}0&2\\3&1\end{pmatrix}$
ANS: B,C
EXP: Write $L=\begin{pmatrix}1&0\\\ell&1\end{pmatrix}$, $U=\begin{pmatrix}u_{11}&u_{12}\\0&u_{22}\end{pmatrix}$. Then $u_{11}=a_{11}$, $u_{12}=a_{12}$, $\ell u_{11}=a_{21}$, $u_{22}=a_{22}-\ell u_{12}$.
[[A]] and [[D]]: $u_{11}=0$ but $a_{21}\ne0$, so $\ell\cdot0=a_{21}$ is impossible. A row swap is needed ($PA=LU$).
[[B]]: $\ell=2$, $U=\begin{pmatrix}1&2\\0&0\end{pmatrix}$. It exists even though $B$ is singular; a zero in the LAST pivot is harmless.
[[C]]: $\ell=2$, $U=\begin{pmatrix}2&1\\0&1\end{pmatrix}$.
The trap is thinking singular matrices have no LU; what matters is a zero pivot before the last step.

@ la h la-h-034
T: Singular value of a rank-one matrix
S: svd-pca
Q: What is the largest singular value of $A=\begin{pmatrix}2&2\\1&1\\2&2\end{pmatrix}$?
A: $3\sqrt2$
B: $18$
C: $6$
D: $5$
ANS: A
EXP: Every row is a multiple of $(1,1)$: $A=uv^T$ with $u=(2,1,2)^T$, $v=(1,1)^T$, so $A$ has rank one.
For $A=uv^T$, $A=\|u\|\|v\|\,\hat u\hat v^T$ is already an SVD, so $\sigma_1=\|u\|\,\|v\|=3\cdot\sqrt2=3\sqrt2$ and $\sigma_2=0$.
Check: $A^TA=\begin{pmatrix}9&9\\9&9\end{pmatrix}$ with eigenvalues $18,0$; $\sigma_1=\sqrt{18}=3\sqrt2$.
$18$ is the eigenvalue of $A^TA$ (forgetting the square root). $6=\|u\|_2\cdot\|v\|_1$ uses the wrong norm for $v$, and $5$ is the sum of the first column; neither is a singular value.

@ la h la-h-035
T: Parallelogram law for vector lengths
S: vectors-norms
Q: Vectors $u,v$ satisfy $\|u\|=3$, $\|v\|=4$ and $\|u-v\|=\sqrt{13}$. What is $\|u+v\|$?
A: $\sqrt{37}$
B: $\sqrt{13}$
C: $7$
D: $5$
ANS: A
EXP: Parallelogram law: $\|u+v\|^2+\|u-v\|^2=2\|u\|^2+2\|v\|^2=2(9+16)=50$.
So $\|u+v\|^2=50-13=37$ and $\|u+v\|=\sqrt{37}$.
(Directly: $\|u-v\|^2=25-2u\cdot v=13\Rightarrow u\cdot v=6$, then $\|u+v\|^2=25+12=37$.)
$7$ assumes $u,v$ are parallel (triangle inequality with equality); $5$ assumes they are orthogonal, which would need $\|u-v\|=5$ too.

@ la h la-h-036
T: Intersection of two subspaces of R⁵
S: vector-spaces
Q: $U$ and $W$ are subspaces of $\mathbb R^5$ with $\dim U=3$ and $\dim W=4$. What is the smallest possible value of $\dim(U\cap W)$?
A: $2$
B: $1$
C: $0$
D: $3$
ANS: A
EXP: Dimension formula: $\dim(U+W)=\dim U+\dim W-\dim(U\cap W)$.
Since $U+W\subseteq\mathbb R^5$, $\dim(U+W)\le5$, so $\dim(U\cap W)\ge3+4-5=2$.
It is attained, e.g. $U=\operatorname{span}\{e_1,e_2,e_5\}$, $W=\operatorname{span}\{e_1,e_2,e_3,e_4\}$, with $U\cap W=\operatorname{span}\{e_1,e_2\}$.
$0$ treats subspaces like sets that can be disjoint; $3$ is the maximum (when $U\subseteq W$), not the minimum.

@ la h la-h-037
T: Inverse of I − N for nilpotent N
S: matrix-ops
TYPE: nat
TOL: 0
Q: Let $N=\begin{pmatrix}0&1&2\\0&0&3\\0&0&0\end{pmatrix}$. Enter the $(1,3)$ entry of $(I-N)^{-1}$.
ANS: 5
EXP: $N$ is strictly upper triangular, so $N^3=0$. The geometric (Neumann) series then terminates:
$(I-N)(I+N+N^2)=I-N^3=I$, so $(I-N)^{-1}=I+N+N^2$.
$N^2=\begin{pmatrix}0&0&3\\0&0&0\\0&0&0\end{pmatrix}$ (row 1 of $N$ times column 3: $1\cdot3$).
The $(1,3)$ entry is $0+2+3=5$. Forgetting $N^2$ gives $2$; using $I-N$ instead gives $-2$.

@ la h la-h-038
T: Homogeneous system with a repeated root
S: linear-systems
Q: Consider $\begin{pmatrix}1&1&1\\1&k&1\\1&1&k\end{pmatrix}x=0$. For the value(s) of $k$ where nontrivial solutions exist, what is the dimension of the solution space?
A: $k=1$, dimension $2$
B: $k=1$, dimension $1$
C: $k=-2$, dimension $1$
D: $k=1$ or $k=-2$, dimension $1$
ANS: A
EXP: Subtract row 1 from rows 2 and 3: $\begin{pmatrix}1&1&1\\0&k-1&0\\0&0&k-1\end{pmatrix}$, so $\det=(k-1)^2$.
Nontrivial solutions need $\det=0$, so only $k=1$. Then all three rows equal $(1,1,1)$, the rank is $1$, and by rank–nullity the solution space $\{x+y+z=0\}$ has dimension $3-1=2$.
The double root $(k-1)^2$ is the hint that rank drops by $2$. $k=-2$ is a trap from the similar-looking matrix $\begin{pmatrix}k&1&1\\1&k&1\\1&1&k\end{pmatrix}$, whose determinant is $(k-1)^2(k+2)$.

@ la h la-h-039
T: Maximum rank of a square-zero matrix
S: rank-nullity
Q: $A$ is a real $6\times6$ matrix with $A^2=0$. What is the largest possible rank of $A$?
A: $3$
B: $5$
C: $2$
D: $6$
ANS: A
EXP: $A^2=0$ means $A(Ax)=0$ for every $x$, so the column space of $A$ lies inside its null space: $\operatorname{rank}A\le\operatorname{nullity}A$.
With rank–nullity $\operatorname{rank}A+\operatorname{nullity}A=6$, this gives $2\operatorname{rank}A\le6$, so $\operatorname{rank}A\le3$.
Attained by $A=\begin{pmatrix}0&I_3\\0&0\end{pmatrix}$ (block form), which has rank $3$ and $A^2=0$.
$5$ is the largest rank of a nilpotent $6\times6$ matrix (a single Jordan block, where $A^6=0$ but $A^2\ne0$).

@ la h la-h-040
T: Determinant of the min(i, j) matrix
S: determinants
Q: Let $A$ be the $4\times4$ matrix with entries $a_{ij}=\min(i,j)$. What is $\det A$?
A: $1$
B: $0$
C: $24$
D: $4$
ANS: A
EXP: $A=\begin{pmatrix}1&1&1&1\\1&2&2&2\\1&2&3&3\\1&2&3&4\end{pmatrix}$.
Row operations $R_4-R_3$, $R_3-R_2$, $R_2-R_1$ (done bottom-up) do not change the determinant and give the upper triangular matrix of all ones on and above the diagonal.
So $\det A=1$. In fact $A=LL^T$ with $L$ the lower-triangular all-ones matrix, a Cholesky factorisation (this is the covariance matrix of a random walk / Brownian motion at times $1,2,3,4$).
$24=1\cdot2\cdot3\cdot4$ multiplies the diagonal of a non-triangular matrix; $0$ guesses that repeated entries mean dependent rows.

@ la h la-h-041
T: Second eigenvalue of a stochastic matrix
S: eigen
TYPE: nat
TOL: 0.01
Q: The column-stochastic transition matrix $P=\begin{pmatrix}0.5&0.2\\0.5&0.8\end{pmatrix}$ has $1$ as one eigenvalue. Enter its other eigenvalue.
ANS: 0.3
EXP: Each column sums to $1$, so $\mathbf 1^TP=\mathbf 1^T$: $1$ is an eigenvalue of $P^T$, hence of $P$.
The eigenvalues sum to the trace: $1+\lambda_2=0.5+0.8=1.3$, so $\lambda_2=0.3$. (Check with the determinant: $0.4-0.1=0.3=1\cdot0.3$.)
$|\lambda_2|=0.3$ controls how fast $P^k x$ approaches the stationary distribution: the error shrinks by a factor $0.3$ per step.

@ la h la-h-042
T: Properties of a 3×3 skew-symmetric matrix
S: special-matrices
TYPE: msq
Q: $A$ is a real $3\times3$ matrix with $A^T=-A$. Which statements are always true? More than one option may be correct.
A: $\det A=0$
B: $x^TAx=0$ for every $x\in\mathbb R^3$
C: all eigenvalues of $A$ are real
D: $A^2$ is symmetric
ANS: A,B,D
EXP: [[A]] True: $\det A=\det A^T=\det(-A)=(-1)^3\det A=-\det A$, so $\det A=0$. (This uses odd $n$.)
[[B]] True: $x^TAx$ is a scalar, so it equals its transpose $x^TA^Tx=-x^TAx$, forcing it to be $0$.
[[C]] False: $A=\begin{pmatrix}0&1&0\\-1&0&0\\0&0&0\end{pmatrix}$ has eigenvalues $0,\pm i$. Skew-symmetric eigenvalues are purely imaginary (or $0$).
[[D]] True: $(A^2)^T=(A^T)^2=(-A)^2=A^2$.
[[B]] is why only the symmetric part $\tfrac12(M+M^T)$ of a matrix matters in a quadratic form.

@ la h la-h-043
T: Definiteness when only the last minor vanishes
S: quadratic-forms
Q: Classify the quadratic form $Q(x,y,z)=2x^2+2y^2+z^2+2xz+2yz$.
A: positive semidefinite but not positive definite
B: positive definite
C: indefinite
D: negative semidefinite
ANS: A
EXP: The symmetric matrix is $A=\begin{pmatrix}2&0&1\\0&2&1\\1&1&1\end{pmatrix}$ (each cross term is split in half).
Leading principal minors: $2>0$, $4>0$, and $\det A=2(2-1)-0+1(0-2)=0$.
The first two minors look like the start of a positive definite pattern, which is the trap. But Sylvester's criterion needs all three to be positive, and $\det A=0$ means $A$ is singular.
Completing squares settles it: $Q=(x+y+z)^2+(x-y)^2\ge0$, and $Q=0$ at $(1,1,-2)\ne0$. So $Q$ is positive semidefinite but not definite (eigenvalues $3,2,0$).


@ la h la-h-044
T: Projection onto a plane through the origin
S: projections-least-squares
Q: What is the orthogonal projection of $b=(3,0,0)$ onto the plane $x+y+z=0$?
A: $(2,-1,-1)$
B: $(1,1,1)$
C: $(3,-1,-1)$
D: $(1,-\tfrac12,-\tfrac12)$
ANS: A
EXP: The plane has normal $n=(1,1,1)$. Remove the component of $b$ along $n$:
$\operatorname{proj}_n b=\dfrac{b\cdot n}{n\cdot n}n=\dfrac33(1,1,1)=(1,1,1)$, so the projection onto the plane is $b-(1,1,1)=(2,-1,-1)$.
Check: $2-1-1=0$ (in the plane) and $b-(2,-1,-1)=(1,1,1)\parallel n$.
$(1,1,1)$ is the projection onto the normal line, not the plane: the classic mix-up between $P$ and $I-P$.

@ la h la-h-045
T: Solving the transposed system from LU factors
S: lu
TYPE: nat
TOL: 0
Q: $A=LU$ with $L=\begin{pmatrix}1&0&0\\2&1&0\\-1&3&1\end{pmatrix}$ and $U=\begin{pmatrix}2&1&1\\0&1&2\\0&0&1\end{pmatrix}$. Using these factors, solve the transposed system $A^Tx=b$ for $b=(-6,2,9)^T$ and enter $x_3$.
ANS: 2
EXP: $A^T=(LU)^T=U^TL^T$, where $U^T$ is lower triangular and $L^T$ is upper triangular. So solve $U^Ty=b$ by forward substitution, then $L^Tx=y$ by back substitution.
$U^T=\begin{pmatrix}2&0&0\\1&1&0\\1&2&1\end{pmatrix}$: $2y_1=-6\Rightarrow y_1=-3$; $y_2=2+3=5$; $y_3=9+3-10=2$.
$L^T=\begin{pmatrix}1&2&-1\\0&1&3\\0&0&1\end{pmatrix}$: $x_3=2$; $x_2=5-3\cdot2=-1$; $x_1=-3-2(-1)+2=1$.
So $x=(1,-1,2)$ and $x_3=2$. Check: $A=\begin{pmatrix}2&1&1\\4&3&4\\-2&2&6\end{pmatrix}$ and $A^Tx=(2-4-4,\ 1-3+4,\ 1-4+12)=(-6,2,9)$.
The trap is to run the usual $Ly=b$, $Ux=y$, which solves $Ax=b$ instead and gives $x_3=-39$. The order of the factors reverses under transposition, as in $(AB)^T=B^TA^T$.


@ la h la-h-046
T: Condition number from the Gram matrix
S: svd-pca
Q: A $2\times2$ matrix $A$ satisfies $A^TA=\begin{pmatrix}5&4\\4&5\end{pmatrix}$. What is the 2-norm condition number $\kappa_2(A)=\sigma_{\max}/\sigma_{\min}$?
A: $3$
B: $9$
C: $\frac{5}{4}$
D: $\sqrt5$
ANS: A
EXP: The singular values of $A$ are the square roots of the eigenvalues of $A^TA$.
$A^TA$ has eigenvalues $5\pm4=9,1$ (eigenvectors $(1,1)$ and $(1,-1)$), so $\sigma=3,1$ and $\kappa_2(A)=3$.
$9$ is $\kappa(A^TA)=\kappa(A)^2$; this squaring is exactly why solving least squares via the normal equations $A^TAx=A^Tb$ is less accurate than via QR or SVD.

@ la h la-h-047
T: Dual norm: maximise over the L1 ball
S: vectors-norms
Q: What is the maximum of $x_1+2x_2+2x_3$ over all $x\in\mathbb R^3$ with $\|x\|_1\le1$?
A: $2$
B: $3$
C: $5$
D: $1$
ANS: A
EXP: $w\cdot x\le\sum|w_i||x_i|\le\left(\max_i|w_i|\right)\sum|x_i|\le\|w\|_\infty\|x\|_1$. With $w=(1,2,2)$ this gives $\le2$.
Equality at the vertex $x=e_2$ (or $e_3$): value $2$. A linear function on the $L_1$ ball is maximised at a vertex $\pm e_i$.
So the dual of the $L_1$ norm is the $L_\infty$ norm. $3=\|w\|_2$ is the answer for the $L_2$ ball, and $5=\|w\|_1$ is the answer for the $L_\infty$ ball.
The corners of the $L_1$ ball are also why LASSO produces sparse solutions.

@ la h la-h-048
T: When (1, t, t²) vectors form a basis
S: vector-spaces
Q: The vectors $(1,a,a^2)$, $(1,b,b^2)$, $(1,c,c^2)$ form a basis of $\mathbb R^3$ exactly when:
A: $a,b,c$ are pairwise distinct
B: $a+b+c\ne0$
C: $abc\ne0$
D: at least two of $a,b,c$ are different
ANS: A
EXP: Three vectors in $\mathbb R^3$ form a basis iff the matrix with them as rows has nonzero determinant.
This is a Vandermonde matrix: $\det=(b-a)(c-a)(c-b)$, nonzero iff $a,b,c$ are pairwise distinct.
[[D]] is not enough: $a=b=0$, $c=1$ gives two equal vectors. $abc\ne0$ is irrelevant: $a=0,b=1,c=2$ works.
This is why polynomial interpolation through $n$ points with distinct $x$-values has a unique solution.

@ la h la-h-049
T: Scalar that makes I − P/3 an inverse
S: matrix-ops
Q: $P$ is a nonzero square matrix with $P^2=P$. For which scalar $\alpha$ is $(I+\alpha P)^{-1}=I-\frac13P$?
A: $\alpha=\frac12$
B: $\alpha=\frac13$
C: $\alpha=-\frac13$
D: $\alpha=2$
ANS: A
EXP: Multiply and use $P^2=P$: $(I+\alpha P)(I-\tfrac13P)=I-\tfrac13P+\alpha P-\tfrac{\alpha}{3}P^2=I+\left(\tfrac{2\alpha}{3}-\tfrac13\right)P$.
Since $P\ne0$, this equals $I$ exactly when $\tfrac{2\alpha}{3}=\tfrac13$, i.e. $\alpha=\tfrac12$.
