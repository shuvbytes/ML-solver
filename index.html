$\chi^2=6.67+2.86\approx9.52$, with df $=(3-1)(2-1)=2$.
$9.52>9.210$, so $p<0.01$.
$6.67$ uses only the click row. With $9.52$ and $0.01<p<0.05$, the df was wrongly taken as $3$ (the number of variants).

@ stat h stat-h-058
T: Chi-square score for selecting a text feature
S: chi-squared-test
TYPE: nat
TOL: 0.01
Q: For feature selection in a text classifier, $200$ documents are counted by whether they contain a word and by their class. Word present: $40$ in class 1, $10$ in class 0. Word absent: $60$ in class 1, $90$ in class 0. What is the chi-square statistic for independence of word and class (no continuity correction)? Enter the number.
ANS: 24
EXP: For a $2\times2$ table $\begin{pmatrix}A&B\\C&D\end{pmatrix}$: $\chi^2=\dfrac{N(AD-BC)^2}{(A+B)(C+D)(A+C)(B+D)}$.
$AD-BC=40\cdot90-10\cdot60=3000$. Margins: $50,150,100,100$.
$\chi^2=\dfrac{200\times9\,000\,000}{50\times150\times100\times100}=\dfrac{1.8\times10^9}{7.5\times10^7}=24$.
Check with expected counts: $25,25,75,75$, giving $\frac{225}{25}+\frac{225}{25}+\frac{225}{75}+\frac{225}{75}=24$. A large score means the word is strongly associated with the class, so it is kept as a feature.

@ stat h stat-h-059
T: Facts about chi-square goodness of fit
S: chi-squared-test
TYPE: msq
Q: Which statements about chi-square tests are true? (More than one option may be correct.)
A: Swapping the roles of rows and columns in a test of independence does not change the statistic or its degrees of freedom
B: The goodness-of-fit test rejects $H_0$ both for very large and for very small values of $\chi^2$ at the usual level
C: Merging two categories in a goodness-of-fit test lowers the degrees of freedom by one
D: Each parameter estimated from the data increases the degrees of freedom by one
ANS: A,C
EXP: [[A]] True: the expected counts and the sum $\sum(O-E)^2/E$ are symmetric in rows and columns, and $(r-1)(c-1)=(c-1)(r-1)$.
[[B]] False: the standard test is upper-tailed. Only a large $\chi^2$ (poor fit) leads to rejection. A suspiciously small value is sometimes examined (data "too good"), but it is not part of the usual rejection region.
[[C]] True: df $=k-1-m$, and merging reduces $k$ by one.
[[D]] False: each estimated parameter reduces the df by one, because the fitted expected counts sit closer to the data.

@ stat h stat-h-060
T: Regression to the mean in exam scores
S: regression-correlation
Q: Midterm scores have mean $60$ and SD $10$. Final scores have mean $70$ and SD $8$. The correlation is $r=0.5$. Using the least-squares line of final on midterm, what is the predicted final score of a student who scored $80$ on the midterm?
A: $86$
B: $82.5$
C: $78$
D: $80$
ANS: C
EXP: Slope $b=r\dfrac{s_y}{s_x}=0.5\times\dfrac{8}{10}=0.4$. Prediction: $\hat y=70+0.4(80-60)=78$.
In standard units, the midterm is $z=2$ and the predicted final is $r\cdot z=1$ SD above the mean: $70+8=78$.
$86$ assumes the student stays $2$ SD above the mean (it ignores $r<1$). This pull toward the mean is called regression to the mean. $82.5$ inverts the SD ratio.

@ stat h stat-h-061
T: Noisy predictor shrinks the slope
S: regression-correlation
Q: The true relation is $y=2x+\varepsilon$ with $\text{Var}(x)=4$. You only observe $\tilde x=x+u$, where the measurement noise $u$ has variance $1$ and is independent of $x$ and $\varepsilon$. For large samples, the OLS slope of $y$ on $\tilde x$ is about:
A: $2$
B: $1.6$
C: $2.5$
D: $1.0$
ANS: B
EXP: Slope $=\dfrac{\text{Cov}(y,\tilde x)}{\text{Var}(\tilde x)}=\dfrac{\text{Cov}(2x,x+u)}{4+1}=\dfrac{2\times4}{5}=1.6$.
This is attenuation bias: noise in $x$ inflates the denominator but not the covariance, so the slope is shrunk toward $0$ by the factor $\frac{\text{Var}(x)}{\text{Var}(x)+\text{Var}(u)}=0.8$.
Noise in $y$ alone (in $\varepsilon$) would leave the slope unbiased, which is why the tempting answer $2$ is wrong here. $2.5$ multiplies by the factor in place of dividing.

@ stat h stat-h-062
T: SD of y from the slope and R squared
S: regression-correlation
TYPE: nat
TOL: 0.01
Q: A simple linear regression gives $\hat y=10-3x$ with $R^2=0.81$. The sample SD of $x$ is $s_x=2$. What is the sample SD of $y$? Enter it to 2 decimal places.
ANS: 6.67
EXP: $|r|=\sqrt{0.81}=0.9$, and $r$ has the sign of the slope, so $r=-0.9$.
Slope $b=r\dfrac{s_y}{s_x}$, so $-3=-0.9\dfrac{s_y}{2}$ and $s_y=\dfrac{6}{0.9}\approx6.67$.
Using $R^2=0.81$ in place of $r$ gives $7.41$. Mixing up the formula as $s_y=|b|\,s_x\,|r|$ gives $5.4$.

@ stat h stat-h-063
T: What adding a regressor does to R squared
S: regression-correlation
TYPE: msq
Q: Consider OLS linear regression with an intercept. Which statements are true? (More than one option may be correct.)
A: Adding a regressor never decreases $R^2$
B: Adding a regressor that is uncorrelated with $y$ cannot increase $R^2$
C: In simple regression (one regressor), $R^2$ equals the square of the sample correlation between $x$ and $y$
D: Adjusted $R^2$ never decreases when a regressor is added
ANS: A,C
EXP: [[A]] True: the larger model contains the smaller one (set the new coefficient to $0$), so its SSE cannot be larger.
[[B]] False: the new regressor can still help through the other regressors (a suppressor). Take independent $u,v$ with equal variance and $y=u$, $x_1=u+v$, $x_2=v$. Then $\text{corr}(x_2,y)=0$, yet $R^2$ goes from $0.5$ with $x_1$ alone to $1$ with both, since $y=x_1-x_2$ exactly.
[[C]] True for simple regression with intercept.
[[D]] False: adjusted $R^2=1-(1-R^2)\frac{n-1}{n-p-1}$ penalises extra parameters, and it falls when the gain in $R^2$ is small. That is the reason it exists, as a guard against overfitting.

@ stat h stat-h-064
T: t-test for a regression slope
S: regression-correlation
Q: A simple linear regression on $n=12$ points gives slope $b=1.5$, residual standard error $s=2$, and $S_{xx}=\sum(x_i-\bar x)^2=10$. Test $H_0:\beta=0$ (two-sided, $\alpha=0.05$) with $t_{0.025,10}=2.228$. Which is correct?
A: $t=7.5$, reject $H_0$
B: $t=0.75$, do not reject $H_0$
C: $t=3.75$, reject $H_0$
D: $t\approx2.37$, reject $H_0$
ANS: D
EXP: $\text{Var}(b)=\sigma^2/S_{xx}$, so $\text{SE}(b)=s/\sqrt{S_{xx}}=2/\sqrt{10}\approx0.632$.
$t=1.5/0.632\approx2.37$ with $n-2=10$ df. Since $2.37>2.228$, reject.
$7.5$ divides by $s/S_{xx}$ (missing square root). $3.75$ uses $s^2/S_{xx}$, the variance in place of the SE. $0.75$ ignores $S_{xx}$.

@ stat h stat-h-065
T: Least-squares slope without an intercept
S: regression-correlation
Q: Fit the model $y=\beta x$ (no intercept) by least squares to the points $(1,2),(2,3),(3,7)$. What is $\hat\beta$?
A: $\frac{29}{14}$
B: $\frac52$
C: $2$
D: $\frac{29}{6}$
ANS: A
EXP: Minimise $\sum(y_i-\beta x_i)^2$: setting the derivative to zero gives $\hat\beta=\dfrac{\sum x_iy_i}{\sum x_i^2}$.
$\sum x_iy_i=2+6+21=29$, $\sum x_i^2=1+4+9=14$, so $\hat\beta=\frac{29}{14}\approx2.07$.
$\frac52$ is the slope of the model with an intercept, $\frac{S_{xy}}{S_{xx}}=\frac{5}{2}$, whose line is $\hat y=-1+2.5x$. Forcing the line through the origin changes the slope. $2=\bar y/\bar x$ is a ratio estimator, not least squares. $\frac{29}{6}$ divides by $\sum x_i$.

@ stat h stat-h-066
T: Weight of the data in a Normal–Normal posterior
S: bayesian-inference
Q: Observations are $X_i\mid\mu\sim N(\mu,36)$ and the prior is $\mu\sim N(50,4)$ (second parameter is the variance). With $n=27$ observations, the posterior mean is $w\bar x+(1-w)\cdot50$. What is $w$?
A: $0.9$
B: $0.964$
C: $0.25$
D: $0.75$
ANS: D
EXP: The weights are the precisions. Data: $n/\sigma^2=27/36=0.75$. Prior: $1/4=0.25$.
$w=\dfrac{0.75}{0.75+0.25}=0.75$.
Another way to see it: the prior variance $4=36/9$ is worth $9$ observations, so $w=\frac{27}{27+9}$.
$0.9$ uses SDs in place of variances ($27/6$ vs $1/2$). $0.964=\frac{27}{28}$ treats the prior as worth one observation.

@ stat h stat-h-067
T: Ridge penalty implied by a Gaussian prior
S: bayesian-inference
Q: In linear regression $y=Xw+\varepsilon$ with $\varepsilon\sim N(0,\sigma^2I)$, $\sigma^2=4$, and prior $w\sim N(0,\tau^2I)$ with $\tau^2=0.5$, the MAP estimate minimises $\|y-Xw\|^2+\lambda\|w\|^2$. What is $\lambda$?
A: $2$
B: $8$
C: $0.125$
D: $16$
ANS: B
EXP: Negative log posterior (up to constants): $\dfrac{1}{2\sigma^2}\|y-Xw\|^2+\dfrac{1}{2\tau^2}\|w\|^2$.
Multiply by $2\sigma^2$: $\|y-Xw\|^2+\dfrac{\sigma^2}{\tau^2}\|w\|^2$, so $\lambda=\dfrac{4}{0.5}=8$.
$2=1/\tau^2$ ignores the noise scale. $0.125$ inverts the ratio.
Insight: more noise or a tighter prior both mean stronger regularisation.

@ stat h stat-h-068
T: MAP, MLE and Beta posteriors
S: bayesian-inference
TYPE: msq
Q: Which statements are true? (More than one option may be correct.)
A: For a Binomial likelihood with a $\text{Beta}(1,1)$ prior, the MAP estimate equals the MLE $k/n$
B: The MAP estimate is unchanged by reparameterisation: if $\hat\theta$ is the MAP for $\theta$, then $g(\hat\theta)$ is the MAP for $\phi=g(\theta)$ for any smooth one-to-one $g$
C: In the Beta–Binomial model the posterior variance is always smaller than the prior variance
D: With a fixed prior that is positive and continuous near the true parameter, the MAP and the MLE get closer as $n\to\infty$
ANS: A,D
EXP: [[A]] True: the posterior is $\text{Beta}(k+1,n-k+1)$, whose mode is $\frac{k}{n}$.
[[B]] False: a change of variables multiplies the density by a Jacobian $|d\theta/d\phi|$, which moves the mode. Example: posterior $\text{Beta}(2,2)$, density $6\theta(1-\theta)$, has mode $\theta=0.5$. For $\phi=\theta^2$, $\theta=\sqrt\phi$ and $d\theta/d\phi=\frac{1}{2\sqrt\phi}$, so the density of $\phi$ is $6\sqrt\phi(1-\sqrt\phi)\cdot\frac{1}{2\sqrt\phi}=3(1-\sqrt\phi)$ on $(0,1)$. Its mode is $\phi=0$, not $0.5^2=0.25$. (The MLE is invariant because a likelihood has no Jacobian.)
[[C]] False: prior $\text{Beta}(1,10)$ has variance $\frac{10}{121\cdot12}\approx0.0069$. After one success it becomes $\text{Beta}(2,10)$, with variance $\frac{20}{144\cdot13}\approx0.0107$, which is larger. A surprising observation can increase uncertainty.
[[D]] True: the log-likelihood grows like $n$ while the log-prior stays fixed, so the prior's influence vanishes.

@ stat h stat-h-069
T: Bayes estimate under absolute-error loss
S: bayesian-inference
Q: With a uniform $\text{Beta}(1,1)$ prior on $\theta$, you observe $2$ successes in $2$ trials, so the posterior is $\text{Beta}(3,1)$ with density $3\theta^2$ on $[0,1]$. What is the Bayes estimate of $\theta$ under absolute-error loss $|\theta-\hat\theta|$?
A: $0.75$
B: $1$
C: $0.794$
D: $0.667$
ANS: C
EXP: The estimate that minimises expected absolute-error loss is the posterior median. (Squared loss gives the mean, and 0–1 loss gives the mode, i.e. MAP.)
CDF: $F(\theta)=\theta^3$. Set $\theta^3=\frac12$: $\theta=2^{-1/3}\approx0.794$.
$0.75$ is the posterior mean (the squared-loss answer), and $1$ is the mode (MAP), which here equals the MLE $2/2$.

@ stat h stat-h-070
T: Posterior predictive variance in a Normal model
S: bayesian-inference
Q: Let $X\mid\mu\sim N(\mu,1)$ with prior $\mu\sim N(0,1)$ (second parameter is the variance). After observing one value $x=2$, what is the variance of the posterior predictive distribution of a new observation $X_{\text{new}}$?
A: $0.5$
B: $1$
C: $2$
D: $1.5$
ANS: D
EXP: Posterior: precision $1+1=2$, so $\mu\mid x\sim N(1,\,0.5)$.
$X_{\text{new}}=\mu+\varepsilon$ with $\varepsilon\sim N(0,1)$ independent, so the predictive variance is $0.5+1=1.5$ (mean $1$).
$0.5$ counts only the uncertainty about $\mu$. $1$ counts only the noise. $2$ is the prior predictive variance, before seeing $x$.

@ stat h stat-h-071
T: Maximum likelihood as KL minimisation
S: information-theory
Q: Let $\hat P$ be the empirical distribution of a training set and $Q_\theta$ a model. Minimising the average negative log-likelihood $-\frac1n\sum_i\log Q_\theta(x_i)$ over $\theta$ is equivalent to minimising which quantity?
A: $D_{KL}(\hat P\,\|\,Q_\theta)$
B: $D_{KL}(Q_\theta\,\|\,\hat P)$
C: The entropy $H(Q_\theta)$
D: The entropy $H(\hat P)$
ANS: A
EXP: The average NLL is the cross-entropy $H(\hat P,Q_\theta)=-\sum_x\hat P(x)\log Q_\theta(x)$.
$H(\hat P,Q_\theta)=H(\hat P)+D_{KL}(\hat P\|Q_\theta)$, and $H(\hat P)$ does not depend on $\theta$. So the MLE minimises the forward KL $D_{KL}(\hat P\|Q_\theta)$.
The reverse KL $D_{KL}(Q_\theta\|\hat P)$ is what variational inference minimises. It is infinite whenever $Q_\theta$ puts mass off the training points, so it is not equivalent to the MLE.

@ stat h stat-h-072
T: Best prediction under noisy labels
S: information-theory
Q: For a certain input, the true label is $1$ with probability $0.8$ and $0$ with probability $0.2$. A model predicts $P(y=1)=q$. Which $q$ minimises the expected cross-entropy loss, and what is the minimum expected loss in bits?
A: $q=1$, loss $0$ bits
B: $q=0.8$, loss $0$ bits
C: $q=0.5$, loss $1$ bit
D: $q=0.8$, loss about $0.722$ bits
ANS: D
EXP: Expected loss: $L(q)=-0.8\log_2q-0.2\log_2(1-q)=H(p)+D_{KL}(p\|q)$, which is minimised at $q=p=0.8$ (KL $=0$).
The minimum is the entropy $H(0.8)=-0.8\log_2 0.8-0.2\log_2 0.2\approx0.722$ bits, the noise that no model can remove.
$q=1$ looks confident but gives infinite loss on the 20% of cases with label $0$. Cross-entropy rewards calibrated probabilities, not just the right argmax.

@ stat h stat-h-073
T: Mutual information with zero correlation
S: information-theory
Q: $X$ is uniform on $\{-1,0,1\}$ and $Y=X^2$. Then $\text{Cov}(X,Y)=0$. Using base-2 logarithms, what is $I(X;Y)$?
A: $0$ bits
B: about $0.918$ bits
C: about $1.585$ bits
D: about $0.667$ bits
ANS: B
EXP: $Y$ is a function of $X$, so $H(Y\mid X)=0$ and $I(X;Y)=H(Y)$.
$Y=0$ with probability $\frac13$ and $Y=1$ with probability $\frac23$: $H(Y)=\frac13\log_23+\frac23\log_2\frac32\approx0.918$ bits.
$0$ is the trap: zero correlation only rules out a linear relation, while $I(X;Y)=0$ if and only if the variables are independent. $1.585=\log_23$ is $H(X)$, which would apply only if $Y$ determined $X$.

@ stat h stat-h-074
T: Jensen–Shannon divergence of disjoint distributions
S: information-theory
Q: Let $P=(1,0)$ and $Q=(0,1)$ on two outcomes. Using base-2 logarithms, what is the Jensen–Shannon divergence $\text{JS}(P,Q)=\frac12D_{KL}(P\|M)+\frac12D_{KL}(Q\|M)$, where $M=\frac12(P+Q)$?
A: $+\infty$
B: $0$
C: $2$ bits
D: $1$ bit
ANS: D
EXP: $M=(\frac12,\frac12)$. $D_{KL}(P\|M)=1\cdot\log_2\frac{1}{1/2}=1$ bit, and likewise $D_{KL}(Q\|M)=1$ bit.
$\text{JS}=\frac12(1)+\frac12(1)=1$ bit, its largest possible value.
$+\infty$ is $D_{KL}(P\|Q)$: the supports do not overlap. Mixing with $M$ keeps JS finite and symmetric, which is why it appears in the original GAN objective.

@ stat h stat-h-075
T: Information one coin gives about a sum
S: information-theory
TYPE: nat
TOL: 0.01
Q: $X$ and $Y$ are independent fair coins taking values $0$ or $1$, and $S=X+Y$. Using base-2 logarithms, what is $I(X;S)$ in bits? Enter the number.
ANS: 0.5
EXP: $I(X;S)=H(S)-H(S\mid X)$.
$S\in\{0,1,2\}$ with probabilities $\frac14,\frac12,\frac14$: $H(S)=\frac14(2)+\frac12(1)+\frac14(2)=1.5$ bits.
Given $X$, $S=X+Y$ is still a fair coin flip (shifted by $X$), so $H(S\mid X)=H(Y)=1$ bit.
$I(X;S)=1.5-1=0.5$ bits. Knowing $X$ removes half a bit of the uncertainty about $S$.

@ graph e graph-e-001
T: Handshake lemma
S: basics-degree
Q: An undirected graph has 10 edges. What is the sum of all vertex degrees?
A: $10$
B: $20$
C: $5$
D: $40$
ANS: B
EXP: Each edge adds 1 to the degree of each of its two endpoints, so $\sum\deg(v)=2|E|=20$.


@ graph e graph-e-002
T: Edges in a complete graph
S: basics-degree
Q: How many edges does the complete graph $K_6$ have?
A: $30$
B: $15$
C: $36$
D: $21$
ANS: B
EXP: Every pair of vertices is joined: $\binom62=\tfrac{6\cdot5}{2}=15$. ($21$ is $K_7$; $30$ counts ordered pairs.)


@ graph e graph-e-003
T: Edges in a tree
S: trees
Q: A tree has 12 vertices. How many edges does it have?
A: $12$
B: $11$
C: $13$
D: $66$
ANS: B
EXP: Every tree on $n$ vertices has exactly $n-1$ edges: connected with no cycles. Adding any edge creates a cycle.


@ graph e graph-e-004
T: Data structures for BFS and DFS
S: traversal
Q: Which pairing of traversal and data structure is correct?
A: BFS uses a queue; DFS uses a stack
B: BFS uses a stack; DFS uses a queue
C: both use a queue
D: both use a priority queue
ANS: A
EXP: BFS explores level by level, first in first out, so it uses a queue. DFS goes deep first, last in first out, so it uses a stack (or recursion).
Dijkstra is the one that uses a priority queue.


@ graph e graph-e-005
T: Adjacency matrix of an undirected graph
S: basics-degree
Q: The adjacency matrix of any simple undirected graph is:
A: symmetric with zero diagonal
B: upper triangular
C: always invertible
D: orthogonal
ANS: A
EXP: Edge $\{i,j\}$ sets $A_{ij}=A_{ji}=1$, so $A$ is symmetric. "Simple" means no self-loops, so the diagonal is zero.
It is often singular (e.g. any graph with two vertices that have identical neighbourhoods).


@ graph e graph-e-006
T: Impossible degree sequence
S: basics-degree
Q: Which degree sequence cannot belong to any simple graph?
A: $(2,2,2)$
B: $(3,3,2,2)$
C: $(3,2,2,1,1)$
D: $(1,1,1,1)$
ANS: C
EXP: The degree sum must be even ($=2|E|$). $3+2+2+1+1=9$ is odd, so [[C]] is impossible.
[[A]] is a triangle, [[D]] is two disjoint edges, and [[B]] is $K_4$ minus one edge.


@ graph e graph-e-007
T: Which graph is bipartite
S: matching-coloring
Q: Which graph is bipartite?
A: $K_3$
B: $C_5$
C: $C_6$
D: $K_4$
ANS: C
EXP: A graph is bipartite if and only if it has no odd cycle. $C_6$ is an even cycle, so you can alternate two colours around it.
$K_3$ and $C_5$ are odd cycles, and $K_4$ contains triangles.


@ graph e graph-e-008
T: Shortest paths with negative edges
S: shortest-paths
Q: Which algorithm finds single-source shortest paths when some edge weights are negative (but there is no negative cycle)?
A: Dijkstra
B: Bellman–Ford
C: Prim
D: BFS
ANS: B
EXP: Bellman–Ford relaxes every edge $V-1$ times in $O(VE)$, and a $V$-th pass detects negative cycles.
Dijkstra's greedy finalisation can be wrong with negative edges. Prim builds a minimum spanning tree, not shortest paths. BFS only handles unweighted graphs.


@ graph e graph-e-009
T: Space for an adjacency list
S: basics-degree
Q: How much space does an adjacency-list representation of a graph use?
A: $O(V^2)$
B: $O(V+E)$
C: $O(E^2)$
D: $O(V\log V)$
ANS: B
EXP: One list per vertex ($V$) plus one entry per edge endpoint ($2E$ undirected). An adjacency matrix always uses $O(V^2)$, which wastes space on sparse graphs.


@ graph e graph-e-010
T: When a topological order exists
S: dag-toposort
Q: A directed graph has a topological ordering if and only if it:
A: is strongly connected
B: is a directed acyclic graph (DAG)
C: has no isolated vertices
D: is a tree
ANS: B
EXP: A cycle $u\to\dots\to u$ would require $u$ to come before itself. Every DAG has a topological order (Kahn's algorithm or DFS finish times).
Neural network computation graphs are DAGs, which is why backprop can process them in reverse topological order.


@ graph m graph-m-001
T: Spanning trees of K₄
S: trees
Q: How many spanning trees does $K_4$ have?
A: $4$
B: $6$
C: $12$
D: $16$
ANS: D
EXP: Cayley's formula: $K_n$ has $n^{n-2}$ labelled spanning trees, so $4^2=16$.
Breakdown: 4 stars plus 12 paths.


@ graph m graph-m-002
T: Counting triangles with the adjacency matrix
S: spectral
Q: $A$ is the adjacency matrix of $K_4$. What is $\operatorname{tr}(A^3)$?
A: $4$
B: $12$
C: $24$
D: $64$
ANS: C
EXP: $(A^3)_{ii}$ counts closed walks of length 3 from $i$. Each triangle gives $6$ such walks (3 starting vertices × 2 directions).
$K_4$ has $\binom43=4$ triangles, so $\operatorname{tr}(A^3)=24$. (Check: eigenvalues $3,-1,-1,-1$ give $27-3=24$.)


@ graph m graph-m-003
T: Zero eigenvalues of the Laplacian
S: spectral
Q: The graph Laplacian $L=D-A$ of a graph with 3 connected components has eigenvalue $0$ with multiplicity:
A: $0$
B: $1$
C: $3$
D: depends on the number of edges
ANS: C
EXP: $x^TLx=\sum_{(i,j)\in E}(x_i-x_j)^2=0$ exactly when $x$ is constant on each component.
That gives one independent null vector per component, so the multiplicity is 3. Spectral clustering uses this fact.


@ graph m graph-m-004
T: Condition for an Euler circuit
S: connectivity
Q: A connected undirected graph has an Euler circuit (a closed walk using every edge exactly once) if and only if:
A: every vertex has even degree
B: exactly two vertices have odd degree
C: it is a complete graph
D: it has a Hamiltonian cycle
ANS: A
EXP: Each pass through a vertex uses one edge in and one edge out, so degrees must be even.
With exactly two odd vertices you get an Euler path (open trail) instead.


@ graph m graph-m-005
T: Weight of a minimum spanning tree
S: mst
Q: Undirected weighted edges: A–B (1), B–C (2), A–C (3), C–D (4), B–D (5). What is the total weight of the minimum spanning tree?
A: $7$
B: $6$
C: $10$
D: $8$
ANS: A
EXP: Kruskal: take A–B (1), take B–C (2), skip A–C (3) because it would form a cycle, take C–D (4). Now all 4 vertices are connected.
Total $=1+2+4=7$. ($6$ wrongly includes A–C.)


@ graph m graph-m-006
T: Dijkstra on a small directed graph
S: shortest-paths
Q: Directed weighted edges: A→B (4), A→C (1), C→B (2), B→D (1), C→D (5). What is the shortest distance from A to D?
A: $4$
B: $5$
C: $6$
D: $3$
ANS: A
EXP: Dijkstra from A: $d(C)=1$, then $d(B)=\min(4,\ 1+2)=3$, then $d(D)=\min(1+5,\ 3+1)=4$.
Path A→C→B→D. The more direct-looking A→B→D costs 5.


@ graph m graph-m-007
T: Running time of Dijkstra with a heap
S: shortest-paths
Q: The running time of Dijkstra's algorithm with a binary heap is:
A: $O(V^2)$
B: $O((V+E)\log V)$
C: $O(VE)$
D: $O(V+E)$
ANS: B
EXP: Each vertex is extracted once ($V\log V$) and each edge may cause a decrease-key ($E\log V$).
$O(V^2)$ is the array version, which is better for dense graphs; $O(VE)$ is Bellman–Ford.


@ graph m graph-m-008
T: Maximum edges in a bipartite graph
S: matching-coloring
Q: What is the maximum number of edges in a simple bipartite graph on 10 vertices?
A: $45$
B: $25$
C: $24$
D: $20$
ANS: B
EXP: With parts of size $a$ and $10-a$, the maximum is $a(10-a)$, achieved by the complete bipartite graph. It peaks at $a=5$: $25$. ($45=\binom{10}{2}$ ignores bipartiteness.)


@ graph m graph-m-009
T: Chromatic number of an odd cycle
S: matching-coloring
Q: What is the chromatic number of the cycle $C_7$?
A: $2$
B: $3$
C: $4$
D: $7$
ANS: B
EXP: Alternating 2 colours fails on an odd cycle: the last vertex clashes with the first. Using a third colour for one vertex fixes it, so $\chi(C_{odd})=3$.


@ graph m graph-m-010
T: Edges in a 3-regular graph
S: basics-degree
Q: A graph has 8 vertices and every vertex has degree 3. How many edges does it have?
A: $24$
B: $12$
C: $11$
D: $8$
ANS: B
EXP: Handshake: $2|E|=8\cdot3=24\Rightarrow|E|=12$. (The cube graph $Q_3$ is an example.)


@ graph h graph-h-001
T: Adjacency eigenvalues of K₅
S: spectral
Q: What are the eigenvalues of the adjacency matrix of $K_5$?
A: $4$ (once) and $-1$ (four times)
B: $5$ (once) and $0$ (four times)
C: $4$ (once) and $0$ (four times)
D: $1$ (five times)
ANS: A
EXP: $A=J-I$. $J$ has eigenvalues $5$ (once) and $0$ (four times), so $A$ has $4$ and $-1\ (\times4)$.
Check: the trace is $4-4=0$, matching the zero diagonal. The top eigenvalue equals the degree, as it does for any regular graph.


@ graph h graph-h-002
T: Number of labelled graphs
S: basics-degree
Q: How many distinct simple graphs are there on 4 labelled vertices?
A: $16$
B: $64$
C: $11$
D: $4096$
ANS: B
EXP: Each of the $\binom42=6$ possible edges is present or absent, so $2^6=64$.
$11$ is the count of unlabelled graphs (up to isomorphism), a common confusion.


@ graph h graph-h-003
T: Planarity of K₅
S: basics-degree
Q: Is $K_5$ planar?
A: Yes, it can be drawn without crossings
B: No, because $|E|=10>3|V|-6=9$
C: No, because it is bipartite
D: Yes, because every vertex has degree 4
ANS: B

@ graph e graph-e-043

S: random-walks

EXP: Two easy lower bounds both give $4$: the longest chain $A\to D\to E$ needs 3 semesters, and $\lceil7/2\rceil=4$.

Total $2+1+2=5$, and the schedule $\{A,B\},\{C\},\{D\},\{E,F\},\{G\}$ achieves it. The bottleneck $D$ wastes a slot in semester 3, which neither bound sees.

@ graph h graph-h-052
T: Edges that can be added to a DAG
S: dag-toposort
Q: A simple DAG has 6 vertices and 7 edges, with at most one edge between any pair. What is the maximum number of new edges that can be added so that the graph is still a simple DAG?
A: $8$
B: $15$
C: $23$
D: it depends on which 7 edges are present
ANS: A
EXP: Fix any topological order $v_1,\dots,v_6$ of the DAG. All 7 existing edges point forward in it. Add the forward edge $v_i\to v_j$ ($i<j$) for every pair not yet joined: all edges still go forward, so no cycle forms.
That fills every one of the $\binom62=15$ pairs, so $15-7=8$ edges can be added, and no more since every pair is then used.
This works for any DAG, so the answer does not depend on which edges are present. $15$ forgets the existing edges; $23=30-7$ counts ordered pairs, which would allow 2-cycles.

@ graph h graph-h-053
T: Shortest path in a DAG with a negative edge
S: dag-toposort
Q: A weighted DAG has edges $S\to A$ (weight $1$), $S\to B$ ($4$), $B\to A$ ($-5$), $A\to T$ ($2$). What is the true shortest distance from $S$ to $T$?
A: $3$
B: $-1$
C: $4$
D: $1$
ANS: D
EXP: In a DAG, relax edges in topological order: $S,B,A,T$. This is correct even with negative weights, in $O(V+E)$.
$d(S)=0$. $d(B)=4$. $d(A)=\min(0+1,\ 4-5)=-1$. $d(T)=d(A)+2=1$. Path $S\to B\to A\to T$.
$3$ is what Dijkstra returns: it finalises $A$ at distance $1$ before seeing the cheaper route through $B$, and it then pops $T$ at $3$ before $B$ (at $4$). $-1$ is the distance to $A$, not $T$.

@ graph h graph-h-054
T: True statements about DAGs
S: dag-toposort
TYPE: msq
Q: Which statements are true for every finite DAG $G$? (More than one option may be correct.)
A: $G$ has at least one vertex of in-degree $0$
B: Reversing the direction of every edge of $G$ gives another DAG
C: If $u$ comes before $v$ in some topological order of $G$, then $G$ has a directed path from $u$ to $v$
D: If $u$ comes before $v$ in some topological order of $G$, then adding the edge $v\to u$ creates a cycle
ANS: A,B
EXP: Walking backwards along edges from any vertex can never repeat a vertex, so it ends at a vertex of in-degree $0$. True.
A cycle in the reversed graph, read backwards, would be a cycle in $G$. So reversing preserves acyclicity (its topological order is the reverse). True.
Counterexample for the path claim: two vertices $u,v$ and no edges. Then $u,v$ is a topological order, yet there is no path $u\to v$.
The same graph refutes the last claim: adding $v\to u$ gives a single edge, no cycle. A cycle forms only if there was already a path $u\leadsto v$.

@ graph h graph-h-055
T: Edges needed to make a digraph strongly connected
S: connectivity
Q: A directed graph on vertices $1,\dots,7$ has edges $1\to2$, $2\to1$, $2\to3$, $3\to4$, $4\to3$, $1\to5$, $6\to5$, $2\to7$. What is the minimum number of edges that must be added to make it strongly connected?
A: $2$
B: $4$
C: $3$
D: $5$
ANS: C
EXP: Contract each SCC to a node: $\{1,2\}$, $\{3,4\}$, $\{5\}$, $\{6\}$, $\{7\}$. The condensation DAG has edges $\{1,2\}\to\{3,4\}$, $\{1,2\}\to\{5\}$, $\{1,2\}\to\{7\}$, $\{6\}\to\{5\}$.
Sources (in-degree 0): $\{1,2\}$ and $\{6\}$, so $s=2$. Sinks (out-degree 0): $\{3,4\}$, $\{5\}$, $\{7\}$, so $t=3$.
Every sink needs a new outgoing edge and every source a new incoming one, and one edge can serve one sink and one source, so at least $\max(s,t)=3$ are needed. Theorem (Eswaran-Tarjan): $\max(s,t)$ edges always suffice when the graph is not already strongly connected. E.g. add $3\to6$, $5\to1$, $7\to1$.
$4$ is (number of SCCs $-1$); $5=s+t$ double-counts edges that fix a sink and a source at once.

@ graph h graph-h-056
T: Connectivity of a graph and its complement
S: connectivity
TYPE: msq
Q: $\bar G$ is the complement of a simple graph $G$ on $n\ge2$ vertices (same vertices; $uv$ is an edge of $\bar G$ iff it is not an edge of $G$). Which statements are true? (More than one option may be correct.)
A: If $G$ is disconnected, then $\bar G$ is connected
B: If $G$ is connected, then $\bar G$ is disconnected
C: $G$ and $\bar G$ can both be connected
D: $G$ and $\bar G$ can both be disconnected
ANS: A,C
EXP: Suppose $G$ is disconnected. Take $u,v$. If they are in different components of $G$, then $uv\in\bar G$. If they are in the same component, pick $w$ in another component: $uw,wv\in\bar G$. So $\bar G$ is connected (diameter at most 2). True.
That also rules out both being disconnected.
The path $P_4$ ($1-2-3-4$) is connected and its complement has edges $13,14,24$: the path $3-1-4-2$, also connected. So both can be connected, and "$G$ connected implies $\bar G$ disconnected" is false. ($C_5$ is another example: its complement is again a 5-cycle.)

@ graph h graph-h-057
T: Which grid has a Hamiltonian cycle
S: connectivity
Q: The $m\times n$ grid graph has a vertex at each point $(i,j)$, $1\le i\le m$, $1\le j\le n$, joined to its horizontal and vertical neighbours. Which grid has a Hamiltonian cycle?
A: $3\times3$
B: $3\times4$
C: $5\times5$
D: $1\times4$
ANS: B
EXP: A grid is bipartite (colour $(i,j)$ by the parity of $i+j$), and a Hamiltonian cycle in a bipartite graph alternates colours, so it needs equal colour classes and therefore an even number of vertices.
$3\times3$ (9 vertices) and $5\times5$ (25) are odd, so no Hamiltonian cycle, though both have Hamiltonian paths (snake row by row).
$1\times4$ is a path with degree-1 ends, so no cycle at all.
$3\times4$ has 12 vertices, and a cycle exists: $(1,1)\to(1,2)\to(1,3)\to(1,4)\to(2,4)\to(3,4)\to(3,3)\to(2,3)\to(2,2)\to(3,2)\to(3,1)\to(2,1)\to(1,1)$.

@ graph h graph-h-058
T: When the DFS root is a cut vertex
S: connectivity
Q: DFS is run on a connected undirected graph from root $r$. When is $r$ an articulation point?
A: when $r$ has degree at least 2 in the graph
B: when $r$ has at least 2 children in the DFS tree
C: when $r$ has at least one back edge
D: never, since the root reaches every vertex
ANS: B
EXP: In an undirected DFS there are no cross edges: every non-tree edge joins a vertex to its ancestor or descendant. So two different subtrees of $r$ are joined only through $r$.
If $r$ has $\ge2$ children, deleting $r$ separates those subtrees: cut vertex. If it has one child, the rest of the tree hangs below that child and stays connected without $r$.
Degree $\ge2$ is not enough: in a triangle the root has degree 2, but DFS reaches the third vertex through the first child, so the root has one child and is not a cut vertex. (Non-root $u$ uses the low-link test: some child $v$ with $\text{low}(v)\ge\text{disc}(u)$.)

@ graph h graph-h-059
T: Maximum edges with 3 components
S: connectivity
TYPE: nat
TOL: 0
Q: A simple undirected graph has 10 vertices and exactly 3 connected components. What is the maximum possible number of edges? Enter an integer.
ANS: 28
EXP: With component sizes $n_1+n_2+n_3=10$, the most edges is $\sum\binom{n_i}{2}$ (each component complete).
$\binom{x}{2}$ is convex, so the sum is largest when the sizes are as unequal as possible: $8,1,1$. That gives $\binom82=28$.
The balanced split $4,3,3$ gives only $6+3+3=12$. In general the maximum is $\binom{n-k+1}{2}$.

@ graph h graph-h-060
T: Graphs with a strongly connected orientation
S: connectivity
Q: Robbins' theorem concerns orienting every edge of an undirected graph so that the result is strongly connected. Which graph has such an orientation?
A: two triangles joined by a single extra edge
B: the cycle $C_5$ with one pendant vertex attached
C: the star $K_{1,3}$
D: two triangles sharing exactly one vertex (the "bowtie")
ANS: D
EXP: Robbins' theorem: a connected graph has a strongly connected orientation iff it has no bridge. A bridge, whichever way it points, can be crossed in only one direction.
Two triangles joined by an edge: that edge is a bridge. $C_5$ plus a pendant: the pendant edge is a bridge. $K_{1,3}$: every edge is a bridge.
The bowtie has a cut vertex but no bridge: orient each triangle as a directed cycle; both pass through the shared vertex, so everything is mutually reachable. The trap is thinking an articulation point blocks this; only bridges do.

@ graph h graph-h-061
T: Proper 3-colourings of a 5-cycle
S: matching-coloring
TYPE: nat
TOL: 0
Q: How many proper vertex colourings of the cycle $C_5$ (vertices labelled $1,\dots,5$) use colours from a set of 3 colours? Colourings that differ by renaming colours count as different. Enter an integer.
ANS: 30
EXP: The chromatic polynomial of the cycle is $P(C_n,k)=(k-1)^n+(-1)^n(k-1)$.
For $n=5$, $k=3$: $2^5-2=30$.
Why: a path on $n$ vertices has $k(k-1)^{n-1}$ colourings ($3\cdot16=48$ here). Those where vertex 5 matches vertex 1 must be removed; they correspond to colourings of $C_4$ ($2^4+2=18$). $48-18=30$. The trap $48$ forgets the closing edge.

@ graph h graph-h-062
T: Perfect matchings of a ladder
S: matching-coloring
Q: The $2\times4$ ladder graph has top vertices $t_1,\dots,t_4$ and bottom vertices $b_1,\dots,b_4$, with edges $t_it_{i+1}$, $b_ib_{i+1}$ ($i=1,2,3$) and rungs $t_ib_i$ ($i=1,\dots,4$). How many perfect matchings does it have?
A: $4$
B: $5$
C: $8$
D: $16$
ANS: B
EXP: Look at $t_1$. Either it is matched by the rung $t_1b_1$, leaving a $2\times3$ ladder, or by $t_1t_2$, which forces $b_1b_2$ (the only option left for $b_1$), leaving a $2\times2$ ladder.
So $M_n=M_{n-1}+M_{n-2}$ with $M_1=1$, $M_2=2$: Fibonacci. $M_3=3$, $M_4=5$.
This is the domino-tiling count of a $2\times4$ board. $16=2^4$ treats each column independently, which ignores how horizontal pairs force each other.

@ graph h graph-h-063
T: Matching and vertex cover of an odd cycle
S: matching-coloring
Q: For the cycle $C_7$, let $\nu$ be the size of a maximum matching and $\tau$ the size of a minimum vertex cover. What are they?
A: $\nu=3,\ \tau=3$
B: $\nu=4,\ \tau=4$
C: $\nu=3,\ \tau=4$
D: $\nu=4,\ \tau=3$
ANS: C
EXP: Matching: 7 vertices, so at most $\lfloor7/2\rfloor=3$ disjoint edges, and 3 is achievable. $\nu=3$.
Cover: each vertex covers 2 of the 7 edges, so 3 vertices cover at most 6. $\tau\ge4$, and $\{1,3,5,7\}$ works. $\tau=4$.
König's theorem ($\nu=\tau$) holds only for bipartite graphs; $C_7$ is an odd cycle, so $\nu=\tau$ fails here. In general $\nu\le\tau\le2\nu$, which also rules out $\nu=4,\tau=3$.

@ graph h graph-h-064
T: Bounds on the chromatic number
S: matching-coloring
TYPE: msq
Q: $\chi(G)$ is the chromatic number, $\omega(G)$ the size of the largest clique and $\Delta(G)$ the maximum degree. Which statements are true for every simple graph $G$? (More than one option may be correct.)
A: $\chi(G)\ge\omega(G)$
B: $\chi(G)\le\Delta(G)+1$
C: If $G$ has no triangle, then $\chi(G)\le3$
D: If $G$ contains an odd cycle, then $\chi(G)\ge3$
ANS: A,B,D
EXP: A clique of size $\omega$ needs $\omega$ different colours. True.
Greedy colouring in any order: each vertex has at most $\Delta$ coloured neighbours, so one of $\Delta+1$ colours is free. True.
An odd cycle is not 2-colourable, and a subgraph needs at most as many colours as the whole graph. True.
False: triangle-free graphs can need many colours. The Grötzsch graph (11 vertices) is triangle-free with $\chi=4$, and Mycielski's construction gives triangle-free graphs of any chromatic number. So $\omega$ can be a very weak lower bound.

@ graph h graph-h-065
T: Chromatic number of the complement of C6
S: matching-coloring
Q: What is the chromatic number of $\bar C_6$, the complement of the 6-cycle?
A: $2$
B: $3$
C: $4$
D: $6$
ANS: B
EXP: Label $C_6$ as $0,1,\dots,5$ around the ring. In $\bar C_6$, vertex $i$ is adjacent to everything except $i\pm1$.
$\{0,2,4\}$ are pairwise non-adjacent in $C_6$, so they form a triangle in $\bar C_6$; likewise $\{1,3,5\}$. So $\chi\ge3$.
Colour classes in $\bar C_6$ are cliques of $C_6$, which are edges: $\{0,1\},\{2,3\},\{4,5\}$. Three classes suffice, so $\chi=3$. (The graph is the triangular prism.)
$2$ is $\chi(C_6)$; complementing does not preserve it. $4$ would need more than 3 colours, but the 3-colouring above already works (the largest clique is only a triangle).

@ graph h graph-h-066
T: Greedy colouring on a bad order
S: matching-coloring
Q: The graph has vertices $u_1,\dots,u_4$ and $v_1,\dots,v_4$, with $u_i$ adjacent to $v_j$ exactly when $i\ne j$ ($K_{4,4}$ minus a perfect matching). Greedy colouring visits $u_1,v_1,u_2,v_2,u_3,v_3,u_4,v_4$ and gives each vertex the smallest colour not used by an already-coloured neighbour. How many colours does it use?
A: $2$
B: $3$
C: $4$
D: $8$
ANS: C
EXP: $u_1\to1$. $v_1$ is not adjacent to $u_1$, so $v_1\to1$. $u_2$ sees $v_1$ (colour 1), so $u_2\to2$; $v_2$ sees $u_1$ (1), so $v_2\to2$.
$u_3$ sees $v_1,v_2$ (1,2): colour 3; $v_3$ likewise 3. $u_4,v_4$ get 4. So greedy uses 4 colours.
But the graph is bipartite ($u$'s one side, $v$'s the other), so $\chi=2$. Greedy depends on the order, and on this "crown" graph with $n$ pairs it uses $n$ colours; the answer $2$ is the optimum, not what greedy produces.

@ graph h graph-h-067
T: Largest eigenvalue of a star
S: spectral
Q: What is the largest eigenvalue of the adjacency matrix of the star $K_{1,4}$ (one centre joined to 4 leaves)?
A: $4$
B: $5$
C: $2$
D: $1$
ANS: C
EXP: Let $x$ be the centre value and $y$ the (equal) leaf values. $Ax=\lambda x$ gives: centre $4y=\lambda x$; each leaf $x=\lambda y$. So $4y=\lambda^2y$, $\lambda^2=4$, $\lambda=\pm2$. The other eigenvalues are $0$ (leaf vectors summing to zero, centre $0$), three times.
Spectrum $2,0,0,0,-2$: check $\sum\lambda^2=8=2|E|$.
$4$ is the maximum degree. That would be right for a 4-regular graph, but in general $\bar d\le\lambda_1\le\Delta$, and for $K_{1,n}$ it is $\sqrt n$.

@ graph h graph-h-068
T: Laplacian spectrum of the complement
S: spectral
Q: A graph $G$ on 4 vertices has Laplacian eigenvalues $0,1,1,4$. How many connected components does its complement $\bar G$ have?
A: $1$
B: $2$
C: $3$
D: $4$
ANS: B
EXP: Since $L(G)+L(\bar G)=L(K_n)=nI-J$, and $J$ vanishes on vectors orthogonal to $\mathbf 1$, each eigenvector of $L(G)$ orthogonal to $\mathbf 1$ with eigenvalue $\mu$ is an eigenvector of $L(\bar G)$ with eigenvalue $n-\mu$. The vector $\mathbf 1$ itself still gives $0$.
Here $n=4$: from $1,1,4$ we get $3,3,0$. So $\bar G$ has Laplacian eigenvalues $0,0,3,3$.
The multiplicity of $0$ counts components: $\bar G$ has 2. (Indeed $G=K_{1,3}$ and $\bar G$ is a triangle plus an isolated vertex.) Answering $1$ forgets the $4\to0$ step; the eigenvalue $4=n$ in $G$ is the signal that $\bar G$ is disconnected.

@ graph h graph-h-069
T: Reading a graph off its spectrum
S: spectral
TYPE: msq
Q: A simple graph has adjacency eigenvalues $3$ (once), $1$ (5 times) and $-2$ (4 times). Which statements are true? (More than one option may be correct.)
A: It has exactly 15 edges
B: It is bipartite
C: It contains no triangle
D: It is disconnected
ANS: A,C
EXP: Edges: $\sum\lambda^2=9+5\cdot1+4\cdot4=30=2|E|$, so $|E|=15$. True.
Triangles: $\operatorname{tr}A^3=6\times(\#\text{triangles})$, and $\sum\lambda^3=27+5-32=0$. No triangles. True.
Bipartite needs a spectrum symmetric about $0$: $3$ is present but $-3$ is not. False.
Connected: $n=10$, average degree $30/10=3=\lambda_1$. $\lambda_1$ equals the average degree only for regular graphs, so it is 3-regular, and for a regular graph the multiplicity of the eigenvalue $k$ counts components. It appears once, so the graph is connected. (This is the Petersen graph.)

@ graph h graph-h-070
T: Exact PageRank with damping 0.5
S: random-walks
TYPE: nat
TOL: 0.001
Q: Pages $P_1,P_2,P_3$ have links $P_1\to P_2$, $P_1\to P_3$, $P_2\to P_3$, $P_3\to P_1$. PageRank satisfies $r_v=\frac{1-d}N+d\sum_{u\to v}\frac{r_u}{\text{out}(u)}$ with $d=0.5$ and $N=3$. Find the exact (fixed-point) value of $r_3$, the rank of $P_3$, to 3 decimal places.
ANS: 0.385
EXP: Equations with $c=\frac{1-d}N=\frac16$:
$r_1=\frac16+\frac12r_3$, $r_2=\frac16+\frac12\cdot\frac{r_1}2$, $r_3=\frac16+\frac12\left(\frac{r_1}2+r_2\right)$.
Substitute $r_2=\frac16+\frac{r_1}4$: $r_3=\frac16+\frac12\left(\frac{r_1}2+\frac16+\frac{r_1}4\right)=\frac14+\frac38r_1$.
With $r_1=\frac16+\frac12r_3$: $r_3=\frac14+\frac1{16}+\frac3{16}r_3$, so $\frac{13}{16}r_3=\frac5{16}$ and $r_3=\frac5{13}\approx0.385$.
Then $r_1=\frac{14}{39}$, $r_2=\frac{10}{39}$; they sum to $1$. $P_3$ ranks highest because it collects all of $P_2$'s vote and half of $P_1$'s.

@ graph h graph-h-071
T: Commute time across a tree edge
S: random-walks
Q: A simple random walk runs on the tree with edges $\{0,1\},\{1,2\},\{1,3\},\{3,4\},\{3,5\}$. What is the expected commute time between vertices $1$ and $3$ (expected steps to go from $1$ to $3$ and then back to $1$)?
A: $2$
B: $5$
C: $10$
D: $20$
ANS: C
EXP: Commute time identity: $\kappa(u,v)=2|E|\cdot R_{\text{eff}}(u,v)$, where each edge is a unit resistor.
In a tree there is only one route, so $R_{\text{eff}}(1,3)=1$ (one edge). With $|E|=5$: $\kappa=2\cdot5\cdot1=10$.
Direct check: for a tree edge $\{u,v\}$, $h(u\to v)=2m_u+1$, where $m_u$ is the number of edges on $u$'s side. Both sides have 2 edges, so $h(1\to3)=h(3\to1)=5$, and $5+5=10$.
$2$ treats the edge as if the walk crossed it immediately both ways; $5$ forgets the factor 2.

@ graph h graph-h-072
T: Eigenvalues of the random walk on K4
S: random-walks
Q: What are the eigenvalues of the transition matrix $P=D^{-1}A$ of the simple random walk on $K_4$?
A: $1,\ -\tfrac13,\ -\tfrac13,\ -\tfrac13$
B: $3,\ -1,\ -1,\ -1$
C: $1,\ 0,\ 0,\ 0$
D: $1,\ \tfrac13,\ \tfrac13,\ \tfrac13$
ANS: A
EXP: $K_4$ is 3-regular, so $P=\frac13A=\frac13(J-I)$. The adjacency eigenvalues are $3,-1,-1,-1$; dividing by 3 gives $1,-\frac13,-\frac13,-\frac13$.
Check: $\operatorname{tr}P=0$ (no self-loops) and $1-1=0$. The eigenvalue $1$ is always present ($P\mathbf 1=\mathbf 1$).
The second-largest absolute value $\frac13$ sets the mixing speed: the distance to uniform shrinks by a factor of $3$ each step. $3,-1,-1,-1$ forgets to normalise by degree.

@ graph h graph-h-073
T: Stationary distribution of a directed walk
S: random-walks
Q: A walk on a directed graph follows a uniformly random outgoing edge at each step. Edges: $P_1\to P_2$, $P_2\to P_3$, $P_3\to P_1$, $P_3\to P_2$. What is the stationary probability of $P_1$?
A: $1/4$
B: $1/3$
C: $1/5$
D: $2/5$
ANS: C
EXP: Solve $\pi=\pi P$. $P_1$ is entered only from $P_3$ (out-degree 2): $\pi_1=\frac12\pi_3$.
$P_2$ from $P_1$ (out 1) and $P_3$: $\pi_2=\pi_1+\frac12\pi_3=\pi_3$. $P_3$ from $P_2$ only: $\pi_3=\pi_2$.
So $\pi\propto(\tfrac12,1,1)$, i.e. $\pi=(\tfrac15,\tfrac25,\tfrac25)$.
The trap $1/4$ uses "proportional to in-degree" (in-degrees $1,2,1$), and degree-proportional rules only hold for undirected graphs. That is exactly why PageRank has to be computed, not read off degrees.

@ graph h graph-h-074
T: Probability of hitting one vertex before another
S: random-walks
Q: A simple random walk runs on the graph with edges $\{A,B\},\{B,C\},\{B,D\},\{C,D\}$. Starting at $B$, what is the probability that it reaches $D$ before it reaches $A$?
A: $1/2$
B: $2/3$
C: $3/5$
D: $1/3$
ANS: C
EXP: Let $h(v)=P(\text{hit }D\text{ before }A\mid\text{start }v)$, so $h(A)=0$, $h(D)=1$, and $h$ is harmonic elsewhere (the average over neighbours).
$h(C)=\frac12(h(B)+1)$. $h(B)=\frac13(0+h(C)+1)$.
Substitute: $h(B)=\frac13\left(\frac{h(B)+1}2+1\right)=\frac{h(B)}6+\frac12$, so $\frac56h(B)=\frac12$ and $h(B)=\frac35$.
$1/3$ counts only the direct step to $D$; $2/3$ adds the step to $C$ as if it always led to $D$. The detour through $C$ can come back to $B$ and then go to $A$.

@ graph h graph-h-075
T: Visits to a vertex between returns
S: random-walks
Q: A simple random walk runs on the graph with edges $\{v,u\},\{u,x\},\{u,y\},\{x,y\}$. Starting at $v$, what is the expected number of visits to $u$ before the walk first returns to $v$?
A: $1$
B: $3$
C: $1/3$
D: $6$
ANS: B
EXP: Renewal argument: over many excursions from $v$, the long-run fraction of time at $u$ versus at $v$ is $\pi(u)/\pi(v)$, and $v$ is visited once per excursion. So expected visits to $u$ per excursion $=\pi(u)/\pi(v)=\deg(u)/\deg(v)=3/1=3$.
Direct check: from $v$ the walk must go to $u$. Each time at $u$ it returns to $v$ with probability $\frac13$; otherwise it goes into the triangle and comes back to $u$ (it cannot reach $v$ without $u$). Visits to $u$ are geometric with success $\frac13$: mean $3$.
$1/3$ inverts the ratio; $1$ assumes $u$ is passed through once.

function parseBank(text) {

  const finish = () => {

    else cur.ans = raw.length === 1 ? 'ABCD'.indexOf(raw) : -1;

    const line = raw.replace(/\s+$/, '');

      cur = { id: explicitId || (topic + '-' + diff + '-' + String(counters[ck]).padStart(3, '0')), topic, diff, sub: '', type: 'mcq', typeRaw: '', title: '', q: '', opts: ['', '', '', ''], ansRaw: '', tolRaw: '', ans: -1, exp: '', seen: {}, dups: [] };
      key = null; continue;

    if (kv) {
      key = kv[1]; const v = kv[2];

      if (cur.seen[key]) cur.dups.push(key); cur.seen[key] = 1;

      else if (key === 'TYPE') { cur.typeRaw = v.trim(); cur.type = QTYPES[cur.typeRaw] ? cur.typeRaw : 'invalid'; }

  const st = {}; const get = k => st[k] || (st[k] = { total: 0, solved: 0, c: 0, w: 0, n: 0 });
  for (const q of BANK) {
    const s = get(q.topic + '/' + q.sub); s.total++; if (solvedEver(q.id)) s.solved++;
    const a = S.att[q.id]; if (a) { s.c += a.c || 0; s.w += a.w || 0; }
  }
  for (const k in S.gsub) { const s = get(k); s.c += S.gsub[k].c || 0; s.w += S.gsub[k].w || 0; }
  for (const k in st) st[k].n = st[k].c + st[k].w;
  return st;
}

/* ---------- daily set ---------- */
function getDaily() {
  const t = ymd();
  if (S.daily[t]) return S.daily[t];
  const r = mulberry32(hashStr('daily-' + t));
  // One bank problem per topic plus one fresh-numbers problem. Within each topic, use the subtopic
  // with the fewest answers so far (ties broken at random), so practice spreads across the syllabus.
  const diffs = shuffle(r, ['e', 'm', 'm', 'h', 'e']); const ids = []; const st = subStats(); const used = new Set();
  const answers = (tp, sub) => (st[tp + '/' + sub] ? st[tp + '/' + sub].n : 0);
  const leastAttempted = (items, keyOf) => { const min = Math.min(...items.map(keyOf)); return pick(r, items.filter(x => keyOf(x) === min)); };
  Object.keys(TOPICS).forEach((tp, i) => {
    const subs = Object.keys(SUBTOPICS[tp]).filter(s => BANK.some(q => q.topic === tp && q.sub === s));
    if (!subs.length) return;
    const sub = leastAttempted(subs, s => answers(tp, s)); used.add(tp + '/' + sub);
    const pool = BANK.filter(q => q.topic === tp && q.sub === sub);
    const tiers = [pool.filter(q => !solvedEver(q.id) && q.diff === diffs[i]), pool.filter(q => !solvedEver(q.id)), pool.filter(q => q.diff === diffs[i]), pool];
    ids.push(pick(r, tiers.find(x => x.length)).id);
  });
  const gpool = GENS.filter(g => g.diff !== 'e' && !used.has(g.topic + '/' + g.sub));
  const g = leastAttempted(gpool.length ? gpool : GENS.filter(x => x.diff !== 'e'), x => answers(x.topic, x.sub));
  ids.push('g_' + g.id + '_' + (hashStr(t) % 900000 + 1000));
  S.daily[t] = { ids, ans: {}, done: false }; prune(); save();
  return S.daily[t];
}

/* ---------- state for views ---------- */
let view = 'today', solve = null, justCompleted = false;
const filt = { topic: 'all', sub: 'all', diff: 'all', st: 'all' };
let reviewTab = 'wrong', progTopic = 'la';

function filteredBank() {
  return BANK.filter(q => (filt.topic === 'all' || q.topic === filt.topic) && (filt.sub === 'all' || q.sub === filt.sub) && (filt.diff === 'all' || q.diff === filt.diff) &&
    (filt.st === 'all' || (filt.st === 'unsolved' && !solvedEver(q.id)) || (filt.st === 'solved' && solvedEver(q.id)) || (filt.st === 'wrong' && status(q.id) === 'wrong') || (filt.st === 'bookmarked' && S.bm[q.id])));
}
const genPool = f => GENS.filter(g => (f.topic === 'all' || g.topic === f.topic) && (!f.sub || f.sub === 'all' || g.sub === f.sub) && (f.diff === 'all' || g.diff === f.diff));
function wrongIds() { return Object.keys(S.att).filter(id => S.att[id].last === 'w' && meta(id)).sort((a, b) => (S.att[b].d || '').localeCompare(S.att[a].d || '')); }
function bmIds() { return Object.keys(S.bm).filter(id => S.bm[id] && meta(id)); }

/* ---------- rendering ---------- */
const diffPill = d => `<span class="pill d-${d}">${DIFF[d]}</span>`;
const topicTag = t => `<span class="tag t-${t}">${TOPICS[t]}</span>`;
const typeTag = type => (type === 'nat' || type === 'msq' ? `<span class="tag qtype">${QTYPES[type]}</span>` : '');
function statusIcon(id) {
  const s = status(id);
  if (s === 'solved') return '<span class="st st-ok" title="Solved" aria-label="Solved">✓</span>';
  if (s === 'wrong') return '<span class="st st-bad" title="Last attempt wrong" aria-label="Last attempt wrong">✗</span>';
  return '<span class="st st-new" aria-label="Not attempted">○</span>';
}
function rows(ids, ctx) {
  if (!ids.length) return '<p class="empty">No problems match these filters.</p>';
  return '<ol class="plist">' + ids.map((id, i) => { const m = meta(id); return `<li><button class="prow" data-open="${i}" data-ctx="${ctx}">
    ${statusIcon(id)}<span class="pnum">${m.gen ? '∞' : esc(id.split('-').pop())}</span><span class="ptitle">${esc(m.title)}</span>
    <span class="pmeta">${typeTag(m.type)}${topicTag(m.topic)}${diffPill(m.diff)}${S.bm[id] ? '<span class="star on" aria-label="Bookmarked">★</span>' : ''}</span></button></li>`; }).join('') + '</ol>';
}

function header() {
  const solved = BANK.filter(q => solvedEver(q.id)).length;
  const navs = [['today', 'Today'], ['practice', 'Problems'], ['review', 'Review'], ['progress', 'Progress']];
  $('#nav').innerHTML = navs.map(([k, l]) => `<a href="#${k}" class="${(solve ? solve.back : view) === k ? 'on' : ''}">${l}</a>`).join('');
  $('#hstats').innerHTML = `<span class="hs" title="Daily streak"><b>${curStreak()}</b> day streak</span><span class="hs"><b>${solved}</b>/${BANK.length} solved</span>`;
}

function render() {
  header();
  const main = $('#main');
  if (window.MathJax && MathJax.typesetClear) { try { MathJax.typesetClear([main]); } catch (e) {} }
  if (solve) main.innerHTML = renderSolve();
  else if (view === 'today') main.innerHTML = renderToday();
  else if (view === 'practice') main.innerHTML = renderPractice();
  else if (view === 'review') main.innerHTML = renderReview();
  else main.innerHTML = renderProgress();
  typeset(main);
}
function typeset(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {}); }

function renderToday() {
  const d = getDaily(); const t = ymd(); const n = d.ids.length; const done = d.ids.filter(i => d.ans && d.ans[i]).length;
  const correct = d.ids.filter(i => d.ans && d.ans[i] === 'c').length;
  const nice = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  const next = d.ids.findIndex(i => !(d.ans && d.ans[i]));

  return `<section class="hero">
    <div><p class="eyebrow">${esc(nice)}</p><h1>Today’s set</h1>

function chipGroup(name, opts, cur) {

}
function renderPractice() {
  const ids = filteredBank().map(q => q.id);
  const genAvail = genPool(filt).length;
  let subRow = '';

    const cnt = s => BANK.filter(q => q.topic === filt.topic && q.sub === s).length;
    subRow = `<div class="chips subchips" role="group" aria-label="Subtopic">` +

        .map(([v, l, n]) => `<button class="chip ${filt.sub === v ? 'on' : ''}" data-f="sub" data-v="${v}" aria-pressed="${filt.sub === v}" ${n || v === filt.sub ? '' : 'disabled title="No problems yet"'}>${esc(l)} <span class="cn">${n}</span></button>`).join('') + '</div>';

function renderReview() {

  <div class="tabs" role="tablist">
    <button role="tab" class="tab ${reviewTab === 'wrong' ? 'on' : ''}" aria-selected="${reviewTab === 'wrong'}" data-rtab="wrong">Got wrong <span class="n">${w.length}</span></button>

  </div>
  ${list.length ? rows(list, 'review') : `<p class="empty">${reviewTab === 'wrong' ? 'Nothing to retry. Wrong answers will collect here.' : 'No bookmarks yet. Use the star on any problem to save it here.'}</p>`}`;
}

function renderProgress() {
  let tc = 0, tw = 0; for (const id in S.att) { if (!S.att[id].g) { tc += S.att[id].c; tw += S.att[id].w; } }
  for (const k in S.gs) { tc += S.gs[k].c; tw += S.gs[k].w; }
  const acc = tc + tw ? Math.round(100 * tc / (tc + tw)) : null; const solved = BANK.filter(q => solvedEver(q.id)).length;
  const cells = Object.keys(TOPICS).map(tp => {
    const tds = ['e', 'm', 'h'].map(df => {
      const pool = BANK.filter(q => q.topic === tp && q.diff === df); const s = pool.filter(q => solvedEver(q.id)).length;
      const g = S.gs[tp + df]; const pct = Math.round(100 * s / pool.length);
      return `<td><div class="cell"><span class="frac">${s}<small>/${pool.length}</small></span><span class="bar"><i class="d-${df}" style="width:${pct}%"></i></span>${g ? `<span class="gstat">fresh: ${g.c}/${g.c + g.w}</span>` : ''}</div></td>`;
    }).join('');
    return `<tr><th scope="row">${TOPICS[tp]}</th>${tds}</tr>`;
  }).join('');
  // heatmap: last 20 weeks, columns = weeks, rows = weekday
  const t = ymd(); const today = new Date(); const dow = (today.getDay() + 6) % 7; // Mon=0
  const start = addDays(t, -(19 * 7 + dow)); let hm = ''; let total = 0, active = 0;
  for (let w = 0; w < 20; w++) { hm += '<div class="hcol">'; for (let d = 0; d < 7; d++) { const day = addDays(start, w * 7 + d); if (day > t) { hm += '<span class="hc fut"></span>'; continue; }
    const n = (S.days[day] && S.days[day].n) || 0; total += n; if (n) active++; const lv = n === 0 ? 0 : n < 3 ? 1 : n < 6 ? 2 : n < 10 ? 3 : 4;
    hm += `<span class="hc l${lv}" title="${day}: ${n} answered"></span>`; } hm += '</div>'; }
  return `<section class="phead"><h1>Progress</h1></section>
  <div class="tiles">
    <div class="tile"><span class="k">Solved</span><span class="v">${solved}<small>/${BANK.length}</small></span></div>
    <div class="tile"><span class="k">Accuracy</span><span class="v">${acc === null ? '–' : acc + '<small>%</small>'}</span><span class="s">${tc + tw} answers</span></div>
    <div class="tile"><span class="k">Current streak</span><span class="v">${curStreak()}<small> days</small></span></div>
    <div class="tile"><span class="k">Best streak</span><span class="v">${S.streak.best}<small> days</small></span></div>
  </div>
  <h2 class="h2">By topic and level</h2>
  <div class="tblwrap"><table class="grid"><thead><tr><th></th><th>${diffPill('e')}</th><th>${diffPill('m')}</th><th>${diffPill('h')}</th></tr></thead><tbody>${cells}</tbody></table></div>
  <h2 class="h2">By subtopic</h2>
  ${renderSubTable()}
  <h2 class="h2">Activity, last 20 weeks</h2>
  <div class="heat"><div class="hdays"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div><div class="hgrid">${hm}</div></div>
  <p class="note">${total} answers on ${active} days. Darker squares mean more problems answered that day.</p>
  <div class="danger"><button class="btn ghost" data-reset="1">Reset all progress</button></div>`;
}

function renderSubTable() {
  const st = subStats(); const tp = progTopic;
  const chips = `<div class="chips" role="group" aria-label="Topic for subtopic table">` + Object.entries(TOPICS).map(([v, l]) =>
    `<button class="chip ${tp === v ? 'on' : ''}" data-ptopic="${v}" aria-pressed="${tp === v}">${l}</button>`).join('') + '</div>';
  const body = Object.entries(SUBTOPICS[tp]).map(([sub, label]) => {
    const s = st[tp + '/' + sub] || { total: 0, solved: 0, c: 0, w: 0, n: 0 };
    const pct = s.total ? Math.round(100 * s.solved / s.total) : 0; const acc = s.n ? Math.round(100 * s.c / s.n) : null;
    return `<tr class="${s.total ? '' : 'nodata'}"><th scope="row">${esc(label)}</th>
      <td><div class="cell"><span class="frac">${s.solved}<small>/${s.total}</small></span><span class="bar"><i class="d-acc" style="width:${pct}%"></i></span></div></td>
      <td class="num">${acc === null ? '–' : acc + '%'}</td><td class="num">${s.n}</td></tr>`;
  }).join('');
  return `<div class="subtopic-head">${chips}</div>
  <div class="tblwrap"><table class="grid subgrid"><thead><tr><th>${esc(TOPICS[tp])}</th><th>Solved</th><th>Accuracy</th><th>Answers</th></tr></thead><tbody>${body}</tbody></table></div>
  <p class="note">Accuracy counts every answer in the subtopic, including fresh-numbers problems answered from now on.</p>`;
}

function renderSolve() {
  const s = solve; const q = s.q; const L = 'ABCD';
  const pos = s.gen ? 'Fresh numbers' : `${s.idx + 1} / ${s.ids.length}`;
  const multi = q.type === 'msq';
  const picked = i => (multi ? s.sel.includes(i) : i === s.sel);
  const isRight = i => (multi ? q.correct.includes(i) : i === q.correct);
  let answerUI;
  if (q.type === 'nat') {
    const cls = s.done ? (s.ok ? ' right' : ' wrongpick') : '';
    answerUI = `<div class="natwrap"><label for="natin">Your answer</label>
      <input id="natin" class="natin${cls}" type="number" step="any" inputmode="decimal" autocomplete="off" value="${esc(s.sel)}" ${s.done ? 'disabled' : ''}>
      <span class="nathint">${q.tol ? `Numerical answer. Accepted within ±${esc(q.tol)}.` : 'Numerical answer. Enter the exact value.'}</span></div>`;
  } else {
    const opts = q.options.map((o, i) => {
      let cls = 'opt' + (multi ? ' multi' : '');
      if (s.done) { if (isRight(i)) cls += ' right' + (multi && !picked(i) ? ' missed' : ''); else if (picked(i)) cls += ' wrongpick'; } else if (picked(i)) cls += ' sel';
      return `<button class="${cls}" data-opt="${i}" ${s.done ? 'disabled' : ''} role="${multi ? 'checkbox' : 'radio'}" aria-checked="${picked(i)}"><span class="ol">${L[i]}</span><span class="ot">${rich(o)}</span></button>`;
    }).join('');
    answerUI = (multi ? '<p class="selhint">Select all options that are correct. You need the exact set.</p>' : '') +
      `<div class="opts" role="${multi ? 'group' : 'radiogroup'}" aria-label="Answer options">${opts}</div>`;
  }
  const ok = s.done && s.ok;
  const answerText = q.type === 'nat' ? `The answer is ${esc(q.ans)}${q.tol ? ` (±${esc(q.tol)} accepted)` : ''}.`
    : multi ? `The correct option${q.correct.length > 1 ? 's are' : ' is'} ${q.correct.map(i => L[i]).join(', ')}.` : `The answer is ${L[q.correct]}.`;
  const keys = q.type === 'nat' ? 'Keys: Enter to check' : multi ? 'Keys: A–D to tick, Enter to check' : 'Keys: A–D to choose, Enter to check';
  const hasNext = s.gen || s.idx < s.ids.length - 1;
  return `<div class="sbar"><button class="btn ghost" data-back="1">← Back</button><span class="pos">${pos}</span>
    <button class="star ${S.bm[q.id] ? 'on' : ''}" data-bm="1" aria-pressed="${!!S.bm[q.id]}" title="Bookmark">${S.bm[q.id] ? '★ Bookmarked' : '☆ Bookmark'}</button></div>
  <article class="card">
    <div class="qmeta">${topicTag(q.topic)}${q.sub ? `<span class="tag">${esc(subLabel(q.topic, q.sub))}</span>` : ''}${diffPill(q.diff)}${typeTag(q.type)}${q.gen ? '<span class="tag fresh">Fresh numbers</span>' : ''}${s.prev ? `<span class="tag prev">${s.prev === 'w' ? 'You missed this before' : 'Solved before'}</span>` : ''}</div>
    <h1 class="qtitle">${esc(q.title)}</h1>
    <div class="qtext">${rich(q.q)}</div>
    ${answerUI}
    <div class="actions">
      ${s.done ? '' : `<button class="btn primary" data-submit="1" ${hasAnswer(q, s.sel) ? '' : 'disabled'}>Check answer</button>`}
      ${s.done && hasNext ? `<button class="btn primary" data-next="1">${s.gen ? 'Another fresh problem →' : 'Next problem →'}</button>` : ''}
      ${s.done && !hasNext ? '<button class="btn primary" data-back="1">Back to list</button>' : ''}
      ${!s.done && hasNext ? '<button class="btn ghost" data-next="1">Skip</button>' : ''}
      <span class="kbd">${keys}</span>
    </div>
    ${s.done ? `<div class="result ${ok ? 'ok' : 'bad'}"><p class="verdict">${ok ? 'Correct.' + (q.type === 'nat' && parseNum(s.sel) !== q.ans ? ` Exact answer: ${esc(q.ans)}.` : '') : `Not quite. ${answerText}`}</p><div class="exp">${rich(q.exp).replace(/\u0001([ABCD])/g, '<b class="optref">$1</b>')}</div></div>` : ''}
  </article>
  ${justCompleted ? `<div class="banner">Today’s set is complete. Your streak is now ${curStreak()} day${curStreak() === 1 ? '' : 's'}.</div>` : ''}`;
}

/* ---------- navigation ---------- */
function openQueue(ids, idx, back, gen) {
  justCompleted = false;
  if (gen) { solve = { gen, ids: [], idx: 0, back, q: null, sel: null, done: false }; nextGen(); return; }
  const q = getQ(ids[idx]); if (!q) return;
  solve = { ids, idx, back, q, sel: initSel(q), done: false, ok: false, prev: S.att[q.id] ? S.att[q.id].last : null };
  render(); window.scrollTo(0, 0);
  if (q.type === 'nat') { const el = document.getElementById('natin'); if (el) el.focus({ preventScroll: true }); }
}
const initSel = q => (q.type === 'msq' ? [] : q.type === 'nat' ? '' : null);
function nextGen() {
  const pool = genPool(solve.gen); if (!pool.length) return;
  const gg = pool[Math.floor(Math.random() * pool.length)]; const seed = Math.floor(Math.random() * 900000) + 1000;
  solve.q = buildGenerated(gg.id, seed); solve.sel = null; solve.done = false; solve.ok = false; solve.prev = null; render(); window.scrollTo(0, 0);
}
function goNext() {
  justCompleted = false;
  if (solve.gen) return nextGen();
  if (solve.idx < solve.ids.length - 1) openQueue(solve.ids, solve.idx + 1, solve.back);
}
function submit() {
  if (!solve || solve.done || !hasAnswer(solve.q, solve.sel)) return;
  solve.done = true; solve.ok = isCorrect(solve.q, solve.sel); record(solve.q, solve.ok); render();
  const r = document.querySelector('.result'); if (r) r.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function listFor(ctx) {
  if (ctx === 'daily') return getDaily().ids;
  if (ctx === 'review') return reviewTab === 'wrong' ? wrongIds() : bmIds();
  return filteredBank().map(q => q.id);
}

document.addEventListener('click', e => {
  const a = e.target.closest('#nav a'); if (a && a.getAttribute('href') === location.hash) { e.preventDefault(); route(); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.open !== undefined) return openQueue(listFor(b.dataset.ctx), Number(b.dataset.open), view);
  if (b.dataset.start !== undefined) return openQueue(getDaily().ids, Number(b.dataset.start), 'today');
  if (b.dataset.f) { filt[b.dataset.f] = b.dataset.v; if (b.dataset.f === 'topic') filt.sub = 'all'; return render(); }
  if (b.dataset.ptopic) { progTopic = b.dataset.ptopic; return render(); }
  if (b.dataset.fresh) return openQueue([], 0, 'practice', { topic: filt.topic, sub: filt.sub, diff: filt.diff });
  if (b.dataset.random) { const ids = filteredBank().map(q => q.id); if (ids.length) openQueue(shuffle(Math.random, ids), 0, 'practice'); return; }
  if (b.dataset.rtab) { reviewTab = b.dataset.rtab; return render(); }
  if (b.dataset.retry) { const ids = reviewTab === 'wrong' ? wrongIds() : bmIds(); return openQueue(ids.slice(), 0, 'review'); }
  if (b.dataset.opt !== undefined && solve && !solve.done) { choose(Number(b.dataset.opt)); return render(); }
  if (b.dataset.submit) return submit();
  if (b.dataset.next) return goNext();
  if (b.dataset.back) { const back = solve ? solve.back : 'today'; solve = null; justCompleted = false; view = back; if (location.hash !== '#' + back) location.hash = back; return render(); }
  if (b.dataset.bm && solve) { const id = solve.q.id; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save(); return render(); }
  if (b.dataset.reset) { if (b.dataset.confirm) { S = blank(); save(); render(); } else { b.dataset.confirm = '1'; b.textContent = 'Click again to erase everything'; b.classList.add('warn'); } }
});
// mcq: pick one option. msq: toggle the option in the selected set.
function choose(i) {
  if (solve.q.type === 'msq') { const s = solve.sel; const at = s.indexOf(i); if (at >= 0) s.splice(at, 1); else s.push(i); }
  else if (solve.q.type !== 'nat') solve.sel = i;
}
document.addEventListener('change', e => { if (e.target.id === 'stsel') { filt.st = e.target.value; render(); } });
// Numerical input: update state without re-rendering, so the field keeps focus while typing.
document.addEventListener('input', e => {
  if (e.target.id !== 'natin' || !solve || solve.done) return;
  solve.sel = e.target.value; const btn = document.querySelector('[data-submit]'); if (btn) btn.disabled = !hasAnswer(solve.q, solve.sel);
});
document.addEventListener('keydown', e => {
  if (!solve || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.activeElement && document.activeElement.id === 'natin') { if (e.key === 'Enter') { solve.sel = document.activeElement.value; submit(); e.preventDefault(); } return; }
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase(); const i = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (i >= 0 && !solve.done && solve.q.type !== 'nat') { choose(i); render(); e.preventDefault(); return; }
  if (e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !document.activeElement.dataset.opt) return; if (!solve.done) submit(); else goNext(); e.preventDefault(); }
});
function route() { const h = location.hash.replace('#', ''); const v = ['today', 'practice', 'review', 'progress'].includes(h) ? h : 'today'; view = v; solve = null; justCompleted = false; render(); }
window.addEventListener('hashchange', route);
route();

</script>
