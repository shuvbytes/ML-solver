<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Math Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet problem sheet on graph-paper grey; one ink-blue accent; difficulty colours carry state. */
:root {
  --bg: #eef0f3; --surface: #ffffff; --ink: #161a23; --muted: #596273; --line: #d9dde4; --accent: #2449c7;
  --accent-soft: #e5ebfb; --ok: #16865b; --ok-soft: #e2f4ec; --bad: #c4372f; --bad-soft: #fbe7e5;
  --easy: #16865b; --med: #b77600; --hard: #c4372f;
  --f-display: "IBM Plex Serif", Georgia, serif; --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10131a; --surface: #181c25; --ink: #e5e8ef; --muted: #98a1b3; --line: #2a303d; --accent: #86a2ff;
  --accent-soft: #1f2840; --ok: #3fc58c; --ok-soft: #13291f; --bad: #ff7a70; --bad-soft: #2f1716;
  --easy: #3fc58c; --med: #f0b232; --hard: #ff7a70; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10131a; --surface: #181c25; --ink: #e5e8ef; --muted: #98a1b3; --line: #2a303d; --accent: #86a2ff;
  --accent-soft: #1f2840; --ok: #3fc58c; --ok-soft: #13291f; --bad: #ff7a70; --bad-soft: #2f1716;
  --easy: #3fc58c; --med: #f0b232; --hard: #ff7a70; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0; background: var(--bg); opacity: .82; z-index: -1; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topin { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { font: 600 18px/1 var(--f-display); letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
.brand i { font-style: italic; color: var(--accent); font-family: var(--f-display); }
#nav { display: flex; gap: 2px; }
#nav a { color: var(--muted); text-decoration: none; padding: 7px 12px; border-radius: 6px; font-weight: 500; font-size: 15px; }
#nav a:hover { color: var(--ink); background: var(--bg); }
#nav a.on { color: var(--accent); background: var(--accent-soft); }
#hstats { margin-left: auto; display: flex; gap: 14px; font-size: 14px; color: var(--muted); }
.hs b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }

main { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font: 600 30px/1.15 var(--f-display); letter-spacing: -.015em; margin: 0 0 6px; text-wrap: balance; }
.h2 { font: 600 19px/1.3 var(--f-display); margin: 28px 0 10px; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; }
.eyebrow { font: 500 13px/1 var(--f-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; }
.phead { margin-bottom: 18px; }

.hero { display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; margin-bottom: 18px; flex-wrap: wrap; }
.streakbox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px; text-align: center; min-width: 120px; font-size: 13px; color: var(--muted); }
.streakbox .big { font: 500 38px/1 var(--f-mono); color: var(--ink); }
.streakbox .sub { font-size: 12px; margin-top: 2px; }
.segs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
.seg { height: 8px; border-radius: 4px; background: var(--line); }
.seg.ok { background: var(--ok); } .seg.bad { background: var(--bad); }
.todaybar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; color: var(--muted); font-size: 15px; flex-wrap: wrap; }
.done { color: var(--ok); font-weight: 600; }
.banner { background: var(--ok-soft); color: var(--ink); border: 1px solid var(--ok); border-radius: 8px; padding: 12px 16px; margin: 14px 0; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 15px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.warn { border-color: var(--bad); color: var(--bad); }

.filters { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; margin-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 14px; cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.frow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.frow select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.count { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.grow { flex: 1; }

.plist { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.plist li + li { border-top: 1px solid var(--line); }
.prow { width: 100%; display: grid; grid-template-columns: 22px 34px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 11px 14px; background: transparent; border: 0; cursor: pointer; }
.prow:hover { background: var(--bg); }
.plist li:nth-child(even) .prow { background: color-mix(in srgb, var(--bg) 45%, var(--surface)); }
.plist li:nth-child(even) .prow:hover { background: var(--bg); }
.pnum { font: 13px var(--f-mono); color: var(--muted); }
.ptitle { font-weight: 500; }
.pmeta { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.st { font-weight: 700; text-align: center; }
.st-ok { color: var(--ok); } .st-bad { color: var(--bad); } .st-new { color: var(--line); }
.pill { font: 500 12px/1 var(--f-body); padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.d-e { color: var(--easy); background: color-mix(in srgb, var(--easy) 13%, transparent); }
.d-m { color: var(--med); background: color-mix(in srgb, var(--med) 15%, transparent); }
.d-h { color: var(--hard); background: color-mix(in srgb, var(--hard) 13%, transparent); }
.tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
.tag.fresh, .tag.prev { border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
.tag.qtype { color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 2px 6px; font-weight: 500; }
.subchips { padding-top: 10px; border-top: 1px dashed var(--line); }
.subchips .chip { font-size: 13px; padding: 4px 10px; }
.chip .cn { font: 12px var(--f-mono); opacity: .7; margin-left: 2px; }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.star { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
.star.on { color: var(--med); }
.empty { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; }

.tabs { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tab.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tab .n { font-family: var(--f-mono); margin-left: 4px; }

.sbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.sbar .pos { font: 14px var(--f-mono); color: var(--muted); margin-right: auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.qmeta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.qtitle { font-size: 24px; margin-bottom: 14px; }
.qtext { font-size: 17px; line-height: 1.65; max-width: 68ch; margin-bottom: 18px; overflow-x: auto; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 9px; padding: 10px 14px; cursor: pointer; min-height: 50px; overflow-x: auto; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .ol { font: 500 14px/1 var(--f-mono); width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ol { background: var(--accent); color: var(--surface); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .ol { background: var(--ok); color: var(--surface); }
.opt.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrongpick .ol { background: var(--bad); color: var(--surface); }
.opt.multi .ol { border-radius: 3px; outline: 1.5px solid var(--line); outline-offset: -1.5px; }
.opt.multi.sel .ol { outline-color: var(--accent); }
.opt.right.missed { border-style: dashed; }
.selhint { font-size: 14px; color: var(--muted); margin: -6px 0 10px; }
.natwrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.natwrap label { font-weight: 500; }
.natin { font: 500 18px var(--f-mono); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 12px; width: 200px; max-width: 100%; }
.natin:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.natin.right { border-color: var(--ok); background: var(--ok-soft); }
.natin.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
.nathint { font-size: 14px; color: var(--muted); }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.kbd { font-size: 12px; color: var(--muted); margin-left: auto; }
.result { margin-top: 20px; border-left: 4px solid var(--ok); background: var(--ok-soft); border-radius: 0 8px 8px 0; padding: 14px 18px; }
.result.bad { border-color: var(--bad); background: var(--bad-soft); }
.verdict { font-weight: 600; margin: 0 0 6px; }
.result.ok .verdict { color: var(--ok); } .result.bad .verdict { color: var(--bad); }
.exp { line-height: 1.7; max-width: 70ch; overflow-x: auto; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.tile .k { font-size: 13px; color: var(--muted); }
.tile .v { font: 500 30px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 15px; color: var(--muted); }
.tile .s { font-size: 12px; color: var(--muted); }
.tblwrap { overflow-x: auto; }
.grid { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.grid th, .grid td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: left; }
.grid tbody th { font-weight: 500; white-space: nowrap; }
.grid tr:last-child th, .grid tr:last-child td { border-bottom: 0; }
.cell { display: grid; gap: 4px; min-width: 110px; }
.frac { font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; }
.frac small { color: var(--muted); font-size: 13px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: currentColor; }
.bar i.d-e { color: var(--easy); } .bar i.d-m { color: var(--med); } .bar i.d-h { color: var(--hard); }
.gstat { font-size: 12px; color: var(--muted); }
.bar i.d-acc { color: var(--accent); }
.subtopic-head { margin-bottom: 10px; }
.subgrid td.num { font: 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.subgrid tr.nodata th, .subgrid tr.nodata td { color: var(--muted); }
.heat { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; }
.hdays { display: grid; grid-template-rows: repeat(7, 14px); gap: 3px; font-size: 10px; color: var(--muted); line-height: 14px; }
.hgrid { display: flex; gap: 3px; }
.hcol { display: grid; grid-template-rows: repeat(7, 14px); gap: 3px; }
.hc { width: 14px; height: 14px; border-radius: 3px; background: var(--line); }
.hc.fut { background: transparent; }
.hc.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.hc.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.hc.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--line)); }
.hc.l4 { background: var(--accent); }
.note { color: var(--muted); font-size: 14px; }
.danger { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); }
footer { max-width: 980px; margin: 0 auto; padding: 0 16px 28px; font-size: 13px; color: var(--muted); }

@media (max-width: 720px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .prow { grid-template-columns: 20px 1fr; }
  .prow .pnum { display: none; }
  .prow .pmeta { grid-column: 2; justify-content: flex-start; }
  #hstats { margin-left: 0; width: 100%; }
  .card { padding: 16px; }
  h1 { font-size: 25px; } .qtitle { font-size: 21px; }
  .kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
